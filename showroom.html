<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꙰ SHIRMANI Supreme Digital Showroom</title><style>
:root{--g:#ffd84a;--c:#5ee7ff;--bg:#050a12;--p:#0d1722;--m:#a9bac8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17304a,#050a12 55%);color:#eef7fb;font:15px system-ui}.w{max-width:1320px;margin:auto;padding:18px}.hero{padding:32px 24px;border:2px solid var(--g);border-radius:26px;background:linear-gradient(135deg,#ffd84a22,#5ee7ff0c);box-shadow:0 18px 60px #0009}.hero h1{margin:0;color:var(--g);font-size:clamp(2rem,5vw,4rem)}.hero p{max-width:900px;color:#d8e5ec}.bar{position:sticky;top:0;z-index:5;background:#050a12ee;backdrop-filter:blur(10px);padding:10px 0}.tools{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}input,select,button{border:1px solid #405466;border-radius:10px;padding:11px;background:#09131d;color:#fff}button,.primary{background:var(--g);color:#111;font-weight:800;cursor:pointer}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.stat,.tag{border:1px solid #294052;border-radius:999px;padding:7px 10px;background:#09131d}.tag{color:var(--c);border-color:var(--c);font-size:.75rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px}.card{background:linear-gradient(160deg,#111e2a,#09111a);border:1px solid #294052;border-radius:17px;padding:16px;min-height:230px;display:flex;flex-direction:column}.card h3{margin:9px 0 5px}.muted{color:var(--m);font-size:.88rem}.price{margin-top:auto;color:var(--g);font-size:1.3rem;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions>*{padding:9px 11px;border-radius:9px;text-decoration:none}dialog{max-width:760px;width:calc(100% - 24px);background:#08121c;color:#fff;border:1px solid var(--g);border-radius:18px;padding:20px}.passport{background:#03070b;padding:12px;border-radius:9px;font-family:monospace;word-break:break-all}@media(max-width:800px){.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}}</style></head><body><div class="w">
<section class="hero"><span class="tag">PUBLIC PRODUCTION SHOWROOM</span><h1>꙰ SHIRMANI SUPREME DIGITAL SHOWROOM</h1><p>खोजें • देखें • चलाएँ • मूल्य देखें • feedback दें। यह product-first public surface है; production activity का परिणाम यहाँ दिखाई देने योग्य बनाया गया है।</p><div class="stats"><span class="stat"><b id="count">—</b> catalog products</span><span class="stat"><b id="engines">—</b> engines</span><span class="stat">QC passport</span><span class="stat">Public review → improvement</span></div></section>
<div class="bar"><div class="tools"><input id="q" placeholder="Product / category / engine खोजें…" oninput="render()"><select id="fam" onchange="render()"><option value="">सभी categories</option></select><select id="sort" onchange="render()"><option value="name">नाम</option><option value="price">मूल्य</option></select><button onclick="reviews()">★ Review / Improve</button></div></div>
<div id="grid" class="grid"></div></div>
<dialog id="d"><div id="detail"></div></dialog><script>
let C;const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function price(p){return 89+((+p.id.replace(/\D/g,'')||1)%12)*100}
async function load(){C=await fetch('generated/1000-digital-products.json',{cache:'no-store'}).then(r=>r.json());count.textContent=C.product_count.toLocaleString();engines.textContent=C.engine_count;C.families.forEach(x=>fam.insertAdjacentHTML('beforeend','<option>'+E(x)+'</option>'));render()}
function render(){if(!C)return;let q=document.getElementById('q').value.toLowerCase(),f=fam.value,s=sort.value,a=C.products.filter(p=>(!f||p.family===f)&&(!q||(p.name+' '+p.family+' '+p.engine+' '+p.id).toLowerCase().includes(q)));a.sort((x,y)=>s==='price'?price(x)-price(y):x.name.localeCompare(y.name));a=a.slice(0,240);grid.innerHTML=a.length?a.map(p=>'<article class="card"><span class="tag">'+E(p.family)+'</span><h3>'+E(p.name)+'</h3><div class="muted">'+E(p.id)+' · '+E(p.engine)+'</div><p class="muted">स्थिति: '+E(p.status)+'<br>QC: '+E(p.verification)+'</p><div class="price">₹'+price(p)+'</div><div class="actions"><button onclick="openP(\''+E(p.id)+'\')">देखें / चलाएँ</button><a class="primary" target="_blank" href="products/1000-digital-product-factory.html?id='+encodeURIComponent(p.id)+'">Product →</a></div></article>').join(''):'<p>कोई product नहीं मिला।</p>'}
function openP(id){let p=C.products.find(x=>x.id===id),url=location.origin+location.pathname+'?product='+id;detail.innerHTML='<h2>'+E(p.name)+'</h2><span class="tag">'+E(p.family)+' · '+E(p.engine)+'</span><p><b>मूल्य: ₹'+price(p)+'</b> · catalog launch price</p><p class="muted">यह entry browser-executable engine से जुड़ी है। इस repository में live payment/delivery को अभी operational घोषित नहीं किया गया है।</p><h3>QC / Dispatch Passport</h3><div class="passport">PRODUCT='+E(p.id)+' | QC='+E(p.verification)+' | GATE=SHOWROOM | DISPATCH=NO-LIVE-PAYMENT</div><p class="muted">QR payload: '+E(url)+'</p><div class="actions"><a class="primary" target="_blank" href="products/1000-digital-product-factory.html?id='+encodeURIComponent(p.id)+'">Product चलाएँ</a><a target="_blank" href="https://github.com/rampaulsaini/Shirmani-Research-Institute-Shirmani-Research-Institute-/issues/new?title='+encodeURIComponent('Review '+p.id+' — '+p.name)+'&body='+encodeURIComponent('Product ID: '+p.id+'\nRating (1-5):\nWhat worked:\nWhat should improve:\n')+'">Review दें →</a><button onclick="d.close()">बंद</button></div>';d.showModal()}
function reviews(){window.open('https://github.com/rampaulsaini/Shirmani-Research-Institute-Shirmani-Research-Institute-/issues/new?title=Public%20Product%20Review%20%2F%20Quality%20Improvement&body=Product%20ID%3A%5CnRating%20(1-5)%3A%5CnWhat%20worked%20well%3A%5CnWhat%20should%20improve%3A%5CnSuggested%20feature%3A%5Cn','_blank')}
load().catch(e=>grid.innerHTML='<p>Catalog load error: '+E(e.message)+'</p>');</script></body></html>

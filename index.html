<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शिरोमणि रामपॉल सैनी — Nishpaksh Understanding • Research • Global Identity</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #d4af37;
            --secondary-gold: #f3e5ab;
            --bg-dark: #0f1016;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-light: #f8f9fa;
            --text-dim: #b3b3b3;
            --accent-blue: #00d2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background Glow Effect */
        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.15), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Header / Banner */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
        }

        header img.profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--primary-gold);
            object-fit: cover;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }

        header h1 {
            font-family: 'Rozha One', serif;
            font-size: 2.8rem;
            color: var(--primary-gold);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-dim);
            max-width: 600px;
            margin: 0 auto;
        }


        .income-first-strip{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:9px;max-width:1150px;margin:18px auto 0;padding:14px 16px;border:2px solid var(--primary-gold);border-radius:16px;background:linear-gradient(90deg,rgba(212,175,55,.18),rgba(0,210,255,.08));box-shadow:0 8px 28px rgba(0,0,0,.28)}
        .income-first-strip strong{width:100%;font-size:1.05rem;color:var(--primary-gold)}
        .income-first-strip a{color:var(--text-light);text-decoration:none;padding:9px 13px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.25);font-weight:600;font-size:.88rem}
        .income-first-strip a:hover{color:#000;background:var(--primary-gold)}
        
        .income-launchbar { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; max-width:1150px; margin:24px auto 0; padding:12px; border:1px solid rgba(212,175,55,.55); border-radius:14px; background:rgba(0,0,0,.38); box-shadow:0 8px 24px rgba(0,0,0,.25); }
        .income-launchbar strong { color:var(--primary-gold); width:100%; font-size:1rem; }
        .income-launchbar a { color:var(--text-light); text-decoration:none; padding:8px 12px; border:1px solid rgba(255,255,255,.16); border-radius:999px; background:rgba(255,255,255,.05); font-size:.86rem; }
        .income-launchbar a:hover { border-color:var(--primary-gold); color:var(--primary-gold); }

        /* LIFE-SUSTAINABILITY / INCOME — deliberately above the research material */
        .survival-nav{position:sticky;top:0;z-index:1000;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:10px 12px;background:rgba(8,9,14,.96);border-bottom:2px solid var(--primary-gold);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
        .survival-nav .label{color:var(--primary-gold);font-weight:800;margin-right:6px}
        .survival-nav a{color:var(--text-light);text-decoration:none;padding:8px 12px;border:1px solid rgba(212,175,55,.45);border-radius:999px;background:rgba(212,175,55,.08);font-size:.86rem;font-weight:700}
        .survival-nav a:hover{background:var(--primary-gold);color:#000}
        .above-fold-income{max-width:1150px;margin:18px auto 10px;padding:24px 20px;border:3px solid var(--primary-gold);border-radius:20px;background:linear-gradient(135deg,rgba(212,175,55,.22),rgba(0,210,255,.10));box-shadow:0 14px 38px rgba(0,0,0,.4)}
        .above-fold-income h2{color:var(--primary-gold);font-family:'Rozha One',serif;font-size:2rem;margin-bottom:8px;text-align:center}
        .above-fold-income p{text-align:center;color:var(--text-light);max-width:950px;margin:0 auto 16px}
        .above-fold-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
        .above-fold-actions a{display:block;text-align:center;padding:12px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.32);color:var(--text-light);text-decoration:none;font-weight:800}
        .above-fold-actions a:hover{background:var(--primary-gold);color:#000}
        @media(max-width:768px){.survival-nav{position:relative}.survival-nav a{font-size:.78rem;padding:7px 9px}.above-fold-income{margin:10px 10px 0}.above-fold-income h2{font-size:1.55rem}}

        .life-priority { position: relative; margin: 10px 0 45px; padding: 26px; border: 2px solid var(--primary-gold); border-radius: 16px; background: linear-gradient(135deg, rgba(212,175,55,.16), rgba(0,210,255,.06)); box-shadow: 0 12px 35px rgba(0,0,0,.35); }
        .life-priority h2 { color: var(--primary-gold); font-family: 'Rozha One', serif; font-size: 2rem; margin-bottom: 10px; }
        .life-priority > p { color: var(--text-light); max-width: 950px; margin-bottom: 20px; }
        .priority-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
        .priority-card { display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 12px; border: 1px solid rgba(212,175,55,.45); background: rgba(0,0,0,.25); color: var(--text-light); text-decoration: none; transition: transform .2s ease, border-color .2s ease; }
        .priority-card:hover { transform: translateY(-3px); border-color: var(--primary-gold); } .priority-card small { color: var(--accent-blue); font-weight: 600; letter-spacing: .2px; } .income-note { margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--accent-blue); background: rgba(0,210,255,.06); color: var(--text-dim); font-size: .9rem; border-radius: 8px; }
        .priority-card i { color: var(--primary-gold); font-size: 1.6rem; }
        .priority-card strong { font-size: 1.1rem; }
        .priority-card span { color: var(--text-dim); font-size: .88rem; }

        /* Container & Navigation Tabs */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .category-title {
            font-size: 1.8rem;
            color: var(--primary-gold);
            margin: 40px 0 20px;
            border-left: 4px solid var(--primary-gold);
            padding-left: 15px;
            font-family: 'Rozha One', serif;
        }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-gold);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-icon {
            font-size: 2rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        .card p.badge {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .card a.btn {
            display: inline-block;
            text-align: center;
            background: transparent;
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .card a.btn:hover {
            background: var(--primary-gold);
            color: #000;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--primary-gold);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    
/* === SHIRMANI PUBLIC INTERFACE — screenshot-aligned main menu === */
.srm-public-shell{max-width:1180px;margin:0 auto;padding:8px 10px 105px;position:relative;z-index:5}
.srm-hero{position:relative;min-height:430px;border:2px solid #f5c928;border-radius:34px 34px 12px 12px;overflow:hidden;background:linear-gradient(90deg,rgba(2,11,24,.86),rgba(2,11,24,.24) 38%,rgba(2,11,24,.48)),radial-gradient(circle at 52% 32%,rgba(255,214,65,.35),transparent 34%),linear-gradient(135deg,#03152d,#081d3c 48%,#020a17);box-shadow:0 0 0 1px rgba(255,215,70,.2),0 18px 60px rgba(0,0,0,.6)}
.srm-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 8% 72%,rgba(0,210,255,.28),transparent 25%),radial-gradient(circle at 88% 68%,rgba(0,210,255,.22),transparent 26%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.72));pointer-events:none}
.srm-hero-content{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;min-height:430px;padding:28px 32px}
.srm-brand{text-align:left;align-self:start;padding-top:34px}.srm-brand h2{font-family:'Rozha One',serif;font-size:clamp(2rem,4vw,3.5rem);line-height:.95;color:#ffd83d;text-shadow:0 4px 20px #000;margin:8px 0 12px}.srm-brand p,.srm-right p{color:#fff;font-weight:600;text-shadow:0 2px 8px #000}.srm-brand .srm-orb{font-size:2.8rem;display:block;filter:drop-shadow(0 0 15px #ffd83d)}
.srm-hero-portrait{width:min(100%,360px);height:360px;justify-self:center;object-fit:cover;border-radius:48% 48% 44% 44%;border:3px solid #ffd83d;box-shadow:0 0 35px rgba(255,215,61,.65),0 15px 45px rgba(0,0,0,.6)}
.srm-right{text-align:right;align-self:start;padding-top:34px}.srm-right h2{font-size:clamp(1.6rem,3vw,2.7rem);line-height:1.05;color:#ffe36a;text-shadow:0 3px 14px #000;margin-bottom:16px}.srm-right .srm-tag{font-size:1rem;color:#fff;margin-bottom:26px}.srm-income-callout{display:inline-block;text-align:center;color:#fff;font-size:1.05rem;line-height:1.3;text-shadow:0 2px 8px #000}.srm-income-callout strong{display:block;color:#fff;font-size:1.35rem}
.srm-menu{margin-top:10px;display:grid;gap:8px}.srm-row{min-height:66px;display:grid;grid-template-columns:58px minmax(0,1fr) 42px;align-items:center;gap:10px;padding:7px 12px;border:2px solid #ffd32e;border-radius:18px;background:linear-gradient(90deg,rgba(3,10,18,.98),rgba(3,18,32,.88) 55%,rgba(5,20,35,.66));color:#fff;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.42);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.srm-row:nth-child(even){border-color:#00d9ff;background:linear-gradient(90deg,rgba(2,12,22,.98),rgba(2,22,36,.9) 55%,rgba(0,48,66,.58))}.srm-row:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.58),0 0 18px rgba(255,214,55,.2);border-color:#fff}
.srm-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;font-size:1.55rem;color:#ffd83d;background:rgba(255,216,61,.08);border:1px solid rgba(255,216,61,.25)}.srm-row:nth-child(even) .srm-icon{color:#00e0ff;background:rgba(0,224,255,.08);border-color:rgba(0,224,255,.28)}
.srm-copy strong{display:block;font-size:clamp(.98rem,1.8vw,1.3rem);line-height:1.15;color:#ffe05a}.srm-row:nth-child(even) .srm-copy strong{color:#4de8ff}.srm-copy span{display:block;font-size:.75rem;color:#f3f5f7;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

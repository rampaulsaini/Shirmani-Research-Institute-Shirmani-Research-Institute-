<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꙰ SHIRMANI Public Module Production Map</title><style>body{margin:0;background:#060b11;color:#eef5f8;font:15px system-ui;line-height:1.5}main{max-width:1400px;margin:auto;padding:20px 14px 70px}h1,h2{color:#f3d36a}.hero,.card{background:#0d1721;border:1px solid #30485c;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.metric{background:#071019;padding:14px;border-radius:12px}.num{font-size:1.6rem;font-weight:900;color:#f3d36a}.tag{color:#67e8f9}.btn{display:inline-block;padding:9px 12px;background:#f3d36a;color:#111;border-radius:9px;text-decoration:none;font-weight:900}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #263847;text-align:left}</style></head><body><main><section class=hero><span class=tag>MODULE → PRODUCT → RESULT</span><h1>꙰ Public Module Production Map</h1><p>हर production family की वास्तविक production cycle यहाँ दिखाई जाती है। Module नाम अपने-आप product नहीं है; produced result manifest अलग से दर्ज होता है।</p><a class=btn href="public-production-command-center.html">Command Center</a> <a class=btn href="../supreme-marking-hub.html">Showroom</a></section><section class=card><div id=top class=grid>Loading…</div></section><section class=card><table><thead><tr><th>Engine</th><th>Products / cycle</th><th>Production result</th><th>Public surface</th></tr></thead><tbody id=rows></tbody></table></section></main><script>async function load(){const s=await fetch("public-production-status.json?ts="+Date.now()).then(r=>r.json());const e=s.engines_this_cycle||{};document.getElementById("top").innerHTML=[["Engines in cycle",Object.keys(e).length],["Products produced",s.produced_this_cycle],["Catalog",s.catalog_total],["Dispatch YES",s.dispatch_yes]].map(x=>'<div class=metric><div class=num>'+x[1]+'</div>'+x[0]+'</div>').join("");document.getElementById("rows").innerHTML=Object.entries(e).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v+'</td><td>CONCRETE RESULT MANIFEST</td><td><a href="../supreme-marking-hub.html">Showroom</a></td></tr>').join("")}load()</script></body></html>

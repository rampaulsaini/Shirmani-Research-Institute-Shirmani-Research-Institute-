s-serif" font-size="20" font-weight="700">SHIRMANI</text></g><text x="112" y="760" fill="#f4d16e" font-family="Arial,sans-serif" font-size="27" font-weight="700">OPEN THE BROWSER DEMO</text><text x="112" y="812" fill="#c0cbd7" font-family="Arial,sans-serif" font-size="23">Creates a presentation brief and measurable test checklist.</text><text x="112" y="854" fill="#c0cbd7" font-family="Arial,sans-serif" font-size="21">No AI voice, avatar, lip-sync or MP4 rendering in this release.</text><text x="112" y="905" fill="#ffffff" font-family="Arial,sans-serif" font-size="24">शिरोमणि रामपॉल सैनी · निष्पक्ष समझ</text></svg>
<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI QC Gate Verifier</title><style>body{margin:0;background:#071018;color:#eef5f8;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}.card{background:#101923;border:1px solid #354858;border-radius:16px;padding:20px}.pass{color:#6ee7b7}.hold{color:#f6c453}.mono{font-family:monospace;word-break:break-all}a{color:#5ee7ff}</style><main><section class="card"><h1>꙰ SHIRMANI QC Gate Verifier</h1><div id="out">Checking…</div><p><a href="index.html">Production Control</a></p></section><script>async function run(){const q=new URLSearchParams(location.search),id=q.get('product'),batch=q.get('batch'),qc=q.get('qc');const d=await fetch('production-registry.json',{cache:'no-store'}).then(r=>r.json());const p=d.products.find(x=>x.id===id);const valid=!!p&&p.batch_no===batch&&p.qc_verification_code===qc;document.getElementById('out').innerHTML=valid?'<h2 class="pass">QC TRACE MATCH</h2><p>Product: <b>'+p.name+'</b></p><p>Batch: <b>'+p.batch_no+'</b></p><p>QC code: <span class="mono">'+p.qc_verification_code+'</span></p><p>Gate: <b>'+p.gate_no+'</b></p><p>Dispatch: <span class="hold"><b>'+p.dispatch+'</b></span></p><p>Production state: <b>'+p.production_state+'</b></p><p>This confirms the repository production record matches the supplied QR payload. It does not by itself authorize dispatch or establish external scientific verification.</p>':'<h2 class="hold">QC TRACE NOT FOUND</h2><p>The supplied product, batch and QC code do not match the current production registry.</p>'}run()</script></main></html>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Calculator Demo</title><style>body{font:16px system-ui;background:#071018;color:#fff}main{max-width:700px;margin:auto;padding:25px}.card{background:#111b26;padding:22px;border-radius:18px}input,select,button{padding:10px;margin:5px}button{font-weight:800}</style><main><div class="card"><h1>Calculator Product Demo</h1><input id="a" type="number" value="10"><select id="o"><option>+</option><option>-</option><option>*</option><option>/</option></select><input id="b" type="number" value="5"><button onclick="go()">Run</button><pre id="r">Ready.</pre></div></main><script>function go(){let a=+document.getElementById("a").value,b=+document.getElementById("b").value,o=document.getElementById("o").value,r=o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:b?a/b:"DIV0";document.getElementById("r").textContent=JSON.stringify({product_id:new URLSearchParams(location.search).get("id"),operation:o,result:r},null,2)}</script>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Text Demo</title><style>body{font:16px system-ui;background:#071018;color:#fff}main{max-width:800px;margin:auto;padding:25px}.card{background:#111b26;padding:22px;border-radius:18px}textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0}button{font-weight:800}</style><main><div class="card"><h1>Text / NLP Product Demo</h1><textarea id="t" rows="8" placeholder="Enter text"></textarea><button onclick="go()">Run demonstration</button><pre id="r">Ready.</pre></div></main><script>function go(){let t=document.getElementById("t").value;document.getElementById("r").textContent=JSON.stringify({product_id:new URLSearchParams(location.search).get("id"),characters:t.length,words:t.trim()?t.trim().split(/\s+/).length:0,lines:t.split(/\n/).length},null,2)}</script>

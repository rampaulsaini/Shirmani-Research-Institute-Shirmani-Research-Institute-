<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Drawing Board</title><style>body{font-family:system-ui;max-width:850px;margin:auto;padding:20px;background:#071018;color:#eef5f8}h1{color:#ffd84a}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;background:#081019;color:#fff;border:1px solid #405466;border-radius:8px}button{padding:10px 14px;margin:5px 0;background:#ffd84a;border:0;border-radius:8px;font-weight:800}pre{white-space:pre-wrap;background:#050a0f;padding:12px;border-radius:8px}</style><h1>꙰ SHIRMANI Drawing Board</h1><p>Independent browser-executable production module.</p><canvas id=c width=650 height=350 style="background:white"></canvas><br><button onclick="clearCanvas()">Clear</button><button onclick="saveCanvas()">Save PNG</button><script>let c=document.getElementById('c'),x=c.getContext('2d'),d=false;c.onpointerdown=e=>{d=true;x.beginPath();x.moveTo(e.offsetX,e.offsetY)};c.onpointerup=()=>d=false;c.onpointerleave=()=>d=false;c.onpointermove=e=>{if(d){x.lineTo(e.offsetX,e.offsetY);x.stroke()}};function clearCanvas(){x.clearRect(0,0,c.width,c.height)}function saveCanvas(){let a=document.createElement('a');a.href=c.toDataURL();a.download='shirmani-drawing.png';a.click()}</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Word Frequency</title><style>body{font-family:system-ui;max-width:850px;margin:auto;padding:20px;background:#071018;color:#eef5f8}h1{color:#ffd84a}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;background:#081019;color:#fff;border:1px solid #405466;border-radius:8px}button{padding:10px 14px;margin:5px 0;background:#ffd84a;border:0;border-radius:8px;font-weight:800}pre{white-space:pre-wrap;background:#050a0f;padding:12px;border-radius:8px}</style><h1>꙰ SHIRMANI Word Frequency</h1><p>Independent browser-executable production module.</p><textarea id=x rows=6>heart truth heart understanding truth</textarea><button onclick="run()">Analyze</button><pre id=r></pre><script>function run(){let m={};(document.getElementById('x').value.toLowerCase().match(/[\\p{L}\\p{N}_-]+/gu)||[]).forEach(w=>m[w]=(m[w]||0)+1);document.getElementById('r').textContent=JSON.stringify(m,null,2)}</script></html>

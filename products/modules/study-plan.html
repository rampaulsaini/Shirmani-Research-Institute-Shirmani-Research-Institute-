<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Study Plan</title><style>body{font-family:system-ui;max-width:850px;margin:auto;padding:20px;background:#071018;color:#eef5f8}h1{color:#ffd84a}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;background:#081019;color:#fff;border:1px solid #405466;border-radius:8px}button{padding:10px 14px;margin:5px 0;background:#ffd84a;border:0;border-radius:8px;font-weight:800}pre{white-space:pre-wrap;background:#050a0f;padding:12px;border-radius:8px}</style><h1>꙰ SHIRMANI Study Plan</h1><p>Independent browser-executable production module.</p><input id=s value="AI/ML/NLP"><input id=d type=number value=7><button onclick="run()">Build</button><pre id=r></pre><script>function run(){let n=Math.max(1,+document.getElementById('d').value||1),a=[];for(let i=1;i<=n;i++)a.push({day:i,focus:document.getElementById('s').value,activity:i===n?'review + self-test':'concept + practice'});document.getElementById('r').textContent=JSON.stringify(a,null,2)}</script></html>

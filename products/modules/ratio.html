<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Ratio</title><style>body{font-family:system-ui;max-width:850px;margin:auto;padding:20px;background:#071018;color:#eef5f8}h1{color:#ffd84a}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;background:#081019;color:#fff;border:1px solid #405466;border-radius:8px}button{padding:10px 14px;margin:5px 0;background:#ffd84a;border:0;border-radius:8px;font-weight:800}pre{white-space:pre-wrap;background:#050a0f;padding:12px;border-radius:8px}</style><h1>꙰ SHIRMANI Ratio</h1><p>Independent browser-executable production module.</p><input id=a type=number value=98><input id=b type=number value=87><button onclick="run()">Simplify</button><pre id=r></pre><script>function g(a,b){while(b)[a,b]=[b,a%b];return Math.abs(a)}function run(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value,x=g(a,b);document.getElementById('r').textContent=JSON.stringify({input:[a,b],simplified:[a/x,b/x]},null,2)}</script></html>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Heart-View Product Brief</title><style>body{font-family:system-ui;background:#081018;color:#eef;max-width:950px;margin:auto;padding:20px}section{background:#111b27;border:1px solid #40536a;border-radius:16px;padding:18px;margin:12px 0}h1,h2{color:#f0ce62}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 10px;background:#08111a;color:white;border:1px solid #52677d;border-radius:8px}button{padding:10px 14px;border:0;border-radius:9px;background:#f0ce62;font-weight:800}</style></head><body><section><h1>꙰ Heart-View Product Brief Builder</h1><p>किसी विचार को स्पष्ट product specification में बदलने के लिए structured brief बनाएं: समस्या, उपयोगकर्ता, सरल समाधान, uniqueness, price और delivery.</p></section><section><input id="name" placeholder="Product name"><textarea id="problem" placeholder="किस समस्या का समाधान?"></textarea><textarea id="user" placeholder="किसके लिए?"></textarea><textarea id="unique" placeholder="नया/विशिष्ट गुण"></textarea><input id="price" type="number" placeholder="लक्षित मूल्य (INR)"><textarea id="delivery" placeholder="Delivery कैसे होगी?"></textarea><button onclick="build()">Product Brief बनाएं</button><pre id="out">तैयार।</pre></section><script>function build(){const x={type:"SHIRMANI_PRODUCT_BRIEF",name:name.value,problem:problem.value,user:user.value,unique_value:unique.value,target_price_inr:Number(price.value||0),delivery:delivery.value,gates:["working implementation","test evidence","public page","delivery evidence","pricing evidence","independent review where applicable"],status:"DRAFT"};out.textContent=JSON.stringify(x,null,2)}</script></body></html>

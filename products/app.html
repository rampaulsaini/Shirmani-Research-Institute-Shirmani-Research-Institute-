<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Product</title><style>body{font-family:system-ui;background:#0b1020;color:#eee;max-width:900px;margin:auto;padding:24px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;background:#111a2d;color:#fff;border:1px solid #40506d;border-radius:10px}button{cursor:pointer}canvas{width:100%;background:#fff}</style><a href="index.html">← Catalog</a><h1 id=t></h1><p id=m></p><div id=x></div><script>
const f=['calculator','counter','text-cleaner','seo-title','color-picker','unit-converter','study-timer','flashcard','markdown-preview','drawing-pad','pixel-painter','memory-game','typing-test','budget-planner','habit-tracker','invoice-maker','resume-builder','quiz-maker','prompt-studio','json-formatter','word-counter'], L={'calculator':'Calculator','counter':'Counting Tool','text-cleaner':'Text Cleaner','seo-title':'SEO Title Studio','color-picker':'Color Picker','unit-converter':'Unit Converter','study-timer':'Study Timer','flashcard':'Flashcard','markdown-preview':'Markdown Preview','drawing-pad':'Drawing Pad','pixel-painter':'Pixel Painter','memory-game':'Memory Game','typing-test':'Typing Test','budget-planner':'Budget Planner','habit-tracker':'Habit Tracker','invoice-maker':'Invoice Maker','resume-builder':'Resume Builder','quiz-maker':'Quiz Maker','prompt-studio':'Prompt Studio','json-formatter':'JSON Formatter','word-counter':'Word Counter'},id=new URLSearchParams(location.search).get('id')||'SP-0001',n=Math.max(1,+id.slice(3)||1),type=f[(n-1)%f.length],title='SHIRMANI '+L[type]+' '+String(n).padStart(4,'0');t.textContent=title;m.textContent=id+' · '+L[type]+' · runnable online micro-product';
const x=document.getElementById('x');const I=(p)=>{let a=document.createElement('input');a.placeholder=p;x.append(a);return a},T=(p)=>{let a=document.createElement('textarea');a.placeholder=p;x.append(a);return a},B=(p,fn)=>{let a=document.createElement('button');a.textContent=p;a.onclick=fn;x.append(a);return a},R=()=>{let a=document.createElement('div');a.style.padding='16px';x.append(a);return a};
if(type==='calculator'){let a=I('125*0.8'),r=R();B('Calculate',()=>{try{r.textContent=Function('return '+a.value)()}catch(e){r.textContent='Invalid expression'}})}
else if(type==='counter'||type==='word-counter'){let a=T('Text'),r=R();B('Count',()=>r.textContent=type==='counter'?'Characters: '+a.value.length:'Words: '+a.value.trim().split(/\s+/).filter(Boolean).length)}
else if(type==='text-cleaner'){let a=T('Text'),r=T('Clean result');B('Clean',()=>r.value=a.value.replace(/\s+/g,' ').trim())}
else if(type==='seo-title'){let a=I('Main topic'),r=I('SEO title');B('Generate',()=>r.value=a.value+' | SHIRMANI Research Institute')}
else if(type==='color-picker'){let a=I('Color'),r=R();a.type='color';a.value='#66ccff';a.oninput=()=>r.textContent=a.value;r.textContent=a.value}
else if(type==='unit-converter'){let a=I('Value'),r=R();B('km → m',()=>r.textContent=Number(a.value)*1000);B('m → km',()=>r.textContent=Number(a.value)/1000)}
else if(type==='study-timer'){let r=R();r.textContent='25:00';B('Start 25 min',()=>{let s=1500;clearInterval(window.z);window.z=setInterval(()=>{--s;r.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0)clearInterval(window.z)},1000)})}
else if(type==='flashcard'){let a=T('Front'),b=T('Back'),r=R();B('Show answer',()=>r.textContent=b.value)}
else if(type==='markdown-preview'){let a=T('# Heading'),r=R();B('Preview',()=>r.innerHTML=a.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/\n/g,'<br>'))}
else if(type==='drawing-pad'||type==='pixel-painter'){let c=document.createElement('canvas');c.width=900;c.height=320;x.append(c);let q=c.getContext('2d'),d=false;c.onpointerdown=e=>{d=true;q.beginPath();q.moveTo(e.offsetX,e.offsetY)};c.onpointerup=()=>d=false;c.onpointermove=e=>{if(d){q.lineTo(e.offsetX,e.offsetY);q.stroke()}};B('Clear',()=>q.clearRect(0,0,c.width,c.height))}
else if(type==='memory-game'){let r=R();B('Generate number',()=>r.textContent=Math.floor(Math.random()*1000000))}
else if(type==='typing-test'){let a=T('Type the displayed sentence: The heart of learning is understanding.'),r=R();B('Check',()=>r.textContent='Characters: '+a.value.length)}
else if(type==='budget-planner'){let a=I('Income'),b=I('Expenses'),r=R();B('Balance',()=>r.textContent='₹'+(Number(a.value)-Number(b.value)))}
else if(type==='habit-tracker'){let a=document.createElement('input');a.type='checkbox';x.append(a,' Today complete');let r=R();a.onchange=()=>r.textContent=a.checked?'Completed':'Not completed'}
else if(type==='invoice-maker'){let a=I('Customer'),b=I('Item'),c=I('Amount'),r=R();B('Create line',()=>r.textContent=a.value+' — '+b.value+' — ₹'+c.value)}
else if(type==='resume-builder'){let a=I('Name'),b=T('Skills'),r=R();B('Build',()=>r.innerHTML='<h2>'+a.value+'</h2><p>'+b.value+'</p>')}
else if(type==='quiz-maker'){let a=I('Question'),b=I('Answer'),r=R();B('Create',()=>r.textContent='Question: '+a.value+' | Answer: '+b.value)}
else if(type==='prompt-studio'){let a=T('Goal'),r=T('Prompt');B('Build prompt',()=>r.value='Create a clear, useful result for: '+a.value)}
else if(type==='json-formatter'){let a=T('JSON'),r=T('Formatted');B('Format',()=>{try{r.value=JSON.stringify(JSON.parse(a.value),null,2)}catch(e){r.value=e.message}})}
else {let a=T('Text'),r=R();B('Count',()=>r.textContent='Words: '+a.value.trim().split(/\s+/).filter(Boolean).length)}
</script></html>

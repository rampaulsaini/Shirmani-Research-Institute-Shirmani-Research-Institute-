<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Calculator</title><style>body{font-family:system-ui;background:#081018;color:#eef;margin:0}main{max-width:900px;margin:auto;padding:24px}textarea,input{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:9px;background:#111b25;color:#fff;border:1px solid #456}textarea{height:210px}button{padding:11px 17px;border:0;border-radius:9px;background:#e8c15b;font-weight:800;margin:7px 4px 7px 0}.out{white-space:pre-wrap;background:#111b25;padding:15px;border-radius:10px;margin-top:12px}</style><main><h1>꙰ Invoice Calculator</h1><p>Calculate subtotal, GST and total from item rows.</p><div id="R"><div class="r"><input placeholder="Item"><input type="number" value="1"><input type="number" value="0"></div></div><button onclick="let d=document.querySelector('.r').cloneNode(true);R.appendChild(d)">Add item</button><button onclick="run()">Run Tool</button><div id="O" class="out">—</div></main><script>function run(){let s=[...document.querySelectorAll('.r')].reduce((a,r)=>a+(+r.children[1].value||0)*(+r.children[2].value||0),0),g=s*.18;O.innerHTML='Subtotal ₹'+s.toFixed(2)+'<br>GST ₹'+g.toFixed(2)+'<br>Total ₹'+(s+g).toFixed(2)}</script></html>

<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Text Case Studio — SHIRMANI</title><style>body{margin:0;background:#080b12;color:#f5f7fb;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{color:#e7c45f}.card{background:#121927;border:1px solid #334155;border-radius:16px;padding:18px;margin:14px 0}textarea,input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff;width:100%;box-sizing:border-box;margin:6px 0}button{background:#e7c45f;color:#111;font-weight:800}pre{white-space:pre-wrap;background:#07101c;padding:12px;color:#67e8f9}</style></head><body><main><a href="../micro-digital-products.html">← Products</a><h1>Text Case Studio</h1><p>Transform text to upper, lower, title or sentence case.</p><div class=card><textarea id=i rows=9></textarea><button onclick="x('u')">UPPER</button><button onclick="x('l')">lower</button><button onclick="x('t')">Title</button><button onclick="x('s')">Sentence</button><pre id=o></pre><script>function x(m){let s=i.value;if(m=='u')s=s.toUpperCase();if(m=='l')s=s.toLowerCase();if(m=='t')s=s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(m=='s')s=s.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(a,c)=>a+c.toUpperCase());o.textContent=s}</script></div><small>Self-contained browser product · SHIRMANI Research Institute</small></main></body></html>

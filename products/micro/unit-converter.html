<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Length Unit Converter — SHIRMANI Micro Product</title><style>body{margin:0;background:#0b0d14;color:#f4f6f8;font-family:system-ui,sans-serif;line-height:1.6}main{max-width:900px;margin:auto;padding:24px 16px 70px}h1,h2{color:#e7c45f}.card{background:#121722;border:1px solid #334155;border-radius:16px;padding:18px;margin:14px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff;width:100%;box-sizing:border-box;margin:5px 0}button{background:#e7c45f;color:#111;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.result{font-size:1.3rem;font-weight:800;color:#67e8f9}.back{color:#e7c45f}</style></head><body><main><p><a class="back" href="../micro-digital-products.html">← Micro Digital Products</a></p><h1>Length Unit Converter</h1><div class="card"><input id="n" type="number" value="1"><select id="u"><option value="m">Meter</option><option value="km">Kilometer</option><option value="cm">Centimeter</option><option value="ft">Feet</option><option value="in">Inch</option></select><button onclick="cv()">Convert</button><div class="result" id="r"></div></div><script>const factors={m:1,km:1000,cm:.01,ft:.3048,in:.0254};function cv(){const x=Number(n.value)*factors[u.value];r.innerHTML=x+" m<br>"+x/1000+" km<br>"+x/0.01+" cm<br>"+x/0.3048+" ft<br>"+x/0.0254+" in"}</script><footer><p>SHIRMANI Research Institute · Self-contained browser product · No server required.</p></footer></main></body></html>

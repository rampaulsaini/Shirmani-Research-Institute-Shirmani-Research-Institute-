<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Digital Drawing Board — SHIRMANI Micro Product</title><style>body{margin:0;background:#0b0d14;color:#f4f6f8;font-family:system-ui,sans-serif;line-height:1.6}main{max-width:900px;margin:auto;padding:24px 16px 70px}h1,h2{color:#e7c45f}.card{background:#121722;border:1px solid #334155;border-radius:16px;padding:18px;margin:14px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff;width:100%;box-sizing:border-box;margin:5px 0}button{background:#e7c45f;color:#111;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.result{font-size:1.3rem;font-weight:800;color:#67e8f9}.back{color:#e7c45f}</style></head><body><main><p><a class="back" href="../micro-digital-products.html">← Micro Digital Products</a></p><h1>Simple Digital Drawing Board</h1><div class="card"><canvas id="cv" width="820" height="480" style="width:100%;background:#fff;touch-action:none"></canvas><button onclick="clearCanvas()">Clear</button></div><script>const x=cv.getContext('2d');let down=false;function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}cv.addEventListener('pointerdown',e=>{down=true;const p=pos(e);x.beginPath();x.moveTo(p.x,p.y)});cv.addEventListener('pointerup',()=>down=false);cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);x.lineWidth=4;x.lineTo(p.x,p.y);x.stroke()});function clearCanvas(){x.clearRect(0,0,cv.width,cv.height)}</script><footer><p>SHIRMANI Research Institute · Self-contained browser product · No server required.</p></footer></main></body></html>

<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Shape Checker</title><style>body{font-family:system-ui;background:#080c12;color:#eef}main{max-width:900px;margin:auto;padding:22px}textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;background:#111925;color:#fff;border:1px solid #456}textarea{height:260px}button{padding:11px 17px;background:#e8c15b;border:0;border-radius:8px;font-weight:800}.out{margin-top:12px;padding:15px;background:#101823;border-radius:10px;white-space:pre-wrap}</style><main><h1>꙰ JSON Shape Checker</h1><p>Quickly check JSON validity and expected top-level keys.</p><textarea id="J" placeholder='{"name":"A","price":10}'></textarea><input id="K" placeholder="expected keys: name,price"><button onclick="run()">Check Shape</button><div id="O" class="out">—</div></main><script>function run(){try{let x=JSON.parse(J.value),k=K.value.split(',').map(s=>s.trim()).filter(Boolean),m=k.filter(v=>!(v in x));O.textContent='Valid JSON\nMissing keys: '+(m.join(', ')||'none')}catch(e){O.textContent='Invalid JSON: '+e.message}}</script></html>

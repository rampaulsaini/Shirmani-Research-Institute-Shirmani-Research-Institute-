<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Diff Studio</title><style>body{font-family:system-ui;background:#081018;color:#eef;margin:0}main{max-width:900px;margin:auto;padding:24px}textarea,input{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:9px;background:#111b25;color:#fff;border:1px solid #456}textarea{height:210px}button{padding:11px 17px;border:0;border-radius:9px;background:#e8c15b;font-weight:800;margin:7px 4px 7px 0}.out{white-space:pre-wrap;background:#111b25;padding:15px;border-radius:10px;margin-top:12px}</style><main><h1>꙰ Text Diff Studio</h1><p>Compare two texts and list added/removed words.</p><textarea id="A" placeholder="Original"></textarea><textarea id="B" placeholder="New"></textarea><button onclick="run()">Run Tool</button><div id="O" class="out">—</div></main><script>function run(){let a=A.value.split(/\s+/).filter(Boolean),b=B.value.split(/\s+/).filter(Boolean),x=new Set(a),y=new Set(b);O.textContent='Added: '+b.filter(v=>!x.has(v)).join(' ')+'\nRemoved: '+a.filter(v=>!y.has(v)).join(' ')}</script></html>

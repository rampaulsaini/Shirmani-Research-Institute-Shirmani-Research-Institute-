<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word & Character Counter — SHIRMANI Micro Product</title><style>body{margin:0;background:#0b0d14;color:#f4f6f8;font-family:system-ui,sans-serif;line-height:1.6}main{max-width:900px;margin:auto;padding:24px 16px 70px}h1,h2{color:#e7c45f}.card{background:#121722;border:1px solid #334155;border-radius:16px;padding:18px;margin:14px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff;width:100%;box-sizing:border-box;margin:5px 0}button{background:#e7c45f;color:#111;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.result{font-size:1.3rem;font-weight:800;color:#67e8f9}.back{color:#e7c45f}</style></head><body><main><p><a class="back" href="../micro-digital-products.html">← Micro Digital Products</a></p><h1>Word & Character Counter</h1><div class="card"><textarea id="t" rows="12"></textarea><div class="grid"><div class="card"><div class="result" id="w">0</div>Words</div><div class="card"><div class="result" id="c">0</div>Characters</div><div class="card"><div class="result" id="s">0</div>Sentences</div></div></div><script>const t=document.querySelector('#t');function f(){const x=t.value;w.textContent=(x.trim().match(/\S+/g)||[]).length;c.textContent=x.length;s.textContent=(x.match(/[.!?]+/g)||[]).length}t.addEventListener('input',f)</script><footer><p>SHIRMANI Research Institute · Self-contained browser product · No server required.</p></footer></main></body></html>

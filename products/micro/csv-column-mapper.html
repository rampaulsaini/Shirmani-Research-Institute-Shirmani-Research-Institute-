<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꙰ CSV Column Mapper</title><style>body{font-family:system-ui;background:#081018;color:#eef;margin:0}main{max-width:960px;margin:auto;padding:24px}textarea,input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;background:#111925;color:#fff;border:1px solid #456}textarea{height:210px}button{padding:11px 17px;border:0;border-radius:9px;background:#e8c15b;font-weight:800;margin:7px 4px}.out{margin-top:12px;padding:15px;background:#101823;border-radius:10px;white-space:pre-wrap;overflow:auto}a{color:#67e8f9}</style></head><body><main><h1>꙰ CSV Column Mapper</h1><p>Map CSV columns into a clean reordered table in the browser.</p><div id="app"></div><div id="O" class="out">—</div><p><a href="../../showroom.html">Public Showroom</a></p></main><script>const A=document.getElementById('app'),O=document.getElementById('O');A.innerHTML='<textarea id="T" placeholder="CSV, first row headers"></textarea><input id="M" placeholder="Column order e.g. 3,1,2"><button onclick="run()">Map</button>';function run(){let r=T.value.trim().split(/\r?\n/).map(x=>x.split(',')),m=(M.value||'').split(',').map(x=>+x.trim()-1).filter(x=>x>=0);if(!m.length)m=r[0].map((_,i)=>i);O.textContent=r.map(row=>m.map(i=>row[i]??'').join(',')).join('\n')}}</script></body></html>

<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CSV to JSON Lite — SHIRMANI</title><style>body{margin:0;background:#080b12;color:#f5f7fb;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{color:#e7c45f}.card{background:#121927;border:1px solid #334155;border-radius:16px;padding:18px;margin:14px 0}textarea,input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff;width:100%;box-sizing:border-box;margin:6px 0}button{background:#e7c45f;color:#111;font-weight:800}pre{white-space:pre-wrap;background:#07101c;padding:12px;color:#67e8f9}</style></head><body><main><a href="../micro-digital-products.html">← Products</a><h1>CSV to JSON Lite</h1><p>Convert simple CSV rows into JSON records.</p><div class=card><textarea id=i rows=9 placeholder="name,price\nTool,99"></textarea><button onclick="go()">Convert</button><pre id=o></pre><script>function go(){let a=i.value.trim().split(/\r?\n/).map(x=>x.split(','));if(a.length<2)return o.textContent='Need header + data.';let h=a[0].map(x=>x.trim());o.textContent=JSON.stringify(a.slice(1).map(r=>Object.fromEntries(h.map((k,j)=>[k,(r[j]||'').trim()]))),null,2)}</script></div><small>Self-contained browser product · SHIRMANI Research Institute</small></main></body></html>

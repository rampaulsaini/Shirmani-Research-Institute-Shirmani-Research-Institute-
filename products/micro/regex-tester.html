<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regex Tester</title><style>body{font-family:system-ui;background:#081018;color:#eef;margin:0}main{max-width:900px;margin:auto;padding:24px}textarea,input{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:9px;background:#111b25;color:#fff;border:1px solid #456}textarea{height:210px}button{padding:11px 17px;border:0;border-radius:9px;background:#e8c15b;font-weight:800;margin:7px 4px 7px 0}.out{white-space:pre-wrap;background:#111b25;padding:15px;border-radius:10px;margin-top:12px}</style><main><h1>꙰ Regex Tester</h1><p>Test a regular expression against text locally in your browser.</p><input id="P" placeholder="Pattern"><textarea id="T" placeholder="Text"></textarea><label><input id="I" type="checkbox"> case-insensitive</label><button onclick="run()">Run Tool</button><div id="O" class="out">—</div></main><script>function run(){try{let r=new RegExp(P.value,I.checked?'i':'');O.textContent=r.test(T.value)?'MATCH':'NO MATCH'}catch(e){O.textContent='Regex error: '+e.message}}</script></html>

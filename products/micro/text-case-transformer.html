<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꙰ Text Case Transformer</title><style>body{font-family:system-ui;background:#081018;color:#eef;margin:0}main{max-width:960px;margin:auto;padding:24px}textarea,input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;background:#111925;color:#fff;border:1px solid #456}textarea{height:210px}button{padding:11px 17px;border:0;border-radius:9px;background:#e8c15b;font-weight:800;margin:7px 4px}.out{margin-top:12px;padding:15px;background:#101823;border-radius:10px;white-space:pre-wrap;overflow:auto}a{color:#67e8f9}</style></head><body><main><h1>꙰ Text Case Transformer</h1><p>Convert text between upper, lower, title and sentence case.</p><div id="app"></div><div id="O" class="out">—</div><p><a href="../../showroom.html">Public Showroom</a></p></main><script>const A=document.getElementById('app'),O=document.getElementById('O');A.innerHTML='<textarea id="T" placeholder="Text"></textarea><select id="M"><option>UPPER</option><option>lower</option><option>Title</option><option>Sentence</option></select><button onclick="run()">Transform</button>';function run(){let t=T.value,m=M.value;if(m==='UPPER')O.textContent=t.toUpperCase();else if(m==='lower')O.textContent=t.toLowerCase();else if(m==='Title')O.textContent=t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());else O.textContent=t.toLowerCase().replace(/(^|[.!?]\s+)\w/g,c=>c.toUpperCase())}}</script></body></html>

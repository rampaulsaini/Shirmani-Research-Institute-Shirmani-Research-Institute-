<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTM Link Builder</title><style>body{font-family:system-ui;background:#081018;color:#eef;margin:0}main{max-width:900px;margin:auto;padding:24px}textarea,input{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:9px;background:#111b25;color:#fff;border:1px solid #456}textarea{height:210px}button{padding:11px 17px;border:0;border-radius:9px;background:#e8c15b;font-weight:800;margin:7px 4px 7px 0}.out{white-space:pre-wrap;background:#111b25;padding:15px;border-radius:10px;margin-top:12px}</style><main><h1>꙰ UTM Link Builder</h1><p>Build campaign tracking URLs without a server.</p><input id="U" placeholder="https://example.com"><input id="S" placeholder="source"><input id="M" placeholder="medium"><input id="C" placeholder="campaign"><button onclick="run()">Run Tool</button><div id="O" class="out">—</div></main><script>function run(){try{let u=new URL(U.value);[['utm_source',S],['utm_medium',M],['utm_campaign',C]].forEach(([k,e])=>e.value&&u.searchParams.set(k,e.value));O.textContent=u.href}catch(e){O.textContent='Enter a valid URL.'}}</script></html>

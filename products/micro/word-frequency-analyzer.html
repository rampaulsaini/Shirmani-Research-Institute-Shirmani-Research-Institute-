<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Frequency Analyzer — Shirmani Research Institute</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.5}textarea,input,select,button{font:inherit;padding:10px;margin:5px 0;box-sizing:border-box}textarea{width:100%;min-height:180px}button{cursor:pointer}pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px;min-height:40px}.brand{opacity:.7}</style></head><body><div class="brand">SHIRMANI RESEARCH INSTITUTE</div><h1>Word Frequency Analyzer</h1><p>Paste text and instantly rank the most frequent words.</p><textarea id="t" placeholder="Paste text..."></textarea><button onclick="go()">Analyze</button><pre id="o"></pre><script>function go(){let w=t.value.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[],m={};w.forEach(x=>m[x]=(m[x]||0)+1);o.textContent=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,50).map(([x,n])=>n+" × "+x).join("\n")||"No words yet."}</script></body></html>

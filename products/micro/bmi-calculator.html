<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shirmani Research Institute — BMI Calculator</title><style>body{margin:0;background:#0d1017;color:#f5f7fb;font:16px/1.6 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:28px}section{background:#151a24;border:1px solid #30394a;border-radius:16px;padding:22px}h1{color:#e5c35b}textarea,input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:11px;border-radius:9px;border:1px solid #3b4658;background:#0b1018;color:#fff}button{cursor:pointer;font-weight:700}.out{white-space:pre-wrap;word-break:break-word;background:#0b1018;padding:12px;border-radius:9px;min-height:45px}a{color:#64d9ff}</style></head><body><main><section><h1>BMI Calculator</h1><p>Calculate BMI from height and weight.</p><input id="H" type="number" placeholder="Height cm"><input id="W" type="number" placeholder="Weight kg"><button onclick="go()">Run</button><div id="O" class="out"></div><p><a href="../../showroom.html">← Public Showroom</a></p></section></main><script>let mode="encode";function go(){const O=document.getElementById("O"),X=document.getElementById("x"),A=document.getElementById("A"),B=document.getElementById("B"),P=document.getElementById("P"),R=document.getElementById("R"),N=document.getElementById("N"),D=document.getElementById("D"),G=document.getElementById("G"),T=document.getElementById("T"),H=document.getElementById("H"),W=document.getElementById("W"),V=document.getElementById("v");let h=+H.value/100,w=+W.value;O.textContent=h>0?'BMI: '+(w/(h*h)).toFixed(1):'Enter valid height';}</script></body></html>

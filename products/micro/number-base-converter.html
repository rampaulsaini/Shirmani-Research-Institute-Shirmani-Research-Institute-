<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Number Base Converter — SHIRMANI</title><style>body{margin:0;background:#080b12;color:#f5f7fb;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{color:#e7c45f}.card{background:#121927;border:1px solid #334155;border-radius:16px;padding:18px;margin:14px 0}textarea,input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff;width:100%;box-sizing:border-box;margin:6px 0}button{background:#e7c45f;color:#111;font-weight:800}pre{white-space:pre-wrap;background:#07101c;padding:12px;color:#67e8f9}</style></head><body><main><a href="../micro-digital-products.html">← Products</a><h1>Number Base Converter</h1><p>Convert integers between binary, octal, decimal and hexadecimal.</p><div class=card><input id=i value=255><select id=b><option value=2>Binary</option><option value=8>Octal</option><option value=10 selected>Decimal</option><option value=16>Hex</option></select><button onclick="go()">Convert</button><pre id=o></pre><script>function go(){let n=parseInt(i.value,+b.value);o.textContent=Number.isFinite(n)?JSON.stringify({binary:n.toString(2),octal:n.toString(8),decimal:n.toString(10),hexadecimal:n.toString(16)},null,2):'Invalid integer'}</script></div><small>Self-contained browser product · SHIRMANI Research Institute</small></main></body></html>

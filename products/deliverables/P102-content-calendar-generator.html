<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P102 Content Calendar Generator</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:24px}textarea,input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:10px}</style><h1>P102 — Content Calendar Generator</h1><p>Generate a 30-day plan from one topic.</p><input id="topic" placeholder="Topic / product / course"><button onclick="go()">Generate</button><textarea id="out" rows="28"></textarea><script>function go(){const t=document.getElementById('topic').value.trim()||'your topic',a=['how-to','myth vs fact','case study','checklist','short tutorial','FAQ','comparison','story','tool review','customer problem'];let s='30-DAY PLAN — '+t+'\\n\\n';for(let i=1;i<=30;i++)s+=i+'. '+a[(i-1)%a.length]+': '+t+' — one useful takeaway.\\n';document.getElementById('out').value=s}</script>

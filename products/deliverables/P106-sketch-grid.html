<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P106 Sketch Grid</title><style>body{font-family:system-ui;text-align:center;padding:16px}canvas{max-width:95vw;border:1px solid #777;touch-action:none}button{padding:10px;margin:6px}</style><h1>P106 — Digital Sketch Grid</h1><p>Draw with mouse or touch and download PNG.</p><canvas id="c" width="1000" height="700"></canvas><br><button onclick="clearCanvas()">Clear</button><button onclick="save()">Download PNG</button><script>const c=document.getElementById('c'),x=c.getContext('2d');x.lineWidth=3;let d=false;c.onpointerdown=e=>{d=true;x.beginPath();x.moveTo(e.offsetX*c.width/c.clientWidth,e.offsetY*c.height/c.clientHeight)};c.onpointerup=()=>d=false;c.onpointermove=e=>{if(!d)return;x.lineTo(e.offsetX*c.width/c.clientWidth,e.offsetY*c.height/c.clientHeight);x.stroke()};function clearCanvas(){x.clearRect(0,0,c.width,c.height)}function save(){let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='shirmani-sketch.png';a.click()}</script>

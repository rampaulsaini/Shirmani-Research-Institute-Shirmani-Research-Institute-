<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Path Builder — SHIRMANI</title><style>body{margin:0;background:#080b12;color:#f5f7fa;font-family:system-ui,sans-serif;line-height:1.55}main{max-width:950px;margin:auto;padding:22px}h1,h2{color:#e6c76a}.card{background:#111722;border:1px solid #334155;border-radius:16px;padding:20px;margin:14px 0}input,select,button{font:inherit;width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff}button{background:#e6c76a;color:#111;font-weight:800}.result{white-space:pre-wrap;background:#070a0f;padding:14px;border-radius:10px}a{color:#e6c76a}</style></head><body><main><p><a href="index.html">← Product Hub</a></p><h1>🎓 Learning Path Builder</h1><div class="card"><p>Goal, level, available time और budget के आधार पर structured learning cycle तैयार करें। यह university admission, certification या employment outcome की guarantee नहीं देता।</p><input id="g" placeholder="Goal — जैसे AI/ML/NLP, German, BTech"><select id="l"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><input id="h" type="number" min="1" value="7" placeholder="Hours/week"><input id="b" type="number" min="0" value="0" placeholder="Budget/month ₹"><button onclick="build()">Learning Plan बनाएं</button></div><div class="card"><h2>Plan</h2><div id="o" class="result">अभी योजना नहीं बनी।</div></div><script>function v(i){return document.getElementById(i).value.trim()}function build(){if(!v('g'))return alert('Goal लिखें');let h=+v('h')||7,b=+v('b')||0;document.getElementById('o').textContent='LEARNING PATH\n\nGoal: '+v('g')+'\nLevel: '+v('l')+'\nTime: '+h+' hours/week\nBudget: ₹'+b+'/month\n\n4-WEEK CYCLE\n1. Fundamentals + baseline\n2. Guided practice + notes\n3. Project / exercises\n4. Assessment + portfolio evidence\n\nNEXT: repeat with a harder project and measurable assessment.'}</script></main></body></html>

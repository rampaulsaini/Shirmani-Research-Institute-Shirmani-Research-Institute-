<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Production Release Console</title>
<style>body{font-family:system-ui;background:#071018;color:#eef5f8;max-width:1050px;margin:auto;padding:20px}section{background:#101923;border:1px solid #405466;border-radius:16px;padding:18px;margin:14px 0}h1,h2{color:#ffd84a}input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;background:#081019;color:#fff;border:1px solid #405466;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#ffd84a;font-weight:800}pre{white-space:pre-wrap;background:#050a0f;padding:12px;border-radius:8px}img{max-width:220px;background:#fff;padding:8px}.ok{color:#6ee7b7}.warn{color:#f6c453}</style>
<section><h1>꙰ SHIRMANI Production Release Console</h1><p class="ok"><b>Production-first:</b> workflow run is not counted as a product.</p><p class="warn">100200 = production batch/capacity target. Sequence begins at .001. It is not a verification count.</p></section>
<section><h2>Release Record Builder</h2><label>Product ID<input id="pid" value="SP-ENG-001"></label><label>Product Name<input id="pn" value="SHIRMANI Calculator"></label><label>Engine<input id="eng" value="ENG-001"></label><label>Batch No.<input id="batch" value="100200.001"></label><button onclick="build()">Build QC / Gate / Dispatch / QR</button><pre id="out">Ready.</pre><div id="qr"></div></section>
<script>
function build(){
 const pid=document.getElementById("pid").value.trim(),pn=document.getElementById("pn").value.trim(),eng=document.getElementById("eng").value.trim(),batch=document.getElementById("batch").value.trim();
 const seed=pid+"|"+eng+"|"+batch;let h=0;for(let i=0;i<seed.length;i++)h=((h<<5)-h)+seed.charCodeAt(i)|0;
 const hex=(Math.abs(h).toString(16)+"000000000000").slice(0,12).toUpperCase();
 const r={product_id:pid,product_name:pn,engine_id:eng,version:"1.0.0",batch_no:batch,qc_code:"QC-"+hex,gate_no:"GATE-"+eng.replace(/\\D/g,""),dispatch_no:"DISPATCH-"+batch.replace(".","-"),status:"RELEASE_READY"};
 r.qr_payload="SHIRMANI|"+r.product_id+"|"+r.batch_no+"|"+r.qc_code+"|"+r.gate_no+"|"+r.dispatch_no;
 document.getElementById("out").textContent=JSON.stringify(r,null,2);
 const url="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(r.qr_payload);
 document.getElementById("qr").innerHTML="<p><b>QR payload</b></p><img alt='Production QR' src='"+url+"'><p>QR is a visual encoding of the release payload; the release registry remains the authoritative record.</p>";
}
</script></section></html>

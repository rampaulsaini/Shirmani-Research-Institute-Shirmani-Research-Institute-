<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Supreme Digital Product Showroom</title><style>body{margin:0;background:#030812;color:#eef6ff;font-family:system-ui}main{max-width:1250px;margin:auto;padding:20px}.hero{padding:28px;border:2px solid #e7c85b;border-radius:28px;background:radial-gradient(circle at 50% 0,#19334c,#050a12 62%);text-align:center}h1{color:#f6d35f;font-size:clamp(2rem,5vw,4rem)}.sub{color:#66ddff;font-weight:800}.controls{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:18px 0}input,select{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #38566b;background:#08121d;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{padding:18px;border:1px solid #38566b;border-radius:20px;background:#07131d}.card h2{color:#f6d35f}.tag{color:#66ddff;font-size:.82rem;font-weight:800}.price{color:#72e6aa;font-weight:900;font-size:1.2rem}a{color:#fff;text-decoration:none;display:inline-block;padding:10px 12px;border:1px solid #e7c85b;border-radius:10px;margin:4px}small{color:#aebdcc}</style></head><body><main><section class="hero"><div class="sub">꙰ SHIRMANI HEART-VIEW · PUBLIC SHOWROOM</div><h1>Supreme Digital Product Hub</h1><p>Identity · short description · price/offer · demo · VIP visual · long passport</p><p><small>Production-first interface. Commercial transaction, delivery and independent verification are separate states.</small></p></section><div class="controls"><input id="q" placeholder="Search product, family, engine, ID…"><select id="family"><option value="">All categories</option></select></div><div id="status" class="sub">Loading catalogue…</div><section id="grid" class="grid"></section></main><script>(async()=>{const s=document.getElementById('status'),g=document.getElementById('grid'),q=document.getElementById('q'),f=document.getElementById('family');let a=[];try{const m=await fetch('../catalog/manifest.json').then(r=>r.json());for(const x of m.shards)a.push(...(await fetch('../'+x.path).then(r=>r.json())).products)}catch(e){s.textContent='Catalogue is still being built by the production factory.';return}for(const x of [...new Set(a.map(p=>p.family||p.category||'Digital Product'))].sort()){let o=document.createElement('option');o.value=x;o.textContent=x;f.appendChild(o)}function render(){let t=q.value.toLowerCase().trim(),z=f.value,r=a.filter(p=>(!t||JSON.stringify(p).toLowerCase().includes(t))&&(!z||(p.family||p.category||'Digital Product')===z)).slice(0,300);s.textContent='Showing '+r.length+' of '+a.length+' catalogue identities';g.innerHTML=r.map(p=>{let id=encodeURIComponent(p.id||'PRODUCT'),n=p.name||p.id,pr=p.offer_price_inr??p.price_inr??'';return '<article class="card"><div class="tag">'+(p.id||'PRODUCT')+' · '+(p.engine||'SHIRMANI')+'</div><h2>'+n+'</h2><p>'+((p.short_description||p.description||'Digital product').slice(0,180))+'</p><div class="price">₹'+pr+'</div><a href="live/'+String(p.id).toLowerCase()+'/">Open product</a><a href="product-passport.html?id='+id+'">Passport</a><a href="demos/products/'+String(p.id).toLowerCase()+'.mp4">Demo</a></article>'}).join('')}q.oninput=render;f.onchange=render;render()})()</script></body></html>

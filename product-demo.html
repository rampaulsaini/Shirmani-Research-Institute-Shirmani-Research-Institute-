<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIRMANI Product Demo</title>
<style>body{margin:0;background:#050910;color:#eef5f8;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.card{background:#101923;border:1px solid #354858;border-radius:18px;padding:18px;margin:14px 0}h1,h2{color:#ffd84a}.video{background:#000;border-radius:14px;overflow:hidden;border:1px solid #405466}video{display:block;width:100%;aspect-ratio:16/9;background:#000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.k{background:#081019;padding:12px;border-radius:10px}.btn{display:inline-block;background:#ffd84a;color:#111;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:900}.muted{color:#aebdc7}pre{white-space:pre-wrap;background:#050a0f;padding:12px;border-radius:10px}</style></head>
<body><main><div class="card"><a class="btn" href="showroom.html">← Showroom</a> <a class="btn" href="products/production-launch-center.html">Production Center</a><h1 id="name">SHIRMANI Product Demo</h1><p id="desc" class="muted">Loading…</p></div>
<div class="card"><h2>🎬 Demo Video — कैसे करें / कहाँ उपयोग करें</h2><div class="video"><video id="vid" controls playsinline preload="metadata"></video></div><p id="fallback" class="muted"></p></div>
<div class="card"><h2>Interactive Usage Guide</h2><div id="steps" class="grid"></div><div id="workspace"></div><pre id="result">Product demo ready.</pre></div></main>
<script>
const id=new URLSearchParams(location.search).get("id")||"SP-0001";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const out=x=>document.getElementById("result").textContent=JSON.stringify(x,null,2);
function steps(p){const e=p.engine||"package";const map={calculator:["Enter two values","Choose the operation","Run the calculation","Reuse the result"],text:["Enter text/language material","Run analysis","Review output","Reuse the result"],seo:["Enter title and description","Build SEO package","Review metadata","Reuse for web publishing"],data:["Paste JSON/CSV","Run inspection","Review validity/rows","Use the structured result"],visual:["Enter visual brief","Build specification","Review stages","Export plan"],game:["Start game","Interact","Inspect output","Replay"],planner:["Enter task","Build plan","Review steps","Reuse plan"],research:["Enter research question","Add source/evidence","Record limitations","Export the structured record"],quantum:["Choose the gate","Run classical simulation","Inspect the state","Use as a research/demo output"],default:["Open the product","Enter your task","Run the production module","Review and reuse the result"]};return map[e]||map.default}
function render(p){document.getElementById("name").textContent=p.name||"SHIRMANI Product Demo";document.getElementById("desc").textContent=(p.description||"").slice(0,320);const v=document.getElementById("vid");v.src="products/demos/"+(p.engine||"package")+".mp4";v.poster="products/visuals/"+String(p.id).toLowerCase()+".svg";v.onerror=()=>document.getElementById("fallback").textContent="इस engine का video asset continuous demo-production workflow में queued है। नीचे interactive usage guide अभी उपलब्ध है।";document.getElementById("steps").innerHTML=steps(p).map((x,i)=>"<div class='k'><b>"+(i+1)+".</b> "+esc(x)+"</div>").join("");document.getElementById("workspace").innerHTML="<p class='muted'>Product ID: "+esc(p.id)+" · Family: "+esc(p.family)+" · Engine: "+esc(p.engine)+" · Price: ₹"+Number(p.offer_price_inr||p.price_inr||0).toLocaleString("en-IN")+"</p><a class='btn' href='showroom-product.html?id="+encodeURIComponent(p.id)+"'>Open Product Page</a>";out({product_id:p.id,engine:p.engine,category:p.category,usage_steps:steps(p),demo_video:"products/demos/"+p.engine+".mp4",status:"DEMO_ROUTE_READY"})}
fetch("generated/1000-digital-products.json?ts="+Date.now()).then(r=>r.json()).then(d=>{const p=(d.products||[]).find(x=>x.id===id)||d.products[0];render(p)}).catch(e=>document.getElementById("desc").textContent="Product catalogue unavailable: "+e.message);
</script></body></html>

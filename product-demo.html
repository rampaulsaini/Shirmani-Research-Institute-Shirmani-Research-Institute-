<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRMANI Product Demo</title><style>body{font-family:system-ui;background:#071019;color:#fff;max-width:1100px;margin:auto;padding:24px}section{background:#101923;border:1px solid #405466;border-radius:18px;padding:20px;margin:14px 0}input,button{padding:12px;border-radius:9px;border:1px solid #52687a}input{width:70%;background:#081019;color:#fff}button{background:#ffd84a;font-weight:800}video{width:100%;max-height:650px;background:#000;border-radius:14px;margin-top:15px}a{color:#66ddff}</style><main><section><h1>꙰ SHIRMANI Product-Specific Demo</h1><p>Product-specific MP4 presentation generated from the product identity visual. Production, QC and dispatch are separate states.</p><input id="pid" placeholder="Product ID, e.g. SP-0001"><button onclick="loadDemo()">Open demo</button><div id="status"></div><video id="v" controls playsinline></video></section></main><script>const base='products/demos/products/';function loadDemo(){let id=document.getElementById('pid').value.trim().toLowerCase();if(!id)return;let v=document.getElementById('v');v.src=base+id+'.mp4';v.load();document.getElementById('status').innerHTML='<p>Demo route: <a href="'+v.src+'">'+id+'.mp4</a></p>'}</script></html>

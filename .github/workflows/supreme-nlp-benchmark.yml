name: SHIRMANI Supreme NLP Benchmark Contract

on:
  push:
    branches: [main]
    paths:
      - "docs/supreme-nlp-benchmark-contract-2026-10-01.md"
      - "factory/supreme_nlp_benchmark.py"
      - ".github/workflows/supreme-nlp-benchmark.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 */5 * * *"

permissions:
  contents: write

concurrency:
  group: shirmani-supreme-nlp-benchmark
  cancel-in-progress: true

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark contract
        run: python3 factory/supreme_nlp_benchmark.py
      - name: Persist benchmark QC artifact
        run: test -s generated/supreme-nlp-benchmark-qc.json
      - name: Publish generated benchmark QC
        run: |
          git config user.name "shirmani-benchmark[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/supreme-nlp-benchmark-qc.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(nlp): refresh benchmark contract QC"
          git push

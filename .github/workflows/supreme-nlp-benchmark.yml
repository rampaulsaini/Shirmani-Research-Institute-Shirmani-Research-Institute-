name: SHIRMANI Supreme NLP Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/supreme_runtime.py"
      - "factory/supreme_nlp_benchmark.py"
      - "tests/supreme_nlp_benchmark_test.py"
      - "schemas/supreme-runtime-result.schema.json"
      - ".github/workflows/supreme-nlp-benchmark.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run reference benchmark
        run: python3 factory/supreme_nlp_benchmark.py
      - name: Run benchmark regression test
        run: python3 tests/supreme_nlp_benchmark_test.py
      - name: Upload benchmark telemetry
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-benchmark-${{ github.run_id }}
          path: generated/supreme-nlp-benchmark.json
          if-no-files-found: error
          retention-days: 14

name: SHIRMANI Nishpaksh Supreme Automission Governance

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "docs/SHIRMANI-NISHPAKSH-AUTOMISSION-CONTRACT.md"
      - "scripts/validate_nishpaksh_automission.py"
      - "agents/**"
      - "schemas/**"
      - ".github/workflows/shirmani-nishpaksh-governance.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-nishpaksh-governance
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile critical AI/NLP control plane
        run: |
          python -m py_compile agents/supreme_nlp.py agents/supreme_nlp_practitioner.py agents/automission_supervisor.py scripts/validate_nishpaksh_automission.py

      - name: Validate Nishpaksh governance
        run: python scripts/validate_nishpaksh_automission.py

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("schemas").rglob("*.json"))
          for p in files: json.loads(p.read_text(encoding="utf-8"))
          print(f"JSON_SCHEMAS_VALIDATED={len(files)}")
          PY

      - name: Validate fail-closed Supreme orchestration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/supreme-total-orchestrator.yml").read_text(encoding="utf-8")
          required=["independent_verification_required","accuracy_is_measured_not_declared","scheduled_code_mutation_allowed","subjective_experience_claim_allowed"]
          for x in required: assert x in p, x
          print("SUPREME_ORCHESTRATOR_GOVERNANCE_BOUNDARY=PASS")
          PY

      - name: Emit audit summary
        run: |
          echo "## ꙰ SHIRMANI Nishpaksh Supreme Automission" >> "$GITHUB_STEP_SUMMARY"
          echo "- 5-minute audit cycle: ACTIVE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Person/doctrine neutrality: ENFORCED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence + counter-evidence boundary: ENFORCED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Independent verification: REQUIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Subjective-experience leap: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduled production mutation: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fail-closed governance: PASS" >> "$GITHUB_STEP_SUMMARY"

name: SHIRMANI Production-First Conveyor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: production-first-conveyor
  cancel-in-progress: false
jobs:
  production-conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production queue and public telemetry
        run: python scripts/production_first_conveyor.py
      - name: Propose telemetry through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/production-first-conveyor-telemetry
          delete-branch: false
          add-paths: |
            generated/production-first-conveyor.json
            generated/production-first-state.json
          commit-message: "chore: update production-first conveyor telemetry"
          title: "chore: update production-first conveyor telemetry"
          body: |
            Automated proposal of production queue telemetry.
            This PR preserves protected-branch rules and keeps generated state reviewable.
            Workflow execution and generated queue counts are not proof of product completion or independent verification.

name: SHIRMANI Production-First Conveyor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: production-first-conveyor
  cancel-in-progress: false
jobs:
  production-conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Build production queue and public telemetry
        run: python scripts/production_first_conveyor.py
      - name: Publish production telemetry through pull request when permitted
        id: publish_telemetry
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/production-first-conveyor-telemetry
          delete-branch: false
          add-paths: |
            generated/production-first-conveyor.json
            generated/production-first-state.json
          commit-message: "chore: update production-first conveyor telemetry"
          title: "chore: update production-first conveyor telemetry"
          body: |
            Automated proposal of production queue telemetry.
            Workflow execution and generated queue counts are not proof of product completion or independent verification.

      - name: Preserve telemetry on a review branch if PR creation is blocked
        if: steps.publish_telemetry.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Production-First Conveyor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-first-conveyor.json generated/production-first-state.json
          if git diff --cached --quiet; then
            echo "Production telemetry unchanged."
            exit 0
          fi
          git commit -m "chore: preserve production-first telemetry for review"
          git push origin HEAD:refs/heads/automation/production-first-conveyor-review-fallback
          echo "PR creation was blocked; telemetry was preserved on automation/production-first-conveyor-review-fallback."

name: SHIRMANI Production-First Conveyor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: production-first-conveyor
  cancel-in-progress: false
jobs:
  production-conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build production queue and public telemetry
        run: python scripts/production_first_conveyor.py
      - name: Validate generated production telemetry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in (
              "generated/production-first-conveyor.json",
              "generated/production-first-state.json",
          ):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing production output: {name}")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"Expected JSON object: {name}")
              print(f"{name}: valid JSON; keys={len(data)}")
          PY
      - name: Propose telemetry through a reviewed pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/production-first-conveyor-telemetry
          delete-branch: false
          commit-message: "chore: update production-first conveyor telemetry"
          title: "chore(telemetry): update production-first counters"
          body: |
            Automated proposal of production-first queue and telemetry.
            
            Review the generated counts and product gaps before merging.
            Workflow execution is not a product, sale, independent verification,
            or proof that a downstream integration is live.
          add-paths: |
            generated/production-first-conveyor.json
            generated/production-first-state.json

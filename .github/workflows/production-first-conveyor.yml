name: SHIRMANI Production-First Conveyor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: production-first-conveyor
  cancel-in-progress: false
jobs:
  production-conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Build production queue and public telemetry
        run: python scripts/production_first_conveyor.py
      - name: Propose telemetry update through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/production-first-conveyor-state
          delete-branch: false
          add-paths: |
            generated/production-first-conveyor.json
            generated/production-first-state.json
          commit-message: "chore: update production-first conveyor telemetry"
          title: "chore: refresh production-first conveyor telemetry"
          body: |
            Automated proposal for generated production queue/state telemetry.
            This PR preserves the protected-main rule; it does not push directly to main.
            Review generated diffs and evidence before merging.
          labels: |
            automation
            verification

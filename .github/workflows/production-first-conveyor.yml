name: SHIRMANI Production-First Conveyor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: production-first-conveyor
  cancel-in-progress: false
jobs:
  production-conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - name: Build production queue and public telemetry
        run: python scripts/production_first_conveyor.py
      - name: Publish telemetry using repository contents permission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Production-First Conveyor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-first-conveyor.json generated/production-first-state.json
          if git diff --cached --quiet; then
            echo "Production telemetry unchanged."
            exit 0
          fi
          git commit -m "chore: update production-first conveyor telemetry"
          git push origin HEAD:main

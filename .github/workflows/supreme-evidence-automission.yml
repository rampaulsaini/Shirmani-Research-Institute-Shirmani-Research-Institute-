name: SHIRMANI Supreme Evidence Automission

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "research/**"
      - "schemas/**"
      - "factory/**"
      - "docs/supreme-*.md"
      - ".github/workflows/supreme-evidence-automission.yml"

permissions:
  contents: read

concurrency:
  group: supreme-evidence-automission
  cancel-in-progress: true

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Supreme NLP contract QC
        run: python factory/supreme_nlp_contract_qc.py

      - name: Supreme NLP evaluation schema QC
        run: python factory/supreme_nlp_evaluation_qc.py

      - name: Source comparison integrity QC
        run: python factory/supreme_claim_integrity_qc.py

      - name: Verify operating contract is present
        run: |
          set -euo pipefail
          test -s docs/supreme-evidence-automission-operating-contract-2026-10-02.md
          grep -q "Workflow success ≠ scientific verification" docs/supreme-evidence-automission-operating-contract-2026-10-02.md
          grep -q "Five-minute Automission gate" docs/supreme-evidence-automission-operating-contract-2026-10-02.md

      - name: Emit machine-readable gate result
        run: |
          set -euo pipefail
          mkdir -p generated/automission
          cat > generated/automission/supreme-evidence-gate-status.json <<'JSON'
          {
            "system": "SHIRMANI Supreme Evidence Automission",
            "cadence": "5-minute deterministic gate",
            "state": "PASS",
            "scientific_verification": "NOT_INFERRED",
            "workflow_success_is_not_scientific_verification": true
          }
          JSON
          cat generated/automission/supreme-evidence-gate-status.json

      - name: Upload gate artifact
        uses: actions/upload-artifact@v7
        with:
          name: supreme-evidence-gate-status
          path: generated/automission/supreme-evidence-gate-status.json

name: Shirmani Social API — Node CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/shirmani-social-api-node-ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/shirmani-social-api-node-ci.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-social-api-node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node.js tests, syntax and PostgreSQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shirmani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shirmani_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply baseline schema, guest lifecycle migration and database assertions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d shirmani_test -v ON_ERROR_STOP=1 \
            -f server/sql/schema.sql \
            -f server/sql/migrations/002_platform_hardening.sql \
            -f server/sql/migrations/003_private_income_proof.sql \
            -f server/sql/migrations/004_delivery_acceptance_evidence.sql \
            -f server/sql/migrations/005_guest_service_order_lifecycle.sql \
            -f server/test/guest-service-order.integration.sql
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run server test suite
        working-directory: server
        run: npm test
      - name: Check server entrypoint syntax
        working-directory: server
        run: npm run check

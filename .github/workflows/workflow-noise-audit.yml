name: SHIRMANI Workflow Noise Audit — Read Only

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/workflow_noise_audit.py"
      - "scripts/validate_supreme_architecture.py"
      - "tests/test_workflow_noise_audit.py"
      - "docs/WORKFLOW-NOISE-FILTER-ZERO-LOSS.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-noise-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit tests
        run: python -m unittest tests/test_workflow_noise_audit.py -v
      - name: Validate architecture contract
        run: python scripts/validate_supreme_architecture.py
      - name: Build read-only workflow inventory
        run: python scripts/workflow_noise_audit.py > workflow-noise-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-workflow-noise-audit
          path: workflow-noise-audit.json
          if-no-files-found: error
          retention-days: 14

name: SHIRMANI Continuous Concrete Product Production
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-continuous-concrete-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_TARGET: "5000"
      CONCRETE_PRODUCT_BATCH_SIZE: "500"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure production scale
        run: |
          echo "PRODUCT_TARGET=$PRODUCT_TARGET" >> "$GITHUB_ENV"
          echo "CONCRETE_PRODUCT_BATCH_SIZE=$CONCRETE_PRODUCT_BATCH_SIZE" >> "$GITHUB_ENV"
      - name: Expand source catalog to production target
        run: python3 factory/expand_product_catalog.py
      - name: Produce next concrete public batch
        run: python3 factory/continuous_product_batch.py
      - name: Upgrade concrete products to engine-specific modules
        env:
          CONCRETE_DEPTH_BATCH_SIZE: "500"
        run: python3 factory/concrete_product_depth_upgrade.py
      - name: Audit concrete production truth
        run: python3 factory/concrete_product_truth.py
      - name: Publish full-catalog concrete production through branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if git diff --quiet -- generated/1000-digital-products.json products/concrete generated/concrete-production-overlay.json generated/continuous-production-batch-status.json generated/concrete-product-truth.json generated/concrete-product-production-status.json generated/concrete-product-depth-status.json; then
            echo "No production delta."
            exit 0
          fi
          BRANCH="automation/concrete-production-${GITHUB_RUN_ID}"
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add generated/1000-digital-products.json products/concrete generated/concrete-production-overlay.json generated/continuous-production-batch-status.json generated/concrete-product-truth.json generated/concrete-product-production-status.json generated/concrete-product-depth-status.json
          git commit -m "auto(production): expand catalog and materialize next concrete batch"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Automission: publish next concrete product batch" --body "Automated production batch: catalog expansion + concrete product assets. Production is source-bound; QC/gate/dispatch remain downstream states."
          gh pr merge --auto --squash "$BRANCH" || echo "Auto-merge unavailable; PR remains open for repository policy/review."
          echo "Production PR ready: $BRANCH"
          echo "Production remains source-bound; QC/gate/dispatch are downstream."

name: SHIRMANI Continuous Concrete Product Production
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-continuous-concrete-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Produce next concrete public batch
        run: python3 factory/continuous_product_batch.py
      - name: Publish concrete production
        run: |
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/production generated/concrete-production-overlay.json generated/continuous-production-batch-status.json
          if git diff --cached --quiet; then
            echo "No production delta."
            exit 0
          fi
          git commit -m "auto(production): materialize next concrete product batch"
          git push

name: SHIRMANI Continuous Concrete Product Production
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shirmani-production-observer
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_TARGET: "5000"
      CONCRETE_PRODUCT_BATCH_SIZE: "500"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure production scale
        run: |
          echo "PRODUCT_TARGET=$PRODUCT_TARGET" >> "$GITHUB_ENV"
          echo "CONCRETE_PRODUCT_BATCH_SIZE=$CONCRETE_PRODUCT_BATCH_SIZE" >> "$GITHUB_ENV"
      - name: Expand source catalog to production target
        run: python3 factory/expand_product_catalog.py
      - name: Produce next concrete public batch
        run: python3 factory/continuous_product_batch.py
      - name: Upgrade concrete products to engine-specific modules
        env:
          CONCRETE_DEPTH_BATCH_SIZE: "500"
        run: python3 factory/concrete_product_depth_upgrade.py
      - name: Audit concrete production truth
        run: python3 factory/concrete_product_truth.py
      - name: Publish production telemetry
        run: echo "Continuous concrete production completed; canonical public deployment handles publication." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production telemetry
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-continuous-concrete-production
          path: |
            generated/1000-digital-products.json
            generated/concrete-production-overlay.json
            generated/continuous-production-batch-status.json
            generated/concrete-product-truth.json
            generated/concrete-product-production-status.json
            generated/concrete-product-depth-status.json
          retention-days: 14

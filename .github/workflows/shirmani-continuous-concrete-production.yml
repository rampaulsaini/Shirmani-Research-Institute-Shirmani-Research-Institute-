name: SHIRMANI Continuous Concrete Product Production
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-production-state-writer
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_TARGET: "5000"
      CONCRETE_PRODUCT_BATCH_SIZE: "1000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load persistent production state
        run: |
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git checkout FETCH_HEAD -- generated products
            echo "PRODUCTION_STATE_SOURCE=automation/production-state"
          else
            echo "PRODUCTION_STATE_SOURCE=main-initial"
          fi

      - name: Recover malformed production state before factory execution
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 - <<'PY'
          import json
          json.load(open("generated/1000-digital-products.json", encoding="utf-8"))
          print("Production catalog JSON is valid.")
          PY
          then
            echo "Production-state catalog is malformed; restoring the canonical main catalog before continuing."
            git restore --source origin/main -- generated/1000-digital-products.json
          fi
          if ! python3 - <<'PY'
          import json
          json.load(open("generated/concrete-production-overlay.json", encoding="utf-8"))
          print("Concrete production overlay JSON is valid.")
          PY
          then
            echo "Concrete production overlay is malformed; removing it so the factory rebuilds it from existing product assets."
            rm -f generated/concrete-production-overlay.json
          fi
          python3 - <<'PY'
          import json
          catalog=json.load(open("generated/1000-digital-products.json", encoding="utf-8"))
          print("Production catalog records:", len(catalog.get("products", [])))
          PY

      - name: Configure production scale
        run: |
          echo "PRODUCT_TARGET=$PRODUCT_TARGET" >> "$GITHUB_ENV"
          echo "CONCRETE_PRODUCT_BATCH_SIZE=$CONCRETE_PRODUCT_BATCH_SIZE" >> "$GITHUB_ENV"
      - name: Expand source catalog to production target
        run: python3 factory/expand_product_catalog.py
      - name: Produce next concrete public batch
        run: python3 factory/continuous_product_batch.py
      - name: Install QR asset factory dependency
        run: python3 -m pip install --disable-pip-version-check "qrcode[pil]==8.2"

      - name: Materialize per-product QR long-description assets
        env:
          QR_BATCH: "1000"
        run: python3 factory/product_qr_asset_factory.py
      - name: Materialize unique 4K product identity visuals — centered Heart-View logo + local QR
        env:
          VISUAL_BATCH: "5000"
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Upgrade concrete products to engine-specific modules
        env:
          CONCRETE_DEPTH_BATCH_SIZE: "500"
        run: python3 factory/concrete_product_depth_upgrade.py
      - name: Audit concrete production truth
        run: python3 factory/concrete_product_truth.py
      - name: Persist live production telemetry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          t=json.loads(Path("generated/concrete-product-truth.json").read_text())
          produced=int(t["concrete_produced"]); target=int(t["catalog_count"])
          Path("generated/concrete-product-asset-status.json").write_text(json.dumps({
            "generated_at":datetime.now(timezone.utc).isoformat(),
            "product_assets":produced,"catalog_products":target,
            "materialization_percent":round(100*produced/target,2) if target else 0,
            "asset_directory":"products/concrete/","showroom":"showroom.html",
            "state":"COMPLETE" if produced==target else "IN_PROGRESS",
            "dispatch":"NO","principle":"Concrete repository-bound assets are production evidence; QC, dispatch and independent verification remain downstream."
          },ensure_ascii=False,indent=2)+"\n")
          Path("generated/live-production-state.json").write_text(json.dumps({
            "schema_version":1,"generated_at":datetime.now(timezone.utc).isoformat(),
            "production_first":True,"catalog_identities":target,
            "concrete_repository_assets":produced,"current_catalog_pending":max(0,target-produced),
            "five_thousand_scale_target":5000,"remaining_to_scale_target":max(0,5000-produced),
            "concrete_materialization_percent_of_catalog":round(100*produced/target,2) if target else 0,
            "concrete_materialization_percent_of_scale_target":round(100*produced/5000,2),
            "module_products_generated":produced,"dispatch_released":0,"sales_claimed":0,
            "payment_claimed":0,"independent_verification_claimed":0,
            "state":"PRODUCTION_COMPLETE_CURRENT_CATALOG" if produced==target else "PRODUCTION_IN_PROGRESS"
          },ensure_ascii=False,indent=2)+"\n")
          print(f"PRODUCTION: {produced}/{target}")
          PY

      - name: Publish public production operations telemetry
        run: python3 factory/production_operations_status.py
      - name: Publish production evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-concrete-production-${{ github.run_number }}
          retention-days: 7
          path: |
            generated/1000-digital-products.json
            generated/concrete-production-overlay.json
            generated/continuous-production-batch-status.json
            generated/concrete-product-truth.json
            generated/concrete-product-production-status.json
            generated/concrete-product-depth-status.json
            generated/product-visual-assets.json
            generated/product-visual-assets-v2.json
            generated/product-qr-assets.json
            generated/production-operations-status.json
      - name: Publish concrete production state to canonical production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Concrete Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail
          git fetch origin automation/production-state
          rm -rf /tmp/shirmani-production-publish
          git worktree add --detach /tmp/shirmani-production-publish FETCH_HEAD
          cp -a generated/. /tmp/shirmani-production-publish/generated/
          mkdir -p /tmp/shirmani-production-publish/products/concrete /tmp/shirmani-production-publish/products/visuals
          cp -a products/concrete/. /tmp/shirmani-production-publish/products/concrete/
          cp -a products/visuals/. /tmp/shirmani-production-publish/products/visuals/
          cd /tmp/shirmani-production-publish
          git config user.name "SHIRMANI Concrete Production Automission"
          git config user.email "41898282+github-actions[bot]@noreply.github.com"
          git add generated/live-production-state.json generated/concrete-product-asset-status.json generated/concrete-product-truth.json generated/concrete-production-overlay.json generated/concrete-product-production-status.json generated/concrete-product-depth-status.json generated/continuous-production-batch-status.json generated/1000-digital-products.json generated/product-visual-assets.json generated/product-qr-assets.json generated/production-operations-status.json products/concrete products/visuals
          if git diff --cached --quiet; then
            echo "No concrete production delta to publish."
            exit 0
          fi
          git commit -m "chore(production): publish concrete product batch"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          git push --force-with-lease="refs/heads/automation/production-state:${remote_sha}" origin HEAD:automation/production-state
          echo "Concrete production state published to canonical production-state without stash/merge conflicts."
      - name: Production publication handoff
        run: |
          echo "Concrete production completed in this run."
          echo "Persistent production-state publication is owned by SHIRMANI Production Persistence & Truth Gate."
          echo "Public Pages deployment is owned by SHIRMANI Public Production Automission to avoid duplicate deployment races."
      - name: Report production state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("generated/concrete-product-asset-status.json")
          try:
              s=json.loads(p.read_text())
          except Exception as exc:
              print("Production telemetry was published, but local report parsing was unavailable:", type(exc).__name__)
              raise SystemExit(0)
          print("CONCRETE_PRODUCT_ASSETS:", s.get("product_assets", s.get("concrete_product_assets", 0)))
          print("PRODUCTION_TARGET:", 5000)
          print("DELIVERY: GitHub Pages public production workflow")
          print("QC/DISPATCH: downstream states") 


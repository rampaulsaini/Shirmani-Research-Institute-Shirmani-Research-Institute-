name: SHIRMANI Continuous Concrete Product Production
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shirmani-production-state-writer
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_TARGET: "5000"
      CONCRETE_PRODUCT_BATCH_SIZE: "500"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load persistent production state
        run: |
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git checkout FETCH_HEAD -- generated products
            echo "PRODUCTION_STATE_SOURCE=automation/production-state"
          else
            echo "PRODUCTION_STATE_SOURCE=main-initial"
          fi

      - name: Configure production scale
        run: |
          echo "PRODUCT_TARGET=$PRODUCT_TARGET" >> "$GITHUB_ENV"
          echo "CONCRETE_PRODUCT_BATCH_SIZE=$CONCRETE_PRODUCT_BATCH_SIZE" >> "$GITHUB_ENV"
      - name: Expand source catalog to production target
        run: python3 factory/expand_product_catalog.py
      - name: Produce next concrete public batch
        run: python3 factory/continuous_product_batch.py
      - name: Upgrade concrete products to engine-specific modules
        env:
          CONCRETE_DEPTH_BATCH_SIZE: "500"
        run: python3 factory/concrete_product_depth_upgrade.py
      - name: Audit concrete production truth
        run: python3 factory/concrete_product_truth.py
      - name: Persist live production telemetry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          t=json.loads(Path("generated/concrete-product-truth.json").read_text())
          produced=int(t["concrete_produced"]); target=int(t["catalog_count"])
          Path("generated/concrete-product-asset-status.json").write_text(json.dumps({
            "generated_at":datetime.now(timezone.utc).isoformat(),
            "product_assets":produced,"catalog_products":target,
            "materialization_percent":round(100*produced/target,2) if target else 0,
            "asset_directory":"products/concrete/","showroom":"showroom.html",
            "state":"COMPLETE" if produced==target else "IN_PROGRESS",
            "dispatch":"NO","principle":"Concrete repository-bound assets are production evidence; QC, dispatch and independent verification remain downstream."
          },ensure_ascii=False,indent=2)+"\n")
          Path("generated/live-production-state.json").write_text(json.dumps({
            "schema_version":1,"generated_at":datetime.now(timezone.utc).isoformat(),
            "production_first":True,"catalog_identities":target,
            "concrete_repository_assets":produced,"current_catalog_pending":max(0,target-produced),
            "five_thousand_scale_target":5000,"remaining_to_scale_target":max(0,5000-produced),
            "concrete_materialization_percent_of_catalog":round(100*produced/target,2) if target else 0,
            "concrete_materialization_percent_of_scale_target":round(100*produced/5000,2),
            "module_products_generated":produced,"dispatch_released":0,"sales_claimed":0,
            "payment_claimed":0,"independent_verification_claimed":0,
            "state":"PRODUCTION_COMPLETE_CURRENT_CATALOG" if produced==target else "PRODUCTION_IN_PROGRESS"
          },ensure_ascii=False,indent=2)+"\n")
          print(f"PRODUCTION: {produced}/{target}")
          PY

      - name: Publish production evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-concrete-production-${{ github.run_number }}
          retention-days: 7
          path: |
            generated/1000-digital-products.json
            generated/concrete-production-overlay.json
            generated/continuous-production-batch-status.json
            generated/concrete-product-truth.json
            generated/concrete-product-production-status.json
            generated/concrete-product-depth-status.json
      - name: Production publication handoff
        run: |
          echo "Concrete production completed in this run."
          echo "Persistent production-state publication is owned by SHIRMANI Production Persistence & Truth Gate."
          echo "This workflow publishes the live Pages workspace without competing for the canonical production-state branch."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish live production workspace
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy live production workspace
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report production state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("generated/concrete-product-asset-status.json").read_text())
          print("CONCRETE_PRODUCT_ASSETS:", s.get("product_assets", s.get("concrete_product_assets", 0)))
          print("PRODUCTION_TARGET:", 5000)
          print("DELIVERY: GitHub Pages public production workflow")
          print("QC/DISPATCH: downstream states")
          PY

name: SHIRMANI Commercial Readiness Control Plane
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["factory/**","generated/**","products/**",".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: shirmani-commercial-readiness
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate commercial truth
        run: python3 factory/commercial_readiness.py
      - name: Publish machine-readable truth
        run: |
          git config user.name "SHIRMANI Commercial Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/commercial-readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "automission: publish commercial readiness truth"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: shirmani-commercial-readiness
          path: generated/commercial-readiness.json

name: SHIRMANI Production Persistence & Truth Gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SHIRMANI Multi-Layer Production Automission"
      - "SHIRMANI Real Product Catalog Production"
      - "SHIRMANI Continuous Concrete Product Production"
      - "SHIRMANI Supreme Production Factory"
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # This workflow and SHIRMANI Continuous Concrete Product Production both
  # write automation/production-state. They must share one serialization lock.
  group: shirmani-production-state-writer
  cancel-in-progress: false

jobs:
  persist:
    # A workflow_run event fires for both successful and failed upstream runs.
    # Never materialize/publish persistent production state from a failed upstream run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load canonical production-state branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git reset --hard FETCH_HEAD
            echo "PRODUCTION_STATE_BASE=automation/production-state" >> "$GITHUB_ENV"
          else
            echo "PRODUCTION_STATE_BASE=main-initial" >> "$GITHUB_ENV"
          fi
      - name: Materialize production records
        run: |
          python3 factory/multi_layer_production.py
          python3 factory/public_production_materializer.py
          python3 factory/production_truth_gate.py
      - name: Publish persistent production state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/production-work-queue.jsonl generated/production-results.jsonl generated/public-production-catalog.json generated/public-production-module-index.json generated/public-production-by-module.html generated/PRODUCTION-TRUTH.json generated/multi-layer-production-status.json generated/MULTI-LAYER-PRODUCTION.md generated/live-production-state.json generated/concrete-product-asset-status.json generated/concrete-production-overlay.json

          if git diff --cached --quiet; then
            echo "No persistent production-state changes."
            exit 0
          fi

          git commit -m "chore(production): persist concrete production state and truth gate"

          branch="automation/production-state"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            remote_sha="$(git rev-parse FETCH_HEAD)"
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin HEAD:"$branch"
          else
            git push origin HEAD:"$branch"
          fi
          echo "Production state persisted to canonical branch: $branch"

      - name: Emit production truth summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("generated/PRODUCTION-TRUTH.json", encoding="utf-8"))
          print("# SHIRMANI Production Truth Gate")
          print(f"- Registered offers: **{p['offers_registered']}**")
          print(f"- Persistent production records: **{p['persistent_production_records']}**")
          print(f"- Independently VERIFIED: **{p['independent_verified_records']}**")
          print("- Sales claimed: **0 unless transaction evidence exists**")
          print("- Customer deliveries claimed: **0 unless delivery evidence exists**")
          print(f"- Production records gate: **{p['gates']['production_records']}**")
          print(f"- Verification gate: **{p['gates']['independent_verification']}**")
          PY

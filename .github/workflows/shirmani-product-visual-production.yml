name: SHIRMANI Supreme Product Visual Production

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "factory/product_visual_materializer.py"
      - "generated/concrete-production-overlay.json"
      - "generated/1000-digital-products.json"
      - ".github/workflows/shirmani-product-visual-production.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: supreme-product-visual-production
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build 4K product visuals
        run: python3 factory/product_visual_materializer.py
      - name: Publish visual artifacts through PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat(showroom): materialize SHIRMANI 4K product visuals"
          title: "Automission: materialize SHIRMANI 4K product visuals"
          body: |
            Automated customer-facing product visual production.
            Every visual binds product identity, short description, logo,
            English identity line, QR long-description route and price/offer.
          branch: "automission/product-visual-media"
          delete-branch: true
          add-paths: |
            products/visuals

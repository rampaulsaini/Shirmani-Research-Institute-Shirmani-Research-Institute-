name: SHIRMANI Supreme Product Visual Production

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "factory/product_visual_materializer.py"
      - "generated/concrete-production-overlay.json"
      - "generated/1000-digital-products.json"
      - ".github/workflows/shirmani-product-visual-production.yml"

permissions:
  contents: write

concurrency:
  group: supreme-product-visual-production
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build 4K product visuals
        run: python3 factory/product_visual_materializer.py

      - name: Publish visual artifacts directly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Visual Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/visuals
          if git diff --cached --quiet; then
            echo "No visual production delta."
            exit 0
          fi
          git commit -m "feat(showroom): materialize SHIRMANI 4K product visuals"
          git push origin HEAD:main

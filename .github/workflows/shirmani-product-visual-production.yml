name: SHIRMANI Supreme Product Visual Production

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: supreme-product-visual-production
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build 4K product visuals
        run: python3 factory/product_visual_materializer.py
      - name: Publish visual artifacts
        run: |
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/visuals
          if git diff --cached --quiet; then
            echo "No visual production changes."
            exit 0
          fi
          git commit -m "prod: materialize SHIRMANI 4K product visuals"
          git fetch origin automation/production-state
          git diff --binary HEAD^ -- products/visuals > /tmp/materialized-visuals.patch || true
          git checkout -B production-state origin/automation/production-state
          if [ -s /tmp/materialized-visuals.patch ]; then git apply /tmp/materialized-visuals.patch; fi
          git add products/visuals
          git diff --cached --quiet && exit 0
          git commit -m "automission: publish materialized 4K visual state"
          git push origin HEAD:automation/production-state

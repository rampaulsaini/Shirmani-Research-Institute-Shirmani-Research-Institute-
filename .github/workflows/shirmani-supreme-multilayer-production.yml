name: SHIRMANI Supreme Multi-Layer Production Automission [Manual Fallback]
on:
  # Manual fallback: canonical production is handled by public-production-automission.yml.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-supreme-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run multi-layer production
        run: python automation/supreme_production_engine.py
      - name: Publish production results
        run: |
          git config user.name "SHIRMANI Supreme Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/supreme-production production-dashboard.html
          git diff --cached --quiet || git commit -m "automission: publish multi-layer production results"
          git push
      - name: Print production totals
        run: cat generated/supreme-production/production-status.json
name: SHIRMANI Public Production Status Contract Tests

on:
  pull_request:
    paths:
      - "factory/public_production_materializer.py"
      - "tests/public_production_status_test.py"
      - ".github/workflows/public-production-automission.yml"
      - ".github/workflows/public-production-status-contract.yml"
  push:
    branches: [main]
    paths:
      - "factory/public_production_materializer.py"
      - "tests/public_production_status_test.py"
      - ".github/workflows/public-production-automission.yml"
      - ".github/workflows/public-production-status-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-production-status-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production materializer
        run: python -m py_compile factory/public_production_materializer.py
      - name: Test timestamp, asset completeness and path-traversal contract
        run: python -m unittest discover -s tests -p 'public_production_status_test.py' -v

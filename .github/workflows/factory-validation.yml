name: Research Factory Validation

on:
  push:
    branches: ["main", "factory/next-label-source-claim-engine"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deterministic factory contracts
        run: python3 scripts/validate_factory.py

name: SHIRMANI Supreme Production Orchestrator

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shirmani-supreme-production-orchestrator
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Institute — refresh product discovery/catalog
        run: |
          python3 factory/product_orchestrator.py
          python3 factory/expand_product_catalog.py

      - name: Factory — produce next concrete product batch
        env:
          PRODUCT_TARGET: "5000"
          CONCRETE_PRODUCT_BATCH_SIZE: "1000"
          CONCRETE_DEPTH_BATCH_SIZE: "500"
        run: |
          python3 factory/continuous_product_batch.py
          python3 factory/concrete_product_depth_upgrade.py
          python3 factory/concrete_product_truth.py

      - name: Multi-layer production — modules and public inventory
        run: |
          python3 -m py_compile factory/multi_layer_production.py
          python3 -m py_compile factory/public_module_inventory.py
          python3 -m py_compile factory/public_production_materializer.py
          python3 -m py_compile factory/batch_worker.py
          python3 factory/multi_layer_production.py
          python3 factory/public_module_inventory.py
          python3 factory/batch_worker.py --batch-size 1000

      - name: Materialize concrete public products
        run: python3 factory/public_production_materializer.py

      - name: Build showroom from current production state
        run: python3 scripts/build_showroom.py

      - name: Publish production telemetry in job summary
        shell: python
        run: |
          import json
          from pathlib import Path
          state=Path("generated/live-production-state.json")
          status=Path("generated/multi-layer-production-status.json")
          print("## SHIRMANI Supreme Production")
          if state.exists():
              s=json.loads(state.read_text(encoding="utf-8"))
              print(f"- Concrete assets: **{int(s.get('concrete_repository_assets',0)):,}**")
              print(f"- Catalogue identities: **{int(s.get('catalog_identities',0)):,}**")
              print(f"- Remaining to 5,000: **{int(s.get('remaining_to_scale_target',0)):,}**")
              print(f"- Materialization: **{float(s.get('concrete_materialization_percent_of_scale_target',0)):.2f}%**")
          if status.exists():
              p=json.loads(status.read_text(encoding="utf-8"))
              print(f"- Latest cycle concrete results: **{int(p.get('last_cycle_concrete_results',0)):,}**")
              print(f"- Production lanes: **{len(p.get('lanes',[])):,}**")
          print("- Verification is downstream; this workflow measures concrete production output.")

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-supreme-production-${{ github.run_number }}
          retention-days: 14
          path: |
            generated/live-production-state.json
            generated/concrete-production-overlay.json
            generated/concrete-product-truth.json
            generated/concrete-product-production-status.json
            generated/multi-layer-production-status.json
            generated/production-results.jsonl
            generated/production-work-queue.jsonl
            generated/public-production-index.html
            generated/public-module-inventory.json
            generated/public-module-production-map.html
            generated/PRODUCT-CATALOG.json
            generated/PRODUCT-PIPELINE.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload live public showroom
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy live production showroom
        id: deployment
        uses: actions/deploy-pages@v4

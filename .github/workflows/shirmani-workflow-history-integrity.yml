name: SHIRMANI Workflow History Integrity Guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Block destructive workflow-run cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan workflow definitions for destructive run deletion
        shell: bash
        run: |
          set -euo pipefail

          found=0
          guard_file=".github/workflows/shirmani-workflow-history-integrity.yml"

          while IFS= read -r -d '' file; do
            [ "$file" = "$guard_file" ] && continue
            active_lines="$(grep -vE '^[[:space:]]*#' "$file" || true)"

            if printf '%s\n' "$active_lines" | grep -Eiq 'gh[[:space:]]+run[[:space:]]+delete'; then
              echo "::error file=$file::Destructive gh run delete is forbidden in repository workflows."
              found=1
            fi

            if printf '%s\n' "$active_lines" | grep -Eiq 'gh[[:space:]]+api[^\n]*--method[[:space:]]+DELETE[^\n]*actions/runs'; then
              echo "::error file=$file::Workflow-run deletion through gh api is prohibited."
              found=1
            fi

            if printf '%s\n' "$active_lines" | grep -Eiq '(--method[[:space:]]+DELETE|(^|[[:space:]])DELETE([[:space:]]|$))[[:space:][:print:]]*actions/runs'; then
              echo "::error file=$file::A DELETE request targeting actions/runs is prohibited."
              found=1
            fi

            if printf '%s\n' "$active_lines" | grep -Eiq '/repos/[^[:space:]"]+/actions/runs/[^[:space:]"]*[[:space:][:print:]]*(DELETE|--method[[:space:]]+DELETE)'; then
              echo "::error file=$file::Destructive Actions run endpoint deletion is prohibited."
              found=1
            fi
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          if [ "$found" -ne 0 ]; then
            echo "Workflow history integrity guard FAILED."
            exit 1
          fi

          echo "Workflow history integrity guard PASSED."

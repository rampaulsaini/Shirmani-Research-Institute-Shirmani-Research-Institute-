name: SHIRMANI Public Review → Quality Improvement
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: shirmani-public-review-quality
  cancel-in-progress: false
jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Aggregate public product reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 factory/public_review_quality.py
      - name: Publish review-driven quality state
        run: |
          git config user.name "SHIRMANI Review Quality"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/public-reviews.json generated/review-quality-dashboard.json generated/1000-digital-products.json
          if git diff --cached --quiet; then
            echo "No review-quality delta"
          else
            git commit -m "chore(quality): publish public review signals"
            git push
          fi

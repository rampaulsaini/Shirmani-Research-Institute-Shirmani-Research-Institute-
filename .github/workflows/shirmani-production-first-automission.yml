name: SHIRMANI Production-First Automission
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  production-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Run multi-work production pulse
        run: python3 scripts/production_pulse.py
      - name: Publish platform result
        run: |
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-pulse.json
          git diff --cached --quiet && exit 0
          git commit -m "production: publish automission pulse"
          git push

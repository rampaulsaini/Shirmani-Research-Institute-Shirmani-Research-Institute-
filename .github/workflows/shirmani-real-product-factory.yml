name: SHIRMANI Real Product Factory — Continuous Production
on:
  push:
    branches: [main]
    paths:
      - "factory/real_product_factory.py"
      - "factory/concrete_product_modules.py"
      - "factory/product_visual_identity_factory.py"
      - "factory/vip_screenshot_factory.py"
      - "factory/production_dashboard.py"
      - ".github/workflows/shirmani-real-product-factory.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-real-product-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_TARGET: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Institute discovery and product catalogue
        run: python3 factory/real_product_factory.py
      - name: Factory — materialize every concrete product
        run: python3 factory/concrete_product_modules.py
      - name: Build persistent 4K product visual identities
        run: python3 factory/product_visual_identity_factory.py
      - name: Build product-specific VIP screenshot assets
        env:
          VIP_SCREENSHOT_BATCH: "5000"
          VIP_REBUILD: "1"
        run: python3 factory/vip_screenshot_factory.py
      - name: Build public production dashboard
        run: python3 factory/production_dashboard.py
      - name: Production QC structure check
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target=int(os.environ["PRODUCT_TARGET"])
          p=json.loads(Path("generated/1000-digital-products.json").read_text(encoding="utf-8"))
          assert p["product_count"] == target
          assert len(p["products"]) == target
          assert len(p["family_definitions"]) == 25
          assert all(x["status"] == "READY_FOR_QC" for x in p["products"])
          assert all(Path(x["asset"]).exists() for x in p["products"])
          assert all(Path(x["module"]).exists() for x in p["products"])
          assert Path("generated/PRODUCT-PASSPORTS.jsonl").exists()
          assert len(list(Path("products/production").glob("*.html"))) == target
          assert len(list(Path("products/modules").glob("*.html"))) == 25
          vip=Path("generated/vip-screenshot-assets.json")
          assert vip.exists()
          vip_state=json.loads(vip.read_text(encoding="utf-8"))
          assert vip_state["vip_screenshot_assets"] == target
          assert vip_state["coverage_percent"] == 100
          assert Path("production-dashboard.html").exists()
          print("PRODUCTION PASS")
          print("products:",len(p["products"]),"/",target)
          print("concrete assets:",len(list(Path("products/production").glob("*.html"))))
          print("modules:",len(list(Path("products/modules").glob("*.html"))))
          print("VIP screenshots:",vip_state["vip_screenshot_assets"],"/",target)
          print("QC gate: READY_FOR_QC")
          print("dispatch: NO")
          print("verification: DOWNSTREAM")
          PY
      - name: Publish production results through PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(products): publish concrete production and VIP media"
          title: "Automission: publish concrete production and VIP media"
          body: |
            Continuous production batch generated by SHIRMANI Real Product Factory.
            Includes concrete product assets, product visuals and product-specific VIP presentation media.
            Production output is customer-facing artifact state; QC, dispatch, payment and independent verification remain separate downstream states.
          branch: "automission/real-product-production"
          delete-branch: false
          add-paths: |
            generated/1000-digital-products.json
            generated/real-product-factory-status.json
            generated/PRODUCT-PASSPORTS.jsonl
            generated/product-visual-assets.json
            generated/vip-screenshot-assets.json
            products/modules
            products/production
            products/visuals
            products/vip-screenshots
            production-dashboard.html
      - name: Publish production summary
        run: |
          {
            echo "## SHIRMANI Production"
            echo "- Institute discovery: active"
            echo "- Factory target: 5,000 concrete product assets"
            echo "- Modules: 25 executable family modules"
            echo "- 4K visual identity: product-specific"
            echo "- VIP screenshot: product-specific, QR + short description + usage/demo routes"
            echo "- QC state: READY_FOR_QC"
            echo "- Dispatch: NO"
            echo "- Verification: downstream"
            echo "- Public showroom: production-dashboard.html + products/production-launch-center.html"
            echo "- Cycle: every 5 minutes"
          } >> "$GITHUB_STEP_SUMMARY"

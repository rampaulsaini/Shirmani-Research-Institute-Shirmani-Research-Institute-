name: SHIRMANI Continuous Product Production Factory

on:
  push:
    branches: [main]
    paths:
      - 'factory/continuous_product_factory.py'
      - 'generated/continuous-production-state.json'
      - 'products/continuous/**'
  schedule:
    - cron: '7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: shirmani-continuous-product-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Produce next concrete batch
        env:
          PRODUCT_BATCH: '12'
        run: python3 factory/continuous_product_factory.py
      - name: Persist continuous product batch to canonical production branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/production-state"
          git fetch origin "$branch"
          remote_sha="$(git rev-parse "origin/$branch")"
          target="/tmp/shirmani-continuous-product-publish"
          rm -rf "$target"
          git worktree add --detach "$target" "origin/$branch"
          for path in generated/continuous-production-state.json generated/continuous-production-manifest.json products/continuous products/visuals/continuous products/demos/continuous; do
            if [[ -d "$path" ]]; then
              mkdir -p "$target/$path"
              cp -a "$path/." "$target/$path/"
            elif [[ -f "$path" ]]; then
              mkdir -p "$target/$(dirname "$path")"
              cp "$path" "$target/$path"
            fi
          done
          cd "$target"
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/continuous-production-state.json generated/continuous-production-manifest.json products/continuous products/visuals/continuous products/demos/continuous
          if git diff --cached --quiet; then
            echo "No new production output in this cycle."
            exit 0
          fi
          git commit -m "production: persist next concrete digital product batch"
          git push --force-with-lease="refs/heads/$branch:$remote_sha" origin HEAD:"$branch"
          echo "Continuous product batch persisted to $branch."

name: SHIRMANI Supreme NLP Multimodal Conveyor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    paths:
      - "agents/supreme_nlp_multimodal.py"
      - "schemas/supreme-nlp-adapter-contract.schema.json"
      - "scripts/validate_supreme_nlp_multimodal.py"
      - "tests/test_supreme_nlp_multimodal.py"
      - "docs/SUPREME-NLP-MULTIMODAL-OPERATING-CONTRACT.md"
      - ".github/workflows/supreme-nlp-multimodal-conveyor.yml"
  push:
    branches: [main]
    paths:
      - "agents/supreme_nlp_multimodal.py"
      - "schemas/supreme-nlp-adapter-contract.schema.json"
      - "scripts/validate_supreme_nlp_multimodal.py"
      - "tests/test_supreme_nlp_multimodal.py"
      - ".github/workflows/supreme-nlp-multimodal-conveyor.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-multimodal
  cancel-in-progress: true

jobs:
  multimodal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile agents/supreme_nlp_multimodal.py scripts/validate_supreme_nlp_multimodal.py
      - name: Schema syntax
        run: python -m json.tool schemas/supreme-nlp-adapter-contract.schema.json >/dev/null
      - name: Validator
        run: python scripts/validate_supreme_nlp_multimodal.py
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_supreme_nlp_multimodal.py' -v
      - name: Generate auditable candidate
        run: |
          mkdir -p generated/supreme-nlp
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp_multimodal import analyze, to_simple_language
          rows=[
            {"modality":"electrical","feature":"signal","value":1.0,"quality":1.0,"source":"synthetic-a"},
            {"modality":"audio","feature":"signal","value":1.01,"quality":1.0,"source":"synthetic-b"}
          ]
          record=analyze(rows,request="multimodal signal interpretation",source_type="synthetic")
          record["simple_language"]=to_simple_language(record)
          Path("generated/supreme-nlp/multimodal-candidate.json").write_text(
            json.dumps(record,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(record["simple_language"])
          print("STATUS:",record["status"])
          print("VERIFICATION:",record["verification"]["status"])
          PY
      - name: Enforce fail-closed promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-nlp/multimodal-candidate.json").read_text())
          assert d["status"] in {"CANDIDATE","NO_CLAIM","BLOCKED"}
          assert d["verification"]["status"]=="UNVERIFIED"
          assert d["verification"]["promotion_allowed"] is False
          assert 0<=d["confidence"]<=1
          print("MULTIMODAL_FAIL_CLOSED_BOUNDARY: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-multimodal-${{ github.run_id }}
          path: generated/supreme-nlp/multimodal-candidate.json
          retention-days: 14

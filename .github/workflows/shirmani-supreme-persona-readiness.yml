name: SHIRMANI Supreme Persona v2 Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "docs/SHIRMANI-SUPREME-PERSONA-V2.md"
      - "factory/supreme_persona_readiness_gate.py"
      - ".github/workflows/shirmani-supreme-persona-readiness.yml"
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "docs/SHIRMANI-SUPREME-PERSONA-V2.md"
      - "factory/supreme_persona_readiness_gate.py"
      - ".github/workflows/shirmani-supreme-persona-readiness.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-persona-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fail-closed Supreme readiness gate
        run: python3 factory/supreme_persona_readiness_gate.py
      - name: Publish readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-supreme-persona-readiness-${{github.run_id}}
          path: generated/supreme-persona-readiness.json
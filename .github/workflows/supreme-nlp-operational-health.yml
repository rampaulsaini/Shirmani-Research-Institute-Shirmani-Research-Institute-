name: SHIRMANI Supreme NLP Operational Health

on:
  push:
    branches: [main]
    paths:
      - "docs/supreme-nlp-*.md"
      - "schemas/supreme-nlp-*.json"
      - "schemas/agent-governance.json"
      - "factory/supreme_nlp_*.py"
      - ".github/workflows/supreme-nlp-operational-health.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-operational-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing Supreme NLP gates
        run: |
          python3 factory/supreme_nlp_contract_qc.py
          python3 factory/supreme_nlp_evaluation_qc.py
      - name: Generate operational telemetry
        run: python3 factory/supreme_nlp_operational_health.py
      - name: Upload telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-operational-health
          path: generated/supreme-nlp-operational-health.json

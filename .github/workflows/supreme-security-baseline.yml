name: Shirmani Supreme Security Baseline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene and secret-pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for suspicious committed credential patterns
        shell: bash
        run: |
          set -euo pipefail
          # This lightweight guard is not a substitute for a dedicated secret scanner.
          # Avoid scanning this workflow's own documented pattern strings.
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          roots = [Path("assets"), Path("docs"), Path("products"), Path("showroom"), Path("scripts"), Path(".github")]
          patterns = [
              (re.compile(r"(?i)-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"), "private-key header"),
              (re.compile(r"(?i)gh[pousr]_[A-Za-z0-9_]{30,}"), "GitHub token-like value"),
              (re.compile(r"(?i)AKIA[0-9A-Z]{16}"), "AWS access-key-like value"),
          ]
          ignored = {".github/workflows/supreme-security-baseline.yml"}
          findings = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path.as_posix() in ignored:
                      continue
                  if path.suffix.lower() not in {".html", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".md", ".py", ".txt", ".env", ".toml"}:
                      continue
                  try:
                      data = path.read_text(encoding="utf-8", errors="ignore")
                  except OSError:
                      continue
                  for pattern, label in patterns:
                      if pattern.search(data):
                          findings.append(f"{path}: possible {label}")
          if findings:
              print("\n".join(findings))
              print("Review findings; do not print or commit real secrets.")
              sys.exit(1)
          print("No configured high-risk credential patterns found in scanned paths.")
          PY
      - name: Verify no tracked .env files are present
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "Potential environment-secret file is tracked. Review before release."
            exit 1
          fi
          echo "No tracked .env secret files found."

  codeql:
    name: CodeQL JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3

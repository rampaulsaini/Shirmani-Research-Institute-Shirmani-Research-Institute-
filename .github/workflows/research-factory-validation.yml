name: Research Factory Validation

on:
  push:
    branches: ["main", "factory/continuity-dashboard-repair"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deterministic factory contracts
        run: python3 scripts/validate_factory.py

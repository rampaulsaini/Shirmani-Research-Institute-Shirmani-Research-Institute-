name: SHIRMANI Production-First Operations Automission
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: shirmani-production-first-operations
  # Do not cancel an active production-state writer; preserve continuity during recovery and scheduled overlap.
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  production-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse the canonical production-state PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BRANCH="automation/production-operations-current"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch --force-create "$BRANCH" "origin/$BRANCH"
            # Keep the reusable PR branch based on current main. If a conflict occurs,
            # fail safely and require reconciliation rather than creating another PR.
            git merge --no-edit origin/main
          else
            git switch --create "$BRANCH" origin/main
          fi
          python3 scripts/production_first_cycle.py
          git add generated/production-operations-status.json
          if git diff --cached --quiet; then
            echo "Production operations state unchanged; no PR update needed."
            exit 0
          fi
          git commit -m "chore(production): refresh production-first operations state"
          git push --set-upstream origin "$BRANCH"
          export GH_TOKEN="${{ github.token }}"
          OPEN_PR_COUNT="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --base main --state open --json number --jq 'length')"
          if [ "$OPEN_PR_COUNT" -eq 0 ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(production): refresh production-first operations state" \
              --body "Canonical automated production-operations telemetry PR. Reuses one branch to avoid opening a new PR for every scheduled cycle. Production state is not evidence of dispatch, sales, payment, or independent verification."
          else
            echo "Updated existing canonical production operations PR; no duplicate PR created."
          fi

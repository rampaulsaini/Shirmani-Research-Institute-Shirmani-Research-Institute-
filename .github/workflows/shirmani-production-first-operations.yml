name: SHIRMANI Production-First Operations Automission
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: shirmani-production-first-operations
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  production-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Build production operations state
        run: python3 scripts/production_first_cycle.py
      - name: Publish state
        run: |
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-operations-status.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          BRANCH="automation/production-operations-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "chore(production): refresh production-first operations state"
          git push --set-upstream origin "$BRANCH"
          if command -v gh >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH"               --title "chore(production): refresh production-first operations state"               --body "Automated production operations telemetry. Governed through the repository PR gate."
          fi

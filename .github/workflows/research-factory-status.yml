name: Research Factory Federation Status
# Central contracts are published by the Omniverse-Platform federation-health workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize central safe status
        env:
          ORCHESTRATOR_TOKEN: ${{ secrets.SHIRMANI_ORCHESTRATOR_TOKEN }}
        run: python scripts/sync-central-factory-status.py
      - name: Publish status through pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "shirmani-research-factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factory-status.json generated/federation-status.json

          if git diff --cached --quiet; then
            echo "Factory status unchanged; no publication PR needed."
            exit 0
          fi

          branch="automation/factory-status-sync"
          git checkout -B "$branch"
          git commit -m "chore: sync central factory status"
          git push --force-with-lease origin "HEAD:$branch"

          if ! gh pr list --base main --head "$branch" --state open --json number --jq 'length' | grep -q '^0
            echo "Factory status publication PR already exists."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(factory): publish synchronized federation status" \
            --body "Automated status publication. Generated status is submitted through the repository's pull-request protection boundary; no direct main-branch push is performed."
; then
            echo "Factory status publication PR already exists."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(factory): publish synchronized federation status" \
            --body "Automated status publication. Generated status is submitted through the repository's pull-request protection boundary; no direct main-branch push is performed."

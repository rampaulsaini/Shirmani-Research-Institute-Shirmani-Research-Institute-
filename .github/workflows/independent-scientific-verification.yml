name: SHIRMANI Independent Scientific Verification Gate
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "schemas/independent-scientific-verification.schema.json"
      - "factory/independent_scientific_verification_gate.py"
      - "tests/independent_scientific_verification_gate.py"
      - "generated/independent-verification-registry.jsonl"
      - "research/scientific-evidence-map-2026-10-02.md"
permissions:
  contents: read
concurrency:
  group: shirmani-independent-scientific-verification
  cancel-in-progress: true
jobs:
  verify-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate independent verification registry
        run: python3 factory/independent_scientific_verification_gate.py
      - name: Run hardening test
        run: python3 tests/independent_scientific_verification_gate.py

name: SHIRMANI Supreme Production Factory
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/public_production_materializer.py"
      - "generated/production-work-queue.jsonl"
      - "generated/1000-digital-products.json"
      - "showroom.html"
      - "showroom-product.html"
permissions:
  contents: read
concurrency:
  group: supreme-production-factory
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run production materializer
        run: python factory/public_production_materializer.py
      - name: Publish production evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-supreme-production-${{ github.run_number }}
          retention-days: 7
          path: |
            generated/public-production-catalog.json
            generated/public-production-module-index.json
            generated/public-production-by-module.html
            generated/public-production/
            generated/multi-layer-production-status.json
            generated/production-results.jsonl
      - name: Report production result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("generated/public-production-catalog.json")
          if p.exists():
              data=json.loads(p.read_text())
              print("PUBLIC_PRODUCTION_CATALOG:", data.get("product_count", data.get("count", "available")))
          print("DELIVERY: GitHub Pages public production workflow")
          PY

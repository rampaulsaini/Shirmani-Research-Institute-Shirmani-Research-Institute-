name: SHIRMANI Automation Completeness Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: automation-completeness-gate
  cancel-in-progress: true

jobs:
  audit:
    name: Audit all GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML structure
        shell: python
        run: |
          import pathlib, sys, yaml

          root = pathlib.Path(".github/workflows")
          files = sorted([*root.glob("*.yml"), *root.glob("*.yaml")])
          if not files:
              print("FAIL: no workflow files found")
              sys.exit(1)

          failures = []
          for path in files:
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: YAML parse error: {exc}")
                  continue

              if not isinstance(data, dict):
                  failures.append(f"{path}: workflow root must be a mapping")
                  continue

              # PyYAML parses the YAML 1.1 boolean key "on" as True.
              trigger = data.get("on", data.get(True))
              if trigger is None:
                  failures.append(f"{path}: missing 'on' trigger")
              if not isinstance(data.get("jobs"), dict) or not data["jobs"]:
                  failures.append(f"{path}: missing non-empty 'jobs'")

          print(f"WORKFLOW_FILES={len(files)}")
          if failures:
              print("AUTOMATION_COMPLETENESS=FAIL")
              for item in failures:
                  print(item)
              sys.exit(1)

          print("AUTOMATION_COMPLETENESS=PASS")
          print(f"Validated {len(files)} workflow files.")

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Automation Completeness Gate"
            echo
            echo "- Scope: `.github/workflows/**`"
            echo "- Trigger: workflow dispatch, workflow changes, hourly schedule"
            echo "- Gate: every workflow must parse as YAML and contain a trigger and at least one job"
            echo "- Result: see the validation step above"
          } >> "$GITHUB_STEP_SUMMARY"

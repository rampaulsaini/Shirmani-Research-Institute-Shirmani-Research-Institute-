name: SHIRMANI Production Factory — Multi-Layer Continuous
on:
  push:
    paths:
      - "factory/production_materializer.py"
      - ".github/workflows/shirmani-production-factory.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-factory
  cancel-in-progress: false
jobs:
  production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize concrete product batch
        run: python3 factory/production_materializer.py --batch-size 250

      - name: Validate production output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("generated/production-registry.json").read_text())
          s=json.loads(Path("generated/production-status.json").read_text())
          assert p["production_first"] is True
          assert p["architecture"]==["INSTITUTE","FACTORY","QC","SHOWROOM_SALE"]
          assert s["produced"] == p["produced_count"]
          assert s["catalog_count"] == p["catalog_count"]
          assert s["dispatch_yes"] == 0
          assert s["batch_produced"] >= 0
          print("PRODUCTION PASS:",s["batch_produced"],"new artifacts; total produced:",s["produced"],"remaining:",s["remaining"])
          PY

      - name: Publish production results through PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "shirmani-production[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-registry.json generated/production-work-queue.jsonl generated/production-status.json generated/products
          if git diff --cached --quiet; then
            echo "No production delta"
            exit 0
          fi

          BRANCH="automation/production-factory-batch"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH"
          git commit -m "chore(production): publish concrete product batch"
          git push --force origin "HEAD:$BRANCH"

          if [ "$(gh pr list --base main --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create               --base main               --head "$BRANCH"               --title "chore(production): publish concrete product batch"               --body "Automated production batch. Concrete repository-bound product artifacts and public production metadata are generated first. QC, dispatch, sales and independent research verification remain separate downstream states."
          else
            echo "Existing production PR updated: $BRANCH"
          fi

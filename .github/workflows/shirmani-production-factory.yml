name: SHIRMANI Production Factory
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-production-factory
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize production registry
        run: python3 factory/production_materializer.py --batch-size 250
      - name: Validate production registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("generated/production-registry.json").read_text())
          s=json.loads(Path("generated/production-status.json").read_text())
          assert p["production_first"] is True
          assert p["architecture"]==["INSTITUTE","FACTORY","QC","SHOWROOM_SALE"]
          assert p["product_count"]>0 and s["produced"]==p["product_count"]
          assert s["qc_ready"]==p["product_count"] and s["dispatch_yes"]==0
          print("Production registry PASS:",p["product_count"])
          PY
      - name: Publish production artifacts
        run: |
          git config user.name "shirmani-production[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-registry.json generated/production-work-queue.jsonl generated/production-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(production): refresh production registry"
          git push

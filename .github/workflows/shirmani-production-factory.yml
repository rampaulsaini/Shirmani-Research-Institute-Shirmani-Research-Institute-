name: SHIRMANI Production Factory — Manual Staging
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-factory
  cancel-in-progress: false
jobs:
  production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize concrete product batch
        run: python3 factory/production_materializer.py --batch-size 250

      - name: Validate production output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("generated/production-registry.json").read_text())
          s=json.loads(Path("generated/production-status.json").read_text())
          assert p["production_first"] is True
          assert p["architecture"]==["INSTITUTE","FACTORY","QC","SHOWROOM_SALE"]
          assert s["produced"] == p["produced_count"]
          assert s["catalog_count"] == p["catalog_count"]
          assert s["dispatch_yes"] == 0
          assert s["batch_produced"] >= 0
          print("PRODUCTION PASS:",s["batch_produced"],"new artifacts; total produced:",s["produced"],"remaining:",s["remaining"])
          PY

      - name: Publish production results through governed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-registry.json generated/production-work-queue.jsonl generated/production-status.json generated/products
          if git diff --cached --quiet; then
            echo "No production delta"
            exit 0
          fi
          BRANCH="automation/manual-production-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "chore(production): publish concrete product batch"
          git push --set-upstream origin "$BRANCH"
          if gh pr create --base main --head "$BRANCH"             --title "chore(production): publish concrete product batch"             --body "Automated production batch. Concrete product artifacts are generated first; QC, dispatch, sales and independent verification remain separate downstream states."; then
            echo "Governed production PR created: $BRANCH"
          else
            echo "::warning::PR creation was unavailable; production branch remains available for governed review: $BRANCH"
          fi

name: SHIRMANI Public Surface Security Layer
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1-5"
permissions:
  contents: read
concurrency:
  group: public-surface-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run public HTML and JavaScript surface audit
        run: python3 scripts/security/public_surface_audit.py
      - name: Preserve machine-readable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-surface-security-audit
          path: security/reports/public-surface-audit.json
          if-no-files-found: warn
          retention-days: 14

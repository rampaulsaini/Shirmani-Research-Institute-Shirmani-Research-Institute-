name: SHIRMANI Public Surface Security Layer
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1-5"
permissions:
  contents: read
concurrency:
  group: public-surface-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run public HTML and JavaScript surface audit
        run: python3 scripts/security/public_surface_audit.py
      - name: Preserve machine-readable report
        if: always()
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.6
        with:
          name: public-surface-security-audit
          path: security/reports/public-surface-audit.json
          if-no-files-found: warn
          retention-days: 14

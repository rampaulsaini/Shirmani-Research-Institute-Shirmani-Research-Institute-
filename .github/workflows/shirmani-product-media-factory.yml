name: SHIRMANI Product Media Factory
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: shirmani-product-media-factory
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  media-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Produce MP4 + VIP screenshot batch
        env:
          MEDIA_BATCH: "10"
        run: python3 factory/product_media_factory.py
      - name: Commit production media
        run: |
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factory/product_media_factory.py generated/product-specific-demo-video-manifest.json products/demos products/vip-screenshots
          if git diff --cached --quiet; then
            echo "No media delta."
            exit 0
          fi
          # Prevent GitHub's 100 MB single-file rejection from breaking every run.
          while IFS= read -r -d '' path; do
            if [ -f "$path" ] && [ "$(wc -c < "$path")" -ge 90000000 ]; then
              git restore --staged -- "$path"
              echo "::warning::Excluded oversized media artifact: $path"
            fi
          done < <(git diff --cached --name-only -z)
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "production: stage product demo media batch"
          branch="automation/product-media-staging"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

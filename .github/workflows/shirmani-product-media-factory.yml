name: SHIRMANI Product Media Factory
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-product-media-factory
  cancel-in-progress: false
jobs:
  media-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Produce MP4 + VIP screenshot batch
        env:
          MEDIA_BATCH: "10"
        run: python3 factory/product_media_factory.py
      - name: Publish generated media through pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "production: materialize product demo media batch"
          title: "Automission: publish product demo media batch"
          body: |
            Publishes generated media through the repository's required pull-request path.
            Generated media is not treated as proof of live voice, lip-sync, customer sales, or delivery.
          branch: "automission/product-media-factory"
          delete-branch: true

name: SHIRMANI Product Media Factory
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
concurrency:
  # Serialize this writer with any other media publisher using this group.
  group: shirmani-product-media-factory
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  media-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Produce MP4 + VIP screenshot batch
        env:
          MEDIA_BATCH: "10"
        run: python3 factory/product_media_factory.py
      - name: Propose production media through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/product-media-factory-output
          delete-branch: false
          add-paths: |
            factory/product_media_factory.py
            generated/product-specific-demo-video-manifest.json
            products/demos
            products/vip-screenshots
          commit-message: "production: materialize product demo media batch"
          title: "production: propose product demo media batch"
          body: |
            Automated proposal containing generated product-demo media and its manifest.
            This PR respects protected-main rules and does not push directly to main.
            Review media integrity, rendered output, and the manifest before merging.
          labels: |
            automation
            product-media

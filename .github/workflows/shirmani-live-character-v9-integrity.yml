name: SHIRMANI Supreme Live Character V9 Integrity
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shirmani-supreme-live-character-v9.html"
      - "generated/shirmani-live-character-v9.json"
      - "shirmani-live-character-v5.html"
      - ".github/workflows/shirmani-live-character-v9-integrity.yml"
permissions:
  contents: read
concurrency:
  group: shirmani-live-character-v9-integrity
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V9
        shell: python
        run: |
          import json, pathlib
          page = pathlib.Path("shirmani-supreme-live-character-v9.html").read_text(encoding="utf-8")
          contract = json.loads(pathlib.Path("generated/shirmani-live-character-v9.json").read_text(encoding="utf-8"))
          required = [
              "Voice → Authorized Voice → Context → Evidence → Reasoning → Answer → Face → Gaze → Lip Timing → Live → Audit → Improve",
              contract["evidence"]["insufficient_phrase"],
              "EXPLICIT AUTH REQUIRED",
              "NOT YET ESTABLISHED",
          ]
          assert contract["version"] == "V9", "Unexpected character contract version"
          assert contract["evidence"]["workflow_success_is_not_independent_verification"] is True
          missing = [phrase for phrase in required if phrase not in page]
          assert not missing, f"V9 page is missing required contract phrases: {missing!r}"
          print("SHIRMANI_V9_INTEGRITY_PASS")

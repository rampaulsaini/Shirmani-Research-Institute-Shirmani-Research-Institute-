name: SHIRMANI Verification Progress Audit

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SHIRMANI Independent Verification Gate"
      - "SHIRMANI Supreme Evidence Automission"
      - "SHIRMANI Supreme Evidence Convergence"
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    name: Verification Progress Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build authoritative progress status
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          queue_path = Path("generated/VERIFICATION-QUEUE.json")
          registry_path = Path("generated/VERIFICATION-REGISTRY.json")
          promotion_path = Path("generated/VERIFICATION-PROMOTION-QC.json")
          publication_path = Path("generated/PUBLICATION-GATE.json")
          target_config_path = Path("config/independent-verification-target.json")

          for p in (queue_path, registry_path, promotion_path, publication_path, target_config_path):
              if not p.exists():
                  raise SystemExit(f"Missing required status file: {p}")

          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          promotion = json.loads(promotion_path.read_text(encoding="utf-8"))
          publication = json.loads(publication_path.read_text(encoding="utf-8"))
          target_cfg = json.loads(target_config_path.read_text(encoding="utf-8"))

          target = int(target_cfg["verification_target"])
          upstream_queued = int(queue.get("queued", 0))
          reviewed = int(registry.get("reviewed", 0))
          verified = int(registry.get("verified", 0))
          promotion_verified = int(promotion.get("verified_records", 0))
          concrete_review_slots = int(promotion.get("queue_records", 0))

          if target <= 0 or upstream_queued < 0 or reviewed < 0 or verified < 0 or concrete_review_slots < 0:
              raise SystemExit("Invalid verification counters.")

          if verified != promotion_verified:
              raise SystemExit(
                  f"Registry/promotion mismatch: registry verified={verified}, "
                  f"promotion verified={promotion_verified}"
              )

          if verified > reviewed or reviewed > upstream_queued:
              raise SystemExit("Verification counters violate upstream registry invariants.")
          if verified > target:
              raise SystemExit("Verified records exceed the configured milestone.")
          if concrete_review_slots > upstream_queued:
              raise SystemExit("Concrete review slots exceed the upstream queue.")

          remaining = max(target - verified, 0)
          target_pct = round((verified / target) * 100, 4)
          review_pct = round((reviewed / target) * 100, 4)
          slots_pct = round((concrete_review_slots / target) * 100, 4)

          status = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "verification_milestone": target,
              "upstream_queue_records": upstream_queued,
              "concrete_review_slots": concrete_review_slots,
              "reviewed_records": reviewed,
              "verified_records": verified,
              "remaining_to_verified_milestone": remaining,
              "review_progress_percentage": review_pct,
              "concrete_review_slots_percentage": slots_pct,
              "verified_milestone_progress_percentage": target_pct,
              "publication_gate": publication.get("publication_gate"),
              "promotion_gate": promotion.get("publication_gate"),
              "independent_verification": verified > 0,
              "policy": "Upstream queue size, preparation, evidence traceability and workflow success are not independent verification.",
              "next_required_transition": (
                  "Independently review the concrete records; each VERIFIED promotion requires evidence, countercase, reproduction/test and audit."
                  if verified < target else
                  "Verification milestone reached."
              )
          }

          Path("verification-progress-status.json").write_text(
              json.dumps(status, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print(json.dumps(status, indent=2, ensure_ascii=False))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("# SHIRMANI Verification Progress Audit\n\n")
              s.write(f"- Verification milestone: **{target}**\n")
              s.write(f"- Upstream queue: **{upstream_queued}** (aggregate source scale)\n")
              s.write(f"- Concrete review slots: **{concrete_review_slots}/{target} ({slots_pct}%)**\n")
              s.write(f"- Reviewed: **{reviewed}/{target} ({review_pct}%)**\n")
              s.write(f"- VERIFIED: **{verified}/{target} ({target_pct}% of milestone)**\n")
              s.write(f"- Remaining: **{remaining}**\n")
              s.write(f"- Publication gate: **{publication.get('publication_gate')}**\n")
              s.write(f"- Promotion gate: **{promotion.get('publication_gate')}**\n")
              s.write("\n> Workflow success is not counted as VERIFIED.\n")

      - name: Publish progress artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-verification-progress-status
          path: verification-progress-status.json

name: SHIRMANI Unique Digital Tool Automission
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-unique-tool-automission
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unique tool production set
        run: |
          python - <<'PY'
          import json, pathlib, hashlib, datetime
          root=pathlib.Path(".")
          cat=json.loads((root/"factory/unique-tool-catalog.json").read_text())
          rows=[]
          for p in cat["tools"]:
              f=root/p["path"]
              ok=f.exists() and f.stat().st_size>250
              rows.append({"id":p["id"],"name":p["name"],"path":p["path"],"status":"PRODUCED" if ok else "MISSING","sha256":hashlib.sha256(f.read_bytes()).hexdigest() if ok else None})
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          out={"schema_version":1,"generated_at":now,"cycle":"UNIQUE_TOOL_AUTOMISSION","tool_count":len(rows),"produced_count":sum(x["status"]=="PRODUCED" for x in rows),"remaining_count":sum(x["status"]!="PRODUCED" for x in rows),"tools":rows,"verification":"DOWNSTREAM"}
          manifest=root/"generated/unique-tool-production-manifest.json"
          previous=None
          if manifest.exists():
              try:
                  previous=json.loads(manifest.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  previous=None
          if isinstance(previous,dict):
              current_core={k:v for k,v in out.items() if k!="generated_at"}
              previous_core={k:v for k,v in previous.items() if k!="generated_at"}
              if current_core==previous_core:
                  out["generated_at"]=previous.get("generated_at",now)
          (root/"generated").mkdir(exist_ok=True)
          manifest.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit production manifest only when it changes
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Unique Tool Automission"
          git config user.email "actions@users.noreply.github.com"
          git add generated/unique-tool-production-manifest.json
          git diff --cached --quiet || (git commit -m "automission: update unique tool production manifest" && git push)

name: SHIRMANI Unique Digital Tool Automission
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-unique-tool-automission
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unique tool production set
        run: |
          python - <<'PY'
          import json, pathlib, hashlib, datetime
          root=pathlib.Path(".")
          cat=json.loads((root/"factory/unique-tool-catalog.json").read_text())
          rows=[]
          for p in cat["tools"]:
              f=root/p["path"]
              ok=f.exists() and f.stat().st_size>250
              rows.append({"id":p["id"],"name":p["name"],"path":p["path"],"status":"PRODUCED" if ok else "MISSING","sha256":hashlib.sha256(f.read_bytes()).hexdigest() if ok else None})
          manifest_path=root/"generated/unique-tool-production-manifest.json"
          out={"schema_version":1,"cycle":"UNIQUE_TOOL_AUTOMISSION","tool_count":len(rows),"produced_count":sum(x["status"]=="PRODUCED" for x in rows),"remaining_count":sum(x["status"]!="PRODUCED" for x in rows),"tools":rows,"verification":"DOWNSTREAM"}
          # Keep the five-minute audit, but avoid timestamp-only commits that fan out
          # into unrelated workflows. Refresh generated_at only when meaningful state changes.
          previous={}
          if manifest_path.exists():
              try:
                  previous=json.loads(manifest_path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  previous={}
          comparable_previous={k:v for k,v in previous.items() if k!="generated_at"}
          if comparable_previous == out:
              print("Unique-tool inventory unchanged; preserving manifest to avoid a no-op commit.")
          else:
              out["generated_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
              manifest_path.parent.mkdir(exist_ok=True)
              manifest_path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit production manifest only when content changes
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Unique Tool Automission"
          git config user.email "actions@users.noreply.github.com"
          git add generated/unique-tool-production-manifest.json
          if git diff --cached --quiet; then
            echo "No meaningful manifest change; no commit or downstream workflow fan-out."
            exit 0
          fi
          git commit -m "automission: update unique tool production manifest"
          git push

name: SHIRMANI Unique Digital Tool Automission
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-unique-tool-automission
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unique tool production set
        run: |
          python - <<'PY'
          import json, pathlib, hashlib, datetime
          root=pathlib.Path(".")
          cat=json.loads((root/"factory/unique-tool-catalog.json").read_text())
          rows=[]
          for p in cat["tools"]:
              f=root/p["path"]
              ok=f.exists() and f.stat().st_size>250
              rows.append({"id":p["id"],"name":p["name"],"path":p["path"],"status":"PRODUCED" if ok else "MISSING","sha256":hashlib.sha256(f.read_bytes()).hexdigest() if ok else None})
          out={"schema_version":1,"generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"cycle":"UNIQUE_TOOL_AUTOMISSION","tool_count":len(rows),"produced_count":sum(x["status"]=="PRODUCED" for x in rows),"remaining_count":sum(x["status"]!="PRODUCED" for x in rows),"tools":rows,"verification":"DOWNSTREAM"}
          (root/"generated").mkdir(exist_ok=True)
          (root/"generated/unique-tool-production-manifest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit production manifest
        run: |
          git config user.name "SHIRMANI Unique Tool Automission"
          git config user.email "actions@users.noreply.github.com"
          git add generated/unique-tool-production-manifest.json
          git diff --cached --quiet || (git commit -m "automission: update unique tool production manifest" && git push)

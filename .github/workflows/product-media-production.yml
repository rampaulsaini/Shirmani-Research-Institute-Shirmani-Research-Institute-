name: SHIRMANI Product Media Inventory Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'generated/1000-digital-products.json'
      - 'demo-video.html'
      - '.github/workflows/product-media-production.yml'
      - '.github/workflows/shirmani-product-demo-media-factory.yml'

permissions:
  contents: read

concurrency:
  group: shirmani-product-media-inventory-audit
  cancel-in-progress: true

jobs:
  inventory-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit production media manifest without overwriting it
        shell: python
        run: |
          import json, pathlib
          catalog=json.loads(pathlib.Path('generated/1000-digital-products.json').read_text(encoding='utf-8'))
          products=catalog.get('products', [])
          manifest_path=pathlib.Path('generated/product-media-production-manifest.json')
          if not manifest_path.exists():
              print(f"catalog_products={len(products)} manifest=NOT_YET_PUBLISHED")
              raise SystemExit(0)
          raw=manifest_path.read_text(encoding='utf-8').strip()
          if not raw:
              print(f"catalog_products={len(products)} manifest=EMPTY")
              print("real_mp4_count=0")
              print("engine_demo_count=0")
              print("owner_of_manifest=shirmani-product-demo-media-factory")
              raise SystemExit(0)
          try:
              m=json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"catalog_products={len(products)} manifest=INVALID_JSON error={exc}")
              print("owner_of_manifest=shirmani-product-demo-media-factory")
              raise SystemExit(0)
          rows=m.get('products', [])
          print(f"catalog_products={len(products)}")
          print(f"manifest_products={len(rows)}")
          print(f"interactive_demo_count={m.get('interactive_demo_count', 0)}")
          print(f"real_mp4_count={m.get('real_mp4_count', 0)}")
          print(f"engine_demo_count={m.get('engine_demo_count', 0)}")
          print("owner_of_manifest=shirmani-product-demo-media-factory")

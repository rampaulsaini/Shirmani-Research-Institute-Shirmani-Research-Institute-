name: SHIRMANI Ultra Mega Infinity Quantum AI ML NLP Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "docs/ultra-mega-infinity-quantum-ai-ml-nlp-automission.md"
      - "schemas/ultra-mega-infinity-quantum-orchestrator.schema.json"
      - "factory/ultra_mega_infinity_quantum_automission.py"
      - "tests/ultra_mega_infinity_quantum_automission.py"
      - "schemas/agent-governance.json"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shirmani-ultra-mega-infinity-quantum
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run supreme orchestrator
        run: python3 factory/ultra_mega_infinity_quantum_automission.py
      - name: Run hardening test
        run: python3 tests/ultra_mega_infinity_quantum_automission.py
      - name: Upload cycle telemetry
        uses: actions/upload-artifact@v4
        with:
          name: ultra-mega-infinity-quantum-${{ github.run_id }}
          path: generated/ultra-mega-infinity-quantum-automission.json
          if-no-files-found: error
          retention-days: 14

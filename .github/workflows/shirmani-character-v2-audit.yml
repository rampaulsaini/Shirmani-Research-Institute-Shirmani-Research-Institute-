name: SHIRMANI Character V2 Continuous Audit

on:
  # Hourly monitoring preserves 24/7 coverage without flooding Actions with a run every five minutes.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/shirmani-character-v2.json"
      - "docs/SHIRMANI-CHARACTER-V2.md"
      - "shirmani-live-presentation.html"
      - ".github/workflows/shirmani-character-v2-audit.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-character-v2-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Character V2 contract
        shell: python
        run: |
          import json
          from pathlib import Path
          cfg=json.loads(Path("config/shirmani-character-v2.json").read_text(encoding="utf-8"))
          required=[
            cfg["identity_owner"]=="user-authored",
            cfg["reasoning"]["context_first"] is True,
            cfg["reasoning"]["comparative_facts_required_for_argument"] is True,
            cfg["reasoning"]["identity_boundary"].startswith("user-authored"),
            cfg["evidence"]["source_when_available"] is True,
            cfg["evidence"]["independent_verification_required_for_verified_claims"] is True,
            cfg["evidence"]["workflow_success_is_not_verification"] is True,
            cfg["respect"]["no_demeaning_of_persons"] is True,
            cfg["respect"]["no_demeaning_of_caste"] is True,
            cfg["respect"]["no_demeaning_of_religion_or_faith"] is True,
            cfg["respect"]["no_demeaning_of_organizations"] is True,
            cfg["presentation"]["live_release"]=="fail-closed until all upstream gates pass",
            "QUESTION" in cfg["promotion_chain"],
            "VERIFIED" in cfg["promotion_chain"],
          ]
          if not all(required):
            raise SystemExit("CHARACTER_V2_AUDIT_FAIL")
          print("CHARACTER_V2_AUDIT_PASS")

      - name: Validate live presentation integration
        shell: python
        run: |
          from pathlib import Path
          p=Path("shirmani-live-presentation.html").read_text(encoding="utf-8")
          required=["SHIRMANI LIVE PRESENTATION SUBSYSTEM","Character & communication contract","अभी पर्याप्त प्रमाण उपलब्ध नहीं है","EXPLICIT AUTH REQUIRED","NOT CLAIMED"]
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit("CHARACTER_V2_UI_AUDIT_FAIL: "+repr(missing))
          print("CHARACTER_V2_UI_AUDIT_PASS")

      - name: Generate machine-readable audit evidence
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          out={
            "generated_at": datetime.now(timezone.utc).isoformat(),
            "workflow_run_number": os.environ.get("GITHUB_RUN_NUMBER"),
            "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
            "character_contract": "SHIRMANI Character V2",
            "contract_checks": "PASS",
            "presentation_integration_checks": "PASS",
            "automated_checks_passed": 2,
            "automated_checks_total": 2,
            "automated_check_pass_rate_percent": 100,
            "live_release": "NOT_VERIFIED",
            "independent_verification": "REQUIRED",
            "external_voice_provider": "NOT_CONNECTED_BY_THIS_AUDIT",
            "phoneme_accurate_lipsync": "NOT_ESTABLISHED_BY_THIS_AUDIT",
            "live_question_answering": "NOT_TESTED_BY_THIS_AUDIT",
            "evidence_uncertainty": "FAIL_CLOSED",
            "source_of_truth": "config/shirmani-character-v2.json",
            "note": "Passing automated contract checks is not proof of public deployment, live voice, lip-sync, or external-provider operation."
          }
          Path("generated").mkdir(exist_ok=True)
          Path("generated/shirmani-character-v2-audit.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          summary = [
            "# SHIRMANI Character V2 — Production audit",
            "",
            f"- UTC timestamp: {out['generated_at']}",
            f"- Workflow run: {out['workflow_run_number']} (ID {out['workflow_run_id']})",
            "- Contract checks: PASS",
            "- Presentation integration checks: PASS",
            "- Automated checks: 2/2 (100%)",
            "- Public/live release: NOT VERIFIED",
            "- External voice provider: NOT CONNECTED BY THIS AUDIT",
            "- Phoneme-accurate lip-sync: NOT ESTABLISHED BY THIS AUDIT",
            "- Live question answering: NOT TESTED BY THIS AUDIT",
            "",
            "> These counters measure only the automated checks run here. They do not claim platform-wide completion or external-service verification."
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))

      - name: Preserve audit evidence as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-character-v2-audit-${{ github.run_number }}
          path: generated/shirmani-character-v2-audit.json
          if-no-files-found: error
          retention-days: 30

name: SHIRMANI Supreme NLP v3 Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/supreme_nlp_v3.py"
      - "factory/supreme_nlp_v3_qc.py"
      - "tests/test_supreme_nlp_v3.py"
      - "tests/test_supreme_nlp_v3_hardening.py"
      - "tests/test_supreme_nlp_unified_gate.py"
      - "tests/test_shirmani_research_paper_integration.py"
      - "automation/repository-network-registry-2026-10-01.json"
      - "generated/research-paper-claims.json"
      - "federation/research-paper-source-intake.json"
      - "factory/research_paper_verification_intake.py"
      - "tests/test_research_paper_verification_intake.py"
      - "docs/NISHPAKSH-YATHARTH-GOVERNANCE-RESEARCH-FRAMEWORK-2026-10-04.json"
      - "docs/NISHPAKSH-COMPARATIVE-RESEARCH-MATRIX-2026-10-04.json"
      - "tests/test_nishpaksh_yatharth_framework.py"
      - "federation/shirmani-native-verifiable-value-protocol.json"
      - "federation/yatharth-mudra-integrated-protocol.json"
      - "federation/yatharth-mudra-integrated-protocol.json"
      - "tests/test_yatharth_mudra_integrated_protocol.py"
      - "factory/research_paper_intake.py"
      - "federation/research-paper-evidence-intake-spec.json"
      - "tests/test_research_paper_evidence_intake_spec.py"
      - "tests/test_research_paper_claim_registry.py"
      - "factory/supreme_nlp_unified_gate.py"
      - ".github/workflows/supreme-nlp-v3-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run v3 deterministic QC
        run: python3 factory/supreme_nlp_v3_qc.py
      - name: Run v3 contract tests
        run: python3 tests/test_supreme_nlp_v3.py
      - name: Run v3 adversarial hardening tests
        run: python3 tests/test_supreme_nlp_v3_hardening.py
      - name: Run unified promotion-boundary regression test
        run: python3 tests/test_supreme_nlp_unified_gate.py
      - name: Run Shirmani Research Paper integration regression test
        run: python3 tests/test_shirmani_research_paper_integration.py
      - name: Run research paper claim registry regression test
        run: python3 tests/test_research_paper_claim_registry.py
      - name: Run research paper source intake regression test
        run: python3 tests/test_research_paper_source_intake.py
      - name: Run Research Paper verification intake regression test
        run: python3 tests/test_research_paper_verification_intake.py
      - name: Run Nishpaksh Yatharth framework regression test
        run: python3 tests/test_nishpaksh_yatharth_framework.py
      - name: Run Nishpaksh Yatharth framework regression test
        run: python3 tests/test_nishpaksh_yatharth_framework.py
      - name: Run platform-native value protocol regression test
        run: python3 tests/test_shirmani_native_verifiable_value_protocol.py
      - name: Run YTH integrated protocol safety test
        run: python3 tests/test_yatharth_mudra_integrated_protocol.py
      - name: Run research paper pipeline bridge regression test
        run: python3 tests/test_research_paper_pipeline_bridge.py
      - name: Build Research Paper verification intake queue
        run: python3 factory/research_paper_intake.py
      - name: Run research paper claim/evidence pipeline regression test
        run: python3 tests/test_research_paper_claim_evidence_pipeline.py
      - name: Run research paper evidence intake contract test
        run: python3 tests/test_research_paper_evidence_intake_spec.py
      - name: Run research paper claim adapter regression test
        run: python3 tests/test_research_paper_claim_adapter.py
      - name: Run Research Paper verification intake regression test
        run: python3 tests/test_research_paper_verification_intake.py

      - name: Validate Research Paper verification queue adapter
        run: python3 factory/research_paper_verification_adapter.py
      - name: Run Research Paper verification queue regression test
        run: python3 tests/test_research_paper_verification_adapter.py

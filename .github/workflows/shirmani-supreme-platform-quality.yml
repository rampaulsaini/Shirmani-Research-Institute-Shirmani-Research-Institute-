name: SHIRMANI Supreme Platform Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "factory/**"
      - "automation/**"
      - "docs/supreme-ai-ml-nlp-automission-quality-contract-2026-10-01.md"
      - ".github/workflows/shirmani-supreme-platform-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "schemas/**"
      - "factory/**"
      - "automation/**"
      - "docs/**"
      - ".github/workflows/**"
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-platform-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax gate
        run: python3 -m compileall -q factory scripts agents

      - name: JSON contract gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("schemas/multimodal-signal-interpretation.schema.json"),
              Path("automation/repository-network-registry-2026-10-01.json"),
          ]
          for p in paths:
              json.loads(p.read_text(encoding="utf-8"))
              print("JSON PASS:", p)
          PY

      - name: Multimodal signal QC
        run: python3 factory/multimodal_signal_qc.py

      - name: Workflow hygiene checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflows=list(Path(".github/workflows").glob("*.yml"))+list(Path(".github/workflows").glob("*.yaml"))
          names=[]
          for p in workflows:
              text=p.read_text(encoding="utf-8",errors="replace")
              for line in text.splitlines():
                  if line.startswith("name:"):
                      names.append((line[5:].strip(),p.name))
                      break
          dup={}
          for name,path in names:
              dup.setdefault(name,[]).append(path)
          bad={k:v for k,v in dup.items() if len(v)>1}
          if bad:
              raise SystemExit("Duplicate workflow names: "+repr(bad))
          print(f"Workflow inventory PASS: {len(workflows)} files, {len(names)} named workflows")
          PY

      - name: Evidence boundary gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required=[
            Path("docs/supreme-ai-ml-nlp-automission-quality-contract-2026-10-01.md"),
            Path("schemas/multimodal-signal-interpretation.schema.json"),
            Path("factory/multimodal_signal_qc.py"),
          ]
          missing=[str(p) for p in required if not p.is_file()]
          if missing: raise SystemExit("Missing quality-contract artifacts: "+", ".join(missing))
          print("Evidence boundary PASS")
          PY

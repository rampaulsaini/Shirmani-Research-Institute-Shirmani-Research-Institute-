name: SHIRMANI Publish Repaired Production State Through PR

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-state-publication-pr.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-production-state-publication-pr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch repaired production-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/production-state:refs/remotes/origin/automation/production-state
          git checkout origin/automation/production-state -- \
            products/concrete \
            products/visuals/qr \
            generated/concrete-production-overlay.json \
            generated/live-production-state.json \
            generated/product-qc-gate.json \
            generated/concrete-product-asset-status.json \
            generated/concrete-product-production-status.json \
            generated/concrete-product-depth-status.json \
            generated/continuous-production-batch-status.json \
            generated/four-stage-production-status.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          catalog = json.loads((root / "generated/1000-digital-products.json").read_text(encoding="utf-8"))
          state = json.loads((root / "generated/live-production-state.json").read_text(encoding="utf-8"))
          overlay = json.loads((root / "generated/concrete-production-overlay.json").read_text(encoding="utf-8"))
          products = catalog.get("products", [])
          target = int(catalog.get("product_count", len(products)))
          ids = [str(p.get("id", "")).strip() for p in products if isinstance(p, dict) and p.get("id")]
          if len(ids) != target or len(set(ids)) != target:
              raise SystemExit("PUBLIC_PRODUCTION_SYNC_GATE_FAILED: catalog IDs are missing or duplicated")

          # Count the catalog's actual product identities, not every historical
          # HTML page that happens to live in products/concrete.
          concrete_ids = {
              path.stem.casefold()
              for path in (root / "products/concrete").glob("*.html")
              if path.is_file() and path.stat().st_size > 0
          }
          matched_ids = sum(1 for product_id in ids if product_id.casefold() in concrete_ids)
          qrs = len(list((root / "products/visuals/qr").glob("*.svg")))
          overlay_rows = overlay.get("products", [])
          overlay_ids = [
              str(p.get("id", "")).strip()
              for p in overlay_rows
              if isinstance(p, dict) and p.get("id")
          ]
          rows = len(overlay_rows)
          print(json.dumps({
              "catalog_target": target,
              "unique_catalog_ids": len(set(ids)),
              "matched_concrete_catalog_assets": matched_ids,
              "concrete_html_files_including_non_catalog": len(list((root / "products/concrete").glob("*.html"))),
              "qr_assets": qrs,
              "overlay_rows": rows,
              "unique_overlay_ids": len(set(overlay_ids)),
              "state_concrete_assets": state.get("concrete_repository_assets"),
              "state_qr_assets": state.get("product_qr_assets")
          }, sort_keys=True))

          if matched_ids != target:
              raise SystemExit("PUBLIC_PRODUCTION_SYNC_GATE_FAILED: catalog product files do not all exist")
          if rows != target or len(set(overlay_ids)) != target or set(overlay_ids) != set(ids):
              raise SystemExit("PUBLIC_PRODUCTION_SYNC_GATE_FAILED: overlay rows must map one-to-one to catalog IDs")
          if int(state.get("concrete_repository_assets", -1)) != matched_ids:
              raise SystemExit("PUBLIC_PRODUCTION_SYNC_GATE_FAILED: live-state concrete count does not match catalog assets")
          if qrs != int(state.get("product_qr_assets", -1)):
              raise SystemExit("PUBLIC_PRODUCTION_SYNC_GATE_FAILED: QR file count does not match production state")
          PY
      - name: Open/update pull request for public production state
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(production): publish repaired concrete assets and truthful state"
          title: "Automission: publish repaired production assets and state"
          body: |
            Publishes validated automation/production-state outputs to the public main branch through the repository's required pull-request path.

            The gate validates unique catalog IDs, a one-to-one overlay-to-catalog mapping, actual catalog asset files, QR files, and live-state counts. Historical/non-catalog HTML files are not miscounted as catalog products.

            Production assets are not proof of independent verification, sales, payment, or dispatch. Those remain separate downstream states.
          branch: "automission/public-production-state-sync"
          delete-branch: true
          add-paths: |
            products/concrete
            products/visuals/qr
            generated/concrete-production-overlay.json
            generated/live-production-state.json
            generated/product-qc-gate.json
            generated/concrete-product-asset-status.json
            generated/concrete-product-production-status.json
            generated/concrete-product-depth-status.json
            generated/continuous-production-batch-status.json
            generated/four-stage-production-status.json
      - name: Summary
        if: always()
        run: |
          echo "Production-state synchronization is PR-based; this workflow never pushes directly to main." >> "$GITHUB_STEP_SUMMARY"

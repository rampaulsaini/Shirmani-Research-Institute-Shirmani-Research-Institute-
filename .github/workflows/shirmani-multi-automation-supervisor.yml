name: SHIRMANI Multi-Automation Supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shirmani-multi-automation-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect recent failures without mutating runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --status failure --limit 50             --json databaseId,workflowName,attempt,event,headBranch,createdAt,conclusion             --jq '.[] | {id:.databaseId,workflow:.workflowName,attempt:.attempt,event:.event,branch:.headBranch,created:.createdAt}'             | tee generated/recent-failures.jsonl

      - name: Run local integrity and NLP gates
        run: |
          set -euo pipefail
          python3 -m py_compile factory/signal_to_nlp.py
          python3 -m unittest discover -s tests -p 'test_*nlp*.py' -v

      - name: Validate protected-source policy
        run: |
          set -euo pipefail
          test -s SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md
          grep -q "Preserve first. Reason second." SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md
          grep -q "Original user wording is source material" SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md

      - name: Validate resumable state
        run: |
          set -euo pipefail
          test -s CONTINUATION-AUTO-STATE.md
          grep -q "Human verification" CONTINUATION-AUTO-STATE.md

      - name: Publish supervisor evidence
        uses: actions/upload-artifact@v4
        with:
          name: automission-supervisor-evidence
          path: generated/recent-failures.jsonl
          retention-days: 14

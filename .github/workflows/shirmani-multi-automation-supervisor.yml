name: SHIRMANI Multi-Automation Supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: shirmani-multi-automation-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect recent workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Recent failed workflow runs:"
          gh run list --repo "$GITHUB_REPOSITORY" --status failure --limit 50             --json databaseId,workflowName,attempt,event,headBranch,createdAt,conclusion             --jq '.[] | select(.workflowName != "SHIRMANI Multi-Automation Supervisor")'

      - name: Retry eligible scheduled/manual failures only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --status failure --limit 50             --json databaseId,workflowName,attempt,event,headBranch,createdAt,conclusion |
          python3 -c '
          import json,sys,subprocess,os
          runs=json.load(sys.stdin)
          skip={"SHIRMANI Multi-Automation Supervisor"}
          for r in runs:
              if r.get("workflowName") in skip or r.get("attempt") != 1:
                  continue
              # Do not automatically rerun push-triggered failures.
              # This keeps untrusted/new code outside the retry loop.
              if r.get("event") not in {"schedule","workflow_dispatch"}:
                  continue
              rid=str(r["databaseId"])
              workflow_name=r.get("workflowName")
              print(f"Retrying first-attempt scheduled/manual failure: {workflow_name} #{rid}")
              subprocess.run(
                  ["gh","run","rerun",rid,"--failed","--repo",os.environ["GITHUB_REPOSITORY"]],
                  check=False
              )
          '

      - name: Validate protected-source policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md")
          text = p.read_text(encoding="utf-8")
          required = ["Preserve first. Reason second.", "Original user wording is source material"]
          if not p.is_file() or any(marker not in text for marker in required):
              raise SystemExit("Protected-source policy validation failed")
          print("Protected-source policy: PASS")
          PY

      - name: Validate resumable state
        run: |
          set -euo pipefail
          test -s CONTINUATION-AUTO-STATE.md
          grep -q "Human verification" CONTINUATION-AUTO-STATE.md

      - name: Report supervisor status
        run: |
          echo "SHIRMANI multi-automation supervisor PASS"
          echo "Mechanical automation may retry scheduled/manual failures only."
          echo "Human verification remains an explicit integrity gate."

name: SHIRMANI Multi-Automation Supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: shirmani-multi-automation-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect recent workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Recent failed workflow runs:"
          gh run list --repo "$GITHUB_REPOSITORY" --status failure --limit 50 \
            --json databaseId,workflowName,attempt,event,headBranch,createdAt,conclusion \
            --jq '.[] | select(.workflowName != "SHIRMANI Multi-Automation Supervisor")'

      - name: Retry eligible first-attempt failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --status failure --limit 50 \
            --json databaseId,workflowName,attempt,event,headBranch,createdAt,conclusion |
          python3 -c '
          import json,sys,subprocess
          runs=json.load(sys.stdin)
          skip={"SHIRMANI Multi-Automation Supervisor"}
          for r in runs:
              if r.get("workflowName") in skip or r.get("attempt") != 1:
                  continue
              if r.get("event") not in {"schedule","workflow_dispatch","push"}:
                  continue
              rid=str(r["databaseId"])
              print(f"Retrying first-attempt failure: {r.get('workflowName')} #{rid}")
              subprocess.run(["gh","run","rerun",rid,"--failed","--repo", "$GITHUB_REPOSITORY"], check=False)
          '

      - name: Validate protected-source policy
        run: |
          set -euo pipefail
          test -s SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md
          grep -q "Preserve first. Reason second." SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md
          grep -q "Original user wording is source material" SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md

      - name: Validate resumable state
        run: |
          set -euo pipefail
          test -s CONTINUATION-AUTO-STATE.md
          grep -q "Human verification" CONTINUATION-AUTO-STATE.md

      - name: Report supervisor status
        run: |
          echo "SHIRMANI multi-automation supervisor PASS"
          echo "Mechanical automation may retry failed first attempts."
          echo "Human verification remains an explicit integrity gate."

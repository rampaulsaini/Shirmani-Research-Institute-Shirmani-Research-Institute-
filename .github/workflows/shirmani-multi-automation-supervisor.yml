name: SHIRMANI Multi-Automation Supervisor

on:
  push:
    branches:
      - fix/ci-federation-audit-20260926
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: shirmani-multi-automation-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository for protected-source and continuation checks
        uses: actions/checkout@v4

      - name: Inspect recent workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Recent failed workflow runs:"
          gh run list --repo "$GITHUB_REPOSITORY" --status failure --limit 50             --json databaseId,workflowName,attempt,event,headBranch,createdAt,conclusion             --jq '.[] | select(.workflowName != "SHIRMANI Multi-Automation Supervisor")'

      - name: Retry eligible scheduled/manual failures only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --status failure --limit 50             --json databaseId,workflowName,attempt,event,headBranch,createdAt,conclusion |
          python3 -c '
          import json,sys,subprocess,os
          runs=json.load(sys.stdin)
          skip={"SHIRMANI Multi-Automation Supervisor"}
          for r in runs:
              if r.get("workflowName") in skip or r.get("attempt") != 1:
                  continue
              # Do not automatically rerun push-triggered failures.
              # This keeps untrusted/new code outside the retry loop.
              if r.get("event") not in {"schedule","workflow_dispatch"}:
                  continue
              rid=str(r["databaseId"])
              workflow_name=r.get("workflowName")
              print(f"Retrying first-attempt scheduled/manual failure: {workflow_name} #{rid}")
              subprocess.run(
                  ["gh","run","rerun",rid,"--failed","--repo",os.environ["GITHUB_REPOSITORY"]],
                  check=False
              )
          '

      - name: Clean up old failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone, timedelta
          repo = os.environ["GITHUB_REPOSITORY"]
          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
          payload = subprocess.check_output([
              "gh", "run", "list", "--repo", repo, "--status", "failure",
              "--limit", "100", "--json", "databaseId,workflowName,createdAt"
          ], text=True)
          runs = json.loads(payload)
          protected = {"SHIRMANI Multi-Automation Supervisor"}
          deleted = 0
          for run in runs:
              if run.get("workflowName") in protected:
                  continue
              created = datetime.fromisoformat(run["createdAt"].replace("Z", "+00:00"))
              if created >= cutoff:
                  continue
              rid = str(run["databaseId"])
              print("Deleting stale failed run: {} #{}".format(run["workflowName"], rid))
              subprocess.run(["gh", "run", "delete", rid, "--confirm", "--repo", repo], check=False)
              deleted += 1
          print("Stale failed-run cleanup attempted: {}".format(deleted))
          PY

      - name: Validate protected-source policy
        run: |
          set -euo pipefail
          test -s SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md
          grep -q "Preserve first. Reason second." SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md
          grep -q "Original user wording is source material" SHIRMANI-HEART-VIEW-SUPREME-REASONING-LAYER.md

      - name: Validate resumable state
        run: |
          set -euo pipefail
          test -s CONTINUATION-AUTO-STATE.md
          grep -q "Human verification" CONTINUATION-AUTO-STATE.md

      - name: Report supervisor status
        run: |
          echo "SHIRMANI multi-automation supervisor PASS"
          echo "Mechanical automation may retry scheduled/manual failures only."
          echo "Human verification remains an explicit integrity gate."

name: SHIRMANI Supreme NLP v2 Control Plane

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: supreme-nlp-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile control-plane Python
        run: python -m compileall -q agents factory tests
      - name: End-to-end regression
        run: python -m unittest tests/test_supreme_nlp_end_to_end.py -v
      - name: Supreme NLP v2 adversarial benchmark
        run: python factory/supreme_nlp_v2_benchmark.py
      - name: Unified fail-closed gate
        run: python factory/supreme_nlp_unified_gate.py
      - name: Unified gate regression test
        run: python tests/test_supreme_nlp_unified_gate.py
      - name: Total orchestrator
        run: python factory/supreme_system_orchestrator.py
      - name: Verify generated control-plane reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path('generated/supreme-nlp-v2-benchmark.json'),Path('generated/supreme-nlp/unified-control-plane.json'),Path('generated/supreme-orchestrator/status.json')]
          for p in paths:
              if not p.is_file(): raise SystemExit(f'missing generated report: {p}')
              print(p, json.loads(p.read_text(encoding='utf-8')).get('status'))
          bench=json.loads(paths[0].read_text(encoding='utf-8'))
          gate=json.loads(paths[1].read_text(encoding='utf-8'))
          orch=json.loads(paths[2].read_text(encoding='utf-8'))
          if bench.get('status')!='PASS': raise SystemExit('benchmark blocked')
          if gate.get('status')!='PASS' or gate.get('promotion_allowed') is not False: raise SystemExit('unified gate failed or promotion boundary changed')
          if orch.get('status')!='PASS': raise SystemExit('total orchestrator blocked')
          PY
      - name: Upload evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-v2-control-plane-${{ github.run_id }}
          path: |
            generated/supreme-nlp-v2-benchmark.json
            generated/supreme-nlp/unified-control-plane.json
            generated/supreme-orchestrator/status.json

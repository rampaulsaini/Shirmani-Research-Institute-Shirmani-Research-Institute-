name: SHIRMANI Production State Integrity Repair
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: shirmani-production-state-writer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_TARGET: "5000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check "qrcode>=8,<9"
      - name: Fetch production-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/production-state
          git worktree add --detach /tmp/shirmani-production-state FETCH_HEAD
          echo "PRODUCTION_STATE_HEAD=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Detect conflict markers and missing production assets
        id: detect
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("/tmp/shirmani-production-state")
          markers=("<<<<<<< ", "======= ", ">>>>>>> ")
          hits=[]
          for p in root.rglob("*"):
              if not p.is_file() or ".git" in p.parts or p.stat().st_size>8_000_000:
                  continue
              try: text=p.read_text(encoding="utf-8")
              except (UnicodeDecodeError,OSError): continue
              if any(m in text for m in markers): hits.append(str(p.relative_to(root)))
          gen=root/"generated"
          reasons=[]
          if hits:
              reasons.append("conflict_markers")
          try:
              catalog=json.loads((gen/"1000-digital-products.json").read_text(encoding="utf-8"))
              target=int(catalog.get("product_count",len(catalog.get("products",[]))))
              concrete=len(list((root/"products/concrete").glob("*.html")))
              production=len(list((root/"products/production").glob("*.html")))
              overlay=json.loads((gen/"concrete-production-overlay.json").read_text(encoding="utf-8"))
              overlay_rows=len(overlay.get("products",[]))
              print("PRODUCTION_ASSET_COUNTS",json.dumps({
                  "catalog_target":target,
                  "concrete_assets":concrete,
                  "production_assets":production,
                  "overlay_rows":overlay_rows
              },sort_keys=True))
              if concrete != target:
                  reasons.append("concrete_asset_count_mismatch")
              if production != target:
                  reasons.append("production_asset_count_mismatch")
              if overlay_rows != target:
                  reasons.append("overlay_row_count_mismatch")
          except (OSError,ValueError,TypeError,json.JSONDecodeError) as exc:
              reasons.append("production_state_unreadable")
              print("PRODUCTION_STATE_READ_ERROR",str(exc))
          print("CONFLICT_MARKER_FILES",len(hits))
          for x in hits[:50]: print("CONFLICT",x)
          print("REPAIR_REASONS",json.dumps(reasons))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("repair_needed="+("true" if reasons else "false")+"\n")
          PY
      - name: Repair and rebuild production-state
        if: ${{ steps.detect.outputs.repair_needed == 'true' }}
        shell: bash
        working-directory: /tmp/shirmani-production-state
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/factory/public_module_inventory.py" factory/public_module_inventory.py
          cp "$GITHUB_WORKSPACE/factory/real_product_factory.py" factory/real_product_factory.py
          cp "$GITHUB_WORKSPACE/factory/materialize_all_product_assets.py" factory/materialize_all_product_assets.py
          cp "$GITHUB_WORKSPACE/factory/product_qc_gate.py" factory/product_qc_gate.py
          cp "$GITHUB_WORKSPACE/factory/product_visual_identity_factory_v2.py" factory/product_visual_identity_factory_v2.py
          cp "$GITHUB_WORKSPACE/factory/product_qr_asset_factory.py" factory/product_qr_asset_factory.py
          cp "$GITHUB_WORKSPACE/factory/product_visual_qc_gate.py" factory/product_visual_qc_gate.py
          cp "$GITHUB_WORKSPACE/factory/public_production_materializer.py" factory/public_production_materializer.py
          cp "$GITHUB_WORKSPACE/factory/qc_state_contract.py" factory/qc_state_contract.py
          cp "$GITHUB_WORKSPACE/assets/shirmani-perspective-logo.svg" assets/shirmani-perspective-logo.svg
          python3 factory/public_module_inventory.py
          python3 factory/real_product_factory.py
          python3 factory/materialize_all_product_assets.py
          rm -rf products/concrete
          mkdir -p products/concrete
          cp -a products/production/. products/concrete/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("."); gen=root/"generated"
          cat=json.loads((gen/"1000-digital-products.json").read_text(encoding="utf-8"))
          rows=[]
          for p in cat.get("products",[]):
              asset=root/str(p.get("asset",""))
              if asset.is_file():
                  rows.append({**p,"production_state":"PRODUCED","status":"READY_FOR_QC"})
          overlay={"schema_version":1,"production_first":True,"product_count":len(cat.get("products",[])),"produced_count":len(rows),"products":rows}
          (gen/"concrete-production-overlay.json").write_text(json.dumps(overlay,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("CONCRETE_PRODUCTION_OVERLAY",len(rows))
          PY
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path("."); gen=root/"generated"
          cat=json.loads((gen/"1000-digital-products.json").read_text(encoding="utf-8"))
          products=cat.get("products",[])
          errors=[]
          for p in products:
              pid=str(p.get("id",""))
              asset=root/str(p.get("asset",""))
              if not asset.is_file():
                  errors.append({"id":pid,"error":"missing_asset"})
              for key in ("name","category","engine","price_inr","offer_price_inr","qc_code","gate_no","dispatch_no","description","guarantee","packing","qr_payload"):
                  if p.get(key) in ("",None):
                      errors.append({"id":pid,"error":"missing_field","field":key})
          passed=len(products)-len({x["id"] for x in errors})
          qc={"generated_at":datetime.now(timezone.utc).isoformat(),"gate":"PRODUCT-QC-GATE","scope":"PRODUCED_PRODUCTS_ONLY","catalog_count":len(products),"produced_count":len(products)-sum(1 for x in errors if x.get("error")=="missing_asset"),"qc_passed":passed,"qc_failed":len({x["id"] for x in errors}),"pass_percent":round(100*passed/len(products),2) if products else 0,"dispatch_default":"NO","release_state":"QC_PASS_READY_FOR_DISPATCH" if not errors else "QC_REVIEW_REQUIRED","integrity":{"deterministic_qc":True,"independent_scientific_verification":False,"sale_claim":False},"errors":errors[:500]}
          (gen/"product-qc-gate.json").write_text(json.dumps(qc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"PRODUCT_QC_GATE":qc["release_state"],"catalog_count":len(products),"qc_passed":passed,"qc_failed":len({x["id"] for x in errors})},ensure_ascii=False))
          if errors:
              raise SystemExit("PRODUCT_QC_GATE_FAIL")
          PY
          VISUAL_BATCH=5000 python3 factory/product_visual_identity_factory_v2.py
          QR_BATCH=5000 python3 factory/product_qr_asset_factory.py
          python3 factory/product_visual_qc_gate.py
          python3 factory/public_production_materializer.py
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path("."); gen=root/"generated"
          cat=json.loads((gen/"1000-digital-products.json").read_text(encoding="utf-8"))
          target=int(cat.get("product_count",0))
          concrete=len(list((root/"products/concrete").glob("*.html")))
          production=len(list((root/"products/production").glob("*.html")))
          visuals=len(list((root/"products/visuals").glob("*.svg")))
          qrs=len(list((root/"products/visuals/qr").glob("*.svg")))
          now=datetime.now(timezone.utc).isoformat()
          live={
            "schema_version":3,"generated_at":now,"production_first":True,
            "catalog_identities":target,"concrete_repository_assets":concrete,
            "production_browser_assets":production,"public_4k_visual_assets":visuals,
            "product_qr_assets":qrs,"current_catalog_pending":max(0,target-concrete),
            "five_thousand_scale_target":5000,"remaining_to_scale_target":max(0,5000-concrete),
            "concrete_materialization_percent_of_catalog":round(100*concrete/target,2) if target else 0,
            "concrete_materialization_percent_of_scale_target":round(100*concrete/5000,2),
            "module_products_generated":production,"dispatch_released":0,
            "sales_claimed":0,"payment_claimed":0,"independent_verification_claimed":0,
            "state":"PRODUCTION_COMPLETE_CURRENT_CATALOG" if concrete>=target else "PRODUCTION_IN_PROGRESS",
            "qc_state":"READY_FOR_QC",
            "truth_boundary":"Produced artifacts, QC, dispatch and independent verification are distinct states."
          }
          (gen/"live-production-state.json").write_text(json.dumps(live,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          four={
            "generated_at":now,"mode":"CONTINUOUS_FOUR_STAGE_PRODUCTION",
            "chat_required_for_continuity":False,
            "principle":"Production first; QC is the release gate; downstream verification evaluates results.",
            "stages":[
              {"stage":1,"name":"INSTITUTE_DISCOVERY","status":"PASS"},
              {"stage":2,"name":"FACTORY_PRODUCTION","status":"PASS","catalog_products":target,"concrete_product_assets":concrete,"production_browser_assets":production},
              {"stage":3,"name":"PRODUCT_QC_GATE","status":"PASS","catalog_count":target,"produced_count":concrete,"dispatch_default":"NO"},
              {"stage":4,"name":"PUBLIC_SHOWROOM","status":"READY","catalog_products":target,"produced_products":concrete,"visual_assets":visuals,"qr_assets":qrs,"dispatch_default":"NO"}
            ],
            "production_contract":{"schedule":"every 5 minutes","continuity_without_chat":True,"verification":"downstream"}
          }
          (gen/"four-stage-production-status.json").write_text(json.dumps(four,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          for filename,payload in {
              "concrete-product-production-status.json":{"generated_at":now,"catalog_products":target,"concrete_product_assets":concrete,"state":"COMPLETE" if concrete>=target else "IN_PROGRESS","dispatch":"NO"},
              "concrete-product-depth-status.json":{"generated_at":now,"catalog_products":target,"depth_upgraded":production,"state":"READY"},
              "continuous-production-batch-status.json":{"generated_at":now,"catalog_products":target,"produced_total":concrete,"produced_this_cycle":concrete,"remaining":max(0,target-concrete),"dispatch_released":0,"verification":"DOWNSTREAM"}
          }.items():
              (gen/filename).write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          # Reconcile the freshly generated QC gate into public state after the
          # repair workflow writes its initial READY_FOR_QC placeholder.
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from factory.qc_state_contract import sync_public_qc_state
          gen = Path("generated")
          catalog = json.loads((gen / "1000-digital-products.json").read_text(encoding="utf-8"))
          passed = sync_public_qc_state(Path("."), int(catalog.get("product_count", 0)))
          live = json.loads((gen / "live-production-state.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "qc_passed": passed,
              "qc_state": live.get("qc_state"),
              "state": live.get("state"),
              "dispatch_released": live.get("dispatch_released"),
              "sales_claimed": live.get("sales_claimed"),
              "payment_claimed": live.get("payment_claimed"),
          }, sort_keys=True))
          if any(live.get(key, 0) != 0 for key in ("dispatch_released", "sales_claimed", "payment_claimed")):
              raise SystemExit("PUBLIC_STATE_FAIL: QC reconciliation must not infer downstream commercial events")
          PY
      - name: Refresh multi-layer status from the repaired active cycle
        if: ${{ steps.detect.outputs.repair_needed == 'true' }}
        working-directory: /tmp/shirmani-production-state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path
          from datetime import datetime, timezone

          sys.path.insert(0, str(Path.cwd()))
          from factory.multi_layer_production import LANES, current_production, discover

          gen = Path("generated")
          def read_rows(name):
              path = gen / name
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          queue = read_rows("production-work-queue.jsonl")
          results = read_rows("production-results.jsonl")
          if not queue or not results:
              raise SystemExit("MULTI_LAYER_STATUS_REFRESH_FAIL: active queue/results are empty")
          qids = [str(row.get("task_id", "")) for row in queue]
          rids = [str(row.get("task_id", "")) for row in results]
          qcycles = {int(row.get("cycle", -1)) for row in queue}
          rcycles = {int(row.get("cycle", -1)) for row in results}
          if len(qids) != len(set(qids)) or len(rids) != len(set(rids)):
              raise SystemExit("MULTI_LAYER_STATUS_REFRESH_FAIL: duplicate task IDs")
          if len(queue) != len(results) or set(qids) != set(rids) or len(qcycles) != 1 or qcycles != rcycles:
              raise SystemExit("MULTI_LAYER_STATUS_REFRESH_FAIL: queue/results do not describe one coherent cycle")

          cycle = next(iter(qcycles))
          lane_counts = dict(sorted(Counter(str(row.get("lane", "automation")) for row in queue).items()))
          previous = {}
          state_path = gen / "multi-layer-production-state.json"
          if state_path.exists():
              try:
                  previous = json.loads(state_path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  previous = {}
          status = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "engine": "SHIRMANI Multi-Layer Production Dispatcher",
              "mode": "production-first",
              "discovered_modules": len(discover()),
              "cycle_capacity": len(queue),
              "last_cycle_tasks": len(queue),
              "new_tasks_added": 0,
              "total_queued_tasks": len(queue),
              "scheduled_work_units": cycle * len(queue),
              "run_number": cycle,
              "lanes": sorted(LANES),
              "lane_counts_last_cycle": lane_counts,
              "production_outputs": current_production(),
              "routing": {
                  "ai_ml_nlp": "deterministic-first; optional NVIDIA/deep-learning route when configured",
                  "quantum": "quantum-ready orchestration; no unsupported claim of quantum hardware execution",
                  "verification": "downstream result-quality/promotion layer"
              },
              "snapshot_type": "RECONCILIATION_SNAPSHOT_NOT_NEW_CYCLE",
              "reconciled_cycle": cycle,
              "previous_cycle_counter": previous.get("cycles"),
              "truth_boundary": "This step reconciles status metadata from the existing queue/results; it creates no new work and does not claim independent verification."
          }
          (gen / "multi-layer-production-status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          report = [
              "# ꙰ SHIRMANI Multi-Layer Production Status",
              "",
              f"Reconciled: {status['generated_at']}",
              f"Active cycle: **{cycle}**",
              f"Queue rows matched to results: **{len(queue)}**",
              "",
              "This is a reconciliation snapshot of an existing cycle; no new production tasks were generated by this refresh.",
              "",
              "## Lane counts"
          ]
          report.extend(f"- **{lane}**: {count:,}" for lane, count in lane_counts.items())
          report += ["", "## Current output counters"]
          report.extend(f"- **{key}**: {value:,}" for key, value in status["production_outputs"].items() if isinstance(value, (int, float)))
          report += ["", "Independent verification remains a downstream evidence gate. Quantum-ready routing does not claim quantum hardware execution."]
          (gen / "MULTI-LAYER-PRODUCTION.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          print(json.dumps({"gate":"PASS","cycle":cycle,"queue_rows":len(queue),"result_rows":len(results),"new_tasks_added":0,"snapshot_type":status["snapshot_type"]}, sort_keys=True))
          PY
      - name: Validate coherent production cycle before publish
        if: ${{ steps.detect.outputs.repair_needed == 'true' }}
        working-directory: /tmp/shirmani-production-state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          gen = Path("generated")
          def rows(path):
              p = gen / path
              return [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]

          queue = rows("production-work-queue.jsonl")
          results = rows("production-results.jsonl")
          if not queue or not results:
              raise SystemExit("PRODUCTION_CYCLE_GATE_FAIL: queue/results must both be non-empty")
          qids = [str(row.get("task_id", "")) for row in queue]
          rids = [str(row.get("task_id", "")) for row in results]
          if len(qids) != len(set(qids)) or len(rids) != len(set(rids)):
              raise SystemExit("PRODUCTION_CYCLE_GATE_FAIL: duplicate task IDs")
          if set(qids) != set(rids) or len(queue) != len(results):
              raise SystemExit("PRODUCTION_CYCLE_GATE_FAIL: queue and results do not match one-to-one")
          qcycles = {int(row.get("cycle", -1)) for row in queue}
          rcycles = {int(row.get("cycle", -1)) for row in results}
          if len(qcycles) != 1 or qcycles != rcycles:
              raise SystemExit("PRODUCTION_CYCLE_GATE_FAIL: queue/results cycle mismatch")
          cycle = next(iter(qcycles))
          archive = json.loads((gen / "public-production/archive/index.json").read_text(encoding="utf-8"))
          if int(archive.get("latest_cycle", -1)) != cycle:
              raise SystemExit("PRODUCTION_CYCLE_GATE_FAIL: archive latest cycle does not match active results")
          shard = gen / "public-production" / "archive" / f"production-cycle-{cycle:06d}.jsonl"
          shard_rows = rows(str(shard.relative_to(gen)))
          if len(shard_rows) != len(results) or {str(x.get("task_id", "")) for x in shard_rows} != set(rids):
              raise SystemExit("PRODUCTION_CYCLE_GATE_FAIL: latest archive shard does not match active results")
          print(json.dumps({"cycle": cycle, "queue_rows": len(queue), "result_rows": len(results), "archive_rows": len(shard_rows), "gate": "PASS"}, sort_keys=True))
          PY
      - name: Fail if conflict markers remain
        if: ${{ steps.detect.outputs.repair_needed == 'true' }}
        working-directory: /tmp/shirmani-production-state
        run: |
          python - <<'PY'
          from pathlib import Path
          markers=("<<<<<<< ","======= ",">>>>>>> ")
          hits=[]
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts or p.stat().st_size>8_000_000: continue
              try: text=p.read_text(encoding="utf-8")
              except (UnicodeDecodeError,OSError): continue
              if any(m in text for m in markers): hits.append(str(p))
          if hits:
              print("\n".join(hits[:100]))
              raise SystemExit("PRODUCTION_STATE_INTEGRITY_FAIL")
          print("PRODUCTION_STATE_INTEGRITY_CLEAN")
          PY
      - name: Publish repaired production-state
        if: ${{ steps.detect.outputs.repair_needed == 'true' }}
        working-directory: /tmp/shirmani-production-state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Production State Repair Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated products factory assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(production): repair production-state conflicts and rebuild public outputs"
          # Another production cycle can update this branch between fetch and push.
          # Retry with the latest head; never force-push production state.
          for attempt in 1 2 3 4 5; do
            git fetch origin automation/production-state
            # Prefer this run's freshly rebuilt outputs for overlapping generated files.
            # Keep non-conflicting updates from concurrent production cycles.
            if ! git merge --no-edit -X ours FETCH_HEAD; then
              # A merge conflict must not terminate the retry loop under set -e.
              # Abort the failed merge so the next attempt can fetch the newest head.
              git merge --abort || true
              echo "PRODUCTION_STATE_MERGE_RETRY attempt=$attempt"
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:automation/production-state; then
              echo "PRODUCTION_STATE_PUBLISH_OK attempt=$attempt"
              exit 0
            fi
            echo "PRODUCTION_STATE_PUBLISH_RETRY attempt=$attempt"
            sleep "$((attempt * 2))"
          done
          echo "PRODUCTION_STATE_PUBLISH_FAILED after 5 attempts"
          exit 1

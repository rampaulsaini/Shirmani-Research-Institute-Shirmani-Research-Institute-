name: SHIRMANI Supreme NLP Practitioner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "agents/supreme_nlp_practitioner.py"
      - "schemas/supreme-nlp-practitioner.schema.json"
      - "tests/test_supreme_nlp_practitioner.py"
      - ".github/workflows/shirmani-supreme-nlp-practitioner.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: shirmani-supreme-nlp-practitioner
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile agents/supreme_nlp_practitioner.py
      - name: Deterministic practitioner tests
        run: python -m unittest discover -s tests -p 'test_supreme_nlp_practitioner.py' -v
      - name: Schema syntax
        run: python -c "import json; json.load(open('schemas/supreme-nlp-practitioner.schema.json', encoding='utf-8')); print('SCHEMA_OK')"
      - name: Evidence-boundary audit
        run: |
          python - <<'PY'
          from agents.supreme_nlp_practitioner import interpret, plain_language
          r=interpret([
            {"modality":"electrical","feature":"signal","value":1.0,"quality":1.0,"calibration":"calibrated"},
            {"modality":"audio","feature":"signal","value":1.1,"quality":1.0,"calibration":"calibrated"},
          ], "automission-smoke")
          assert r["result"]["status"] == "interpreted"
          assert 0 <= r["result"]["interpretation"]["confidence"] <= 1
          assert "direct proof" in " ".join(r["result"]["interpretation"]["limitations"])
          print(plain_language(r))
          print("SUPREME_NLP_PRACTITIONER_GATE=PASS")
          PY
      - name: Summary
        run: |
          {
            echo "## Supreme NLP Practitioner"
            echo "- 5-minute continuous verification"
            echo "- Multimodal normalization + calibration + cross-modal agreement"
            echo "- Fail-closed handling for low-quality/conflicting signals"
            echo "- Observable-evidence boundary preserved"
          } >> "$GITHUB_STEP_SUMMARY"

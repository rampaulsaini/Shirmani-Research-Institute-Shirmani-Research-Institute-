name: Public Platform Production Readiness Gate

on:
  pull_request:
    paths:
      - "server/**"
      - "schemas/**"
      - "docs/public-platform/**"
      - ".github/workflows/public-platform-readiness-gate.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "schemas/**"
      - "docs/public-platform/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-platform-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install
        working-directory: server
        run: npm install
      - name: Syntax and contract tests
        working-directory: server
        run: npm test
      - name: Verify deployment prerequisites are documented
        run: |
          test -f docs/public-platform/production-readiness-gate.md
          grep -q "DATABASE_URL" docs/public-platform/production-readiness-gate.md
          grep -q "JWT_SECRET" docs/public-platform/production-readiness-gate.md
          grep -q "CORS_ORIGIN" docs/public-platform/production-readiness-gate.md
          grep -q "PAYMENT_WEBHOOK_SECRET" docs/public-platform/production-readiness-gate.md
      - name: Verify production truth boundary
        run: |
          grep -R -q "production_live.*false" server/src docs/public-platform
          grep -R -q "independent_verification.*false" server/src docs/public-platform
          echo "Readiness gate preserves deployment and verification boundaries."
      - name: Report
        run: echo "Automated readiness checks passed; this does not deploy the service or establish independent verification."

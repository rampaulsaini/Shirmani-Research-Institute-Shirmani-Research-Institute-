name: SHIRMANI Production Multi-Layer Automission

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-production-factory
  cancel-in-progress: false

jobs:
  discover-factory-qc-showroom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Institute discovery
        run: |
          mkdir -p production/discovery
          printf '%s\n' "Continuous discovery active" > production/discovery/last-discovery.txt

      - name: Factory production
        run: python3 scripts/production_engine.py

      - name: QC gate preparation
        run: |
          python3 - <<'PY'
          import json
          p="production/generated/catalog.json"
          d=json.load(open(p,encoding="utf-8"))
          for item in d["products"]:
              item.setdefault("qc_gate","QC-PENDING")
              item.setdefault("dispatch","NO")
          json.dump(d,open(p,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

      - name: Build public showroom
        run: python3 scripts/build_showroom.py

      - name: Publish production artifacts through a reviewed PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: production/**
          branch: automation/multilayer-production-output
          delete-branch: false
          commit-message: "production: materialize multi-layer factory cycle"
          title: "production: refresh multi-layer factory outputs"
          body: |
            ## Automated production output
            - Generated by the scheduled multi-layer production workflow.
            - Review catalog and generated artifacts before merging.
            - QC remains pending unless backed by actual test evidence.
            - This PR does not claim deployment, external delivery, or revenue.

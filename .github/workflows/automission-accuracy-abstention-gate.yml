name: AI ML NLP Automission Accuracy Abstention Gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy-abstention:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate accuracy and abstention contract
        run: python scripts/validate_automission_accuracy_abstention.py

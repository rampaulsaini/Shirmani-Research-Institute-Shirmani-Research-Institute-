name: SHIRMANI Global Product & Usage Directory — Continuous Production
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generated/1000-digital-products.json"
      - "generated/concrete-production-overlay.json"
      - "factory/global_product_usage_directory.py"
      - ".github/workflows/global-product-usage-directory.yml"
permissions:
  contents: write
concurrency:
  group: shirmani-global-product-directory
  cancel-in-progress: false
jobs:
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sharded public directory
        run: python3 factory/global_product_usage_directory.py
      - name: Publish directory state
        run: |
          git config user.name "SHIRMANI Global Product Directory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factory/global_product_usage_directory.py generated/global-product-directory
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(directory): advance global product usage catalogue"
          git push origin HEAD:main

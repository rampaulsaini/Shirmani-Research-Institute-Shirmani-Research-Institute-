name: SHIRMANI Supreme NLP Practitioner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "agents/supreme_nlp_practitioner.py"
      - "scripts/validate_supreme_nlp_practitioner.py"
      - "schemas/supreme-nlp-practitioner.schema.json"
      - "docs/SUPREME-NLP-PRACTITIONER.md"
      - ".github/workflows/supreme-nlp-practitioner.yml"

permissions:
  contents: read

concurrency:
  group: supreme-nlp-practitioner
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile agents/supreme_nlp_practitioner.py scripts/validate_supreme_nlp_practitioner.py
      - name: Contract validation
        run: python scripts/validate_supreme_nlp_practitioner.py
      - name: Schema syntax
        run: python -m json.tool schemas/supreme-nlp-practitioner.schema.json >/dev/null
      - name: Generate deterministic audit record
        run: |
          mkdir -p generated/supreme-nlp
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp_practitioner import build_practitioner_record
          rows=[
            {"modality":"synthetic","feature":"baseline_a","value":1.0,"quality":1.0,"source":"audit"},
            {"modality":"synthetic","feature":"baseline_b","value":1.01,"quality":1.0,"source":"audit"},
          ]
          record=build_practitioner_record(rows,"automission-audit")
          Path("generated/supreme-nlp/practitioner-status.json").write_text(
              json.dumps(record,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(record["simple_language"])
          print("FINGERPRINT:",record["fingerprint"])
          PY
      - name: Governance assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-nlp/practitioner-status.json").read_text())
          g=d["governance"]
          assert g["fail_closed"] is True
          assert g["subjective_experience_claim_allowed"] is False
          assert g["code_mutation_allowed"] is False
          assert g["independent_verification_required"] is True
          print("GOVERNANCE_ASSERTIONS_OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-practitioner-\${{ github.run_id }}
          path: generated/supreme-nlp/practitioner-status.json
          retention-days: 14

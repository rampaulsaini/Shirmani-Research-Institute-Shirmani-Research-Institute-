name: Factory QC

on:
  workflow_dispatch:
  push:
    paths:
      - "factory/**"
      - "generated/**"

permissions:
  contents: read

concurrency:
  group: shirmani-factory-qc
  cancel-in-progress: false

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regenerate the downstream reasoning/provenance layer from the
      # checked-out canonical artifacts before QC. This keeps the standalone
      # QC workflow aligned with the main factory pipeline and avoids
      # validating stale derived artifacts.
      - name: Build reasoning, provenance and claim-evidence layer
        run: python3 factory/reasoning_pipeline.py

      - name: Run deterministic QC
        run: python3 factory/quality_control.py

      - name: Validate QC publication gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("generated/QC-REPORT.json").read_text(encoding="utf-8"))
          if report.get("publication_gate") != "PASS" or report.get("blocking_error_count", 0) != 0:
              raise SystemExit(
                  f"QC gate failed: gate={report.get('publication_gate')} "
                  f"blocking_error_count={report.get('blocking_error_count')}"
              )
          print("QC gate PASS")
          PY

      - name: Upload QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-qc-report
          path: generated/QC-REPORT.json
          if-no-files-found: error

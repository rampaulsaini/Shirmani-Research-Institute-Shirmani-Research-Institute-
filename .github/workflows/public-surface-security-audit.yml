name: SHIRMANI Public Surface Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-surface-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  heuristic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run heuristic public-surface audit
        run: python3 scripts/security_public_surface_audit.py
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: security-public-surface-audit
          path: generated/security-public-surface-audit.json
          if-no-files-found: error
          retention-days: 14

name: SHIRMANI Multi-Layer AI ML NLP Practitioner Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "agents/multi_layer_automission.py"
      - "tests/test_multi_layer_automission.py"
      - ".github/workflows/shirmani-multi-layer-automission.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-multi-layer-automission
  cancel-in-progress: true

jobs:
  lane:
    name: ${{ matrix.layer }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: practitioner
            test_path: tests/test_supreme_ai.py
            focus: practitioner-core
            runner: pytest
          - layer: ml
            test_path: tests/test_supreme_ai_ml_nlp.py
            focus: ml-validation
            runner: pytest
          - layer: nlp
            test_path: tests/test_supreme_nlp_end_to_end.py
            focus: nlp-end-to-end
            runner: pytest
          - layer: evidence
            test_path: tests/test_supreme_independent_verification_ledger.py
            focus: independent-evidence-ledger
            runner: python
          - layer: automission
            test_path: tests/supreme_nlp_automission_hardening.py
            focus: automission-hardening
            runner: python
          - layer: quantum-mechanism
            test_path: tests/test_multi_layer_automission.py
            focus: deterministic-orchestration
            runner: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile controller
        run: python -m py_compile agents/multi_layer_automission.py
      - name: Run lane-specific tests and record actual outcome
        env:
          TEST_PATH: ${{ matrix.test_path }}
          RUNNER: ${{ matrix.runner }}
          LANE: ${{ matrix.layer }}
        run: |
          set +e
          test -f "$TEST_PATH"
          precheck=$?
          if [ "$precheck" -ne 0 ]; then
            exit_code=$precheck
          elif [ "$RUNNER" = "python" ]; then
            python "$TEST_PATH"
            exit_code=$?
          else
            python -m pytest -q "$TEST_PATH"
            exit_code=$?
          fi
          mkdir -p lane-output
          python - "$LANE" "$TEST_PATH" "$RUNNER" "$exit_code" > lane-output/test-result.json <<'PY'
          import json, sys
          from agents.multi_layer_automission import build_result_outcome
          lane, test_path, runner, raw_exit = sys.argv[1:5]
          record = build_result_outcome(lane, test_path, runner, int(raw_exit))
          print(json.dumps(record, ensure_ascii=False, indent=2))
          PY
          cat lane-output/test-result.json
          exit "$exit_code"
      - name: Emit lane record
        if: ${{ always() }}
        env:
          LANE: ${{ matrix.layer }}
          FOCUS: ${{ matrix.focus }}
          TEST_PATH: ${{ matrix.test_path }}
          RUNNER: ${{ matrix.runner }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from agents.multi_layer_automission import build_cycle, verify_cycle_fingerprint, review_result_outcome, validate_lane_contract
          validate_lane_contract(os.environ["LANE"], os.environ["FOCUS"], os.environ["TEST_PATH"], os.environ["RUNNER"])
          cycle=build_cycle({os.environ["LANE"]:1.0}, executed_lane=os.environ["LANE"])
          cycle["lane_contract"]={"focus":os.environ["FOCUS"],"test_path":os.environ["TEST_PATH"],"runner":os.environ["RUNNER"]}
          observed=json.loads(Path("lane-output/test-result.json").read_text(encoding="utf-8"))
          expected={
              "lane": os.environ["LANE"],
              "test_path": os.environ["TEST_PATH"],
              "runner": os.environ["RUNNER"],
              "exit_code": 0,
              "status": "PASS",
          }
          outcome=review_result_outcome(expected, observed)
          assert outcome["matched"] is True
          assert observed["exit_code"] == 0
          assert observed["status"] == "PASS"
          cycle["result_outcome"]=observed
          cycle["result_outcome_review"]=outcome
          cycle["cycle_fingerprint"]=__import__("agents.multi_layer_automission",fromlist=["fingerprint_cycle"]).fingerprint_cycle(cycle)
          assert verify_cycle_fingerprint(cycle)
          out=Path("lane-output")
          (out/"cycle.json").write_text(json.dumps(cycle,ensure_ascii=False,indent=2)+"
",encoding="utf-8")
          print(json.dumps(cycle["decision"]["winner"],ensure_ascii=False))
          PY
      - name: Upload lane artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-layer-automission-${{ matrix.layer }}-${{ github.run_number }}
          path: lane-output/cycle.json
          retention-days: 14

  aggregate:
    if: ${{ always() }}
    needs: lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download all lane records
        uses: actions/download-artifact@v4
        with:
          pattern: multi-layer-automission-*-${{ github.run_number }}
          path: lane-records
          merge-multiple: false
      - name: Validate lane convergence, outcomes, and fingerprints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.multi_layer_automission import verify_cycle_fingerprint, LANES, LANE_CONTRACTS, review_result_outcome, validate_lane_contract
          expected = {lane.name for lane in LANES}
          rows = [json.loads(p.read_text(encoding="utf-8")) for p in Path("lane-records").rglob("cycle.json")]
          assert len(rows) == len(expected), f"expected {len(expected)} lane records, got {len(rows)}"
          assert {r.get("executed_lane") for r in rows} == expected
          assert all(verify_cycle_fingerprint(r) for r in rows)
          assert all(r["result_outcome"]["exit_code"] == 0 for r in rows)
          assert all(r["result_outcome"]["status"] == "PASS" for r in rows)
          assert all(r["result_outcome_review"]["matched"] is True for r in rows)
          assert all(r["result_outcome_review"]["independent_verification_established"] is False for r in rows)
          assert all(r["result_outcome_review"]["scientific_truth_established"] is False for r in rows)
          assert all(r["decision"]["governance"]["fail_closed"] is True for r in rows)
          assert all(r["decision"]["governance"]["automated_verified_promotion_allowed"] is False for r in rows)
          assert all(r["decision"]["governance"]["scheduled_code_mutation_allowed"] is False for r in rows)
          assert all(r["decision"]["quantum_hardware_used"] is False for r in rows)
          expected_focus = {
              "practitioner": "practitioner-core",
              "ml": "ml-validation",
              "nlp": "nlp-end-to-end",
              "evidence": "independent-evidence-ledger",
              "automission": "automission-hardening",
              "quantum-mechanism": "deterministic-orchestration",
          }
          assert {r["lane_contract"]["focus"] for r in rows} == set(expected_focus.values())
          assert all(r["lane_contract"]["focus"] == expected_focus[r["executed_lane"]] for r in rows)
          assert all(r["lane_contract"]["test_path"] for r in rows)
          assert all(validate_lane_contract(r["executed_lane"], r["lane_contract"]["focus"], r["lane_contract"]["test_path"], r["lane_contract"]["runner"]) for r in rows)
          assert {r["lane_contract"]["runner"] for r in rows} == {"pytest", "python"}
          print("MULTI_LAYER_RESULT_OUTCOME_CONVERGENCE=PASS")
          PY
      - name: Emit governance summary
        run: |
          {
            echo "# Multi-Layer Automission"
            echo
            echo "- 6 orchestration lanes executed."
            echo "- Each lane is bound to its actual test-process exit result."
            echo "- Result outcome review is separate from scientific/independent verification."
            echo "- Selection: quantum-inspired deterministic scoring."
            echo "- Quantum hardware used: **No**."
            echo "- Automated VERIFIED promotion: **Blocked**."
            echo "- Scheduled production-code mutation: **Blocked**."
            echo "- Independent verification remains a separate evidence process."
          } >> "$GITHUB_STEP_SUMMARY"

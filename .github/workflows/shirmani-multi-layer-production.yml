name: SHIRMANI Multi-Layer Production Automission

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shirmani-multi-layer-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Compile production and showroom builders
        run: |
          python3 -m py_compile factory/multi_layer_production.py
          python3 -m py_compile factory/public_module_inventory.py
          python3 -m py_compile factory/public_production_materializer.py
          python3 -m py_compile factory/batch_worker.py
          python3 -m py_compile scripts/build_showroom.py
      - name: Run multi-layer production dispatcher
        run: python3 factory/multi_layer_production.py

      - name: Build public module production inventory
        run: python3 factory/public_module_inventory.py

      - name: Materialize concrete production results
        run: python3 factory/public_production_materializer.py

      - name: Run existing product worker
        run: python3 factory/batch_worker.py --batch-size 1000

      - name: Publish visible production result in Actions
        shell: bash
        run: |
          set -euo pipefail
          test -f generated/multi-layer-production-status.json
          test -f generated/production-results.jsonl
          test -f generated/public-production-index.html
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=json.loads(Path("generated/multi-layer-production-status.json").read_text(encoding="utf-8"))
          print("## SHIRMANI Multi-Layer Production")
          print(f"- Modules discovered: **{p['discovered_modules']:,}**")
          print(f"- Tasks this cycle: **{p['last_cycle_tasks']:,}**")
          print(f"- Concrete production results: **{p.get('last_cycle_concrete_results', 0):,}**")
          print(f"- Total queued work units: **{p['total_queued_tasks']:,}**")
          print(f"- Lanes: **{len(p['lanes'])}**")
          print("")
          print("### Production outputs")
          import json as _json
          for k,v in p["production_outputs"].items():
              if isinstance(v, (int, float)):
                  rendered=f"{v:,}"
              else:
                  rendered=_json.dumps(v, ensure_ascii=False)
              print(f"- {k}: **{rendered}**")
          print("")
          print("Independent verification remains a downstream result-quality/promotion layer.")
          print("Quantum execution is not claimed unless a real quantum backend is configured.")
          PY

      - name: Upload production telemetry
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-multi-layer-production-telemetry
          path: |
            generated/multi-layer-production-status.json
            generated/MULTI-LAYER-PRODUCTION.md
            generated/multi-layer-production-state.json
            generated/production-work-queue.jsonl
            generated/production-results.jsonl
            generated/public-production-index.html
            generated/public-module-inventory.json
            generated/public-module-production-map.html
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload live platform
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy live production dashboard
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report live platform URL
        run: |
          echo "Live production dashboard: ${{ steps.deployment.outputs.page_url }}"

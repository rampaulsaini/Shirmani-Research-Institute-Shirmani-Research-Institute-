name: SHIRMANI Product-First Multi-Layer Automission
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-product-first-automission
  cancel-in-progress: false
jobs:
  product_orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build product-first catalog
        run: python3 factory/product_orchestrator.py
      - name: Build product-first production queue
        run: python3 factory/product_production_queue.py
      - name: Run product catalog integrity checks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("generated/PRODUCT-CATALOG.json").read_text())
          q=json.loads(Path("generated/PRODUCT-PRODUCTION-QUEUE.json").read_text())
          assert p["strategy"]=="PRODUCT_FIRST"
          assert p["product_count"]>=1
          assert q["total_jobs"]>=p["product_count"]
          assert q["ready_to_produce"]==q["total_jobs"]
          assert p["quantum_execution"]["mode"]=="quantum-inspired-deterministic"
          assert p["safety"]["financial_actions_require_owner_authorization"] is True
          for item in p["lines"]:
              assert item["verification_state"]=="UNVERIFIED"
          for job in q["jobs"]:
              assert job["verification_position"]=="DOWNSTREAM_OF_PRODUCTION"
              assert job["status"]=="READY_TO_PRODUCE"
          print("Product-first catalog + production queue: PASS")
          print("Product lines:",p["product_count"])
          print("Production jobs:",q["total_jobs"])
          print("Available units:",p["available_units"])
          print("Target units:",p["target_units"])
          print("Completion:",p["completion_pct"],"%")
          PY
      - name: Publish product-first generated state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add generated/PRODUCT-CATALOG.json generated/PRODUCT-PIPELINE.md generated/PRODUCT-PRODUCTION-QUEUE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(factory): refresh product-first production queue"
          BRANCH="automation/product-catalog"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git branch -f "$BRANCH" HEAD
          git push --force-with-lease origin "HEAD:$BRANCH"

name: SHIRMANI Public Production Automission
on:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shirmani-public-production-pages
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PRODUCT_TARGET: "5000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Self-heal production queue
        run: python3 factory/public_production_queue_self_heal.py

      - name: Build public module inventory
        run: python3 factory/public_module_inventory.py

      - name: Generate expanded concrete-product catalog
        run: python3 factory/real_product_factory.py

      - name: Materialize expanded concrete product assets
        run: python3 factory/materialize_all_product_assets.py

      - name: Validate concrete product production
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path("generated/1000-digital-products.json").read_text(encoding="utf-8"))
          status = json.loads(Path("generated/concrete-product-asset-status.json").read_text(encoding="utf-8"))
          target = int(os.environ["PRODUCT_TARGET"])
          produced = int(status.get("concrete_product_assets", status.get("product_assets", 0)))
          assert target >= 1016
          assert catalog["product_count"] == target, f"catalog {catalog['product_count']}/{target}"
          assert produced == target, f"concrete assets {produced}/{target}"
          print(f"CONCRETE_PRODUCT_PRODUCTION: {produced}/{target} (100%)")
          print(f"ENGINE_COUNT: {len(catalog['family_definitions'])}")
          print("PRODUCTION PRINCIPLE: product output first; verification remains downstream.")

      - name: Materialize public production status
        run: python3 factory/public_production_materializer.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated production site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy generated production site
        id: deployment
        uses: actions/deploy-pages@v4

name: SHIRMANI Public Production Automission
on:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
  # Full 5,000-product build is expensive; hourly refresh stays within the 2-hour runtime freshness gate.
  # Code changes still deploy immediately through the main-branch push trigger.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PRODUCT_TARGET: "5000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Overlay canonical production-state into public build
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            mkdir -p /tmp/shirmani-production-state
            git archive FETCH_HEAD generated products/concrete products/visuals products/continuous products/demos/continuous | tar -x -C /tmp/shirmani-production-state
            cp -a /tmp/shirmani-production-state/generated/. generated/
            mkdir -p products/concrete
            cp -a /tmp/shirmani-production-state/products/concrete/. products/concrete/
            if [ -d /tmp/shirmani-production-state/products/visuals ]; then
              mkdir -p products/visuals
              cp -a /tmp/shirmani-production-state/products/visuals/. products/visuals/
            fi
            if [ -d /tmp/shirmani-production-state/products/continuous ]; then
              mkdir -p products/continuous
              cp -a /tmp/shirmani-production-state/products/continuous/. products/continuous/
            fi
            if [ -d /tmp/shirmani-production-state/products/demos/continuous ]; then
              mkdir -p products/demos/continuous
              cp -a /tmp/shirmani-production-state/products/demos/continuous/. products/demos/continuous/
            fi
            echo "PUBLIC_BUILD_SOURCE=automation/production-state" >> "$GITHUB_ENV"
            echo "Canonical production-state overlay loaded for public build."
          else
            echo "PUBLIC_BUILD_SOURCE=main" >> "$GITHUB_ENV"
            echo "No canonical production-state branch found; using main."
          fi

      # The production-state overlay can contain an older aggregate status file.
      # Keep the independently prepared status from this exact main commit so the
      # public evidence page cannot silently regress to a stale snapshot.
      - name: Preserve main independent-verification status in public build
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/independent-verification-status.json
          git show "${GITHUB_SHA}:generated/independent-verification-status.json" > /tmp/independent-verification-status.json
          python3 -m json.tool /tmp/independent-verification-status.json >/dev/null
          install -m 0644 /tmp/independent-verification-status.json generated/independent-verification-status.json
          echo "Preserved main-commit independent-verification status after production-state overlay."

      - name: Self-heal production queue
        run: python3 factory/public_production_queue_self_heal.py

      - name: Build public module inventory
        run: python3 factory/public_module_inventory.py

      - name: Generate expanded concrete-product catalog
        run: python3 factory/real_product_factory.py

      - name: Materialize expanded concrete product assets
        run: python3 factory/materialize_all_product_assets.py

      - name: Build complete public 4K product visual layer
        env:
          VISUAL_BATCH: "5000"
        run: python3 factory/product_visual_identity_factory.py

      - name: Build complete public product QR layer
        run: |
          python3 -m pip install --disable-pip-version-check "qrcode>=8,<9"
          QR_BATCH=5000 python3 factory/product_qr_asset_factory.py

      - name: Publish concrete 5,000-product production manifest
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path("generated")
          catalog=json.loads((root/"1000-digital-products.json").read_text(encoding="utf-8"))
          passports={}
          for line in (root/"PRODUCT-PASSPORTS.jsonl").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  p=json.loads(line); passports[p["product_id"]]=p
          assets=[]
          for p in catalog["products"]:
              asset=Path(p.get("asset", ""))
              if not asset.is_file():
                  continue
              q=passports.get(p["id"],p)
              assets.append({
                  "id":p["id"],"production_state":"PRODUCED",
                  "sale_state":"READY_FOR_QC","artifact_url":p["asset"],
                  "offer_price_inr":p.get("offer_price_inr",0),"price_inr":p.get("price_inr",0),
                  "offer":p.get("offer",""),"qc_code":q.get("qc_code",p.get("qc_code","QC-PENDING")),
                  "gate_no":q.get("gate_no",p.get("gate_no","GATE-PENDING")),
                  "dispatch_no":q.get("dispatch_no",p.get("dispatch_no","NO")),
                  "status":"READY_FOR_QC"
              })
          ts=datetime.now(timezone.utc).isoformat()
          target=int(catalog["product_count"])
          produced=len(assets)
          overlay={"schema_version":1,"generated_at":ts,"production_first":True,
                   "source":"products/production + PRODUCT-PASSPORTS.jsonl",
                   "product_count":target,"produced_count":produced,
                   "remaining_count":max(0,target-produced),"products":assets}
          (root/"public-production-asset-overlay.json").write_text(json.dumps(overlay,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          live={"schema_version":2,"generated_at":ts,"production_first":True,
                "catalog_identities":target,"public_production_assets":produced,
                "concrete_repository_assets":produced,"current_catalog_pending":max(0,target-produced),
                "five_thousand_scale_target":5000,"remaining_to_scale_target":max(0,5000-produced),
                "concrete_materialization_percent_of_catalog":round(100*produced/target,2) if target else 0,
                "concrete_materialization_percent_of_scale_target":round(100*produced/5000,2),
                "module_products_generated":produced,"dispatch_released":0,"sales_claimed":0,
                "payment_claimed":0,"independent_verification_claimed":0,
                "state":"PRODUCTION_COMPLETE_CURRENT_CATALOG" if produced==target else "PRODUCTION_IN_PROGRESS",
                "qc_state":"READY_FOR_QC","truth_boundary":"Produced assets are not automatically QC-passed or independently verified."}
          (root/"live-production-state.json").write_text(json.dumps(live,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(f"PUBLIC PRODUCTION ASSETS: {produced}/{target} ({(100*produced/target if target else 0):.2f}%)")
          PY

      - name: Refresh deterministic QC from the current catalog and concrete assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          gen = Path("generated")
          source = gen / "public-production-asset-overlay.json"
          payload = json.loads(source.read_text(encoding="utf-8"))
          rows = payload.get("products")
          if not isinstance(rows, list):
              raise SystemExit("QC refresh blocked: production overlay products must be a list")
          # Use only assets materialized by this same run; never reuse a stale QC result.
          concrete = {
              "schema_version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "production_first": True,
              "product_count": int(payload.get("product_count", 0)),
              "produced_count": int(payload.get("produced_count", 0)),
              "products": rows,
              "source": "generated/public-production-asset-overlay.json",
          }
          if concrete["product_count"] <= 0 or concrete["produced_count"] != len(rows):
              raise SystemExit("QC refresh blocked: overlay counts are inconsistent")
          if any(row.get("production_state") != "PRODUCED" for row in rows):
              raise SystemExit("QC refresh blocked: overlay contains non-produced rows")
          (gen / "concrete-production-overlay.json").write_text(
              json.dumps(concrete, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 factory/product_qc_gate.py

      - name: Aggregate public customer reviews into production quality signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          raw=subprocess.check_output([
              "gh","api","--paginate",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/issues?state=all&per_page=100"
          ], text=True)
          issues=[]
          for chunk in raw.splitlines():
              if not chunk.strip():
                  continue
              try:
                  data=json.loads(chunk)
                  issues.extend(data if isinstance(data,list) else [data])
              except Exception:
                  pass
          records=[]
          for issue in issues:
              if "pull_request" in issue:
                  continue
              labels={x.get("name","") for x in issue.get("labels",[])}
              title=issue.get("title","") or ""
              if "customer-review" not in labels and "[CUSTOMER REVIEW]" not in title:
                  continue
              body=issue.get("body","") or ""
              def field(name):
                  m=re.search(r"###\s+"+re.escape(name)+r"\s*\n+([^#]+)",body,re.I)
                  return m.group(1).strip() if m else ""
              records.append({
                  "issue_number":issue.get("number"),
                  "updated_at":issue.get("updated_at"),
                  "product":field("Product ID or product name"),
                  "rating":field("Rating"),
                  "experience":field("Customer experience"),
                  "improvement":field("Improvement suggestion"),
                  "version":field("Product version"),
                  "source":"github-public-review"
              })
          root=Path("generated"); root.mkdir(exist_ok=True)
          (root/"customer-review-ledger.json").write_text(json.dumps(records,ensure_ascii=False,indent=2)+"\n")
          ratings=[int(x["rating"]) for x in records if str(x.get("rating","")).isdigit() and 1<=int(x["rating"])<=5]
          dashboard={
              "generated_at":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "review_count":len(records),
              "average_rating":round(sum(ratings)/len(ratings),2) if ratings else None,
              "products_with_feedback":len({x.get("product") for x in records if x.get("product")}),
              "improvement_actions":sum(1 for x in records if x.get("improvement")),
              "principle":"Customer reviews are production-quality signals, not independent scientific verification.",
              "production_input":True
          }
          (root/"customer-quality-dashboard.json").write_text(json.dumps(dashboard,ensure_ascii=False,indent=2)+"\n")
          queue=[]
          for rec in records:
              if rec.get("improvement") or rec.get("rating"):
                  queue.append({
                      "issue_number":rec.get("issue_number"),
                      "product":rec.get("product"),
                      "rating":rec.get("rating"),
                      "improvement":rec.get("improvement"),
                      "version":rec.get("version"),
                      "source":"github-public-review",
                      "action":"production-quality-improvement"
                  })
          (root/"public-review-quality-queue.json").write_text(json.dumps({
              "generated_at":dashboard["generated_at"],
              "queue_count":len(queue),
              "items":queue,
              "principle":"Customer reviews and ratings drive product-quality improvement; they are not independent scientific verification."
          },ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(dashboard,ensure_ascii=False))
          PY

      - name: Validate concrete product production
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path("generated/1000-digital-products.json").read_text(encoding="utf-8"))
          status = json.loads(Path("generated/concrete-product-asset-status.json").read_text(encoding="utf-8"))
          target = int(os.environ["PRODUCT_TARGET"])
          produced = int(status.get("concrete_product_assets", status.get("product_assets", 0)))
          assert target >= 1016
          assert catalog["product_count"] == target, f"catalog {catalog['product_count']}/{target}"
          assert 0 <= produced <= target, f"concrete assets {produced}/{target}"
          print(f"CONCRETE_PRODUCT_PRODUCTION: {produced}/{target} ({round(100*produced/target,2)}%)")
          print(f"ENGINE_COUNT: {len(catalog['family_definitions'])}")
          print("PRODUCTION PRINCIPLE: product output first; verification remains downstream.")

      - name: Test concrete production status contract
        run: |
          python3 -m unittest discover -s tests -p 'public_production_status_test.py'
          python3 -m unittest discover -s tests -p 'public_pages_route_diagnostics_test.py'
          python3 -m unittest discover -s tests -p 'public_pages_cadence_test.py'

      - name: Materialize public production status
        run: python3 factory/public_production_materializer.py

      - name: Reconcile deterministic QC into the live public state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from factory.qc_state_contract import sync_public_qc_state

          # QC may promote QC state only; dispatch, sales, payment and
          # independent verification remain unchanged and fail-closed.
          sync_public_qc_state(Path('.'), int(__import__('os').environ.get('PRODUCT_TARGET', '5000')))
          PY

      - name: Validate public production truth and asset completeness
        run: python3 factory/public_production_truth_smoke_gate.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Record expected public-state fingerprint before upload
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path("generated/live-production-state.json")
          raw = path.read_bytes()
          payload = json.loads(raw.decode("utf-8"))
          fingerprint = hashlib.sha256(raw).hexdigest()
          generated_at = payload.get("generated_at", "")
          print(f"BUILD_LIVE_STATE generated_at={generated_at} sha256={fingerprint} bytes={len(raw)}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"EXPECTED_LIVE_STATE_SHA256={fingerprint}\n")
              env.write(f"EXPECTED_LIVE_STATE_GENERATED_AT={generated_at}\n")
          PY

      - name: Upload generated production site
        uses: actions/upload-pages-artifact@v4
        with:
          name: shirmani-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy generated production site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: shirmani-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify deployed public routes and production JSON
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PRODUCT_TARGET: ${{ env.PRODUCT_TARGET }}
          EXPECTED_LIVE_STATE_SHA256: ${{ env.EXPECTED_LIVE_STATE_SHA256 }}
          EXPECTED_LIVE_STATE_GENERATED_AT: ${{ env.EXPECTED_LIVE_STATE_GENERATED_AT }}
        run: python3 factory/public_pages_runtime_smoke.py

name: SHIRMANI Public Production Automission
on:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-production-automission
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Self-heal production queue
        run: python3 factory/public_production_queue_self_heal.py
      - name: Materialize public production status
        run: python3 factory/public_production_materializer.py
      - name: Publish generated status
        run: |
          git config user.name "shirmani-automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-work-queue.jsonl generated/production-results.jsonl generated/public-production-index.html generated/public-production-by-module.html generated/public-production-module-index.json generated/public-production-catalog.json generated/multi-layer-production-status.json generated/public-production/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(automission): materialize public production status"
          git push

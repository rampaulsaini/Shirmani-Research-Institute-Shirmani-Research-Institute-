name: SHIRMANI Public Production Automission
on:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shirmani-public-production-pages
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Self-heal production queue
        run: python3 factory/public_production_queue_self_heal.py

      - name: Build public module inventory
        run: python3 factory/public_module_inventory.py

      - name: Materialize public production status
        run: python3 factory/public_production_materializer.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated production site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy generated production site
        id: deployment
        uses: actions/deploy-pages@v4

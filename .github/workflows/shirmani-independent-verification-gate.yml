name: SHIRMANI Independent Verification Record Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SHIRMANI Supreme Evidence Automission"
      - "SHIRMANI Supreme Evidence Convergence"
      - "SHIRMANI Supreme NLP Evaluation Gate"
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    name: Independent Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify research records
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          target = 100200
          queue_path = Path("generated/VERIFICATION-QUEUE.json")
          packet_paths = sorted(Path("generated").glob("verification-review-packet-*.json"))

          queue_records = target
          if queue_path.exists():
              try:
                  queue = json.loads(queue_path.read_text(encoding="utf-8"))
                  queue_records = int(queue.get("records", target))
              except Exception:
                  pass

          items = []
          packet_errors = []

          for path in packet_paths:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  packet_items = data.get("items", [])
                  if not isinstance(packet_items, list):
                      packet_errors.append(f"{path}: items is not a list")
                      continue
                  for item in packet_items:
                      if isinstance(item, dict):
                          items.append(item)
              except Exception as exc:
                  packet_errors.append(f"{path}: {exc}")

          seen = set()
          unique_items = []
          for item in items:
              task_id = item.get("task_id") or item.get("claim_id")
              if not task_id or task_id in seen:
                  continue
              seen.add(task_id)
              unique_items.append(item)

          def human_review_complete(item):
              review = item.get("review_template")
              if not isinstance(review, dict):
                  return False
              evidence = review.get("evidence_references")
              countercase = review.get("countercase_review")
              reproduction = review.get("reproduction_or_test")
              return (
                  item.get("current_verification_status") == "VERIFIED"
                  and review.get("exact_claim")
                  and isinstance(evidence, list) and len(evidence) > 0
                  and isinstance(countercase, dict)
                  and countercase.get("status") not in (None, "NOT_REVIEWED")
                  and isinstance(reproduction, dict)
                  and reproduction.get("status") not in (None, "NOT_RUN")
                  and review.get("reviewer")
                  and review.get("reviewed_at")
                  and review.get("reviewer_conclusion")
              )

          verified = [x for x in unique_items if human_review_complete(x)]
          rejected = [x for x in unique_items if x.get("current_verification_status") == "REJECTED"]
          reviewed = [
              x for x in unique_items
              if isinstance(x.get("review_template"), dict)
              and x["review_template"].get("reviewer")
              and x["review_template"].get("reviewed_at")
          ]

          packet_items = len(unique_items)
          review_records = packet_items - len(verified) - len(rejected)
          missing_from_packets = max(queue_records - packet_items, 0)

          target_progress = round((len(verified) / target) * 100, 4) if target else 0.0
          packet_coverage = round((packet_items / queue_records) * 100, 4) if queue_records else 0.0
          review_completion = round((len(reviewed) / packet_items) * 100, 4) if packet_items else 0.0

          out = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "queue_records": queue_records,
              "packet_records": packet_items,
              "verified_records": len(verified),
              "reviewed_records": len(reviewed),
              "review_records": review_records,
              "rejected_records": len(rejected),
              "missing_from_packets": missing_from_packets,
              "target_verified_records": target,
              "target_progress_percentage": target_progress,
              "packet_coverage_percentage": packet_coverage,
              "review_completion_percentage": review_completion,
              "remaining_to_target": max(target - len(verified), 0),
              "independent_verification_gate_open": len(verified) > 0,
              "packet_integrity_errors": packet_errors,
              "definition": (
                  "A workflow run or prepared packet is not a VERIFIED record. "
                  "Promotion requires a completed independent review record; "
                  "the factory does not invent reviewer, evidence, reproduction, or verification fields."
              )
          }

          progress = {
              "generated_at": out["generated_at"],
              "queue_records": queue_records,
              "packet_records": packet_items,
              "verified_records": len(verified),
              "reviewed_records": len(reviewed),
              "rejected_records": len(rejected),
              "target_verified_records": target,
              "target_progress_percentage": target_progress,
              "packet_coverage_percentage": packet_coverage,
              "review_completion_percentage": review_completion,
              "remaining_to_target": max(target - len(verified), 0),
              "map": {
                  "preparation": "COMPLETE",
                  "evidence_traceability": "COMPLETE",
                  "verification_queue": "READY",
                  "independent_verification": "IN_PROGRESS",
                  "verified_output": "ESTABLISHED" if len(verified) else "NOT_YET_ESTABLISHED"
              }
          }

          Path("verification-status.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          Path("verification-progress-map.json").write_text(
              json.dumps(progress, indent=2, ensure_ascii=False), encoding="utf-8"
          )

          print(json.dumps(out, indent=2, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("# SHIRMANI Independent Verification\n\n")
              s.write(f"- Queue records: **{queue_records}**\n")
              s.write(f"- Packet records: **{packet_items}**\n")
              s.write(f"- Independently reviewed: **{len(reviewed)}**\n")
              s.write(f"- VERIFIED records: **{len(verified)}**\n")
              s.write(f"- REJECTED: **{len(rejected)}**\n")
              s.write(f"- Target: **{target}** VERIFIED\n")
              s.write(f"- Target progress: **{target_progress}%**\n")
              s.write(f"- Packet coverage: **{packet_coverage}%**\n")
              s.write(f"- Remaining to target: **{max(target-len(verified),0)}**\n")

      - name: Publish verification status
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-independent-verification-status
          path: |
            verification-status.json
            verification-progress-map.json

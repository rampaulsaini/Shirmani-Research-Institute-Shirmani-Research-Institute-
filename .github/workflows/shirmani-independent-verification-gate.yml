name: SHIRMANI Independent Verification Record Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SHIRMANI Supreme Evidence Automission"
      - "SHIRMANI Supreme Evidence Convergence"
      - "SHIRMANI Supreme NLP Evaluation Gate"
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    name: Independent Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify research records
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          from datetime import datetime, timezone

          roots = [Path("generated"), Path("evidence"), Path("research"), Path("source"), Path("docs"), Path("schemas")]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(sorted(root.rglob("*.json")))
                  files.extend(sorted(root.rglob("*.jsonl")))

          records = []
          seen = set()

          def emit(obj, source):
              if not isinstance(obj, dict):
                  return
              rid = obj.get("record_id") or obj.get("id") or obj.get("verification_id")
              if not rid or rid in seen:
                  return
              seen.add(rid)
              records.append((str(rid), obj, str(source)))

          for path in files:
              try:
                  if path.suffix == ".jsonl":
                      for line in path.read_text(encoding="utf-8").splitlines():
                          if line.strip():
                              try:
                                  emit(json.loads(line), path)
                              except Exception:
                                  pass
                  else:
                      data = json.loads(path.read_text(encoding="utf-8"))
                      if isinstance(data, list):
                          for item in data:
                              emit(item, path)
                      else:
                          emit(data, path)
              except Exception:
                  continue

          verified, review, rejected = [], [], []
          review_reasons = {}

          for rid, obj, source in records:
              iv = obj.get("independent_verification")
              evidence = obj.get("evidence") or obj.get("evidence_ref") or obj.get("evidence_refs")
              provenance = obj.get("provenance") or obj.get("source") or obj.get("source_ref")
              status = iv.get("status") if isinstance(iv, dict) else None
              timestamp = iv.get("timestamp") if isinstance(iv, dict) else None
              run_ref = iv.get("run_id") if isinstance(iv, dict) else None
              fingerprint = iv.get("sha256") if isinstance(iv, dict) else None

              payload = {k:v for k,v in obj.items() if k != "independent_verification"}
              canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
              expected = hashlib.sha256(canonical.encode("utf-8")).hexdigest()

              if status == "REJECTED":
                  rejected.append(rid)
              elif status == "VERIFIED" and evidence and provenance and (timestamp or run_ref) and fingerprint == expected:
                  verified.append(rid)
              else:
                  review.append(rid)
                  reasons = []
                  if status != "VERIFIED": reasons.append("status_not_verified")
                  if not evidence: reasons.append("missing_evidence")
                  if not provenance: reasons.append("missing_provenance")
                  if not (timestamp or run_ref): reasons.append("missing_verification_timestamp_or_run")
                  if fingerprint != expected: reasons.append("fingerprint_missing_or_mismatch")
                  for reason in reasons:
                      review_reasons[reason] = review_reasons.get(reason, 0) + 1

          total, v = len(records), len(verified)
          target = 100200
          pct = round((v / total) * 100, 2) if total else 0.0
          target_pct = round((v / target) * 100, 4)

          gate_open = v > 0
          out = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "total_candidate_records": total,
              "verified_records": v,
              "review_records": len(review),
              "rejected_records": len(rejected),
              "verified_percentage_of_records": pct,
              "target_verified_records": target,
              "target_progress_percentage": target_pct,
              "remaining_to_target": max(target - v, 0),
              "independent_verification_gate_open": gate_open,
              "review_reason_counts": review_reasons,
              "definition": "A workflow run is not a VERIFIED record; all verification gates must pass."
          }

          progress = {
              "generated_at": out["generated_at"],
              "candidate_records": total,
              "verified_records": v,
              "review_records": len(review),
              "rejected_records": len(rejected),
              "target_verified_records": target,
              "target_progress_percentage": target_pct,
              "remaining_to_target": max(target-v, 0),
              "verification_rate_of_candidates": pct,
              "review_reason_counts": review_reasons,
              "map": {
                  "preparation": "COMPLETE",
                  "evidence_traceability": "COMPLETE",
                  "independent_verification": "IN_PROGRESS",
                  "verified_output": "NOT_YET_ESTABLISHED"
              }
          }

          Path("verification-status.json").write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          Path("verification-progress-map.json").write_text(json.dumps(progress, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(out, indent=2, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("# SHIRMANI Independent Verification\n\n")
              s.write(f"- Candidate records: **{total}**\n")
              s.write(f"- VERIFIED records: **{v}**\n")
              s.write(f"- REVIEW: **{len(review)}**\n")
              s.write(f"- REJECTED: **{len(rejected)}**\n")
              s.write(f"- Target: **{target}** VERIFIED\n")
              s.write(f"- Target progress: **{target_pct}%**\n")
              s.write(f"- Remaining: **{max(target-v,0)}**\n")

      - name: Publish verification status
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-independent-verification-status
          path: |
            verification-status.json
            verification-progress-map.json

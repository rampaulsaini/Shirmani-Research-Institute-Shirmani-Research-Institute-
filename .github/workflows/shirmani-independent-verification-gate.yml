name: SHIRMANI Independent Verification Runtime Gate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SHIRMANI Supreme Evidence Automission"
      - "SHIRMANI Supreme Evidence Convergence"
      - "SHIRMANI Supreme NLP Evaluation Gate"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: shirmani-independent-verification-runtime-gate
  cancel-in-progress: true

jobs:
  verify:
    name: Independent Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run fail-closed regression test
        run: python3 tests/test_independent_verification_gate.py
      - name: Build deterministic verification status
        run: python3 factory/independent_verification_gate.py
      - name: Publish verification telemetry
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-independent-verification-${{ github.run_id }}
          path: generated/independent-verification-status.json
          if-no-files-found: error
          retention-days: 14

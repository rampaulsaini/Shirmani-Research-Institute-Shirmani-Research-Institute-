name: SHIRMANI Independent Verification Record Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SHIRMANI Supreme Evidence Automission"
      - "SHIRMANI Supreme Evidence Convergence"
      - "SHIRMANI Supreme NLP Evaluation Gate"
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    name: Independent Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify authoritative registry state
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path("generated")
          queue_path = root / "VERIFICATION-QUEUE.json"
          registry_path = root / "VERIFICATION-REGISTRY.json"
          promotion_path = root / "VERIFICATION-PROMOTION-QC.json"

          for path in (queue_path, registry_path, promotion_path):
              if not path.exists():
                  raise SystemExit(f"VERIFICATION_SCAN_FAIL: missing {path}")

          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          promotion = json.loads(promotion_path.read_text(encoding="utf-8"))

          queue_total = int(queue["records"])
          target = 50
          queued = int(queue["queued"])
          reviewed = int(registry["reviewed"])
          verified = int(registry["verified"])
          promotion_verified = int(promotion["verified_records"])

          if queue_total != 100200:
              raise SystemExit(f"VERIFICATION_SCAN_FAIL: queue_total={queue_total}, expected=100200")
          if not (0 <= verified <= reviewed <= queued <= queue_total):
              raise SystemExit("VERIFICATION_SCAN_FAIL: registry counters violate monotonic invariants")
          if promotion_verified != verified:
              raise SystemExit("VERIFICATION_SCAN_FAIL: promotion/registry verified counts differ")
          if not (0 <= int(promotion["queue_records"]) <= queue_total):
              raise SystemExit("VERIFICATION_SCAN_FAIL: promotion queue count is outside upstream queue")

          remaining = max(target - verified, 0)
          verified_pct = round(verified / target * 100, 4) if target else 0.0
          reviewed_queue_pct = round(reviewed / queue_total * 100, 4) if queue_total else 0.0
          queued_pct = round(queued / queue_total * 100, 4) if queue_total else 0.0
          reviewed_target_pct = round(min(reviewed, target) / target * 100, 4) if target else 0.0

          out = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "authoritative_source": str(registry_path),
              "target_verified_records": target,
              "upstream_queue_records": queue_total,
              "queued_records": queued,
              "reviewed_records": reviewed,
              "verified_records": verified,
              "remaining_to_target": remaining,
              "upstream_queue_remaining": max(queue_total - verified, 0),
              "queued_percentage_of_queue": queued_pct,
              "reviewed_percentage_of_queue": reviewed_queue_pct,
              "reviewed_percentage_of_verification_milestone": reviewed_target_pct,
              "target_progress_percentage": verified_pct,
              "independent_verification_gate_open": verified > 0,
              "promotion_gate": promotion.get("promotion_gate", promotion.get("publication_gate")),
              "publication_gate": queue.get("publication_gate"),
              "definition": "Workflow activity is not independent verification; VERIFIED requires an independent review record and passing promotion controls."
          }

          progress = {
              "generated_at": out["generated_at"],
              "target": target,
              "queued": queued,
              "reviewed": reviewed,
              "verified": verified,
              "remaining": remaining,
              "percent": {
                  "queued": queued_pct,
                  "reviewed": reviewed_pct,
                  "verified": verified_pct,
                  "remaining": round(remaining / target * 100, 4) if target else 0.0
              },
              "map": {
                  "preparation": "COMPLETE",
                  "evidence_traceability": "COMPLETE",
                  "independent_verification": "IN_PROGRESS",
                  "verified_output": "ESTABLISHED" if verified else "NOT_YET_ESTABLISHED"
              }
          }

          Path("verification-status.json").write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          Path("verification-progress-map.json").write_text(json.dumps(progress, indent=2, ensure_ascii=False), encoding="utf-8")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("# SHIRMANI Independent Verification\n\n")
              s.write(f"- Independent verification milestone: **{target:,}**\n")
              s.write(f"- Upstream queue: **{queue_total:,}**\n")
              s.write(f"- Queue: **{queued:,} ({queued_pct}%)**\n")
              s.write(f"- Reviewed: **{reviewed:,} ({reviewed_queue_pct}% of upstream queue; {reviewed_target_pct}% of 50 milestone)\n")
              s.write(f"- Independently VERIFIED: **{verified:,} ({verified_pct}%)**\n")
              s.write(f"- Remaining: **{remaining:,} ({round(remaining / target * 100, 4)}%)**\n")
              s.write(f"- Promotion gate: **{out['promotion_gate']}**\n")
              s.write("- Workflow success is not counted as VERIFIED.\n")

          print(json.dumps(out, indent=2, ensure_ascii=False))

      - name: Publish verification status
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-independent-verification-status
          path: |
            verification-status.json
            verification-progress-map.json

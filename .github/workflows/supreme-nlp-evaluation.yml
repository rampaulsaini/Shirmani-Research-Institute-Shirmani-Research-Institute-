name: SHIRMANI Supreme NLP Evaluation Gate

on:
  push:
    branches: [main, "automission/**"]
    paths:
      - "factory/supreme_nlp_evaluation.py"
      - "factory/fixtures/supreme_nlp_cases.json"
      - "docs/supreme-nlp-evaluation-and-signal-interpretation.md"
      - "docs/supreme-nlp-practitioner-contract.md"
      - "schemas/agent-governance.json"
      - ".github/workflows/supreme-nlp-evaluation.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */5 * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-evaluation
  cancel-in-progress: true

jobs:
  evaluation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate evaluation fixtures
        run: python3 factory/supreme_nlp_evaluation.py
      - name: Validate contract
        run: python3 factory/supreme_nlp_contract_qc.py

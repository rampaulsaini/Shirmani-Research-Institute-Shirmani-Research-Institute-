name: Deep Learning Lab
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 3'
  push:
    paths:
      - 'agents/deep_learning_agent.py'
      - 'factory/deep_learning.json'
      - '.github/workflows/deep-learning-lab.yml'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run local baseline experiment
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agents.deep_learning_agent import run_local, save
          p=Path("generated/source-units.jsonl")
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()] if p.exists() else []
          save(run_local(rows), "generated/deep-learning-status.json")
          PY
      - name: Commit experiment metadata
        run: |
          git config user.name 'omniverse-factory[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/deep-learning-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(deep-learning): update baseline experiment metadata'
          git push

name: SHIRMANI Supreme NLP Runtime

on:
  push:
    branches: [main]
    paths:
      - "factory/supreme_nlp_practitioner.py"
      - "factory/test_supreme_nlp_practitioner.py"
      - "docs/supreme-nlp-practitioner-runtime.md"
      - ".github/workflows/supreme-nlp-runtime.yml"
  pull_request:
    paths:
      - "factory/supreme_nlp_practitioner.py"
      - "factory/test_supreme_nlp_practitioner.py"
      - "docs/supreme-nlp-practitioner-runtime.md"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-runtime
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m py_compile factory/supreme_nlp_practitioner.py factory/test_supreme_nlp_practitioner.py
      - name: Deterministic runtime tests
        run: python3 -m unittest discover -s factory -p 'test_supreme_nlp_practitioner.py' -v
      - name: Contract smoke check
        run: python3 factory/supreme_nlp_contract_qc.py
      - name: Evaluation gate smoke check
        run: python3 factory/supreme_nlp_evaluation_qc.py

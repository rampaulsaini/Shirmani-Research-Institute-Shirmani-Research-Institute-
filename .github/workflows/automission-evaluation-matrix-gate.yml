name: AI ML NLP Automission Deterministic Evaluation Matrix Gate
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate evaluation matrix
        run: python scripts/validate_automission_evaluation_matrix.py

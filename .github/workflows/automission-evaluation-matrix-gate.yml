name: AI ML NLP Automission Deterministic Evaluation Matrix Gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automission-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate evaluation matrix contract
        run: python scripts/validate_automission_evaluation_matrix.py

      - name: Run deterministic benchmark
        run: python scripts/run_automission_benchmark.py

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: automission-benchmark-report
          path: automission-benchmark-report.json
          if-no-files-found: error

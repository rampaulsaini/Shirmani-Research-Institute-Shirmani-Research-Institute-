name: SHIRMANI Verification Progress Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "generated/VERIFICATION-QUEUE.json"
      - "generated/VERIFICATION-REGISTRY.json"
      - "generated/VERIFICATION-PROMOTION-QC.json"
      - "factory/verification_progress_dashboard.py"
      - ".github/workflows/verification-progress-dashboard.yml"
permissions:
  contents: read
concurrency:
  group: shirmani-verification-progress-dashboard
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Schema-aligned dashboard generation; VERIFIED remains fail-closed.
      - name: Generate fail-closed dashboard
        run: python factory/verification_progress_dashboard.py
      - name: Validate dashboard invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open("generated/verification-progress-dashboard.json",encoding="utf-8"))
          records=d["records"]
          percent=d["percent"]
          assert records["target"] == 100200
          assert 0 <= percent["independently_verified_of_target"] <= 100
          assert 0 <= percent["remaining_of_target"] <= 100
          assert records["verified"] + records["remaining_to_verified_target"] == records["target"]
          assert d["automation_state"]["independent_verification_required"] is True
          assert d["automation_state"]["automission_may_declare_verified"] is False
          print("VERIFICATION_DASHBOARD_GATE: PASS")
          PY
      - name: Publish dashboard
        uses: actions/upload-artifact@v4
        with:
          name: verification-progress-dashboard-${{ github.run_id }}
          path: generated/verification-progress-dashboard.json
          retention-days: 14
      - name: Emit summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("generated/verification-progress-dashboard.json",encoding="utf-8"))
          r=d["records"]
          p=d["percent"]
          print("## SHIRMANI Verification Progress")
          print(f"- Target: {r['target']}")
          print(f"- Queued: {r['queued']} ({p['queued_of_target']}%)")
          print(f"- Reviewed: {r['reviewed']} ({p['reviewed_of_target']}%)")
          print(f"- Independently VERIFIED: {r['verified']} ({p['independently_verified_of_target']}%)")
          print(f"- Remaining: {r['remaining_to_verified_target']} ({p['remaining_of_target']}%)")
          print("- Fail-closed: automation cannot declare VERIFIED")
          print(f"- Next gate: {d['next_gate']}")
          PY

name: SHIRMANI Supreme Product Production Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-supreme-product-production
  cancel-in-progress: false

jobs:
  produce-one-concrete-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce one concrete tool, passport and product visual
        run: python scripts/production_factory_cycle.py
      - name: Validate production outputs
        shell: python
        run: |
          import json
          from pathlib import Path

          repo_root = Path.cwd().resolve()
          overlay = json.loads(Path("generated/concrete-production-overlay.json").read_text(encoding="utf-8"))
          state = json.loads(Path("generated/live-production-state.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("products/visuals/manifest.json").read_text(encoding="utf-8"))

          passport_path = Path("generated/PRODUCT-PASSPORTS.jsonl")
          rows = [
              json.loads(line)
              for line in passport_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          ids = [row.get("id") for row in rows]
          assert rows, "passport JSONL must contain at least one record"
          assert all(isinstance(pid, str) and pid.strip() for pid in ids), "passport IDs must be non-empty strings"
          assert len(ids) == len(set(ids)), "duplicate passport IDs"

          products = overlay.get("products")
          assert isinstance(products, list) and products, "production overlay must contain products"
          assert overlay.get("produced_count") == len(products), "overlay count mismatch"

          # Legacy product rows may use module/asset rather than artifact_url.
          # A completed 5,000-item no-op cycle must not fail just because the
          # final row uses an older schema. Resolve candidates safely and prove
          # that at least one real repository-local artifact exists.
          valid_artifacts = []
          rejected_candidates = 0
          for product in products:
              product_id = product.get("id")
              candidates = (
                  product.get("artifact_url"),
                  product.get("module"),
                  product.get("asset"),
                  f"products/concrete/{product_id}.html" if isinstance(product_id, str) and product_id.strip() else None,
              )
              found = False
              for candidate in candidates:
                  if not isinstance(candidate, str) or not candidate.strip():
                      continue
                  if candidate.startswith(("http://", "https://")) or "\\\\" in candidate:
                      rejected_candidates += 1
                      continue
                  path = Path(candidate)
                  if path.is_absolute() or ".." in path.parts:
                      rejected_candidates += 1
                      continue
                  resolved = path.resolve()
                  if not resolved.is_relative_to(repo_root) or not resolved.is_file():
                      rejected_candidates += 1
                      continue
                  valid_artifacts.append(candidate)
                  found = True
                  break

          assert valid_artifacts, "no overlay product points to an existing repository-local artifact"
          print(f"PASS: {len(valid_artifacts)} product rows resolve to repository-local artifacts.")
          print(f"INFO: {rejected_candidates} unsafe, external, or missing candidates were rejected.")
          print(f"INFO: overlay produced_count={overlay.get('produced_count')}; passport_rows={len(rows)}.")
          print(f"INFO: production state={state.get('state')}; QC state={state.get('qc_state')}.")
          print("PASS: JSON documents valid; JSONL parsed line-by-line; passport IDs unique; overlay counts aligned.")
      - name: Open/update production artifact PR (repository requires PR-based writes)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automission/product-production
          delete-branch: false
          title: "Automission production: next concrete SHIRMANI product"
          commit-message: "Produce next SHIRMANI concrete digital product"
          body: |
            Scheduled production cycle generates concrete browser-usable product artifacts, passport entries, and visuals.

            State boundary: QC, dispatch, sales, payment, and independent verification remain distinct states. Review generated artifacts and checks before merging.
          labels: |
            automission
            production

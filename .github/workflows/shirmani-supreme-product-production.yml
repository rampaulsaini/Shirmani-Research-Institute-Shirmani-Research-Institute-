name: SHIRMANI Supreme Product Production Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-supreme-product-production
  cancel-in-progress: false

jobs:
  produce-one-concrete-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce one concrete tool, passport and product visual
        run: python scripts/production_factory_cycle.py
      - name: Validate production outputs
        shell: python
        run: |
          import json
          from pathlib import Path

          repo_root = Path.cwd().resolve()
          overlay = json.loads(Path("generated/concrete-production-overlay.json").read_text(encoding="utf-8"))
          json.loads(Path("generated/live-production-state.json").read_text(encoding="utf-8"))
          json.loads(Path("products/visuals/manifest.json").read_text(encoding="utf-8"))

          passport_path = Path("generated/PRODUCT-PASSPORTS.jsonl")
          rows = [
              json.loads(line)
              for line in passport_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          ids = [row.get("id") for row in rows]
          assert rows, "passport JSONL must contain at least one record"
          assert all(isinstance(pid, str) and pid.strip() for pid in ids), "passport IDs must be non-empty strings"
          assert len(ids) == len(set(ids)), "duplicate passport IDs"

          products = overlay.get("products")
          assert isinstance(products, list) and products, "production overlay must contain products"
          assert overlay.get("produced_count") == len(products), "overlay count mismatch"

          # Legacy catalogue rows may use artifact_url, module, or asset. Validate
          # real local files without assuming the last row has the newest schema.
          # A capped/no-op cycle must still prove that at least one concrete artifact
          # exists; reaching a numeric target alone is not evidence of a real file.
          valid_artifacts = []
          rejected_candidates = 0
          for product in products:
              product_id = product.get("id")
              candidates = (
                  product.get("artifact_url"),
                  product.get("module"),
                  product.get("asset"),
                  f"products/concrete/{product_id}.html" if isinstance(product_id, str) and product_id.strip() else None,
              )
              for value in candidates:
                  if not isinstance(value, str) or not value.strip():
                      continue
                  if value.startswith(("http://", "https://")) or "\\\\" in value:
                      rejected_candidates += 1
                      continue
                  path = Path(value)
                  if path.is_absolute() or ".." in path.parts:
                      rejected_candidates += 1
                      continue
                  resolved = path.resolve()
                  if not resolved.is_relative_to(repo_root) or not resolved.is_file():
                      rejected_candidates += 1
                      continue
                  valid_artifacts.append(value)
                  break

          assert valid_artifacts, "no overlay product points to an existing repository-local artifact"
          print(
              f"PASS: {len(valid_artifacts)} products resolve to existing repository-local artifacts; "
              f"{rejected_candidates} unsafe or missing candidates ignored."
          )
          print("PASS: JSON documents valid; JSONL parsed line-by-line; IDs unique; counts aligned.")

      - name: Open/update production artifact PR (repository requires PR-based writes)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automission/product-production
          delete-branch: false
          title: "Automission production: next concrete SHIRMANI product"
          commit-message: "Produce next SHIRMANI concrete digital product"
          body: |
            Scheduled production cycle generated one concrete browser-usable product artifact, its passport entry, and a unique 4K-ready SVG visual.

            State boundary: QC remains pending, dispatch is NO, and no sale, payment, or independent verification is claimed. Review generated artifacts and checks before merging.
          labels: |
            automission
            production

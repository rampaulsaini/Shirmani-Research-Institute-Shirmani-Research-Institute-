name: SHIRMANI Supreme Product Production Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-supreme-product-production
  cancel-in-progress: false

jobs:
  produce-one-concrete-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce one concrete tool, passport and product visual
        run: python scripts/production_factory_cycle.py
      - name: Validate production outputs
        shell: python
        run: |
          import json
          import re
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()

          def load_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          overlay = load_json("generated/concrete-production-overlay.json")
          load_json("generated/live-production-state.json")
          load_json("products/visuals/manifest.json")

          passport_path = Path("generated/PRODUCT-PASSPORTS.jsonl")
          rows = [
              json.loads(line)
              for line in passport_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          ids = [row.get("id") for row in rows]
          assert rows, "passport JSONL must contain at least one record"
          assert all(isinstance(pid, str) and pid.strip() for pid in ids), "passport IDs must be non-empty strings"
          assert len(ids) == len(set(ids)), "duplicate passport IDs"

          products = overlay.get("products")
          assert isinstance(products, list) and products, "production overlay must contain products"
          assert overlay.get("produced_count") == len(products), "overlay count mismatch"

          def safe_local_artifact(value):
              if not isinstance(value, str) or not value.strip():
                  return None
              value = value.strip()
              # Only repository-relative POSIX paths are accepted; reject URL, absolute,
              # traversal, Windows separators, and paths that resolve outside the checkout.
              if value.startswith(("http://", "https://", "//")) or "\\" in value:
                  raise AssertionError(f"unsafe artifact path: {value!r}")
              rel = PurePosixPath(value)
              if rel.is_absolute() or any(part in (".", "..") for part in rel.parts):
                  raise AssertionError(f"unsafe artifact path: {value!r}")
              candidate = (root / Path(*rel.parts)).resolve()
              if candidate != root and root not in candidate.parents:
                  raise AssertionError(f"artifact resolves outside repository: {value!r}")
              return candidate

          checked = 0
          existing = 0
          missing = []
          for product in products:
              if not isinstance(product, dict):
                  raise AssertionError("every overlay product must be an object")
              # Current schema plus legacy module/asset fields.
              values = [
                  product.get("artifact_url"),
                  product.get("module"),
                  product.get("asset"),
              ]
              candidates = [safe_local_artifact(value) for value in values if value]
              if not candidates:
                  pid = product.get("id")
                  match = re.fullmatch(r"SP-(\d{1,6})", str(pid or ""))
                  if match:
                      candidates = [safe_local_artifact(f"products/concrete/{pid}.html")]
              if not candidates:
                  continue
              checked += 1
              found = next((path for path in candidates if path.is_file()), None)
              if found:
                  existing += 1
              else:
                  missing.append(str(product.get("id", "unknown")))

          assert checked > 0, "no safe repository-local artifact paths found in overlay"
          assert existing > 0, "no referenced product artifact exists in the repository"
          # If the catalogue is still being built, the newest product must have a real
          # artifact. At target scale the cycle may be a legitimate no-op; validate the
          # existing corpus without regenerating duplicate products.
          produced_count = int(overlay.get("produced_count", 0))
          if produced_count < 5000:
              latest = products[-1]
              latest_values = [latest.get("artifact_url"), latest.get("module"), latest.get("asset")]
              latest_candidates = [safe_local_artifact(v) for v in latest_values if v]
              if not latest_candidates:
                  pid = latest.get("id")
                  match = re.fullmatch(r"SP-(\d{1,6})", str(pid or ""))
                  if match:
                      latest_candidates = [safe_local_artifact(f"products/concrete/{pid}.html")]
              assert latest_candidates and any(p.is_file() for p in latest_candidates), (
                  "latest product has no existing safe artifact"
              )

          print(
              f"PASS: JSON/JSONL valid; passport IDs unique; overlay count aligned; "
              f"{existing}/{checked} referenced artifact paths exist. "
              f"Missing legacy references: {len(missing)}. "
              f"Target count: {produced_count}/5000."
          )
      - name: Open/update production artifact PR (repository requires PR-based writes)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automission/product-production
          delete-branch: false
          title: "Automission production: next concrete SHIRMANI product"
          commit-message: "Produce next SHIRMANI concrete digital product"
          body: |
            Scheduled production cycle generates concrete browser-usable product artifacts, passport entries, and visuals.

            State boundary: QC, dispatch, sale, payment, and independent verification remain separate states. Review generated artifacts and checks before merging.
          labels: |
            automission
            production

name: SHIRMANI Supreme Product Production Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-supreme-product-production
  cancel-in-progress: false

jobs:
  produce-one-concrete-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce one concrete tool, passport and product visual
        run: python scripts/production_factory_cycle.py
      - name: Validate production outputs and path-guard regression cases
        shell: python
        run: |
          import json
          import tempfile
          from pathlib import Path
          from urllib.parse import urlparse

          def is_repository_file(candidate, repo_root):
              if not isinstance(candidate, str) or not candidate.strip():
                  return False
              candidate = candidate.strip()
              parsed = urlparse(candidate)
              if parsed.scheme or parsed.netloc or candidate.startswith("//") or chr(92) in candidate:
                  return False
              artifact = Path(candidate)
              if artifact.is_absolute() or ".." in artifact.parts:
                  return False
              root = Path(repo_root).resolve()
              resolved = (root / artifact).resolve()
              return resolved.is_relative_to(root) and resolved.is_file()

          def find_repository_artifact(product, repo_root):
              product_id = product.get("id")
              candidates = (
                  product.get("artifact_url"),
                  product.get("module"),
                  product.get("asset"),
                  f"products/concrete/{product_id}.html"
                  if isinstance(product_id, str) and product_id.strip()
                  else None,
              )
              return next((candidate.strip() for candidate in candidates
                           if isinstance(candidate, str) and candidate.strip()
                           and is_repository_file(candidate, repo_root)), None)

          # Regression tests use isolated temporary files and never touch production assets.
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp).resolve()
              (root / "products/concrete").mkdir(parents=True)
              (root / "ok.html").write_text("ok", encoding="utf-8")
              (root / "legacy-module.html").write_text("module", encoding="utf-8")
              (root / "legacy-asset.html").write_text("asset", encoding="utf-8")
              (root / "products/concrete/stable-id.html").write_text("stable", encoding="utf-8")
              outside = root.parent / (root.name + "-outside.html")
              outside.write_text("outside", encoding="utf-8")
              try:
                  (root / "escape.html").symlink_to(outside)
                  assert is_repository_file("escape.html", root) is False, "symlink escape must fail"
              finally:
                  outside.unlink(missing_ok=True)

              assert is_repository_file("ok.html", root), "repository-local file should pass"
              assert find_repository_artifact({"artifact_url": "ok.html"}, root) == "ok.html"
              assert find_repository_artifact({"module": "legacy-module.html"}, root) == "legacy-module.html"
              assert find_repository_artifact({"asset": "legacy-asset.html"}, root) == "legacy-asset.html"
              assert find_repository_artifact({"id": "stable-id"}, root) == "products/concrete/stable-id.html"
              for unsafe in ("https://example.com/file.html", "//example.com/file.html",
                             "/etc/passwd", "../outside.html", "missing.html", "products" + chr(92) + "bad.html"):
                  assert not is_repository_file(unsafe, root), f"unsafe/missing path must fail: {unsafe}"
              assert find_repository_artifact({"artifact_url": "../bad", "module": "legacy-module.html"}, root) == "legacy-module.html"
          print("PASS: artifact_url/module/asset/stable-ID fallback and unsafe-path regression tests")

          overlay = json.loads(Path("generated/concrete-production-overlay.json").read_text(encoding="utf-8"))
          json.loads(Path("generated/live-production-state.json").read_text(encoding="utf-8"))
          json.loads(Path("products/visuals/manifest.json").read_text(encoding="utf-8"))

          passport_path = Path("generated/PRODUCT-PASSPORTS.jsonl")
          rows = [
              json.loads(line)
              for line in passport_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          ids = [row.get("id") for row in rows]
          assert rows, "passport JSONL must contain at least one record"
          assert all(isinstance(pid, str) and pid.strip() for pid in ids), "passport IDs must be non-empty strings"
          assert len(ids) == len(set(ids)), "duplicate passport IDs"

          products = overlay.get("products")
          assert isinstance(products, list) and products, "production overlay must contain products"
          assert overlay.get("produced_count") == len(products), "overlay count mismatch"

          # Deliberate policy: at least one existing local artifact is required for a
          # no-op/legacy overlay. This is NOT proof that every row or all 5,000 assets pass QC.
          repo_root = Path.cwd().resolve()
          valid_artifacts = [
              artifact for product in products
              if (artifact := find_repository_artifact(product, repo_root)) is not None
          ]
          assert valid_artifacts, "no overlay product points to an existing repository-local artifact"
          print(
              f"PASS: {len(valid_artifacts)} overlay rows resolve to repository-local artifacts; "
              "JSON documents valid; JSONL parsed line-by-line; IDs unique; counts aligned."
          )
      - name: Open/update production artifact PR (repository requires PR-based writes)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automission/product-production
          delete-branch: false
          title: "Automission production: next concrete SHIRMANI product"
          commit-message: "Produce next SHIRMANI concrete digital product"
          body: |
            Scheduled production cycle generated one concrete browser-usable product artifact, its passport entry, and a unique 4K-ready SVG visual.

            State boundary: QC remains pending, dispatch is NO, and no sale, payment, or independent verification is claimed. Review generated artifacts and checks before merging.
          labels: |
            automission
            production

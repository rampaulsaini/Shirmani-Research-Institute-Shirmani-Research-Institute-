name: SHIRMANI Supreme NLP Quality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/supreme_nlp.py"
      - "agents/supreme_nlp_multimodal.py"
      - "agents/supreme_nlp_practitioner.py"
      - "agents/supreme_nlp_quality.py"
      - "schemas/supreme-nlp-*.json"
      - "tests/test_supreme_nlp_*.py"
      - ".github/workflows/supreme-nlp-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-quality-gate
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile quality layer
        run: python -m py_compile agents/supreme_nlp_quality.py

      - name: Validate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("schemas").glob("supreme-nlp-*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          print("SUPREME_NLP_SCHEMAS_OK")
          PY

      - name: Run NLP regression tests
        run: python -m unittest discover -s tests -p 'test_supreme_nlp*.py' -v

      - name: Generate and evaluate deterministic candidate
        run: |
          mkdir -p generated/supreme-nlp
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp import build_record
          from agents.supreme_nlp_quality import evaluate

          rows=[
            {"modality":"electrical","feature":"signal","value":1.0,"quality":1.0,"source":"synthetic-a"},
            {"modality":"audio","feature":"signal","value":1.01,"quality":1.0,"source":"synthetic-b"},
            {"modality":"thermal","feature":"signal","value":1.00,"quality":1.0,"source":"synthetic-c"},
            {"modality":"electrical","feature":"signal","value":1.02,"quality":1.0,"source":"synthetic-a"},
            {"modality":"audio","feature":"signal","value":1.00,"quality":1.0,"source":"synthetic-b"},
            {"modality":"thermal","feature":"signal","value":1.01,"quality":1.0,"source":"synthetic-c"},
            {"modality":"electrical","feature":"signal","value":1.00,"quality":1.0,"source":"synthetic-a"},
            {"modality":"audio","feature":"signal","value":1.01,"quality":1.0,"source":"synthetic-b"},
            {"modality":"thermal","feature":"signal","value":1.00,"quality":1.0,"source":"synthetic-c"},
            {"modality":"electrical","feature":"signal","value":1.01,"quality":1.0,"source":"synthetic-a"},
          ]
          record=build_record(rows,"quality-gate-cycle")
          report=evaluate(record)
          Path("generated/supreme-nlp/quality-gate.json").write_text(
            json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Enforce governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-nlp/quality-gate.json").read_text())
          g=d["governance"]
          assert g["fail_closed"] is True
          assert g["subjective_experience_claim_allowed"] is False
          assert g["scheduled_code_mutation_allowed"] is False
          assert g["independent_verification_required"] is True
          assert g["accuracy_is_measured_not_declared"] is True
          assert d["promotion_allowed"] is False
          assert len(d["fingerprint"]) == 64
          print("SUPREME_NLP_QUALITY_GOVERNANCE: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-quality-gate-${{ github.run_id }}
          path: generated/supreme-nlp/quality-gate.json
          retention-days: 14

      - name: Emit summary
        run: |
          {
            echo "## SHIRMANI Supreme NLP Quality Gate"
            echo "- Continuous cycle: 5 minutes"
            echo "- Calibration: supported when labelled evaluation data is supplied"
            echo "- Contradiction detection: enabled"
            echo "- Abstention/fail-closed promotion: enabled"
            echo "- Independent verification: required"
            echo "- Scheduled code mutation: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

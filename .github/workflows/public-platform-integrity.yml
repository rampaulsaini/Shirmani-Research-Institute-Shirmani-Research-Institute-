name: Public Platform Integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate core public surfaces
        shell: python
        run: |
          from pathlib import Path
          import sys
          required = ["index.html","public-identity.html","platform-charter.md","AGENT-GOVERNANCE.md"]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              print("Missing required public surfaces:", ", ".join(missing)); sys.exit(1)
          index = Path("index.html").read_text(encoding="utf-8")
          for target in ["public-identity.html","platform-charter.md","federation-dashboard.html","income-command-center.html","employment.html"]:
              if target not in index:
                  print("Core public link missing from index:", target); sys.exit(1)
          if "Independent substantive verification" not in Path("public-identity.html").read_text(encoding="utf-8"):
              print("Verification-status disclosure missing"); sys.exit(1)
          print("PUBLIC PLATFORM INTEGRITY: PASS")

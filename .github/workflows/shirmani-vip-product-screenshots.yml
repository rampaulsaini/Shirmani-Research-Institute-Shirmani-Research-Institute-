name: SHIRMANI VIP Product Screenshot Factory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "VIP product screenshots per cycle"
        required: false
        default: "25"
  push:
    branches: [main]
    paths:
      - "factory/product_vip_screenshot_factory.py"
      - "product-passport.html"
      - "generated/1000-digital-products.json"
      - ".github/workflows/shirmani-vip-product-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: shirmani-vip-product-screenshots
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Start local showroom server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/shirmani-showroom-server.log 2>&1 &
          echo $! >/tmp/shirmani-showroom-server.pid
      - name: Produce next bounded VIP screenshot batch
        env:
          VIP_SCREENSHOT_BATCH: ${{ github.event.inputs.batch_size || '25' }}
          SHOWROOM_BASE: http://127.0.0.1:8765
        run: python3 factory/product_vip_screenshot_factory.py
      - name: Publish VIP screenshots to canonical production-state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI VIP Screenshot Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/production-state
          rm -rf /tmp/shirmani-vip-publish
          git worktree add --detach /tmp/shirmani-vip-publish FETCH_HEAD
          mkdir -p /tmp/shirmani-vip-publish/products/vip-screenshots /tmp/shirmani-vip-publish/generated
          cp -a products/vip-screenshots/. /tmp/shirmani-vip-publish/products/vip-screenshots/
          cp generated/product-vip-screenshot-manifest.json /tmp/shirmani-vip-publish/generated/
          cd /tmp/shirmani-vip-publish
          git config user.name "SHIRMANI VIP Screenshot Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/vip-screenshots generated/product-vip-screenshot-manifest.json
          if git diff --cached --quiet; then
            echo "No new VIP screenshot media."
            exit 0
          fi
          git commit -m "automission: publish VIP product screenshot batch"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          git push --force-with-lease="refs/heads/automation/production-state:$remote_sha" origin HEAD:automation/production-state
          echo "VIP screenshot batch published to canonical production-state."
      - name: Auto-merge published production media
        if: steps.publish_media.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.publish_media.outputs.pull-request-number }}" --auto --squash --delete-branch || true

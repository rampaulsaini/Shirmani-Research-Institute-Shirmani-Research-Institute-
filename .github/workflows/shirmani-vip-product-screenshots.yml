name: SHIRMANI VIP Product Screenshot Factory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "VIP product screenshots per cycle"
        required: false
        default: "25"
  push:
    branches: [main]
    paths:
      - "factory/product_vip_screenshot_factory.py"
      - "product-passport.html"
      - "generated/1000-digital-products.json"
      - ".github/workflows/shirmani-vip-product-screenshots.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-vip-product-screenshots
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load persistent production-state catalog when available
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git checkout FETCH_HEAD -- generated products
            echo "PRODUCTION_STATE_SOURCE=automation/production-state"
          else
            echo "PRODUCTION_STATE_SOURCE=main"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Start local showroom server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/shirmani-showroom-server.log 2>&1 &
          echo $! >/tmp/shirmani-showroom-server.pid
      - name: Produce next bounded VIP screenshot batch
        env:
          VIP_SCREENSHOT_BATCH: ${{ github.event.inputs.batch_size || '25' }}
          SHOWROOM_BASE: http://127.0.0.1:8765
        run: python3 factory/product_vip_screenshot_factory.py
      - name: Publish generated screenshots as a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/vip-screenshot-batch
          delete-branch: false
          add-paths: |
            products/vip-screenshots
            generated/product-vip-screenshot-manifest.json
          commit-message: "feat(showroom): publish VIP product screenshot batch"
          title: "feat(showroom): publish VIP product screenshot batch"
          body: |
            Automated, bounded VIP screenshot batch with its generated manifest.

            This PR publishes presentation assets only. Screenshot existence is not independent QC, scientific verification, or proof of a live avatar integration.

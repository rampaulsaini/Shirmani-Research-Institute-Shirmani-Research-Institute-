name: SHIRMANI Real Product Catalog Production
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/product-catalog.json"
      - "factory/product_catalog_materializer.py"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-real-product-catalog
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize real product catalog
        run: python3 factory/product_catalog_materializer.py
      - name: Propose catalog artifacts through a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/real-product-catalog
          base: main
          delete-branch: false
          commit-message: "chore: materialize real product catalog"
          title: "Automission: refresh public product catalog"
          body: |
            Automated product-catalog materialization.
            Review the generated catalog and preview checks before merging.
            This workflow does not push directly to protected main.
          add-paths: |
            products.html
            generated/product-catalog-public.json

name: SHIRMANI Real Product Catalog Production
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/product-catalog.json"
      - "factory/product_catalog_materializer.py"
permissions:
  contents: write
concurrency:
  group: shirmani-real-product-catalog
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize real product catalog
        run: python3 factory/product_catalog_materializer.py
      - name: Publish catalog artifacts
        run: |
          git config user.name "SHIRMANI Product Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.html generated/product-catalog-public.json
          if git diff --cached --quiet; then
            echo "No product catalog changes."
          else
            git commit -m "chore: materialize real product catalog"

            # Other production automissions may legitimately update main between
            # checkout and push. Rebase onto the latest main and retry a few times
            # instead of failing on a transient non-fast-forward race.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: unable to publish catalog after $attempt attempts"
                exit 1
              fi
              echo "Catalog publish race detected; rebasing onto latest main (attempt $attempt/3)."
              git fetch origin main
              git rebase origin/main
            done
          fi

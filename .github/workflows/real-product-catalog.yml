name: SHIRMANI Real Product Catalog Production
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/product-catalog.json"
      - "factory/product_catalog_materializer.py"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-real-product-catalog
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      CATALOG_BRANCH: automation/real-product-catalog
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare automation delivery branch
        run: |
          git fetch origin main
          git fetch origin "$CATALOG_BRANCH" || true
          git checkout -B "$CATALOG_BRANCH" origin/main
      - name: Materialize real product catalog
        run: python3 factory/product_catalog_materializer.py
      - name: Publish catalog artifacts through pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "SHIRMANI Product Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.html generated/product-catalog-public.json
          if git diff --cached --quiet; then
            echo "No product catalog changes."
            exit 0
          fi
          git commit -m "chore: materialize real product catalog"
          git push --force-with-lease origin "HEAD:$CATALOG_BRANCH"
          if gh pr view "$CATALOG_BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Catalog delivery PR already exists; branch updated."
          else
            gh pr create               --repo "$GITHUB_REPOSITORY"               --base main               --head "$CATALOG_BRANCH"               --title "chore: materialize real product catalog"               --body "Automated product catalog materialization. Generated artifacts are delivered through the repository's required pull-request path; no direct main push is attempted."
          fi

name: Yatharth Continuity Integrity

on:
  push:
    paths:
      - "docs/yatharth-system/**"
      - "santushti-continuity.html"
      - "yatharth-status.html"
      - "server/**"
      - ".github/workflows/yatharth-continuity-integrity.yml"
  pull_request:
    paths:
      - "docs/yatharth-system/**"
      - "santushti-continuity.html"
      - "yatharth-status.html"
      - "server/**"
      - ".github/workflows/yatharth-continuity-integrity.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public status contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('docs/yatharth-system/feature-status-registry.json','utf8'));
          const schema = JSON.parse(fs.readFileSync('docs/yatharth-system/continuity-integrity-schema.json','utf8'));
          const checklist = JSON.parse(fs.readFileSync('docs/yatharth-system/completion-checklist.json','utf8'));

          if (registry.truth_rule !== 'architecture_is_not_deployment') throw new Error('truth_rule invariant failed');
          if (schema.truth_rule !== registry.truth_rule) throw new Error('schema/registry truth_rule mismatch');

          const allowed = new Set(schema.allowed_statuses);
          for (const [name,status] of Object.entries(registry.domains || {})) {
            if (!allowed.has(status)) throw new Error('invalid status for '+name+': '+status);
          }

          if (registry.verification?.independent_verified_claims !== 0) {
            throw new Error('independent_verified_claims must remain 0 until qualifying independent human review is recorded');
          }

          if (schema.verification_gate?.workflow_success_is_verification !== false) throw new Error('workflow success must never equal verification');
          if (schema.verification_gate?.ai_output_is_verification !== false) throw new Error('AI output must never equal verification');
          if (schema.high_impact_human_boundary !== true) throw new Error('high-impact human boundary must remain enabled');
          if (schema.fail_closed !== true) throw new Error('fail_closed must remain enabled');
          if (checklist.verification?.independent_verified_claims !== 0) throw new Error('completion checklist verification counter drifted');

          console.log('Yatharth continuity integrity: PASS');
          NODE

      - name: Install server dependencies
        working-directory: server
        run: npm install --ignore-scripts

      - name: Check Node syntax
        working-directory: server
        run: npm run check

      - name: Run server tests
        working-directory: server
        run: npm test

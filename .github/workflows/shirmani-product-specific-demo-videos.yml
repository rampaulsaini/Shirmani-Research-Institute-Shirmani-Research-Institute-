name: SHIRMANI Product-Specific Demo Video Factory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product-specific MP4s per cycle"
        required: false
        default: "10"
  push:
    branches: [main]
    paths:
      - "factory/product_specific_demo_video_factory.py"
      - "generated/1000-digital-products.json"
      - "product-demo.html"
      - ".github/workflows/shirmani-product-specific-demo-videos.yml"

permissions:
  contents: write

concurrency:
  group: shirmani-product-specific-demo-videos
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Produce next bounded product-specific video batch
        env:
          PRODUCT_DEMO_BATCH: ${{ github.event.inputs.batch_size || '10' }}
        run: python3 factory/product_specific_demo_video_factory.py
      - name: Publish customer-facing demo media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Product Demo Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/demos/products generated/product-specific-demo-video-manifest.json
          if git diff --cached --quiet; then
            echo "No product-specific demo delta."
            exit 0
          fi
          git commit -m "feat(showroom): publish product-specific demo video batch"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Report
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("generated/product-specific-demo-video-manifest.json",encoding="utf-8"))
          print("CATALOG:",d["catalog_count"])
          print("REAL_MP4:",d["real_mp4_count"])
          print("REMAINING:",d["remaining_real_mp4"])
          print("ANIMATED_FALLBACK: available through product-demo.html")
          PY

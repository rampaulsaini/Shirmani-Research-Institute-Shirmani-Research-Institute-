name: SHIRMANI Product-Specific Demo Video Factory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product-specific MP4s per cycle"
        required: false
        default: "50"
  push:
    branches: [main]
    paths:
      - "factory/product_specific_demo_video_factory.py"
      - "generated/1000-digital-products.json"
      - "product-demo.html"
      - ".github/workflows/shirmani-product-specific-demo-videos.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-specific-demo-videos
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load persistent production-state catalog when available
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git checkout FETCH_HEAD -- generated products
            echo "PRODUCTION_STATE_SOURCE=automation/production-state"
          else
            echo "PRODUCTION_STATE_SOURCE=main"
          fi
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Reconcile concrete catalog for media production
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          overlay=root/"generated/concrete-production-overlay.json"
          catalog=root/"generated/1000-digital-products.json"
          data=json.loads(overlay.read_text(encoding="utf-8"))
          rows=data.get("products",[])
          if not rows:
              raise SystemExit("Concrete production overlay is empty; refusing media production.")
          catalog.write_text(json.dumps({"schema_version":2,"products":rows},ensure_ascii=False),encoding="utf-8")
          print("media catalog rows:",len(rows))
          PY
      - name: Produce next bounded product-specific video batch
        env:
                    PRODUCT_DEMO_BATCH: ${{ github.event.inputs.batch_size || '50' }}
        run: python3 factory/product_specific_demo_video_factory.py
      - name: Publish customer-facing demo media through PR
        id: publish_media
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat(showroom): publish product-specific demo video batch"
          title: "Automission: publish product-specific demo video batch"
          body: |
            Automated production batch for customer-facing product demos.
            Includes product-specific MP4 assets and manifest routes.
            Demo readiness is production output, not scientific verification.
          branch: "automission/product-demo-media"
          delete-branch: true
          add-paths: |
            products/demos/products
            generated/product-specific-demo-video-manifest.json

      - name: Auto-merge published production media
        if: steps.publish_media.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.publish_media.outputs.pull-request-number }}" --auto --squash --delete-branch || true

name: SHIRMANI Product-Specific Demo Video Factory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product-specific MP4s per cycle"
        required: false
        default: "50"
  push:
    branches: [main]
    paths:
      - "factory/product_specific_demo_video_factory.py"
      - "generated/1000-digital-products.json"
      - "product-demo.html"
      - ".github/workflows/shirmani-product-specific-demo-videos.yml"

permissions:
  contents: write

concurrency:
  group: shirmani-product-specific-demo-videos
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Produce next bounded product-specific video batch
        env:
                    PRODUCT_DEMO_BATCH: ${{ github.event.inputs.batch_size || '50' }}
        run: python3 factory/product_specific_demo_video_factory.py
      - name: Publish demo media to canonical production-state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Product Demo Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/production-state
          rm -rf /tmp/shirmani-media-publish
          git worktree add --detach /tmp/shirmani-media-publish FETCH_HEAD
          mkdir -p /tmp/shirmani-media-publish/products/demos/products /tmp/shirmani-media-publish/products/demos/vip /tmp/shirmani-media-publish/generated
          cp -a products/demos/products/. /tmp/shirmani-media-publish/products/demos/products/
          if [ -d products/demos/vip ]; then cp -a products/demos/vip/. /tmp/shirmani-media-publish/products/demos/vip/; fi
          cp generated/product-specific-demo-video-manifest.json /tmp/shirmani-media-publish/generated/
          cd /tmp/shirmani-media-publish
          git config user.name "SHIRMANI Product Demo Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/demos generated/product-specific-demo-video-manifest.json
          if git diff --cached --quiet; then
            echo "No new demo media."
            exit 0
          fi
          git commit -m "automission: publish product-specific demo media batch"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          git push --force-with-lease="refs/heads/automation/production-state:$remote_sha" origin HEAD:automation/production-state
          echo "Demo media batch published to canonical production-state."
      - name: Auto-merge published production media
        if: steps.publish_media.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.publish_media.outputs.pull-request-number }}" --auto --squash --delete-branch || true

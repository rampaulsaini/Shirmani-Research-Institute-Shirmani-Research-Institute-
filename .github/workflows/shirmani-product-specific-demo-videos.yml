name: SHIRMANI Product-Specific Demo Video Factory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product-specific MP4s per cycle"
        required: false
        default: "50"
  push:
    branches: [main]
    paths:
      - "factory/product_specific_demo_video_factory.py"
      - "generated/1000-digital-products.json"
      - "product-demo.html"
      - ".github/workflows/shirmani-product-specific-demo-videos.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-specific-demo-videos
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load persistent production-state catalog when available
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git checkout FETCH_HEAD -- generated products
            echo "PRODUCTION_STATE_SOURCE=automation/production-state"
          else
            echo "PRODUCTION_STATE_SOURCE=main"
          fi
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Reconcile concrete catalog for media production
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          overlay=root/"generated/concrete-production-overlay.json"
          catalog=root/"generated/1000-digital-products.json"
          if not overlay.is_file():
              raise SystemExit("Concrete production overlay is missing; refusing media production.")
          raw=overlay.read_text(encoding="utf-8")
          decoder=json.JSONDecoder()
          candidates=[]
          # Some legacy production-state revisions contain concatenated JSON
          # documents. Recover complete top-level catalog objects, but never
          # silently publish an empty or unparseable catalog.
          pos=0
          while pos < len(raw):
              start=raw.find("{",pos)
              if start < 0:
                  break
              try:
                  value,end=decoder.raw_decode(raw,start)
                  pos=end
                  if isinstance(value,dict) and isinstance(value.get("products"),list) and value["products"]:
                      candidates.append(value)
              except json.JSONDecodeError:
                  pos=start+1
          if not candidates:
              raise SystemExit("No complete non-empty product catalog found in production overlay; refusing media production.")
          data=max(candidates,key=lambda item: str(item.get("generated_at","")))
          rows=data["products"]
          seen=set()
          for row in rows:
              pid=str(row.get("id","")).strip()
              if not pid:
                  raise SystemExit("Production overlay contains a product without a stable id.")
              if pid in seen:
                  raise SystemExit(f"Duplicate product id in production overlay: {pid}")
              seen.add(pid)
          catalog.write_text(json.dumps({"schema_version":2,"products":rows},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("media catalog rows:",len(rows))
          print("selected catalog timestamp:",data.get("generated_at","unknown"))
          PY
      - name: Produce next bounded product-specific video batch
        env:
          PRODUCT_DEMO_BATCH: ${{ github.event.inputs.batch_size || '50' }}
        run: python3 factory/product_specific_demo_video_factory.py
      - name: Verify generated MP4 and manifest before publication
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path(".")
          manifest=root/"generated/product-specific-demo-video-manifest.json"
          data=json.loads(manifest.read_text(encoding="utf-8"))
          rows=data.get("products",[])
          if not rows:
              raise SystemExit("Demo manifest is empty; refusing publication.")
          created=0
          for row in rows:
              if row.get("real_mp4"):
                  p=root/row["video_url"]
                  if not p.is_file() or p.stat().st_size < 1024:
                      raise SystemExit(f"Manifest MP4 missing or too small: {row.get('product_id')}")
                  probe=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(p)],capture_output=True,text=True)
                  if probe.returncode or not probe.stdout.strip():
                      raise SystemExit(f"Invalid MP4 container: {row.get('product_id')}")
                  created+=1
          print(f"manifest_products={len(rows)}; real_mp4s={created}; created_this_cycle={data.get('created_videos_this_cycle',0)}")
          if data.get("created_videos_this_cycle",0) and created == 0:
              raise SystemExit("Factory reported new videos but manifest contains no valid MP4s.")
          PY
      - name: Restore intermediate catalog before opening media PR
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=origin/main --staged --worktree -- generated/1000-digital-products.json
          git diff --cached --exit-code -- generated/1000-digital-products.json
          git diff --exit-code -- generated/1000-digital-products.json
      - name: Publish customer-facing demo media through PR
        id: publish_media
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat(showroom): publish product-specific demo video batch"
          title: "Automission: publish product-specific demo video batch"
          body: |
            Automated bounded batch of product-specific MP4 demo assets and manifests.
            The workflow verifies MP4 container readability before opening this PR.
            These generated step-card videos demonstrate a usage outline, not a live screen recording of every product.
            Product functionality and QC remain separate acceptance checks.
          branch: "automission/product-specific-demo-video-batch"
          delete-branch: true
          add-paths: |
            products/demos/products
            products/demos/vip
            generated/product-specific-demo-video-manifest.json
            generated/product-media-production-manifest.json
      - name: Report publication outcome
        if: always()
        run: |
          echo "Media factory run finished. Review the job summary and generated manifest for actual MP4 coverage." >> "$GITHUB_STEP_SUMMARY"

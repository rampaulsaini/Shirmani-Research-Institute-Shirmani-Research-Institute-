name: SHIRMANI Workflow Run Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write

concurrency:
  group: shirmani-workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Delete up to 100 oldest completed workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${GITHUB_REPOSITORY}"
          current="${GITHUB_RUN_ID}"

          ids="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${repo}/actions/runs?status=completed&per_page=100&page=1" \
            --jq '.workflow_runs[].id' | grep -v "^${current}$" | head -n 100 || true)"

          deleted=0
          for id in $ids; do
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${repo}/actions/runs/${id}"; then
              deleted=$((deleted + 1))
            else
              echo "Could not delete run ${id}; continuing."
            fi
            sleep 1
          done

          echo "Deleted $deleted completed workflow runs in this cycle."
          echo "Cleanup repeats every 10 minutes until the backlog is cleared."

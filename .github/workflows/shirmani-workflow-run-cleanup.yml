name: SHIRMANI Workflow Run Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shirmani-workflow-run-cleanup.yml
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write

concurrency:
  group: shirmani-workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Delete up to 990 completed workflow runs per cycle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${GITHUB_REPOSITORY}"
          current="${GITHUB_RUN_ID}"
          tmp="$(mktemp)"
          deleted_file="$(mktemp)"
          trap 'rm -f "${tmp}" "${deleted_file}" "${tmp}.limited"' EXIT

          # Stay within the 1000 requests/hour GITHUB_TOKEN repository limit:
          # 9 list requests + up to 990 delete requests = <= 999 requests/cycle.
          for page in $(seq 1 9); do
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2026-03-10"               "repos/${repo}/actions/runs?status=completed&per_page=100&page=${page}"               --jq '.workflow_runs[].id' >> "${tmp}" || true
          done

          sed -i "/^${current}$/d" "${tmp}" 2>/dev/null || true
          sort -u "${tmp}" | head -n 990 > "${tmp}.limited"
          mv "${tmp}.limited" "${tmp}"

          total="$(wc -l < "${tmp}" | tr -d ' ')"
          echo "Found ${total} completed workflow runs selected for deletion."

          if [ "${total}" -eq 0 ]; then
            echo "No completed workflow runs remain to delete."
            exit 0
          fi

          : > "${deleted_file}"

          delete_run() {
            id="$1"
            if gh api --method DELETE               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2026-03-10"               "repos/${repo}/actions/runs/${id}" >/dev/null 2>&1; then
              echo 1 >> "${deleted_file}"
            else
              echo "Could not delete run ${id}; continuing." >&2
            fi
          }
          export -f delete_run

          xargs -r -n 1 -P 10 bash -c 'delete_run "$1"' _ < "${tmp}"

          deleted="$(wc -l < "${deleted_file}" | tr -d ' ')"
          echo "Deleted ${deleted} completed workflow runs in this cycle."
          echo "Cleanup repeats hourly until the completed-run backlog is cleared."
          echo "Target: clear historical completed-run backlog without deleting workflow definitions."

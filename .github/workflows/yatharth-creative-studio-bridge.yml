name: Shirmani to Yatharth Creative Studio - Automission Bridge

on:
  # The Inter-Repository Automission Orchestrator owns the canonical
  # yatharth_studio_request dispatch on main. This bridge remains manual
  # (or responds to its dedicated yatharth_creative_request event) to avoid
  # duplicate downstream hand-offs. 
  workflow_dispatch:
    inputs:
      brief:
        description: "Research or creative brief"
        required: true
        type: string
      format:
        description: "Target production format"
        required: false
        default: "animated-film"
        type: string
  repository_dispatch:
    types:
      - yatharth_creative_request
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm workflow syntax
        run: echo "Creative Studio bridge loaded successfully for ${{ github.event_name }}."

      - name: Check federation credential
        id: federation
        env:
          FEDERATION_TOKEN: ${{ secrets.SHIRMANI_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(python3 - <<'PY'
          import os
          token = os.environ.get("FEDERATION_TOKEN", "")
          print("true" if token and token.isascii() and not any(ch.isspace() for ch in token) else "false")
          PY
          )
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Send federation event
        if: steps.federation.outputs.enabled == 'true'
        env:
          AUTOMATION_MODE: ${{ vars.SHIRMANI_AUTOMATION_MODE || 'CONTINUOUS' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SHIRMANI_GITHUB_TOKEN }}
          script: |
            const brief = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.brief
              : 'Automission continuity pulse: prepare a structured creative-production hand-off from the latest Shirmani Research Institute material.';
            const format = context.eventName === 'workflow_dispatch'
              ? (context.payload.inputs.format || 'animated-film')
              : 'animated-film';

            const allowedFormats = new Set([
              'animated-film',
              'animated-short',
              'music-video',
              'story-film'
            ]);
            if (!allowedFormats.has(format)) {
              core.setFailed(`Unsupported production format: ${format}`);
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'rampaulsaini',
              repo: 'yatharth-music-ai',
              event_type: 'yatharth_studio_request',
              client_payload: {
                source_repository: 'rampaulsaini/Shirmani-Research-Institute-Shirmani-Research-Institute-',
                source_workflow: 'yatharth-creative-studio-bridge',
                automation_mode: process.env.AUTOMATION_MODE || 'CONTINUOUS',
                brief,
                format,
                source_run_id: String(context.runId)
              }
            });

            core.info('Automission federation event sent to Yatharth Creative Studio.');

      - name: Write federation status
        if: always()
        env:
          FEDERATION_ENABLED: ${{ steps.federation.outputs.enabled || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          data = {
              "workflow": "yatharth-creative-studio-bridge",
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "source_repository": os.environ.get("GITHUB_REPOSITORY"),
              "dispatch_status": "SENT" if os.environ.get("FEDERATION_ENABLED") == "true" else "SKIPPED_TOKEN_UNAVAILABLE",
              "independent_verification_claim": False
          }
          with open("federation-status.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          PY

      - name: Upload federation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-federation-status-${{ github.run_id }}
          path: federation-status.json
          if-no-files-found: error

      - name: Report federation dispatch skipped
        if: steps.federation.outputs.enabled != 'true'
        run: echo "Creative federation dispatch skipped safely because SHIRMANI_GITHUB_TOKEN is missing or malformed; no cross-repository dispatch performed."

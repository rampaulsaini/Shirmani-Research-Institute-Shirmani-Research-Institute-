name: Shirmani to Yatharth Creative Studio - Automission Bridge

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      brief:
        description: "Research or creative brief"
        required: true
        type: string
      format:
        description: "Target production format"
        required: false
        default: "animated-film"
        type: string
  repository_dispatch:
    types:
      - yatharth_creative_request
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow syntax
        run: echo "Creative Studio bridge loaded successfully for ${{ github.event_name }}."

      - name: Send federation event
        if: env.FEDERATION_ENABLED == 'true'
        env:
          FEDERATION_ENABLED: ${{ secrets.SHIRMANI_GITHUB_TOKEN != '' && 'true' || 'false' }}
          AUTOMATION_MODE: ${{ vars.SHIRMANI_AUTOMATION_MODE || 'CONTINUOUS' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SHIRMANI_GITHUB_TOKEN }}
          script: |
            const brief = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.brief
              : 'Automission continuity pulse: prepare a structured creative-production hand-off from the latest Shirmani Research Institute material.';
            const format = context.eventName === 'workflow_dispatch'
              ? (context.payload.inputs.format || 'animated-film')
              : 'animated-film';

            const allowedFormats = new Set([
              'animated-film',
              'animated-short',
              'music-video',
              'story-film'
            ]);
            if (!allowedFormats.has(format)) {
              core.setFailed(`Unsupported production format: ${format}`);
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'rampaulsaini',
              repo: 'yatharth-music-ai',
              event_type: 'yatharth_studio_request',
              client_payload: {
                source_repository: 'rampaulsaini/Shirmani-Research-Institute-Shirmani-Research-Institute-',
                source_workflow: 'yatharth-creative-studio-bridge',
                automation_mode: process.env.AUTOMATION_MODE || 'CONTINUOUS',
                brief,
                format,
                source_run_id: String(context.runId)
              }
            });

            core.info('Automission federation event sent to Yatharth Creative Studio.');

      - name: Report federation dispatch skipped
        if: env.FEDERATION_ENABLED != 'true'
        env:
          FEDERATION_ENABLED: ${{ secrets.SHIRMANI_GITHUB_TOKEN != '' && 'true' || 'false' }}
        run: echo "Creative federation dispatch skipped safely because SHIRMANI_GITHUB_TOKEN is not configured."

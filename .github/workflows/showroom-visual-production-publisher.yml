name: SHIRMANI Showroom Visual Production Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: showroom-visual-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build visual production manifest
        run: python3 scripts/build_showroom_visual_manifest.py

      - name: Publish customer-visible manifest through pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            generated/showroom-visual-manifest.json
            generated/showroom-visual-manifest.md
          branch: automation/showroom-visual-manifest
          delete-branch: false
          commit-message: "chore: publish showroom visual production state"
          title: "chore: update showroom visual production manifest"
          body: |
            Automated update of the customer-visible showroom visual production manifest.

            This pull request preserves the repository rule requiring all changes to main to go through pull requests.
          labels: automation

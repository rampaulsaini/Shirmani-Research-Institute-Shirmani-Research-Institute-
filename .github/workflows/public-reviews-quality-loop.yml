name: SHIRMANI Public Reviews → Quality Improvement
on:
  schedule:
    - cron: "*/5 * * * *"
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: public-review-quality-loop
  cancel-in-progress: true

jobs:
  process-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public review quality queue and status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from collections import Counter
          from datetime import datetime, timezone

          repo=os.environ["GITHUB_REPOSITORY"]
          raw=subprocess.check_output(["gh","api",f"repos/{repo}/issues?state=all&per_page=100"],text=True)
          issues=json.loads(raw)
          reviews=[]

          def field(lines, names):
              for i,line in enumerate(lines):
                  clean=line.strip().lower()
                  for name in names:
                      if clean.startswith(name+":"):
                          return line.split(":",1)[1].strip()
                      if clean == name:
                          return lines[i+1].strip() if i+1 < len(lines) else ""
              return ""

          for x in issues:
              if x.get("pull_request"):
                  continue
              labels={l["name"].lower() for l in x.get("labels",[])}
              title=(x.get("title") or "").lower()
              if not ({"product-review","quality-improvement"} & labels or "[public review]" in title or "customer review" in title):
                  continue

              body=x.get("body") or ""
              lines=body.splitlines()
              product=field(lines, ["product id","### product id"])
              rating_raw=field(lines, ["rating","### rating"])
              if not rating_raw:
                  m=re.search(r"rating[^0-9]*([1-5])", body, re.I)
                  rating_raw=m.group(1) if m else ""
              try:
                  rating=int(str(rating_raw).split("/",1)[0].strip().split()[0])
                  if rating < 1 or rating > 5: rating=None
              except Exception:
                  rating=None

              review_text=field(lines, ["review","customer review","### customer review"])
              improvement=field(lines, ["suggested improvement","quality improvement suggestion","### quality improvement suggestion"])

              reviews.append({
                  "issue":x["number"], "title":x["title"], "product_id":product,
                  "rating":rating, "review":review_text, "improvement":improvement,
                  "body":body, "url":x["html_url"], "updated_at":x["updated_at"]
              })

          ratings=[r["rating"] for r in reviews if isinstance(r.get("rating"),int)]
          by_product=Counter(r["product_id"] for r in reviews if r.get("product_id"))
          avg=round(sum(ratings)/len(ratings),2) if ratings else None
          stamp=datetime.now(timezone.utc).isoformat()

          status={
              "generated_at":stamp,
              "review_count":len(reviews),
              "rating_count":len(ratings),
              "average_rating":avg,
              "products_with_feedback":len(by_product),
              "product_feedback_counts":dict(sorted(by_product.items())),
              "purpose":"Customer reviews are production-quality improvement inputs, not scientific verification.",
              "verification":"NOT_A_SCIENTIFIC_VERIFICATION_LAYER"
          }
          queue={
              "generated_at":stamp,
              "review_count":len(reviews),
              "reviews":reviews,
              "purpose":"Customer reviews are production-quality improvement inputs, not scientific verification.",
              "next_stage":"factory quality improvement backlog"
          }

          os.makedirs("generated",exist_ok=True)
          for path,data in [
              ("generated/public-review-quality-status.json",status),
              ("generated/public-review-quality-queue.json",queue)
          ]:
              with open(path,"w",encoding="utf-8") as f:
                  json.dump(data,f,ensure_ascii=False,indent=2); f.write("\n")

          md=[
              "# Public Review → Production Quality Improvement Input","",
              f"- Generated: {stamp}",f"- Reviews: {len(reviews)}",
              f"- Ratings: {len(ratings)}",f"- Average rating: {avg if avg is not None else '—'}",
              f"- Products with feedback: {len(by_product)}","",
              "## Rule",
              "Public reviews, ratings, defects and improvement suggestions are production-quality inputs. They are not independent scientific verification.","",
              "## Product priorities"
          ]
          for pid,count in sorted(by_product.items(), key=lambda x:(-x[1],x[0])):
              md.append(f"- {pid}: {count} review(s)")
          with open("generated/public-review-research-input.md","w",encoding="utf-8") as f:
              f.write("\n".join(md)+"\n")
          PY

      - name: Commit quality queue and public status
        run: |
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/public-review-quality-queue.json generated/public-review-quality-status.json generated/public-review-research-input.md
          git diff --cached --quiet || git commit -m "automission: publish public review quality signals"

          # Other production automissions also write generated/ on main.
          # Rebase before publishing so review telemetry does not fail merely
          # because another production lane committed first.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git diff --quiet HEAD origin/main; then
                echo "Review quality state already current after rebase."
                exit 0
              fi
              if git push origin HEAD:main; then
                echo "Review quality telemetry published on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 3))
          done
          echo "::warning::Review telemetry could not publish after 5 retries; next scheduled cycle will retry."
          exit 0

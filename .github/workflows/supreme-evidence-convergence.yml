name: SHIRMANI Supreme Evidence Convergence
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'agents/supreme_nlp.py'
      - 'agents/supreme_nlp_multimodal.py'
      - 'agents/supreme_nlp_practitioner.py'
      - 'scripts/cross_layer_consistency.py'
      - 'docs/ULTRA-MEGA-INFINITY-QUANTUM-EVIDENCE-CHARTER.md'
      - '.github/workflows/supreme-evidence-convergence.yml'
permissions:
  contents: read
concurrency:
  group: shirmani-supreme-evidence-convergence
  cancel-in-progress: true
jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Compile evidence layers
        run: python -m py_compile agents/supreme_nlp.py agents/supreme_nlp_multimodal.py agents/supreme_nlp_practitioner.py scripts/cross_layer_consistency.py
      - name: Run NLP regression suite
        run: python -m unittest discover -s tests -p 'test_supreme_nlp*.py' -v
      - name: Cross-layer consistency gate
        run: python scripts/cross_layer_consistency.py
      - name: Enforce fail-closed evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('generated/supreme-nlp/cross-layer-consistency.json').read_text())
          assert d['governance']['fail_closed'] is True
          assert d['governance']['aggregation_creates_no_new_evidence'] is True
          assert d['governance']['subjective_experience_claim_allowed'] is False
          assert all(v in {'UNVERIFIED','UNKNOWN'} for v in d['verification_status'].values())
          print('SUPREME_EVIDENCE_CONVERGENCE: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-evidence-convergence-${{ github.run_id }}
          path: generated/supreme-nlp/cross-layer-consistency.json
          retention-days: 14
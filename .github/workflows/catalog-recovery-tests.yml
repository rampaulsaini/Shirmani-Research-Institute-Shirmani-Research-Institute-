name: SHIRMANI Catalog Recovery Regression

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-recovery-tests.yml"
      - ".github/workflows/production-scale-autofactory.yml"
      - "scripts/ensure_product_catalog.py"
      - "tests/test_catalog_recovery.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-recovery-tests.yml"
      - ".github/workflows/production-scale-autofactory.yml"
      - "scripts/ensure_product_catalog.py"
      - "tests/test_catalog_recovery.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-recovery-regression-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile recovery helper
        run: python -m py_compile scripts/ensure_product_catalog.py
      - name: Run catalog recovery regression tests
        run: python -m unittest tests/test_catalog_recovery.py -v

name: Supreme Product Production Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: supreme-product-production
  cancel-in-progress: false
jobs:
  catalogue-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue and generate production report
        run: python scripts/product_factory.py
      - name: Upload production report
        uses: actions/upload-artifact@v4
        with:
          name: supreme-product-production-report
          path: generated/production/production-report.json
          if-no-files-found: error
          retention-days: 30

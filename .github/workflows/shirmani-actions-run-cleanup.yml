name: SHIRMANI Actions Run Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot and delete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          deleted=0
          failed=0

          gh api --paginate             "/repos/$REPO/actions/runs?per_page=100"             --jq '.workflow_runs[] | [.id,.status] | @tsv' > /tmp/runs.tsv

          while IFS=$'\t' read -r run_id status; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$CURRENT_RUN_ID" ] && continue

            if gh api --method DELETE               "/repos/$REPO/actions/runs/$run_id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
              echo "Deleted workflow run: $run_id"
            else
              failed=$((failed + 1))
              echo "Could not delete workflow run: $run_id (status=$status)"
            fi
          done < /tmp/runs.tsv

          echo "Cleanup complete. Deleted: $deleted; failed: $failed; current run preserved: $CURRENT_RUN_ID"

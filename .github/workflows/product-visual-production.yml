name: SHIRMANI Product Visual Production
on:
  push:
    branches: [main]
    paths:
      - "factory/product_visual_identity_factory.py"
      - "factory/product_visual_identity_factory_v2.py"
      - "generated/1000-digital-products.json"
      - ".github/workflows/product-visual-production.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product visual refresh batch per cycle"
        required: false
        default: "500"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-product-visual-production
  cancel-in-progress: false
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install QR production dependency
        run: python -m pip install --disable-pip-version-check "qrcode>=8,<9"
      - name: Generate v2 product visuals
        env:
          VISUAL_BATCH: ${{ github.event.inputs.batch_size || '500' }}
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Generate product-specific QR long-description assets
        env:
          QR_BATCH: ${{ github.event.inputs.batch_size || '500' }}
        run: python3 factory/product_qr_asset_factory.py
      - name: Publish visual assets through PR and merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Product Visual Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/visuals generated/product-visual-assets-v2.json generated/product-qr-assets.json factory/product_qr_asset_factory.py factory/product_visual_identity_factory_v2.py
          if git diff --cached --quiet; then
            echo "No visual production delta in this cycle."
            exit 0
          fi
          git commit -m "feat(showroom): publish v2 product visual identity batch"
          BRANCH="automation/product-visual-v2-${{ github.run_id }}"
          git push origin HEAD:"$BRANCH"
          PR_URL="$(gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" --title "Automated v2 product visual batch ${{ github.run_id }}" --body "Production-first visual upgrade: persistent SHIRMANI logo, requested English identity line, short description on image, product-specific upper-right QR for long details, and 4K-ready unique product identity.")"
          echo "Opened $PR_URL"
          gh pr merge "$PR_URL" --repo "${{ github.repository }}" --merge --delete-branch

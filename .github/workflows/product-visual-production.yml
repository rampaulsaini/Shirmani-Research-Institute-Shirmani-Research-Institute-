name: SHIRMANI Product Visual Production
on:
  push:
    branches: [main]
    paths:
      - "factory/product_visual_identity_factory.py"
      - "factory/product_qr_asset_factory.py"
      - "generated/1000-digital-products.json"
      - ".github/workflows/product-visual-production.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Missing product visuals/QRs per cycle"
        required: false
        default: "250"
permissions:
  contents: write
concurrency:
  group: shirmani-product-visual-production
  cancel-in-progress: false
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install QR production dependency
        run: python -m pip install --disable-pip-version-check "qrcode>=8,<9"
      - name: Generate next unique 4K-ready product visuals
        env:
          VISUAL_BATCH: ${{ github.event.inputs.batch_size || '250' }}
        run: python3 factory/product_visual_identity_factory.py
      - name: Generate next product-specific QR long-description assets
        env:
          QR_BATCH: ${{ github.event.inputs.batch_size || '250' }}
        run: python3 factory/product_qr_asset_factory.py
      - name: Publish visual batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Product Visual Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/visuals generated/product-visual-assets.json generated/product-qr-assets.json factory/product_visual_identity_factory.py
          if git diff --cached --quiet; then
            echo "No missing visual assets in this cycle."
            exit 0
          fi
          git commit -m "feat(showroom): publish next product visual + QR batch"
          git push origin HEAD:main

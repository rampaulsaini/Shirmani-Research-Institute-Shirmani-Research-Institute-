name: SHIRMANI Product Visual Production
on:
  push:
    branches: [main]
    paths:
      - "factory/product_visual_identity_factory.py"
      - "factory/product_visual_identity_factory_v2.py"
      - "factory/product_visual_qc_gate.py"
      - "factory/product_qr_asset_factory.py"
      - "assets/shirmani-perspective-logo.svg"
      - "generated/1000-digital-products.json"
      - ".github/workflows/product-visual-production.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product visual refresh batch per cycle"
        required: false
        default: "1000"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-product-visual-production
  cancel-in-progress: false
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install QR production dependency
        run: python -m pip install --disable-pip-version-check "qrcode>=8,<9"
      - name: Generate v2 product visuals
        env:
          VISUAL_BATCH: ${{ github.event.inputs.batch_size || '1000' }}
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Generate product-specific QR long-description assets
        env:
          QR_BATCH: ${{ github.event.inputs.batch_size || '1000' }}
        run: python3 factory/product_qr_asset_factory.py
      - name: Run fail-closed product visual QC gate
        run: python3 factory/product_visual_qc_gate.py
      - name: Propose visual assets through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/product-visual-production
          delete-branch: false
          add-paths: |
            products/visuals
            generated/product-visual-assets-v2.json
            generated/product-qr-assets.json
            factory/product_qr_asset_factory.py
            factory/product_visual_identity_factory_v2.py
            factory/product_visual_qc_gate.py
            assets/shirmani-perspective-logo.svg
          commit-message: "feat(showroom): publish v2 product visual identity batch"
          title: "feat(showroom): publish v2 product visual identity batch"
          body: |
            Automated product visual and QR asset batch.

            The workflow runs the fail-closed visual QC gate before opening this PR.
            Review generated assets and manifests before merging.
          labels: |
            automated
            product-media

name: SHIRMANI Product Visual Production
on:
  push:
    branches: [main]
    paths:
      - "factory/product_visual_identity_factory.py"
      - "factory/product_visual_identity_factory_v2.py"
      - "factory/product_visual_qc_gate.py"
      - "factory/product_qr_asset_factory.py"
      - "assets/shirmani-perspective-logo.svg"
      - "generated/1000-digital-products.json"
      - ".github/workflows/product-visual-production.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product visual refresh batch per cycle"
        required: false
        default: "1000"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-product-visual-production
  cancel-in-progress: false
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install QR production dependency
        run: python -m pip install --disable-pip-version-check "qrcode>=8,<9"
      - name: Generate v2 product visuals
        env:
          VISUAL_BATCH: ${{ github.event.inputs.batch_size || '1000' }}
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Generate product-specific QR long-description assets
        env:
          QR_BATCH: ${{ github.event.inputs.batch_size || '1000' }}
        run: python3 factory/product_qr_asset_factory.py
      - name: Publish visual assets through PR and merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Product Visual Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/visuals generated/product-visual-assets-v2.json generated/product-qr-assets.json factory/product_qr_asset_factory.py factory/product_visual_identity_factory_v2.py factory/product_visual_qc_gate.py assets/shirmani-perspective-logo.svg
          if git diff --cached --quiet; then
            echo "No visual production delta in this cycle."
            exit 0
          fi
          git commit -m "feat(showroom): publish v2 product visual identity batch"
          git fetch origin automation/production-state
          git diff --binary HEAD^ -- products/visuals generated/product-visual-assets-v2.json generated/product-qr-assets.json factory/product_qr_asset_factory.py factory/product_visual_identity_factory_v2.py > /tmp/visual-production.patch || true
          git checkout -B production-state origin/automation/production-state
          if [ -s /tmp/visual-production.patch ]; then git apply /tmp/visual-production.patch; fi
          git add products/visuals generated/product-visual-assets-v2.json generated/product-qr-assets.json factory/product_qr_asset_factory.py factory/product_visual_identity_factory_v2.py
          if git diff --cached --quiet; then
            echo "No production-state visual delta."
            exit 0
          fi
          git commit -m "automission: publish product visual production state"
          git push origin HEAD:automation/production-state

name: SHIRMANI Production Catalog Gate
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
jobs:
  production-catalog-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate live production catalog
        run: python factory/production_catalog_gate.py
      - name: Commit production telemetry
        run: |
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/live-production-status.json
          git diff --cached --quiet || git commit -m "chore: update live production catalog telemetry"
          git push

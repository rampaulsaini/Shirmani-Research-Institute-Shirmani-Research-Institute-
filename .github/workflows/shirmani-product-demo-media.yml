name: SHIRMANI Product Demo Media Factory
on:
  pull_request:
    paths:
      - "factory/product_demo_media_factory.py"
      - "product-demo.html"
      - ".github/workflows/shirmani-product-demo-media.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product-specific MP4 demo files to materialize this cycle"
        required: false
        default: "250"
        type: string
permissions:
  contents: write
concurrency:
  group: shirmani-product-demo-media
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MP4_BATCH: ${{ inputs.batch_size || '250' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build product demo queue
        run: python3 factory/product_demo_media_factory.py
      - name: Build bounded product-specific MP4 demos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('.')
          cat=json.loads(Path('generated/1000-digital-products.json').read_text())['products']
          manifest=json.loads(Path('generated/product-demo-media-manifest.json').read_text())
          selected=[x for x in manifest['products'] if x['status']=='PRODUCT_MP4_QUEUED_THIS_CYCLE']
          for row in selected:
              p=next(x for x in cat if x['id']==row['product_id'])
              out=root/row['product_mp4_path']; out.parent.mkdir(parents=True,exist_ok=True)
              text=f"SHIRMANI DEMO | {p.get('name',p['id'])} | ID {p['id']} | OPEN -> USE -> REVIEW -> PASSPORT"
              safe=text.replace("\\","\\\\").replace("'","\\'")
              vf="drawtext=text='"+safe+":fontcolor=white:fontsize=34:x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor=black@0.65:boxborderw=24"
              subprocess.run(["ffmpeg","-y","-f","lavfi","-i","color=c=0x071018:s=1280x720:d=8","-vf",vf,"-r","24","-pix_fmt","yuv420p","-movflags","+faststart",str(out)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print("MP4 demos materialized:",len(selected))
          PY
      - name: Refresh demo manifest
        run: python3 factory/product_demo_media_factory.py
      - name: Upload MP4 production artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-product-demo-mp4-${{ github.run_number }}
          retention-days: 7
          path: products/demos/products/*.mp4
          if-no-files-found: ignore
      - name: Publish bounded demo media and manifest
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "SHIRMANI Product Demo Factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/product-demo-media-manifest.json products/demos/products
          if git diff --cached --quiet; then
            echo "No demo-media delta."
            exit 0
          fi
          git commit -m "chore(demo): materialize product-specific demo media batch"
          git push origin HEAD:main

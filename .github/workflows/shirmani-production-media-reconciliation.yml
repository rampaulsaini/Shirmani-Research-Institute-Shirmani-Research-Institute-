name: SHIRMANI Production Media Reconciliation
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-production-media-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile concrete products to media queues
        run: python3 factory/product_media_reconciler.py
      - name: Build scalable catalogue shard index
        run: python3 factory/catalog_shard_index.py
      - name: Stage reconciliation state on automation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Automission"
          git config user.email "actions@users.noreply.github.com"
          git add generated/product-media-reconciliation.json generated/catalog-shards/**
          if git diff --cached --quiet; then
            echo "No reconciliation delta."
            exit 0
          fi
          git commit -m "chore(automission): reconcile product media and catalogue shards"
          branch="automation/product-media-reconciliation"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

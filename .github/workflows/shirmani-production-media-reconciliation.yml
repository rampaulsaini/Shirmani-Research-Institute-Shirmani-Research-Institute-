name: SHIRMANI Production Media Reconciliation
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-media-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile concrete products to media queues
        run: python3 factory/product_media_reconciler.py
      - name: Build scalable catalogue shard index
        run: python3 factory/catalog_shard_index.py
      - name: Stage generated MEDIA outputs without bypassing protected main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Automission"
          git config user.email "actions@users.noreply.github.com"
          git add generated/product-media-reconciliation.json generated/catalog-shards
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "automission: stage media production outputs"
          git push --force-with-lease origin HEAD:refs/heads/automation/product-media-reconciliation-staging
          echo "Staging branch updated: automation/product-media-reconciliation-staging. Protected main was not pushed."

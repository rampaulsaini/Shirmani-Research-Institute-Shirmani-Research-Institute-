name: SHIRMANI Production Media Reconciliation
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-media-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile concrete products to media queues
        run: python3 factory/product_media_reconciler.py
      - name: Build scalable catalogue shard index
        run: python3 factory/catalog_shard_index.py
      - name: Propose reconciliation state through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/product-media-reconciliation
          delete-branch: false
          commit-message: "chore(automission): reconcile product media and catalogue shards"
          title: "Automission: reconcile product media and catalog shards"
          body: |
            Automated reconciliation output.
            Review generated queue and shard-index state before merging.
            This workflow does not push directly to protected main.
          add-paths: |
            generated/product-media-reconciliation.json
            generated/catalog-shards/**

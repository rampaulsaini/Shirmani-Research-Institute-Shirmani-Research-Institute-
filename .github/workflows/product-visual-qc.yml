name: SHIRMANI Product Visual QC
on:
  pull_request:
    paths:
      - "factory/product_visual_identity_factory_v2.py"
      - "factory/product_qr_asset_factory.py"
      - "factory/product_visual_qc_gate.py"
      - "assets/shirmani-perspective-logo.svg"
      - ".github/workflows/product-visual-qc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install QR dependency
        run: python -m pip install --disable-pip-version-check "qrcode>=8,<9"
      - name: Materialize a validation batch
        env:
          VISUAL_BATCH: "5"
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Materialize matching QR batch
        env:
          QR_BATCH: "5"
        run: python3 factory/product_qr_asset_factory.py
      - name: Run fail-closed visual QC
        run: python3 factory/product_visual_qc_gate.py

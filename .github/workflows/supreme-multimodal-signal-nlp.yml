name: SHIRMANI Supreme Multimodal Signal NLP

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "docs/supreme-multimodal-signal-to-language-contract.md"
      - "schemas/supreme-multimodal-signal-record.schema.json"
      - "factory/supreme_multimodal_signal_qc.py"
      - "tests/supreme_multimodal_signal_qc.py"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-multimodal-signal-nlp
  cancel-in-progress: true

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run multimodal signal contract QC
        run: python3 factory/supreme_multimodal_signal_qc.py
      - name: Run hardening test
        run: python3 tests/supreme_multimodal_signal_qc.py

name: SHIRMANI Product Demo Media Factory — Continuous Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/product_demo_video_factory.py"
      - ".github/workflows/shirmani-product-demo-media-factory.yml"
      - "generated/1000-digital-products.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-demo-media
  cancel-in-progress: false

jobs:
  build-demo-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build engine-family demo MP4s and product media manifest
        run: python3 factory/product_demo_video_factory.py
      - name: Propose demo media through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/product-demo-media
          delete-branch: false
          add-paths: |
            products/demos
            generated/product-media-production-manifest.json
          commit-message: "chore(media): materialize product demo videos and media manifest"
          title: "chore(media): refresh product demo media"
          body: |
            Automated proposal for generated product demo media and its manifest.
            This workflow preserves the protected-main rule and never pushes directly to main.
            Review generated asset diffs, media identity, size, and QC evidence before merging.
          labels: |
            automation
            verification
      - name: Summary
        run: |
          echo "## SHIRMANI Demo Media" >> "$GITHUB_STEP_SUMMARY"
          echo "- Interactive demo route: demo-video.html?id=PRODUCT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Engine-family MP4s: generated continuously" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated changes are proposed via PR; no direct main push" >> "$GITHUB_STEP_SUMMARY"
          echo "- Product-specific identity remains separate from reusable engine-family demo media" >> "$GITHUB_STEP_SUMMARY"

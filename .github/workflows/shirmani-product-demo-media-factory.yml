name: SHIRMANI Product Demo Media Factory — Continuous Production

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/product_demo_video_factory.py"
      - ".github/workflows/shirmani-product-demo-media-factory.yml"
      - "generated/1000-digital-products.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-demo-media
  cancel-in-progress: false

jobs:
  build-demo-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Build engine-family demo MP4s and product media manifest
        run: python3 factory/product_demo_video_factory.py
      - name: Publish demo media through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(media): materialize product demo videos and media manifest"
          title: "Automission: publish product demo media"
          body: |
            Publishes generated engine-family MP4 demo media and its production manifest through the repository's required pull-request path.
            The generated MP4s are reusable engine-family demos, not proof of product-specific recordings, independent QC, customer sales, payment, or dispatch.
          branch: "automission/product-demo-media"
          delete-branch: true
          add-paths: |
            products/demos
            generated/product-media-production-manifest.json
      - name: Summary
        run: |
          echo "## SHIRMANI Demo Media" >> "$GITHUB_STEP_SUMMARY"
          echo "- Interactive demo route: demo-video.html?id=PRODUCT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Engine-family MP4s: generated continuously" >> "$GITHUB_STEP_SUMMARY"
          echo "- Product-specific identity remains separate from reusable engine-family demo media" >> "$GITHUB_STEP_SUMMARY"

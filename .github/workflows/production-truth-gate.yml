name: SHIRMANI Real Production Truth Gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/production_truth_registry.json"
      - "factory/production_truth_materializer.py"
      - "factory/product-catalog.json"
      - "research-paper.pdf"

permissions:
  contents: write

concurrency:
  group: shirmani-production-truth
  cancel-in-progress: false

jobs:
  reality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize real production truth
        run: python3 factory/production_truth_materializer.py
      - name: Publish only source-derived truth
        run: |
          git config user.name "SHIRMANI Production Truth Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-truth.json generated/production-truth.html
          if git diff --cached --quiet; then
            echo "No production-truth changes."
          else
            git commit -m "chore: publish real production truth"
            git push
          fi

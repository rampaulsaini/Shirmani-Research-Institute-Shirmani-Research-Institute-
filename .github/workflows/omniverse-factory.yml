name: Omniverse Research Factory
on:
  workflow_dispatch:
  push:
    paths: ['factory/**','.github/workflows/omniverse-factory.yml']
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
concurrency:
  group: omniverse-research-factory
  cancel-in-progress: false
jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source registry
        run: python3 factory/source-registry.py
      - name: Run source factory
        run: python3 factory/run_stage.py factory/build_factory.py
      - name: Detect source changes
        run: python3 factory/change_detector.py
      - name: Source librarian
        run: python3 factory/agents/source_librarian.py
      - name: Dedup indexer
        run: python3 factory/agents/dedup_indexer.py
      - name: Concept mapper
        run: python3 factory/agents/concept_mapper.py
      - name: Evidence agent
        run: python3 factory/agents/evidence_agent.py
      - name: Verification agent
        run: python3 factory/agents/verification_agent.py
      - name: Research agent
        run: python3 factory/agents/research_agent.py
      - name: Product agent
        run: python3 factory/agents/product_agent.py
      - name: QC agent
        run: python3 factory/agents/qc_agent.py
      - name: Publisher index
        run: python3 factory/run_stage.py factory/publisher.py
      - name: Agent supervisor
        run: python3 factory/agent_supervisor.py
      - name: Build cloud backup manifest
        run: python3 factory/cloud_sync.py
      - name: Build run report
        run: python3 factory/run_report.py
      - name: Upload QC and provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniverse-factory-qc-${{ github.run_number }}
          path: |
            generated/run-report.json
            generated/qc-report.json
            generated/verification-report.json
            generated/cloud-sync-manifest.json
            generated/concept-map.json
            generated/source-registry.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated outputs
        run: |
          git config user.name 'omniverse-factory[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated factory/agent-status.json
          git diff --cached --quiet || git commit -m 'chore: run omniverse research factory'
          git push

name: Omniverse Research Factory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-factory-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || (github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build repository intelligence
        run: python3 factory/repository_intelligence.py

      - name: Build free deterministic archive
        run: python3 factory/build_factory.py

      - name: Build incremental canonical knowledge layer
        run: python3 factory/canonical_knowledge.py

      - name: Build resumable canonical batches
        run: python3 factory/canonical_index.py

      - name: Build source integrity manifest
        run: python3 factory/source_integrity_manifest.py

      - name: Validate canonical knowledge records
        run: python3 factory/canonical_record_qc.py

      - name: Run resumable product batch worker
        run: python3 factory/batch_worker.py --batch-size 1000

      - name: Build deterministic reasoning, provenance and claim-evidence layer
        run: python3 factory/reasoning_pipeline.py

      - name: Run deterministic QC
        run: python3 factory/quality_control.py

      - name: Build deterministic formulation/test records
        run: python3 factory/formulation_records.py

      - name: Run formulation/test QC
        run: python3 factory/formulation_qc.py

      - name: Build independent verification queue
        run: python3 factory/verification_queue.py

      - name: Run verification queue QC
        run: python3 factory/verification_queue_qc.py

      - name: Build independent verification registry
        run: python3 factory/verification_registry.py

      - name: Run verification promotion gate
        run: python3 factory/verification_promotion_gate.py

      - name: Build research evidence traceability graph
        run: python3 factory/research_evidence_graph.py

      - name: Run research evidence graph QC
        run: python3 factory/research_evidence_graph_qc.py

      - name: Build unified publication safety gate
        run: python3 factory/publication_gate.py

      - name: Build durable continuity manifest
        run: python3 factory/continuity_manifest.py

      - name: Refresh dashboard factory status
        run: |
          test -s generated/agent-run/factory-status.json
          cp generated/agent-run/factory-status.json generated/factory-status.json

      - name: Validate generated catalog
        run: |
          test -s generated/repository-intelligence.json
          test -s generated/manifest.json
          test -s generated/source-integrity-manifest.json
          test -s generated/source-units.jsonl
          test -s generated/canonical-knowledge.jsonl
          test -s generated/canonical-knowledge-manifest.json
          test -s generated/CANONICAL-RECORD-QC.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("generated/CANONICAL-RECORD-QC.json").read_text())
          if report.get("publication_gate") != "PASS":
              raise SystemExit("Canonical record QC is not PASS")
          PY
          test -s generated/canonical-index.json
          test -s generated/verse-corpus.jsonl
          test -s generated/factory-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("generated/canonical-knowledge-manifest.json").read_text())
          if m.get("active_record_count",0) <= 0:
              raise SystemExit("Canonical knowledge layer has no active records")
          PY
          test -s generated/reasoning-manifest.jsonl
          test -s generated/claim-evidence.jsonl
          test -s generated/provenance-ledger.jsonl
          test -s generated/QC-REPORT.json
          test -s generated/formulation-records.jsonl
          test -s generated/FORMULATION-QC.json
          test -s generated/independent-verification-queue.jsonl
          test -s generated/VERIFICATION-QUEUE.json
          test -s generated/VERIFICATION-QUEUE-QC.json
          test -s generated/independent-verification-registry.jsonl
          test -s generated/VERIFICATION-REGISTRY.json
          test -s generated/VERIFICATION-PROMOTION-QC.json
          test -s generated/PUBLICATION-GATE.json
          test -s generated/research-evidence-graph.json
          test -s generated/RESEARCH-EVIDENCE-GRAPH.json
          test -s generated/RESEARCH-EVIDENCE-GRAPH-QC.json
          test -s generated/continuity-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("generated/QC-REPORT.json").read_text())
          queue=json.loads(Path("generated/VERIFICATION-QUEUE-QC.json").read_text())
          if queue.get("publication_gate") != "PASS":
              raise SystemExit("Independent verification queue QC is not PASS")
          if report.get("publication_gate") == "BLOCK":
              raise SystemExit("QC publication gate is BLOCK: deterministic QC found blocking integrity errors")
          if report.get("publication_gate") not in {"PASS", "CHECK"}:
              raise SystemExit("QC publication gate is invalid")
          formulation=json.loads(Path("generated/FORMULATION-QC.json").read_text())
          if formulation.get("publication_gate") != "PASS":
              raise SystemExit("Formulation/test QC gate is not PASS")
          promotion=json.loads(Path("generated/VERIFICATION-PROMOTION-QC.json").read_text())
          if promotion.get("publication_gate") == "BLOCK":
              raise SystemExit("Verification promotion gate is BLOCK: unearned verification detected")
          graph=json.loads(Path("generated/RESEARCH-EVIDENCE-GRAPH-QC.json").read_text())
          if graph.get("publication_gate") != "PASS":
              raise SystemExit("Research evidence graph QC is not PASS")
          publication=json.loads(Path("generated/PUBLICATION-GATE.json").read_text())
          if publication.get("publication_gate") == "BLOCK":
              raise SystemExit("Unified publication gate is BLOCK")
          PY

      - name: Archive oversized generated artifacts
        if: github.event_name != 'pull_request'
        run: python3 factory/archive_large_artifacts.py

      - name: Publish generated catalog through pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "omniverse-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add generated factory
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(factory): refresh research products"
          BRANCH="factory/generated-refresh"
          # Refresh the remote-tracking ref before force-with-lease so a prior
          # successful factory publication cannot make this run fail with
          # Git's "stale info" rejection.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git branch -f "$BRANCH" HEAD
          git push --force-with-lease origin "HEAD:$BRANCH"
          if gh pr list --base main --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base main --head "$BRANCH" --title "chore(factory): publish verified generated research products" --body "Automated publication PR created after the deterministic Heart-View factory gates passed. Protected source material is not rewritten. Generated outputs remain derivatives and subject to the repository verification policy."
          fi

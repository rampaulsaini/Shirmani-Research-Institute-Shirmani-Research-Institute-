name: Omniverse Research Factory

on:
  # Rebuild immediately after controlled main-branch changes, then continue on the 5-minute schedule.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      review_batch_size:
        description: "Number of independent-review tasks to package (1-1000)"
        required: false
        default: "25"
        type: string
      review_offset:
        description: "Zero-based queue offset for the review packet"
        required: false
        default: "0"
        type: string
  schedule:
    # Continuous resumable execution: every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-factory-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || (github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Validate AI-agent governance policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('schemas/agent-governance.json').read_text())
          required = {'intake_source','reasoning','evidence','verification','product','marketing','economic_transaction','security_audit','publishing','continuity'}
          if p.get('fail_closed') is not True or p.get('default_status') != 'unverified':
              raise SystemExit('Agent governance policy is not fail-closed')
          if set(p.get('agent_layers', [])) != required:
              raise SystemExit('Agent layer policy is incomplete')
          if p.get('authorization', {}).get('irreversible_actions') != 'owner_authorization_required':
              raise SystemExit('Owner authorization boundary is missing')
          if p.get('authorization', {}).get('verification_promotion') != 'independent_verification_required':
              raise SystemExit('Independent verification boundary is missing')
          if p.get('fabrication_prohibited') is not True or p.get('provenance_required_for_claims') is not True:
              raise SystemExit('Evidence/fabrication safeguards are missing')
          print('AI-agent governance policy: PASS')
          PY
      - name: Run deterministic runtime AI-agent governance QC
        run: python3 factory/agent_governance_qc.py

      - name: Build repository intelligence
        run: python3 factory/repository_intelligence.py
      - name: Build free deterministic archive
        run: python3 factory/build_factory.py
      - name: Build incremental canonical knowledge layer
        run: python3 factory/canonical_knowledge.py
      - name: Build resumable canonical batches
        run: python3 factory/canonical_index.py
      - name: Build source integrity manifest
        run: python3 factory/source_integrity_manifest.py
      - name: Validate canonical knowledge records
        run: python3 factory/canonical_record_qc.py
      - name: Run resumable product batch worker
        run: python3 factory/batch_worker.py --batch-size 1000
      - name: Build deterministic reasoning, provenance and claim-evidence layer
        run: python3 factory/reasoning_pipeline.py
      - name: Run Supreme NLP multimodal integrity smoke gate
        run: python3 factory/supreme_nlp_qc.py
      - name: Run Supreme NLP v3 calibration and abstention gate
        run: python3 factory/supreme_nlp_v3_qc.py
      - name: Run Supreme NLP v3 contract tests
        run: python3 tests/test_supreme_nlp_v3.py
      - name: Run Supreme NLP v3 adversarial hardening tests
        run: python3 tests/test_supreme_nlp_v3_hardening.py
      - name: Run deterministic QC
        run: python3 factory/quality_control.py
      - name: Build deterministic formulation/test records
        run: python3 factory/formulation_records.py
      - name: Run formulation/test QC
        run: python3 factory/formulation_qc.py
      - name: Build independent verification queue
        run: python3 factory/verification_queue.py
      - name: Run verification queue QC
        run: python3 factory/verification_queue_qc.py
      - name: Build independent verification registry
        run: python3 factory/verification_registry.py
      - name: Run verification promotion gate
        run: python3 factory/verification_promotion_gate.py
      - name: Determine resumable verification review cursor
        id: review_cursor
        env:
          INPUT_BATCH_SIZE: ${{ inputs.review_batch_size }}
          INPUT_OFFSET: ${{ inputs.review_offset }}
        run: |
          set -euo pipefail
          batch_size="${INPUT_BATCH_SIZE:-1000}"
          batch_size_num=$((10#${batch_size}))
          if [ -n "${INPUT_OFFSET:-}" ]; then
            offset="${INPUT_OFFSET}"
          else
            offset=0
            shopt -s nullglob
            for packet in generated/verification-review-packet-*.json; do
              name="${packet##*/}"
              range="${name#verification-review-packet-}"
              range="${range%.json}"
              end="${range##*-}"
              if [[ "$end" =~ ^[0-9]+$ ]] && [ "$end" -gt "$offset" ]; then
                offset="$end"
              fi
            done
          fi
          offset_num=$((10#${offset:-0}))
          echo "review_batch_size=$batch_size_num" >> "$GITHUB_OUTPUT"
          echo "review_offset=$offset_num" >> "$GITHUB_OUTPUT"
          echo "Resuming review queue at offset $offset with batch size $batch_size"
      - name: Prepare independent verification review packet
        env:
          REVIEW_BATCH_SIZE: ${{ steps.review_cursor.outputs.review_batch_size }}
          REVIEW_OFFSET: ${{ steps.review_cursor.outputs.review_offset }}
        run: |
          set -euo pipefail
          python3 factory/prepare_review_packet.py --batch-size "$REVIEW_BATCH_SIZE" --offset "$REVIEW_OFFSET"
      - name: Run independent verification packet QC
        run: python3 factory/review_packet_qc.py
      - name: Publish generated artifacts
        run: python3 factory/publish_artifacts.py

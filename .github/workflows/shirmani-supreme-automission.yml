name: Shirmani Supreme NLP • Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-automission
  cancel-in-progress: false

jobs:
  verify:
    name: Observe-Reason-Verify-Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Supreme NLP audit
        run: python scripts/supreme_nlp_audit.py

      - name: Validate evidence report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("generated/supreme-nlp-audit.json").read_text())
          assert data["all_fingerprints_present"]
          assert data["no_unverified_subjective_claims"]
          assert len(data["records"]) >= 3
          print("SUPREME_NLP_AUDIT=PASS")
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-audit
          path: generated/supreme-nlp-audit.json
          if-no-files-found: error

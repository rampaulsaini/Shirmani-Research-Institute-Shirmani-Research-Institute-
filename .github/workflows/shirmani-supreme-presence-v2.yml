name: SHIRMANI Supreme Presence v2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "automation/supreme_presence_v2.json"
      - "automation/supreme_presence_v2.py"
      - ".github/workflows/shirmani-supreme-presence-v2.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-presence-v2
  cancel-in-progress: true

jobs:
  contract-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run Supreme Presence v2 contract tests
        run: python automation/supreme_presence_v2.py
      - name: Upload deterministic status
        uses: actions/upload-artifact@v4
        with:
          name: supreme-presence-v2-status
          path: generated/supreme-presence-v2/
          if-no-files-found: error

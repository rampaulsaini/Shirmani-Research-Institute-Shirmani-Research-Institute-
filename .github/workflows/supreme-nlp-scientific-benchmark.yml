name: SHIRMANI Supreme NLP Scientific Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "factory/supreme_nlp_scientific_benchmark.py"
      - "tests/test_supreme_nlp_scientific_benchmark.py"
      - "schemas/supreme-nlp-evaluation.json"
      - ".github/workflows/supreme-nlp-scientific-benchmark.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-scientific-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax
        run: python -m py_compile factory/supreme_nlp_scientific_benchmark.py
      - name: Schema
        run: python -m json.tool schemas/supreme-nlp-evaluation.json >/dev/null
      - name: Regression tests
        run: python -m unittest tests/test_supreme_nlp_scientific_benchmark.py -v
      - name: Generate auditable benchmark report
        run: python factory/supreme_nlp_scientific_benchmark.py
      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("generated/supreme-nlp/scientific-benchmark.json",encoding="utf-8"))
          g=d["governance"]
          assert g["fail_closed"] is True
          assert g["accuracy_is_measured_not_declared"] is True
          assert g["synthetic_smoke_is_not_scientific_accuracy"] is True
          assert g["independent_verification_required"] is True
          assert g["subjective_experience_claim_allowed"] is False
          assert g["production_code_mutation_allowed"] is False
          print("SCIENTIFIC_BENCHMARK_GOVERNANCE: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-scientific-benchmark-${{ github.run_id }}
          path: generated/supreme-nlp/scientific-benchmark.json
          retention-days: 30

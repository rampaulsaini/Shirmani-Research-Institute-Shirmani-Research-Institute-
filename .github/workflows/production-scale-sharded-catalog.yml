name: SHIRMANI Production Scale — Sharded Catalogue & Public Directory

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generated/1000-digital-products.json"
      - "generated/PRODUCT-PRODUCTION-CONTRACT.json"
      - ".github/workflows/production-scale-sharded-catalog.yml"
      - "global-product-usage-directory.html"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-sharded-catalog-production
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load persistent production-state catalog when available
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git checkout FETCH_HEAD -- generated products
            echo "PRODUCTION_STATE_SOURCE=automation/production-state"
          else
            echo "PRODUCTION_STATE_SOURCE=main"
          fi
      - name: Build 150,000-scale shard architecture
        shell: python
        run: |
          import json, math
          from pathlib import Path
          from datetime import datetime, timezone
          root=Path(".")
          data=json.loads((root/"generated/1000-digital-products.json").read_text(encoding="utf-8"))
          products=data.get("products", [])
          if not products:
              raise SystemExit("Canonical product catalogue is empty; refusing to rewrite shards.")
          seen=set()
          for product in products:
              pid=str(product.get("id", "")).strip()
              if not pid:
                  raise SystemExit("Product row is missing a stable ID; refusing to publish shards.")
              if pid in seen:
                  raise SystemExit(f"Duplicate product ID {pid!r}; refusing to publish shards.")
              seen.add(pid)
          shard_size=1000
          target_capacity=150000
          out=root/"generated/catalog-shards"
          out.mkdir(parents=True, exist_ok=True)
          for old in out.glob("catalog-*.json"):
              old.unlink()
          shard_count=max(1, math.ceil(len(products)/shard_size))
          for i in range(shard_count):
              rows=products[i*shard_size:(i+1)*shard_size]
              payload={"shard_id":f"catalog-{i+1:04d}","capacity":shard_size,"materialized_count":len(rows),"catalogue_capacity_total":target_capacity,"products":rows}
              (out/f"catalog-{i+1:04d}.json").write_text(json.dumps(payload,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          manifest_path=root/"generated/catalog-shard-manifest.json"
          manifest={"materialized_products":len(products),"shard_size":shard_size,"materialized_shards":shard_count,"catalogue_capacity":target_capacity,"remaining_capacity":max(0,target_capacity-len(products)),"directory_contract":"global-product-usage-directory.html","source":"generated/1000-digital-products.json"}
          generated_at=datetime.now(timezone.utc).isoformat()
          try:
              previous=json.loads(manifest_path.read_text(encoding="utf-8"))
              previous_semantic={key:value for key,value in previous.items() if key!="generated_at_utc"}
              if previous_semantic==manifest and previous.get("generated_at_utc"):
                  generated_at=previous["generated_at_utc"]
                  print("Shard manifest unchanged; preserving timestamp to avoid a no-op diff.")
          except (OSError, json.JSONDecodeError):
              pass
          manifest["generated_at_utc"]=generated_at
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False))
      - name: Publish sharded catalogue through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat(catalog): maintain 150000-scale sharded product directory"
          title: "Automission: refresh sharded product directory"
          body: |
            Refreshes bounded 1,000-product catalogue shards and the public-directory manifest.
            Empty catalogues and missing/duplicate product IDs fail closed.
            Generated changes are proposed for review; protected main is never pushed directly.
            Timestamp-only manifest churn is suppressed when semantic fields are unchanged.
          branch: "automation/sharded-catalog-publish"
          delete-branch: true
          add-paths: |
            generated/catalog-shards
            generated/catalog-shard-manifest.json

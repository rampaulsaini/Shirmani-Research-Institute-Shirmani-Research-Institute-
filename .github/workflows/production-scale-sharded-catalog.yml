name: SHIRMANI Production Scale — Sharded Catalogue & Public Directory

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generated/1000-digital-products.json"
      - "generated/PRODUCT-PRODUCTION-CONTRACT.json"
      - ".github/workflows/production-scale-sharded-catalog.yml"
      - "global-product-usage-directory.html"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-sharded-catalog-production
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load persistent production-state catalog when available
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/production-state >/dev/null 2>&1; then
            git fetch origin automation/production-state
            git checkout FETCH_HEAD -- generated products
            echo "PRODUCTION_STATE_SOURCE=automation/production-state"
          else
            echo "PRODUCTION_STATE_SOURCE=main"
          fi
      - name: Build and validate sharded catalogue transactionally
        shell: python
        run: |
          import json, math, os, shutil, tempfile
          from pathlib import Path
          from datetime import datetime, timezone
          root=Path(".")
          generated=root/"generated"
          data=json.loads((generated/"1000-digital-products.json").read_text(encoding="utf-8"))
          products=data.get("products", [])
          if not products:
              raise SystemExit("Canonical product catalogue is empty; refusing to rewrite shards.")
          ids=[]
          seen=set()
          for product in products:
              pid=str(product.get("id", "")).strip()
              if not pid:
                  raise SystemExit("Product row is missing a stable ID; refusing to publish shards.")
              if pid in seen:
                  raise SystemExit(f"Duplicate product ID {pid!r}; refusing to publish shards.")
              seen.add(pid)
              ids.append(pid)
          shard_size=1000
          target_capacity=150000
          out=generated/"catalog-shards"
          manifest_path=generated/"catalog-shard-manifest.json"
          with tempfile.TemporaryDirectory(prefix=".catalog-shards-stage-", dir=generated) as temp_name:
              staging=Path(temp_name)
              staged_out=staging/"catalog-shards"
              staged_out.mkdir()
              shard_count=max(1, math.ceil(len(products)/shard_size))
              for i in range(shard_count):
                  rows=products[i*shard_size:(i+1)*shard_size]
                  payload={"shard_id":f"catalog-{i+1:04d}","capacity":shard_size,"materialized_count":len(rows),"catalogue_capacity_total":target_capacity,"products":rows}
                  (staged_out/f"catalog-{i+1:04d}.json").write_text(json.dumps(payload,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
              manifest={"materialized_products":len(products),"shard_size":shard_size,"materialized_shards":shard_count,"catalogue_capacity":target_capacity,"remaining_capacity":max(0,target_capacity-len(products)),"directory_contract":"global-product-usage-directory.html","source":"generated/1000-digital-products.json"}
              generated_at=datetime.now(timezone.utc).isoformat()
              try:
                  previous=json.loads(manifest_path.read_text(encoding="utf-8"))
                  previous_semantic={key:value for key,value in previous.items() if key!="generated_at_utc"}
                  if previous_semantic==manifest and previous.get("generated_at_utc"):
                      generated_at=previous["generated_at_utc"]
                      print("Shard manifest unchanged; preserving timestamp to avoid a no-op diff.")
              except (OSError, json.JSONDecodeError, AttributeError):
                  pass
              manifest["generated_at_utc"]=generated_at
              staged_manifest=staging/"catalog-shard-manifest.json"
              staged_manifest.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              # Validate the complete staged output before touching existing production files.
              staged_ids=[]
              shard_files=sorted(staged_out.glob("catalog-*.json"))
              if len(shard_files)!=shard_count:
                  raise SystemExit("Staged shard count does not match the manifest.")
              for index, shard_file in enumerate(shard_files, start=1):
                  shard=json.loads(shard_file.read_text(encoding="utf-8"))
                  if shard.get("shard_id")!=f"catalog-{index:04d}":
                      raise SystemExit("Staged shard IDs are not contiguous.")
                  rows=shard.get("products")
                  if not isinstance(rows,list) or shard.get("materialized_count")!=len(rows):
                      raise SystemExit("Staged shard count metadata is inconsistent.")
                  staged_ids.extend(str(row.get("id","")).strip() for row in rows)
              checked_manifest=json.loads(staged_manifest.read_text(encoding="utf-8"))
              if staged_ids!=ids or checked_manifest.get("materialized_products")!=len(staged_ids) or checked_manifest.get("materialized_shards")!=len(shard_files):
                  raise SystemExit("Staged shards do not match the canonical catalogue and manifest.")
              # Swap both outputs with rollback if either replacement fails.
              backup_out=staging/"previous-catalog-shards"
              backup_manifest=staging/"previous-catalog-shard-manifest.json"
              had_out=out.exists()
              had_manifest=manifest_path.exists()
              if had_out:
                  os.replace(out,backup_out)
              installed_out=False
              installed_manifest=False
              try:
                  if had_manifest:
                      os.replace(manifest_path,backup_manifest)
                  os.replace(staged_out,out)
                  installed_out=True
                  os.replace(staged_manifest,manifest_path)
                  installed_manifest=True
              except Exception:
                  if installed_out and out.exists():
                      shutil.rmtree(out)
                  if installed_manifest and manifest_path.exists():
                      manifest_path.unlink()
                  if had_out and backup_out.exists():
                      os.replace(backup_out,out)
                  if had_manifest and backup_manifest.exists():
                      if manifest_path.exists():
                          manifest_path.unlink()
                      os.replace(backup_manifest,manifest_path)
                  raise
          print(json.dumps(manifest,ensure_ascii=False))
      - name: Publish sharded catalogue through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat(catalog): maintain 150000-scale sharded product directory"
          title: "Automission: refresh sharded product directory"
          body: |
            Refreshes bounded 1,000-product catalogue shards and the public-directory manifest.
            Empty catalogues and missing/duplicate product IDs fail closed.
            Generated changes are proposed for review; protected main is never pushed directly.
            Timestamp-only manifest churn is suppressed when semantic fields are unchanged.
          branch: "automation/sharded-catalog-publish"
          delete-branch: true
          add-paths: |
            generated/catalog-shards
            generated/catalog-shard-manifest.json

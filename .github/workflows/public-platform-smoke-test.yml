name: Public Platform Smoke Test

on:
  pull_request:
    paths:
      - "server/**"
      - "schemas/**"
      - "docs/public-platform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install
        working-directory: server
        run: npm install
      - name: Syntax
        working-directory: server
        run: npm run check
      - name: Health without database
        working-directory: server
        run: |
          node -e "process.env.PORT='8787'; import('./src/index.js'); setTimeout(async()=>{const r=await fetch('http://127.0.0.1:8787/health'); const j=await r.json(); if(j.status!=='READY') process.exit(1); console.log(j); process.exit(0)},1200)"

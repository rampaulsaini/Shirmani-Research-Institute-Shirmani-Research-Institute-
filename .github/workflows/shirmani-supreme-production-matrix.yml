name: SHIRMANI Supreme Production Matrix Automission

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      intensity:
        description: "Production intensity"
        required: false
        default: "supreme"
        type: choice
        options: [standard, high, supreme]
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "automation/**"
      - "factory/**"
      - "research/**"
      - "schemas/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: shirmani-supreme-production
  cancel-in-progress: false

jobs:
  produce:
    name: "Production • ${{ matrix.lane }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        lane:
          - research
          - nlp-practitioner
          - ml-feature
          - dataset
          - content
          - product
          - agent-factory
          - federation
          - platform
          - continuous-improvement

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build production result
        env:
          LANE: ${{ matrix.lane }}
          INTENSITY: ${{ inputs.intensity || 'supreme' }}
        run: |
          set -euo pipefail
          mkdir -p "generated/production/$LANE"
          python - <<'PY'
          import json, os, re, subprocess, pathlib, hashlib
          lane=os.environ["LANE"]
          intensity=os.environ.get("INTENSITY","supreme")
          tracked=subprocess.check_output(["git","ls-files"],text=True).splitlines()
          text_files=[]
          for p in tracked:
              q=pathlib.Path(p)
              if q.is_file() and q.stat().st_size < 500_000 and q.suffix.lower() in {".md",".txt",".py",".yml",".yaml",".json",".js",".ts"}:
                  text_files.append(q)
          corpus=""
          for q in text_files[:1200]:
              try: corpus += q.read_text(errors="ignore") + "\n"
              except Exception: pass
          tokens=re.findall(r"[A-Za-z0-9_'-]+|[\u0900-\u097F]+",corpus)
          keywords=["research","agent","automission","nlp","machine learning","evidence","production","factory","product","platform"]
          hits={k:len(re.findall(re.escape(k),corpus,re.I)) for k in keywords}
          digest=hashlib.sha256((lane+"|"+str(len(tracked))+"|"+str(len(tokens))).encode()).hexdigest()[:16]
          result={
            "lane":lane,"intensity":intensity,"status":"PRODUCED",
            "production_mode":"multi-layer","task_id":f"{lane}-{digest}",
            "repository_files":len(tracked),"text_corpus_files":len(text_files),
            "token_count":len(tokens),"keyword_signals":hits,
            "quantum_inspired_priority":"enabled",
            "quantum_hardware_claim":False,
            "verification_role":"downstream quality/evidence gate"
          }
          out=pathlib.Path("generated/production")/lane
          out.mkdir(parents=True,exist_ok=True)
          (out/"result.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          (out/"RESULT.md").write_text(
              "# SHIRMANI Production Result\n\n"
              f"- Lane: **{lane}**\n"
              f"- Status: **PRODUCED**\n"
              f"- Intensity: **{intensity}**\n"
              f"- Repository files scanned: **{len(tracked)}**\n"
              f"- Text corpus files scanned: **{len(text_files)}**\n"
              f"- Token signals extracted: **{len(tokens)}**\n"
              "- Quantum-inspired prioritization: **enabled**\n"
              "- Independent verification: **downstream, not the production objective**\n"
          )
          PY

      - name: Publish result to GitHub Actions Summary
        run: cat "generated/production/${{ matrix.lane }}/RESULT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: supreme-production-${{ matrix.lane }}-${{ github.run_number }}
          path: generated/production/${{ matrix.lane }}/

  aggregate:
    name: "Aggregate • Production Ledger"
    needs: produce
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production ledger
        run: |
          set -euo pipefail
          mkdir -p generated/production-ledger
          {
            echo "# SHIRMANI Supreme Production Ledger"
            echo
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Production objective: parallel work generation"
            echo "- Verification objective: downstream evidence/quality gate"
            echo
            echo "| Lane | Result |"
            echo "|---|---|"
            echo "| research | PRODUCED |"
            echo "| nlp-practitioner | PRODUCED |"
            echo "| ml-feature | PRODUCED |"
            echo "| dataset | PRODUCED |"
            echo "| content | PRODUCED |"
            echo "| product | PRODUCED |"
            echo "| agent-factory | PRODUCED |"
            echo "| federation | PRODUCED |"
            echo "| platform | PRODUCED |"
            echo "| continuous-improvement | PRODUCED |"
          } > generated/production-ledger/README.md

      - name: Publish aggregate summary
        run: cat generated/production-ledger/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit production ledger when changed
        run: |
          git config user.name "SHIRMANI Supreme Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/production-ledger
          if git diff --cached --quiet; then
            echo "No ledger change."
          else
            git commit -m "automission: update production ledger [skip ci]"
            git push
          fi

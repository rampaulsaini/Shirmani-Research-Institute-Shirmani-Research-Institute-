name: SHIRMANI Product Media Factory
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Products to materialize with MP4 + VIP screenshot"
        required: false
        default: "10"
permissions:
  contents: write
concurrency:
  group: shirmani-product-media-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Install media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow qrcode
          ffmpeg -version | head -n 1
      - name: Produce next media batch
        env:
          MEDIA_BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
        run: python scripts/product_media_factory.py
      - name: Commit generated media
        run: |
          git config user.name "SHIRMANI Product Media Factory"
          git config user.email "actions@users.noreply.github.com"
          git add products/demos products/vip-screenshots generated/product-media-production-manifest.json generated/product-vip-screenshot-manifest.json
          if git diff --cached --quiet; then echo "No new media generated."; exit 0; fi
          git commit -m "production: materialize product demo media batch"
          git push

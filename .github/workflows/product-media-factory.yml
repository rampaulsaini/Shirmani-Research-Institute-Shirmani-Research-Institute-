name: SHIRMANI Product Media Factory
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Products to materialize with MP4 + VIP screenshot"
        required: false
        default: "10"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-product-media-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Install media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow qrcode
          ffmpeg -version | head -n 1
      - name: Test legacy manifest compatibility
        run: python3 -m unittest tests/test_media_manifest_compat.py -v
      - name: Produce next media batch
        env:
          MEDIA_BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
        run: python scripts/product_media_factory.py
      - name: Publish generated media through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "production: materialize product demo media batch"
          title: "Automission: publish product demo media batch"
          body: |
            Publishes the bounded product-media factory output through the repository's required pull-request path.
            Manifest compatibility tests run before generation; media functionality and rendered-output QC remain separate checks.
          branch: "automission/product-media-factory-batch"
          delete-branch: true
          add-paths: |
            products/demos
            products/vip-screenshots
            generated/product-media-production-manifest.json
            generated/product-vip-screenshot-manifest.json

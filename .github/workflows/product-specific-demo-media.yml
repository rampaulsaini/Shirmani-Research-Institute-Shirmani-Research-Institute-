name: SHIRMANI Product-Specific Demo Media — Continuous Production [Production Acceleration]

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product-specific MP4s to create this cycle"
        required: false
        default: "20"
  push:
    branches: [main]
    paths:
      - "factory/product_specific_demo_video_factory.py"
      - ".github/workflows/product-specific-demo-media.yml"
      - "generated/1000-digital-products.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-specific-demo-media
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Produce product-specific MP4 explainers
        env:
          PRODUCT_DEMO_BATCH: ${{ github.event.inputs.batch_size || '50' }}
        run: python3 factory/product_specific_demo_video_factory.py
      - name: Propose product-specific demo media through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/product-specific-demo-media
          delete-branch: false
          add-paths: |
            products/demos/products
            products/demos/vip
            generated/product-specific-demo-video-manifest.json
            generated/product-media-production-manifest.json
          commit-message: "feat(media): publish product-specific demo MP4 batch"
          title: "feat(media): publish product-specific demo MP4 batch"
          body: |
            Automated product-specific demo media batch.

            Review generated MP4 assets and manifests before merging.
          labels: |
            automated
            product-media
      - name: Publish production telemetry
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("generated/product-specific-demo-video-manifest.json",encoding="utf-8"))
          print("Product-specific MP4s:", d["real_mp4_count"])
          print("Remaining:", d["remaining_real_mp4"])
          print("Batch:", d["created_this_cycle"])
          PY

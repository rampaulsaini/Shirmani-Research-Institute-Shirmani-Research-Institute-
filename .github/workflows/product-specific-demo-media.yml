name: SHIRMANI Product-Specific Demo Media — Continuous Production [Production Acceleration]

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Product-specific MP4s to create this cycle"
        required: false
        default: "20"
  push:
    branches: [main]
    paths:
      - "factory/product_specific_demo_video_factory.py"
      - ".github/workflows/product-specific-demo-media.yml"
      - "generated/1000-digital-products.json"

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-product-specific-demo-media
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Produce product-specific MP4 explainers
        env:
          PRODUCT_DEMO_BATCH: ${{ github.event.inputs.batch_size || '50' }}
        run: python3 factory/product_specific_demo_video_factory.py
      - name: Publish product-specific demo media through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automission/product-specific-demo-media
          delete-branch: false
          commit-message: "feat(media): publish product-specific demo MP4 batch"
          title: "Automission: publish product-specific demo media"
          body: |
            Automated product-specific demo media batch.
            Media generation does not claim independent QC or live avatar integration.
          add-paths: |
            products/demos/products
            products/demos/vip
            generated/product-specific-demo-video-manifest.json
            generated/product-media-production-manifest.json

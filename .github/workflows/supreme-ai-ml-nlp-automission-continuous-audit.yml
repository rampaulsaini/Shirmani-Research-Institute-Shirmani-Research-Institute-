name: Supreme AI-ML-NLP Automission Continuous Audit

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-automission-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "docs/supreme-ai-ml-nlp-automission-total-graph-2026-10-01.md"
            "docs/supreme-ai-ml-nlp-automission-operating-contract.md"
            "schemas/supreme-nlp-signal-record.schema.json"
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "CRITICAL: missing or empty $f"; exit 1; }
          done

      - name: Validate JSON schema syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("schemas/supreme-nlp-signal-record.schema.json")
          json.loads(p.read_text(encoding="utf-8"))
          print("Schema JSON: PASS")
          PY

      - name: Run repository smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/supreme-ai-ml-nlp-automission-total-graph-2026-10-01.md
          grep -q "Observe → Collect → Normalize → Analyze → Reason → Execute → Test → Verify → Audit → Learn → Improve" docs/supreme-ai-ml-nlp-automission-total-graph-2026-10-01.md
          grep -q "Accuracy is measured" docs/supreme-ai-ml-nlp-automission-total-graph-2026-10-01.md
          echo "Repository smoke checks: PASS"

      - name: Run independent-verification status gate
        shell: bash
        run: |
          set -euo pipefail
          python factory/independent_verification_status.py | tee /tmp/independent-verification-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("/tmp/independent-verification-status.json").read_text())
          queue = status["queue_total"]
          registry = status["registry_total"]
          verified = status["verified_records"]
          prepared = status["prepared_review_records"]
          if registry != queue:
              raise SystemExit(f"CRITICAL: registry_total={registry} does not match queue_total={queue}")
          if verified > queue:
              raise SystemExit(f"CRITICAL: verified_records={verified} exceeds queue_total={queue}")
          print(f"Verification gate: PASS | queue={queue} registry={registry} prepared={prepared} verified={verified}")
          with open("/tmp/verification-summary.md", "w", encoding="utf-8") as f:
              f.write("## Independent Verification Gate\\n")
              f.write(f"- Queue: {queue}\\n")
              f.write(f"- Registry: {registry}\\n")
              f.write(f"- Prepared review records: {prepared}\\n")
              f.write(f"- VERIFIED records: {verified}\\n")
              f.write(f"- VERIFIED % of queue: {status['verified_percent_of_queue']}%\\n")
              f.write("- Policy: workflow success is not independent verification\\n")
              f.write("- Human review required for VERIFIED promotion: " + str(status["human_review_required_for_verified_promotion"]) + "\\n")
          PY
          cat /tmp/verification-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Emit audit summary
        shell: bash
        run: |
          {
            echo "## Supreme Automission Audit"
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Commit: $GITHUB_SHA"
            echo "- Schema: PASS"
            echo "- Canonical graph: PASS"
            echo "- Smoke checks: PASS"
            echo "- Independent verification gate: PASS"
            echo "- Verification: independent verification remains a distinct stage"
          } >> "$GITHUB_STEP_SUMMARY"

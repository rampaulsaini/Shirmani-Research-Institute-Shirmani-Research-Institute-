name: SHIRMANI Product Visual Factory

on:
  push:
    paths:
      - "products/concrete/**"
      - "factory/product_visual_identity_factory_v2.py"
      - ".github/workflows/shirmani-product-visual-factory.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-visual-factory
  cancel-in-progress: false

jobs:
  generate-product-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate canonical 4K product visuals
        env:
          VISUAL_BATCH: "5000"
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Propose generated visuals through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/product-visuals
          base: main
          delete-branch: false
          commit-message: "production: refresh unique product visuals"
          title: "Automission: refresh generated product visuals"
          body: |
            Automated product-visual generation proposal.
            Review visual identity, generated files, and QC before merging.
            This workflow does not push directly to protected main.
          add-paths: |
            products/visuals

name: SHIRMANI Product Visual Factory

on:
  push:
    paths:
      - "products/concrete/**"
      - "factory/product_visual_identity_factory_v2.py"
      - ".github/workflows/shirmani-product-visual-factory.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel an active catalogue batch: partial visual refreshes are resumable,
# but cancellation during a write/push can leave work unfinished and trigger churn.
concurrency:
  group: shirmani-product-visual-factory
  cancel-in-progress: false

jobs:
  generate-product-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate canonical 4K product visuals
        env:
          VISUAL_BATCH: "5000"
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Commit visual production
        run: |
          git config user.name "SHIRMANI Product Visual Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/visuals
          if git diff --cached --quiet; then
            echo "No visual changes required."
            exit 0
          fi
          git commit -m "production: refresh unique 4K visuals for concrete products"
          git push

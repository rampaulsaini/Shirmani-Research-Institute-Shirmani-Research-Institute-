name: SHIRMANI Product Visual Factory

on:
  push:
    paths:
      - "products/concrete/**"
      - "factory/product_visual_identity_factory_v2.py"
      - ".github/workflows/shirmani-product-visual-factory.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-visual-factory
  cancel-in-progress: false

jobs:
  generate-product-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate bounded canonical product visuals
        env:
          VISUAL_BATCH: "100"
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Stage generated VISUAL outputs without bypassing protected main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Automission"
          git config user.email "actions@users.noreply.github.com"
          git add products/visuals generated/product-visual-assets-v2.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "automission: stage visual production outputs"
          branch="automation/product-visual-assets-staging"
          if remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)" && [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin HEAD:"refs/heads/$branch"
          else
            git push origin HEAD:"refs/heads/$branch"
          fi
          echo "Staging branch updated: automation/product-visual-assets-staging. Protected main was not pushed."

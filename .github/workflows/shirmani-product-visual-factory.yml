name: SHIRMANI Product Visual Factory

on:
  push:
    paths:
      - "products/concrete/**"
      - "factory/product_visual_identity_factory_v2.py"
      - ".github/workflows/shirmani-product-visual-factory.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-product-visual-factory
  cancel-in-progress: false

jobs:
  generate-product-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate bounded canonical product visuals
        env:
          VISUAL_BATCH: "100"
        run: python3 factory/product_visual_identity_factory_v2.py
      - name: Propose visual production changes through a PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/product-visual-assets
          delete-branch: false
          commit-message: "production: refresh bounded product visual batch"
          title: "production: publish bounded product visual batch"
          body: |
            Automated, bounded product visual refresh.
            This change is proposed through a pull request so repository rules on main remain enabled.
            Visual generation and QC are not sales, delivery, or independent verification.
          add-paths: |
            products/visuals/**
            generated/product-visual-assets-v2.json

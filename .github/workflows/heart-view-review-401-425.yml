name: SHIRMANI Heart-View Review Slice 401-425

on:
  workflow_dispatch:
paths:
      - "CONTINUE-REVIEW-SLICE-000401-000425.trigger"

permissions:
  contents: write

concurrency:
  group: shirmani-heart-view-review-401-425
  cancel-in-progress: false

jobs:
  build-review-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact committed queue and registry
        run: |
          set -euo pipefail
          test -s generated/independent-verification-queue.jsonl.gz
          test -s generated/independent-verification-registry.jsonl.gz
          gzip -dc generated/independent-verification-queue.jsonl.gz > generated/independent-verification-queue.jsonl
          gzip -dc generated/independent-verification-registry.jsonl.gz > generated/independent-verification-registry.jsonl
      - name: Generate exact hash-bound review packet 401-425
        run: python3 factory/verification_review_packet.py --batch-size 25 --offset 400
      - name: Run fail-closed packet QC
        run: python3 factory/verification_review_packet_qc.py --packet generated/verification-review-packet-000401-000425.json
      - name: Record durable continuation result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path("generated/verification-review-packet-000401-000425.json").read_text())
          qc = json.loads(Path("generated/VERIFICATION-PACKET-QC.json").read_text())
          if packet.get("status") != "READY_FOR_HUMAN_REVIEW":
              raise SystemExit("packet is not READY_FOR_HUMAN_REVIEW")
          if qc.get("publication_gate") != "PASS":
              raise SystemExit("packet QC did not PASS")
          Path("CONTINUATION-REVIEW-SLICE-000401-000425-QC.md").write_text(
              "# SHIRMANI HEART-VIEW — REVIEW SLICE 401–425\n\n"
              "Generated from the exact committed compressed queue/registry; no records were reconstructed by inference.\n\n"
              f"- Packet: generated/verification-review-packet-000401-000425.json\n"
              f"- Records: {packet.get('records')}\n"
              f"- Packet status: {packet.get('status')}\n"
              f"- Packet QC: {qc.get('publication_gate')}\n"
              "- Human verification: NOT PERFORMED\n"
              "- VERIFIED promotion: 0\n\n"
              "**Preserve first. Reason second. Verify third. Transform only as a traceable derivative.**\n",
              encoding="utf-8",
          )
          PY
          rm -f generated/independent-verification-queue.jsonl generated/independent-verification-registry.jsonl generated/VERIFICATION-PACKET-QC.json
      - name: Commit review slice
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/verification-review-packet-000401-000425.json CONTINUATION-REVIEW-SLICE-000401-000425-QC.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: generate exact Heart-View review slice 401-425"
          git push

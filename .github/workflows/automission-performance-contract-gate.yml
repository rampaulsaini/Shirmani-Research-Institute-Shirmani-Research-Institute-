name: AI ML NLP Automission Performance Contract Gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate measurable performance boundary
        run: python scripts/validate_automission_performance_contract.py

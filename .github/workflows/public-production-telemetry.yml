name: SHIRMANI Multi-Layer Public Production Telemetry
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
permissions: {contents: write}
jobs:
  telemetry:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 factory/public_production_status.py
      - name: Commit public telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add generated/multi-layer-production-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(telemetry): refresh public multi-layer production status [skip ci]"
          git push origin HEAD:main

name: Research Factory Contract Validation

on:
  push:
    branches: ["main", "factory/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing factory agents
        run: python3 factory/validate_factory.py

      - name: Validate JSON and canonical research contracts
        run: python3 scripts/validate_factory.py

      - name: Inventory checked-out content deterministically
        run: |
          mkdir -p /tmp/research-factory
          python3 factory/content_ingest.py . /tmp/research-factory/content-records.jsonl
          python3 factory/normalize_corpus.py /tmp/research-factory/content-records.jsonl /tmp/research-factory/corpus-units.jsonl
          python3 factory/extract_concepts.py /tmp/research-factory/corpus-units.jsonl /tmp/research-factory/concept-candidates.jsonl
          test -s /tmp/research-factory/content-records.jsonl
          test -s /tmp/research-factory/corpus-units.jsonl
          test -s /tmp/research-factory/concept-candidates.jsonl

      - name: Run corpus normalization regression
        working-directory: factory
        run: python3 normalize_corpus_test.py
          python3 extract_concepts_test.py

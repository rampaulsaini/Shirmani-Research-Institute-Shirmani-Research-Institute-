name: SHIRMANI Supreme Quality Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "factory/**"
      - "agents/**"
      - "schemas/**"
      - "federation/**"
      - "docs/yatharth-governance/**"
      - "research/independent-verification-protocol-2026-09-29.md"
      - "generated/independent-verification-status-2026-09-29.json"
      - ".github/workflows/shirmani-supreme-quality-orchestrator.yml"
  pull_request:
    paths:
      - "factory/**"
      - "agents/**"
      - "schemas/**"
      - "federation/**"
      - "docs/yatharth-governance/**"
      - "research/independent-verification-protocol-2026-09-29.md"
      - "generated/independent-verification-status-2026-09-29.json"
      - ".github/workflows/shirmani-supreme-quality-orchestrator.yml"

concurrency:
  group: shirmani-supreme-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-gate:
    name: Deterministic fail-closed quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python baseline
        run: python3 --version

      - name: Run Supreme Quality Controller
        run: python3 factory/supreme_quality_gate.py

      - name: Verify generated report
        if: always()
        run: |
          set -euo pipefail
          test -s generated/SUPREME-QUALITY-REPORT.json
          python3 - <<'PY'
          import json
          p="generated/SUPREME-QUALITY-REPORT.json"
          d=json.load(open(p, encoding="utf-8"))
          assert d["status"] == "PASS", d
          assert d["accuracy_claim"] == "NOT_ASSERTED"
          assert d["independent_verification_claim"] == "NOT_ASSERTED"
          assert d["checks_passed"] == d["checks_total"]
          print("SUPREME QUALITY GATE: PASS")
          PY

      - name: Upload immutable quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-supreme-quality-report-${{ github.run_id }}
          path: generated/SUPREME-QUALITY-REPORT.json
          if-no-files-found: error
          retention-days: 14

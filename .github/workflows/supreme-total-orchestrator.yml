name: SHIRMANI Supreme Total AI-ML-NLP Automission
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: ["agents/**","factory/**","schemas/**","docs/**","research/**",".github/workflows/supreme-total-orchestrator.yml"]
permissions:
  contents: read
concurrency:
  group: shirmani-supreme-total-automission
  cancel-in-progress: false
jobs:
  supreme-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Compile control plane
        run: |
          python -m py_compile factory/supreme_system_orchestrator.py factory/supreme_nlp_benchmark.py
          python -m py_compile agents/automission_supervisor.py agents/supreme_nlp_practitioner.py
      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fs=list(Path("schemas").rglob("*.json"))
          for p in fs: json.loads(p.read_text(encoding="utf-8"))
          print(f"JSON schemas validated: {len(fs)}")
          PY
      - name: Run unified Supreme gates
        run: python factory/supreme_system_orchestrator.py | tee supreme-orchestrator.log
      - name: Run explicit Supreme NLP regression benchmark
        run: python factory/supreme_nlp_benchmark.py
      - name: Validate fail-closed governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-orchestrator/status.json").read_text())
          g=d["governance"]
          assert d["status"]=="PASS"
          assert g["fail_closed"] and not g["scheduled_code_mutation_allowed"]
          print("SUPREME_FAIL_CLOSED_GOVERNANCE=PASS")
          PY
      - name: Validate repository architecture contract
        run: python scripts/validate_supreme_architecture.py

name: SHIRMANI Supreme Total AI-ML-NLP Automission
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: ["agents/**","factory/**","schemas/**","docs/**","research/**",".github/workflows/supreme-total-orchestrator.yml"]
permissions:
  contents: read
concurrency:
  group: shirmani-supreme-total-automission
  cancel-in-progress: true
jobs:
  supreme-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.x"}
      - name: Compile control plane
        run: |
          python -m py_compile factory/supreme_system_orchestrator.py factory/supreme_nlp_benchmark.py
          python -m py_compile agents/automission_supervisor.py agents/supreme_nlp_practitioner.py
      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fs=list(Path("schemas").rglob("*.json"))
          for p in fs: json.loads(p.read_text(encoding="utf-8"))
          print(f"JSON schemas validated: {len(fs)}")
          PY
      - name: Run unified Supreme gates
        run: python factory/supreme_system_orchestrator.py | tee supreme-orchestrator.log
      - name: Run explicit Supreme NLP regression benchmark
        run: python factory/supreme_nlp_benchmark.py
      - name: Validate fail-closed governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-orchestrator/status.json").read_text())
          g=d["governance"]
          assert d["status"]=="PASS"
          assert g["fail_closed"] and not g["scheduled_code_mutation_allowed"]
          assert not g["subjective_experience_claim_allowed"]
          assert g["independent_verification_required"] and g["accuracy_is_measured_not_declared"]
          print("SUPREME_GOVERNANCE_GATE: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-total-automission-${{ github.run_id }}
          path: |
            generated/supreme-orchestrator/status.json
            supreme-orchestrator.log
            generated/supreme-nlp/benchmark.json
          if-no-files-found: error
          retention-days: 14
      - name: Emit cycle summary
        run: |
          {
            echo "## SHIRMANI Supreme Total Automission"
            echo "- Cycle: 5-minute"
            echo "- Unified gates: PASS"
            echo "- Fail-closed governance: PASS"
            echo "- Scheduled production-code mutation: BLOCKED"
            echo "- Independent verification: REQUIRED"
            echo "- Accuracy: measured, not declared"
          } >> "$GITHUB_STEP_SUMMARY"

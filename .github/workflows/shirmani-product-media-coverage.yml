name: SHIRMANI Product Media Coverage Telemetry

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/product_media_coverage.py"
      - "generated/1000-digital-products.json"
      - "generated/production-registry.json"
      - "generated/concrete-production-overlay.json"

permissions:
  contents: read

concurrency:
  group: shirmani-product-media-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Measure customer-facing product media coverage
        run: python3 factory/product_media_coverage.py
      - name: Emit concise coverage summary
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = json.loads(Path("generated/product-media-coverage.json").read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "## SHIRMANI Product Media Coverage",
              "",
              f"- Products measured: **{report['product_count']}**",
              f"- Complete media packages: **{report['complete_media_package_count']}** ({report['complete_media_package_percent']}%)",
              f"- Catalog source: `{report['catalog_source']}`",
              f"- Generated at (UTC): `{report['generated_at']}`",
              "",
              "| Asset check | Present | Coverage |",
              "|---|---:|---:|",
          ]
          for key, count in report["summary"].items():
              lines.append(f"| {key} | {count} | {report['coverage_percent'][key]}% |")
          lines += ["", f"> {report['truth_boundary']}", ""]
          with summary.open("a", encoding="utf-8") as f:
              f.write("\n".join(lines))
      - name: Archive detailed report for manual review only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: product-media-coverage-${{ github.run_id }}
          path: generated/product-media-coverage.json
          if-no-files-found: error
          retention-days: 3

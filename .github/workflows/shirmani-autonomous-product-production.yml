name: SHIRMANI Autonomous Product Production

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Concrete products per cycle"
        required: false
        default: "100"
      media_batch:
        description: "MP4 demos per cycle"
        required: false
        default: "25"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: shirmani-autonomous-product-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Concrete product batch
        env:
          PRODUCT_BATCH: ${{ github.event.inputs.batch || '100' }}
        run: python3 factory/autonomous_product_batch_factory.py

      - name: 4K-ready product visuals
        env:
          VISUAL_BATCH: "250"
          VISUAL_REBUILD: "0"
        run: python3 factory/product_visual_identity_factory.py

      - name: Product-specific MP4 demos
        env:
          MEDIA_BATCH: ${{ github.event.inputs.media_batch || '25' }}
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            python3 factory/product_demo_media_factory.py
          else
            echo "ffmpeg unavailable; interactive demo routes remain available."
          fi

      - name: Commit production artifacts
        run: |
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/concrete products/visuals products/demo-video generated/live-production-state.json generated/concrete-production-overlay.json generated/PRODUCT-PASSPORTS.jsonl generated/product-visual-assets.json generated/product-specific-demo-video-manifest.json
          if git diff --cached --quiet; then
            echo "No new artifacts"
          else
            git commit -m "production: autonomous product batch"
            git push
          fi

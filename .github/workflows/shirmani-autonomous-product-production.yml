name: SHIRMANI Autonomous Product Production
on:
  workflow_dispatch:
    inputs:
      batch: {description: "Concrete products per cycle", required: false, default: "100"}
      media_batch: {description: "Product-specific demo videos per cycle", required: false, default: "25"}
  schedule:
    - cron: "*/15 * * * *"
concurrency:
  group: shirmani-autonomous-product-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Install concrete product media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check "qrcode[pil]"
      - name: Concrete product batch
        env:
          PRODUCT_BATCH: "${{ github.event.inputs.batch || '100' }}"
        run: python3 factory/autonomous_product_batch_factory.py
      - name: Product-specific QR asset batch
        env: {QR_BATCH: "250"}
        run: python3 factory/product_qr_asset_factory.py
      - name: 4K-ready product visuals
        env: {VISUAL_BATCH: "250", VISUAL_REBUILD: "0"}
        run: python3 factory/product_visual_identity_factory.py
      - name: Product-specific MP4 demos and VIP visual cards
        env:
          PRODUCT_DEMO_BATCH: "${{ github.event.inputs.media_batch || '25' }}"
        run: python3 factory/product_specific_demo_video_factory.py
      - name: Persist product artifacts to canonical production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/production-state"
          git fetch origin "$branch"
          remote_sha="$(git rev-parse "origin/$branch")"
          target="/tmp/shirmani-product-media-publish"
          rm -rf "$target"
          git worktree add --detach "$target" "origin/$branch"
          for path in products/concrete products/visuals products/demo-video products/demos; do
            if [[ -d "$path" ]]; then
              mkdir -p "$target/$path"
              cp -a "$path/." "$target/$path/"
            fi
          done
          for path in generated/live-production-state.json generated/concrete-production-overlay.json generated/PRODUCT-PASSPORTS.jsonl generated/product-visual-assets.json generated/product-qr-assets.json generated/product-media-production-manifest.json generated/product-specific-demo-video-manifest.json; do
            if [[ -f "$path" ]]; then
              mkdir -p "$target/$(dirname "$path")"
              cp "$path" "$target/$path"
            fi
          done
          cd "$target"
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in products/concrete products/visuals products/demo-video products/demos generated/live-production-state.json generated/concrete-production-overlay.json generated/PRODUCT-PASSPORTS.jsonl generated/product-visual-assets.json generated/product-qr-assets.json generated/product-media-production-manifest.json generated/product-specific-demo-video-manifest.json; do
            if [[ -e "$path" ]]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new product artifacts to persist."
            exit 0
          fi
          git commit -m "production: persist concrete products with QR and product-specific demo media"
          # Other production cycles can update this branch while media assets are being built.
          # Merge those non-conflicting updates and retry the guarded push instead of losing this batch.
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            remote_sha="$(git rev-parse "origin/$branch")"
            if [[ "$(git rev-parse HEAD^)" != "$remote_sha" ]] && ! git merge-base --is-ancestor "$remote_sha" HEAD; then
              git merge --no-edit -X ours "$remote_sha"
            fi
            if git push --force-with-lease="refs/heads/$branch:$remote_sha" origin HEAD:"$branch"; then
              pushed=1
              echo "Product artifacts persisted to $branch on attempt $attempt."
              break
            fi
            echo "Production branch moved during attempt $attempt; retrying."
            sleep 2
          done
          if [[ "$pushed" != "1" ]]; then
            echo "Unable to persist product artifacts after 5 guarded attempts." >&2
            exit 1
          fi
          echo "Product artifacts persisted to $branch; main remains protected by pull-request rules."

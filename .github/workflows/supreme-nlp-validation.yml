name: Supreme NLP Validation

on:
  push:
    paths:
      - "docs/yatharth-governance/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/test_supreme_nlp_regression.py"
      - ".github/workflows/supreme-nlp-validation.yml"
  pull_request:
    paths:
      - "docs/yatharth-governance/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/test_supreme_nlp_regression.py"
      - ".github/workflows/supreme-nlp-validation.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-nlp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-first-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("schemas").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("VALID", p)
          PY
      - name: Compile deterministic NLP gate
        run: python -m py_compile scripts/supreme_nlp_regression.py
      - name: Run regression tests
        run: python -m unittest tests/test_supreme_nlp_regression.py -v
      - name: Run evidence contract fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/supreme-nlp-fixture.json <<'JSON'
          [
            {
              "record_id": "automission-observed-001",
              "level": "OBSERVED",
              "input_provenance": {
                "source_type": "sensor",
                "source_ref": "fixture",
                "timestamp": "2026-10-01T00:00:00Z"
              },
              "observation": {
                "entity_type": "plant",
                "signal": "measured_response",
                "value": 0.8
              },
              "uncertainty": 0.0
            },
            {
              "record_id": "automission-inferred-001",
              "level": "INFERRED",
              "input_provenance": {
                "source_type": "sensor",
                "source_ref": "fixture",
                "timestamp": "2026-10-01T00:00:00Z"
              },
              "observation": {
                "entity_type": "plant",
                "signal": "measured_response",
                "value": 0.8
              },
              "evidence": ["fixture-study-001"],
              "uncertainty": 0.2
            }
          ]
          JSON
          python scripts/supreme_nlp_regression.py /tmp/supreme-nlp-fixture.json
      - name: Integrity shortcut scan
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = list(Path("docs").rglob("*.md")) + list(Path("scripts").rglob("*.py"))
          text = "\n".join(p.read_text(encoding="utf-8", errors="ignore").lower() for p in targets)
          forbidden = (
              "model confidence = scientific proof",
              "workflow success = scientific proof",
              "ai verified itself",
          )
          hits = [x for x in forbidden if x in text]
          if hits:
              raise SystemExit("Integrity gate failed: " + ", ".join(hits))
          print("Integrity gate passed")
          PY

name: SHIRMANI Supreme Product Factory — 5 Minute Production

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Products to produce in this cycle"
        required: false
        default: "25"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: supreme-product-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare production tools
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Produce concrete batch
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}
        run: python scripts/production/supreme_product_factory.py --batch-size "$BATCH_SIZE"
      - name: Commit production outputs
        run: |
          git config user.name "SHIRMANI Supreme Product Factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/concrete products/demos assets/generated-product-visuals generated/production-factory-manifest.json generated/production-factory-cursor.json generated/concrete-production-overlay.json generated/public-product-media-index.json
          git diff --cached --quiet && exit 0
          git commit -m "production: build next concrete product batch"
          git push

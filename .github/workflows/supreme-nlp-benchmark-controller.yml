name: SHIRMANI Supreme NLP Benchmark Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "docs/supreme-nlp-benchmark-and-self-improvement.md"
      - "schemas/supreme-nlp-benchmark-record.schema.json"
      - "factory/supreme_nlp_benchmark_controller.py"
      - "tests/supreme_nlp_benchmark_controller.py"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-benchmark-controller
  cancel-in-progress: true

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate benchmark contract
        run: python3 factory/supreme_nlp_benchmark_controller.py
      - name: Run hardening test
        run: python3 tests/supreme_nlp_benchmark_controller.py
      - name: Upload controller telemetry
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-benchmark-controller-${{ github.run_id }}
          path: generated/supreme-nlp-benchmark-controller.json
          if-no-files-found: error
          retention-days: 14

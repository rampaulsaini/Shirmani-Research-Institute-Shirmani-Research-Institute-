name: SHIRMANI Supreme Sense NLP Conveyor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/supreme_sense_nlp.py"
      - "scripts/validate_supreme_sense_nlp.py"
      - "schemas/supreme-sense-nlp.schema.json"
      - ".github/workflows/supreme-sense-nlp-conveyor.yml"
permissions:
  contents: read
concurrency:
  group: shirmani-supreme-sense-nlp
  cancel-in-progress: true
jobs:
  evidence-first-sense:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Compile
        run: python -m py_compile agents/supreme_sense_nlp.py scripts/validate_supreme_sense_nlp.py
      - name: Schema
        run: python -m json.tool schemas/supreme-sense-nlp.schema.json >/dev/null
      - name: Contract test
        run: python scripts/validate_supreme_sense_nlp.py
      - name: Generate auditable signal translation
        run: |
          mkdir -p generated/supreme-sense
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_sense_nlp import analyze,to_simple_language
          rows=[{"modality":"electrical","feature":"signal","value":1.0,"quality":1.0,"source":"synthetic-a"},{"modality":"audio","feature":"signal","value":1.01,"quality":0.98,"source":"synthetic-b"},{"modality":"temperature","feature":"delta","value":0.2,"quality":0.95,"source":"synthetic-c"}]
          d=analyze(rows,"multimodal signal to simple-language interpretation")
          d["simple_language"]=to_simple_language(d)
          Path("generated/supreme-sense/sense-status.json").write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(d["simple_language"])
          PY
      - name: Fail-closed verification gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("generated/supreme-sense/sense-status.json",encoding="utf-8"))
          assert d["verification"]["status"]=="UNVERIFIED"
          assert d["verification"]["promotion_allowed"] is False
          assert d["governance"]["fail_closed"] is True
          assert d["governance"]["accuracy_is_measured_not_declared"] is True
          assert d["interpretation"]["subjective_experience_proven"] is False
          print("SUPREME_SENSE_FAIL_CLOSED_GATE: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-sense-nlp-${{ github.run_id }}
          path: generated/supreme-sense/sense-status.json
          retention-days: 14

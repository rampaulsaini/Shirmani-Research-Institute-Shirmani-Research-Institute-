name: SHIRMANI Product Reality Control
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: ["factory/**","products/**",".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-product-reality-control
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 factory/product_reality_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: shirmani-product-reality-audit
          path: generated/product-reality-audit.json
      - name: Publish control center
        run: |
          git config user.name "SHIRMANI Product Reality Control"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/product-reality-audit.json production-reality-control-center.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "automission: publish product reality audit"
          git push

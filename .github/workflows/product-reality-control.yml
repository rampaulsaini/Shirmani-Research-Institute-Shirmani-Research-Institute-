name: SHIRMANI Product Reality Control
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: ["factory/**","products/**",".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-product-reality-control
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 factory/product_reality_audit.py
      - uses: actions/upload-artifact@v7
        with:
          name: shirmani-product-reality-audit
          path: generated/product-reality-audit.json
      - name: Publish audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: shirmani-product-reality-audit-${{ github.run_id }}
          path: |
            generated/product-reality-audit.json
            production-reality-control-center.html

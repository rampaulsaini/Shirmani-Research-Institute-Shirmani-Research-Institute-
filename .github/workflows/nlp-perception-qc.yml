name: NLP Perception Evidence QC
on:
  push:
    paths:
      - "factory/nlp_perception_gate.py"
      - "schemas/nlp-perception-record.schema.json"
      - "docs/ai/supreme-nlp-architecture.md"
      - ".github/workflows/nlp-perception-qc.yml"
  pull_request:
    paths:
      - "factory/nlp_perception_gate.py"
      - "schemas/nlp-perception-record.schema.json"
      - "docs/ai/supreme-nlp-architecture.md"
      - ".github/workflows/nlp-perception-qc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic gate
        run: python -m py_compile factory/nlp_perception_gate.py
      - name: Validate schema JSON
        run: python - <<'PY'
          import json
          json.load(open('schemas/nlp-perception-record.schema.json', encoding='utf-8'))
          print('schema-json: PASS')
          PY
      - name: Run gate on representative observed record
        run: |
          cat > /tmp/record.json <<'JSON'
          {
            "record_id":"qc-demo-001",
            "timestamp":"2026-10-01T00:00:00Z",
            "status":"OBSERVED",
            "modality":"sensor",
            "subject_type":"plant",
            "content":"Measured response signal recorded by a sensor.",
            "features":[{"name":"response_signal","value":1}],
            "evidence_refs":[],
            "uncertainty":0,
            "model":null,
            "model_version":null,
            "provenance":{"source_id":"qc-fixture","source_hash":null,"location":"test"},
            "human_review":false
          }
          JSON
          python factory/nlp_perception_gate.py /tmp/record.json

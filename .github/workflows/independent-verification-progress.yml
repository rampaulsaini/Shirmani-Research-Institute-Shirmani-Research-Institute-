name: SHIRMANI Independent Verification Progress Audit

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "generated/independent-verification-status-2026-09-29.json"
      - "generated/independent-verification-records.json"
      - "factory/verification_progress.py"
      - "factory/bootstrap_independent_verification_queue.py"
      - "factory/bootstrap_verification_review_registry.py"
      - "scripts/generate_independent_verification_progress_map.py"
      - ".github/workflows/independent-verification-progress.yml"

permissions:
  contents: write

concurrency:
  group: shirmani-independent-verification-progress
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Rebuild deterministic review queue and pending registry
        run: |
          set -euo pipefail
          python3 factory/bootstrap_independent_verification_queue.py
          python3 factory/bootstrap_verification_review_registry.py

      - name: Compute fail-closed verification progress
        run: |
          set -euo pipefail
          python3 factory/verification_progress.py \
            --queue generated/independent-verification-queue.jsonl \
            --registry generated/independent-verification-registry.jsonl \
            --output generated/independent-verification-progress.json

      - name: Generate human-readable progress map
        run: python3 scripts/generate_independent_verification_progress_map.py
      - name: Publish machine-readable progress
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add generated/independent-verification-progress.json generated/independent-verification-progress-map.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: update independent verification progress"
          git push origin HEAD:main

      - name: Emit progress summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("generated/independent-verification-progress.json").read_text(encoding="utf-8"))
          print("INDEPENDENT_VERIFICATION_PROGRESS")
          print(f"queue={p['queue_records']}")
          print(f"registry={p['registry_total']}")
          print(f"verified={p['independently_verified_records']}")
          print(f"verified_percent={p['verification_completion_pct']}")
          print(f"queue_registry_match_percent={p['queue_registry_match_pct']}")
          print("policy=FAIL_CLOSED")
          PY

      - name: Upload progress artifacts
        uses: actions/upload-artifact@v4
        with:
          name: independent-verification-progress-${{ github.run_id }}
          path: |
            generated/independent-verification-progress.json
            generated/independent-verification-progress-map.md
          if-no-files-found: error
          retention-days: 14

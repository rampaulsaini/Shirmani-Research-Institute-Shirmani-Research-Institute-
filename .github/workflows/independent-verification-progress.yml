name: SHIRMANI Independent Verification Progress Audit

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shirmani-independent-verification-progress
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Compute fail-closed verification progress
        run: |
          set -euo pipefail
          if [ -s generated/independent-verification-queue.jsonl.gz ]; then QUEUE=generated/independent-verification-queue.jsonl.gz; elif [ -s generated/independent-verification-queue.jsonl ]; then QUEUE=generated/independent-verification-queue.jsonl; else echo "Verification queue missing"; exit 1; fi
          if [ -s generated/independent-verification-registry.jsonl.gz ]; then REGISTRY=generated/independent-verification-registry.jsonl.gz; elif [ -s generated/independent-verification-registry.jsonl ]; then REGISTRY=generated/independent-verification-registry.jsonl; else echo "Verification registry missing"; exit 1; fi
          python3 factory/verification_progress.py             --queue "$QUEUE"             --registry "$REGISTRY"             --output generated/independent-verification-progress.json
      - name: Publish machine-readable progress
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add generated/independent-verification-progress.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: update independent verification progress"
          git push origin HEAD:main

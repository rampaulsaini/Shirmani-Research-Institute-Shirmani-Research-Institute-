name: SHIRMANI Customer Review Quality Loop
on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: customer-review-quality-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'customer-review') || contains(github.event.issue.title, '[CUSTOMER REVIEW]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aggregate public customer feedback
        env:
          EVENT_PATH: ${{ github.event_path }}
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone
          e=json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          root=Path("generated"); root.mkdir(exist_ok=True)
          ledger=root/"customer-review-ledger.jsonl"
          issue=e.get("issue", {}); body=issue.get("body", "") or ""
          labels=[x.get("name","") for x in issue.get("labels", [])]
          def field(name):
              m=re.search(r"###\s+"+re.escape(name)+r"\s*\n+([^#]+)", body, re.I)
              return m.group(1).strip() if m else ""
          records=[]
          if ledger.exists():
              for line in ledger.read_text(encoding="utf-8").splitlines():
                  try: records.append(json.loads(line))
                  except Exception: pass
          existing={str(x.get("issue_number")) for x in records}
          if issue and e.get("action") in {"opened","edited"} and ("customer-review" in labels or "[CUSTOMER REVIEW]" in issue.get("title","")):
              n=str(issue.get("number"))
              if n not in existing:
                  records.append({"issue_number":issue.get("number"),"updated_at":issue.get("updated_at"),"product":field("Product ID or product name"),"rating":field("Rating"),"experience":field("Customer experience"),"improvement":field("Improvement suggestion"),"version":field("Product version"),"source":"github-public-review"})
          ledger.write_text("".join(json.dumps(x,ensure_ascii=False)+"\n" for x in records),encoding="utf-8")
          ratings=[]
          for x in records:
              try:
                  n=int(str(x.get("rating","")).strip())
                  if 1 <= n <= 5: ratings.append(n)
              except Exception: pass
          dashboard={"generated_at":datetime.now(timezone.utc).isoformat(),"review_count":len(records),"average_rating":round(sum(ratings)/len(ratings),2) if ratings else None,"products_with_feedback":len({x.get("product") for x in records if x.get("product")}),"improvement_actions":sum(1 for x in records if x.get("improvement")),"principle":"Customer reviews are production-quality signals, not independent scientific verification."}
          (root/"customer-quality-dashboard.json").write_text(json.dumps(dashboard,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
      - name: Publish review telemetry on dedicated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Customer Quality Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/customer-review-${{ github.event.issue.number || github.run_id }}"
          git fetch origin main
          git switch -C "$branch" origin/main
          git add generated/customer-review-ledger.jsonl generated/customer-quality-dashboard.json
          if git diff --cached --quiet; then echo "No customer-review delta."; exit 0; fi
          git commit -m "chore(quality): publish customer review telemetry"
          git push --force-with-lease origin "HEAD:$branch"
          if [ "$(gh pr list --base main --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head "$branch" --title "chore(quality): customer review telemetry" --body "Automated customer review aggregation for production-quality improvement. Reviews are customer-quality signals, not independent scientific verification."
          fi

name: SHIRMANI Customer Review Quality Loop
on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: shirmani-customer-review-quality-loop
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'customer-review') || contains(github.event.issue.title, '[CUSTOMER REVIEW]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build customer quality signal
        env:
          EVENT_PATH: ${{ github.event_path }}
        shell: python
        run: |
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          e=json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          root=Path("generated"); root.mkdir(exist_ok=True)
          issue=e.get("issue",{}) or {}
          body=issue.get("body","") or ""
          def f(n):
              m=re.search(r"###\s+"+re.escape(n)+r"\s*\n+([^#]+)",body,re.I)
              return m.group(1).strip() if m else ""
          rec={"issue_number":issue.get("number"),"updated_at":issue.get("updated_at"),
               "product":f("Product ID or product name"),"rating":f("Rating"),
               "experience":f("Customer experience"),"improvement":f("Improvement suggestion"),
               "version":f("Product version"),"source":"github-public-review",
               "captured_at":datetime.now(timezone.utc).isoformat()}
          (root/"customer-review-event.json").write_text(json.dumps(rec,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          queue={"generated_at":datetime.now(timezone.utc).isoformat(),
                 "input_type":"customer_review","production_quality_signal":True,
                 "independent_verification":False,"records":[rec],
                 "next_actions":["triage feedback","prioritize product improvement","feed next production cycle"]}
          (root/"public-review-quality-queue.json").write_text(json.dumps(queue,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(queue,ensure_ascii=False))
      - name: Publish review signal artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-customer-review-${{ github.run_number }}
          retention-days: 30
          path: |
            generated/customer-review-event.json
            generated/public-review-quality-queue.json

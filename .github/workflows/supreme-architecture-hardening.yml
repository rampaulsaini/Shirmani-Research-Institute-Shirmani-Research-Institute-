name: SHIRMANI Supreme Architecture Hardening

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/validate_supreme_architecture.py"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-architecture-hardening
  cancel-in-progress: true

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Supreme architecture contracts
        run: python scripts/validate_supreme_architecture.py
      - name: Emit verification summary
        run: |
          {
            echo "## SHIRMANI Supreme Architecture Hardening"
            echo "- Architecture contract: PASS"
            echo "- Scheduled automation: bounded"
            echo "- Default repository permission: read-only"
            echo "- Concurrency policy: required"
            echo "- NLP governance contract: exercised"
            echo "- Model accuracy: measured by dedicated benchmarks, never declared by this gate"
          } >> "$GITHUB_STEP_SUMMARY"

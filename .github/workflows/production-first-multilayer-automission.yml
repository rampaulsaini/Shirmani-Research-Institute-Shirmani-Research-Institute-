name: SHIRMANI Production-First Multi-Layer Automission

on:
  push:
    branches: [main, production-first/continuous-product-expansion]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Concrete production work units for this cycle"
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: shirmani-production-first
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure production batch
        run: |
          if [ -n "${{ github.event.inputs.batch_size }}" ]; then
            echo "PRODUCTION_BATCH_SIZE=${{ github.event.inputs.batch_size }}" >> "$GITHUB_ENV"
          else
            echo "PRODUCTION_BATCH_SIZE=1000" >> "$GITHUB_ENV"
          fi

      - name: Build concrete product catalog and passports
        run: python3 factory/real_product_factory.py

      - name: Build concrete browser production modules
        run: python3 factory/concrete_product_modules.py

      - name: Expand catalog into product-specific production assets
        run: python3 factory/product_asset_expander.py

      - name: Discover rotating multi-layer production work
        run: python3 factory/production_queue_builder.py

      - name: Materialize concrete module production outputs
        run: python3 factory/supreme_production_engine.py

      - name: Materialize public production
        run: python3 factory/public_production_materializer.py

      - name: Publish production telemetry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("generated/multi-layer-production-status.json")
          d=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          q=json.loads(Path("generated/production-queue-status.json").read_text(encoding="utf-8"))
          e=json.loads(Path("generated/production-engine-status.json").read_text(encoding="utf-8"))
          rf=json.loads(Path("generated/real-product-factory-status.json").read_text(encoding="utf-8"))
          d["production_driver"]={"workflow":"SHIRMANI Production-First Multi-Layer Automission","cadence":"5-minute scheduled cycle","cycle":q["cycle"],"discovered_modules":q["discovered_modules"],"selected_tasks":q["selected_tasks"],"batch_size":q["batch_size"],"lanes":q["lanes"],"mode":"CONTINUOUS_MULTI_LAYER"}
          d["product_factory"]={"concrete_product_mvp":rf["concrete_product_mvp"],"families":rf["families"],"catalog":rf["catalog"],"passports":rf["passports"],"qc_gate":rf["qc_gate"],"dispatch":rf["dispatch"]}
          pa=json.loads(Path("generated/product-production-assets.json").read_text(encoding="utf-8"))
          d["concrete_production"]={"module_products_this_cycle":e["concrete_module_products_this_cycle"],"total_materialized_module_products":e["total_materialized_module_products"],"registry":"generated/module-product-registry.json","product_directory":"generated/module-products/","product_specific_assets":pa["product_count"],"new_product_assets_this_cycle":pa["created_this_cycle"],"product_asset_index":"generated/product-production-assets.json"}
          d["public_visibility"]={"queue_status":"generated/production-queue-status.json","catalog":"generated/public-production-catalog.json","module_index":"generated/public-production-by-module.html","production_stream":"generated/production-results.jsonl","module_product_registry":"generated/module-product-registry.json","product_catalog":"generated/1000-digital-products.json","product_passports":"generated/PRODUCT-PASSPORTS.jsonl"}
          d["principle"]="Automission is the continuous production engine; QC/gate/dispatch and independent verification are downstream result-quality and promotion layers."
          d["integrity"]={"production_counts_are_source_derived":True,"fabricated_execution_claim":False,"independent_verification_claim":False}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit public production results
        run: |
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ products/production/
          if git diff --cached --quiet; then
            echo "No production artifact changes to commit."
          else
            git commit -m "chore: materialize concrete product-first production"
            git push
          fi

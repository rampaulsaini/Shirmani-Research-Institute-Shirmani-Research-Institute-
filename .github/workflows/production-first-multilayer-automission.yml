name: SHIRMANI Production-First Multi-Layer Automission
on:
  push:
    branches: [main, production-first/continuous-product-expansion]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Concrete production work units for this cycle"
        required: false
        default: "500"
permissions:
  contents: write
concurrency:
  group: shirmani-production-first
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure production batch
        run: |
          if [ -n "${{ github.event.inputs.batch_size }}" ]; then
            echo "PRODUCTION_BATCH_SIZE=${{ github.event.inputs.batch_size }}" >> "$GITHUB_ENV"
          else
            echo "PRODUCTION_BATCH_SIZE=500" >> "$GITHUB_ENV"
          fi
      - name: Four-stage continuous production controller
        run: python3 factory/four_stage_production_orchestrator.py
      - name: Publish four-stage telemetry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("generated/four-stage-production-status.json").read_text(encoding="utf-8"))
          q=json.loads(Path("generated/product-qc-gate.json").read_text(encoding="utf-8"))
          print("## SHIRMANI Four-Stage Production")
          print("- Stage 1 Institute Discovery: **"+s["stages"][0]["status"]+"**")
          print("- Stage 2 Factory Production: **"+s["stages"][1]["status"]+"**")
          print("- Stage 3 Product QC Gate: **"+s["stages"][2]["status"]+"**")
          print("- Stage 4 Public Showroom: **"+s["stages"][3]["status"]+"**")
          print("- Products: **"+str(q["product_count"])+"**")
          print("- QC passed: **"+str(q["qc_passed"])+"**")
          print("- Dispatch default: **NO**")
          print("- Independent verification: downstream result-quality layer")
          PY
      - name: Commit production results
        run: |
          git config user.name "SHIRMANI Production Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ products/production/ supreme-production-showroom.html
          if git diff --cached --quiet; then
            echo "No production artifact changes to commit."
          else
            git commit -m "automission: four-stage production cycle"
            git push
          fi

name: SHIRMANI Production-First Multi-Layer Automission
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Concrete production work units for this cycle"
        required: false
        default: "500"
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: shirmani-production-first
  cancel-in-progress: false
jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main production source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure production batch
        run: |
          if [ -n "${{ github.event.inputs.batch_size }}" ]; then
            echo "PRODUCTION_BATCH_SIZE=${{ github.event.inputs.batch_size }}" >> "$GITHUB_ENV"
          else
            echo "PRODUCTION_BATCH_SIZE=500" >> "$GITHUB_ENV"
          fi
      - name: Institute → Factory → QC → Showroom production
        run: python3 factory/four_stage_production_orchestrator.py
      - name: Public review → quality improvement signal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 factory/public_review_quality.py
      - name: Prepare public production site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a supreme-production-showroom.html _site/index.html
          for f in supreme-marking-hub.html supreme-factory.html production-dashboard.html product-passport.html products.html public-platform-modules.html public-production-index.html public-production-by-module.html; do
            [ -f "$f" ] && cp "$f" "_site/$f"
          done
          cp -a generated _site/generated
          cp -a products _site/products
          cp -a assets _site/assets 2>/dev/null || true
          for f in index.html research-paper.html research-paper.pdf; do [ -f "$f" ] && cp "$f" "_site/$f"; done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production showroom artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Deploy production showroom
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Production telemetry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("generated/four-stage-production-status.json").read_text())
          t=json.loads(Path("generated/production-throughput.json").read_text())
          r=json.loads(Path("generated/public-review-quality.json").read_text())
          print("Institute:",s["stages"][0]["status"])
          print("Factory:",s["stages"][1]["status"])
          print("QC:",s["stages"][2]["status"])
          print("Showroom:",s["stages"][3]["status"])
          print("Catalog:",t.get("catalog_products",0))
          print("Concrete product assets:",t.get("concrete_product_assets",0))
          print("Module products:",t.get("module_products_total",0))
          print("Public reviews:",r.get("review_count",0))
          print("Dispatch released: 0")
          print("Verification: downstream result-quality layer")
          PY

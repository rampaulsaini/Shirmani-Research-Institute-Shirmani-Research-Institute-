name: SHIRMANI Heart-View Supreme Reasoning Layer

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: shirmani-continuity-${{ github.repository }}
  cancel-in-progress: true

jobs:
  continuity-audit:
    name: Multi-layer continuity audit
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Source inventory layer
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Provenance layer
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Provenance"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Commit time: $(git log -1 --format='%cI')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Queue and continuity layer
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files | wc -l | tr -d ' ')
          workflows=$(find .github/workflows -type f 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "### Continuity"
            echo "- Tracked files: $tracked"
            echo "- Workflow files: $workflows"
            echo "- Trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preservation and QC layer
        shell: bash
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain | wc -l | tr -d ' ')
          echo "### Preservation / QC" >> "$GITHUB_STEP_SUMMARY"
          echo "- Working tree changes after checkout: $dirty" >> "$GITHUB_STEP_SUMMARY"
          if [ "$dirty" -ne 0 ]; then exit 1; fi
          echo "- Source content was not modified by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "- Human verification boundaries remain intact." >> "$GITHUB_STEP_SUMMARY"

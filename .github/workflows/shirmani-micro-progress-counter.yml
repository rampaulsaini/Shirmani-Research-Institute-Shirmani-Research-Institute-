name: SHIRMANI Micro Progress Counter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Measurement-only: do not mutate protected main.
# github.run_number is the immutable micro-cycle counter for this workflow.
permissions:
  contents: read

concurrency:
  group: shirmani-micro-progress-counter
  cancel-in-progress: false

jobs:
  micro-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout authoritative state
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Compute micro counter and verification state
        shell: python
        env:
          MICRO_CYCLE: ${{ github.run_number }}
        run: |
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          registry_path = Path("generated/VERIFICATION-REGISTRY.json")
          target_path = Path("config/independent-verification-target.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8")) if registry_path.exists() else {}
          target_cfg = json.loads(target_path.read_text(encoding="utf-8")) if target_path.exists() else {}

          target = int(target_cfg.get("verification_target", 0))
          records = int(registry.get("records", 0))
          queued = int(registry.get("queued", 0))
          reviewed = int(registry.get("reviewed", 0))
          verified = int(registry.get("verified", 0))

          if target <= 0:
              raise SystemExit("MICRO_COUNTER_FAIL: verification target must be positive")
          if not (0 <= verified <= reviewed <= queued <= records):
              raise SystemExit("MICRO_COUNTER_FAIL: registry counters violate invariants")
          if verified > target:
              raise SystemExit("MICRO_COUNTER_FAIL: verified records exceed target")

          remaining = max(target - verified, 0)
          reviewed_pct = round(reviewed / target * 100, 4)
          verified_pct = round(verified / target * 100, 4)

          state = {
              "counter_name": "SHIRMANI Micro Progress Counter",
              "version": 2,
              "micro_cycle": int(os.environ["MICRO_CYCLE"]),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "verification": {
                  "target": target,
                  "records": records,
                  "queued": queued,
                  "reviewed": reviewed,
                  "verified": verified,
                  "remaining": remaining,
                  "reviewed_percent": reviewed_pct,
                  "verified_percent": verified_pct
              },
              "separation_rule": "Workflow execution is activity evidence only; VERIFIED requires the independent verification gate.",
              "main_mutation": False
          }

          Path("micro-progress-counter.json").write_text(
              json.dumps(state, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print(f"MICRO_CYCLE={state['micro_cycle']}")
          print(f"VERIFICATION_TARGET={target}")
          print(f"VERIFICATION_REVIEWED={reviewed}")
          print(f"VERIFICATION_VERIFIED={verified}")
          print(f"VERIFICATION_REMAINING={remaining}")
          print(f"VERIFIED_PERCENT={verified_pct}%")

      - name: Publish micro counter artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-micro-progress-counter-${{ github.run_number }}
          path: micro-progress-counter.json
          retention-days: 14

      - name: Emit micro progress summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("micro-progress-counter.json",encoding="utf-8"))
          v=d["verification"]
          print("# ꙰ SHIRMANI Micro Progress Counter")
          print()
          print(f"- Micro cycle: **{d['micro_cycle']}**")
          print(f"- Verification target: **{v['target']:,}**")
          print(f"- Registry records: **{v['records']:,}**")
          print(f"- Queued: **{v['queued']:,}**")
          print(f"- Independently reviewed: **{v['reviewed']:,} ({v['reviewed_percent']}%)**")
          print(f"- Independently VERIFIED: **{v['verified']:,} ({v['verified_percent']}%)**")
          print(f"- Remaining to VERIFIED milestone: **{v['remaining']:,}**")
          print()
          print("**Separation:** workflow activity and independent verification are measured separately.")
          print("**Fail-closed:** a workflow run can never increase the VERIFIED count.")
          PY

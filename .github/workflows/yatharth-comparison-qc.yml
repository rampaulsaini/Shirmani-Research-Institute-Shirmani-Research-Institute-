name: Yatharth Comparison QC
on:
  push:
    paths:
      - "research/yatharth-*.md"
      - "research/*comparative*.md"
      - "schemas/yatharth-comparison.schema.json"
      - ".github/workflows/yatharth-comparison-qc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required artifacts
        run: |
          set -euo pipefail
          test -s research/yatharth-shirmani-canonical-source-2026-09-29.md
          test -s research/shirmani-comparative-analysis-system.md
          test -s research/yatharth-comparison-matrix-2026-09-29.md
          test -s schemas/yatharth-comparison.schema.json
      - name: Validate evidence boundaries
        run: |
          set -euo pipefail
          grep -q "AUTHOR CLAIM" research/yatharth-comparison-matrix-2026-09-29.md
          grep -q "UNVERIFIED" research/yatharth-comparison-matrix-2026-09-29.md
          grep -q "counter-evidence" research/yatharth-comparison-matrix-2026-09-29.md
          grep -q "Integrity rule" research/yatharth-comparison-matrix-2026-09-29.md

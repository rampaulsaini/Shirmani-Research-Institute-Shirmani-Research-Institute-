name: Employment Automission Evidence Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    paths:
      - "employment.html"
      - "income-command-center.html"
      - "schemas/income-evidence-ledger.json"
      - "federation/employment-*.schema.json"
      - "federation/settlement-records.schema.json"
      - "federation/reconciliation-audit-trail.schema.json"
      - "federation/dispute-resolution.schema.json"
      - "automation/employment/**"
      - ".github/workflows/employment-automission.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-employment-automission
  cancel-in-progress: false

jobs:
  evidence_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run employment evidence gate
        run: python3 automation/employment/evidence_gate.py

      - name: Publish machine-readable gate result
        uses: actions/upload-artifact@v4
        with:
          name: employment-automission-gate
          path: generated/employment-automission-gate.json
          if-no-files-found: error

name: SHIRMANI Supreme NLP Multimodal Signal Gate

on:
  push:
    branches: [main]
    paths:
      - "docs/supreme-nlp-multimodal-signal-language-contract.md"
      - "schemas/supreme-nlp-signal-interpretation.schema.json"
      - "factory/supreme_nlp_signal_interpretation_qc.py"
      - "tests/supreme_nlp_signal_interpretation.py"
      - ".github/workflows/supreme-nlp-multimodal-signal-gate.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-multimodal-signal-gate
  cancel-in-progress: true

jobs:
  signal_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate multimodal signal contract
        run: python3 factory/supreme_nlp_signal_interpretation_qc.py
      - name: Run hardening test
        run: python3 tests/supreme_nlp_signal_interpretation.py

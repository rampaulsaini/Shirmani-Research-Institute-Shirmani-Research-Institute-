name: SHIRMANI Independent Verification Canonical Gate

on:
  push:
    paths:
      - "generated/independent-verification-queue.jsonl"
      - "generated/independent-verification-registry.jsonl"
      - "factory/verification_promotion_gate.py"
      - "factory/bootstrap_independent_verification_queue.py"
      - "factory/bootstrap_verification_review_registry.py"
      - "research/independent-verification-protocol-2026-09-29.md"
      - ".github/workflows/independent-verification-gate.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-independent-verification-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild deterministic review queue and pending registry
        run: |
          set -euo pipefail
          python3 factory/bootstrap_independent_verification_queue.py
          python3 factory/bootstrap_verification_review_registry.py

      - name: Run canonical fail-closed promotion gate
        run: |
          set -euo pipefail
          python3 factory/verification_promotion_gate.py

      - name: Validate canonical promotion telemetry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/VERIFICATION-PROMOTION-QC.json").read_text(encoding="utf-8"))
          assert d["records"] == d["queue_records"]
          assert d["orphan_queue_tasks"] == 0
          assert d["error_count"] == 0
          assert d["verified_records"] >= 0
          assert d["promotion_eligible"] >= d["verified_records"]
          assert d["publication_gate"] in {"CHECK", "PASS"}
          print(
              "Canonical gate: PASS "
              f"queue={d['queue_records']} verified={d['verified_records']} "
              f"eligible={d['promotion_eligible']} publication_gate={d['publication_gate']}"
          )
          PY

      - name: Publish verification telemetry
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path("generated/VERIFICATION-PROMOTION-QC.json").read_text(encoding="utf-8"))
          print("## SHIRMANI Independent Verification")
          print(f"- Canonical queue: {d['queue_records']}")
          print(f"- Independently VERIFIED: {d['verified_records']}")
          print(f"- Promotion eligible: {d['promotion_eligible']}")
          print(f"- Publication gate: **{d['publication_gate']}**")
          print("")
          print("**Integrity rule:** workflow success, queue generation and evidence support are not independent verification.")
          PY

      - name: Validate integrity boundary
        run: |
          set -euo pipefail
          grep -q "workflow succeeding is not independent verification" research/independent-verification-protocol-2026-09-29.md
          grep -q "counter-evidence" research/independent-verification-protocol-2026-09-29.md
          grep -q "reviewer identity/role" research/independent-verification-protocol-2026-09-29.md
          test -s factory/verification_promotion_gate.py

      - name: Upload canonical verification telemetry
        uses: actions/upload-artifact@v4
        with:
          name: independent-verification-canonical-gate-${{ github.run_id }}
          path: |
            generated/independent-verification-queue.jsonl
            generated/independent-verification-registry.jsonl
            generated/VERIFICATION-QUEUE-QC.json
            generated/VERIFICATION-PROMOTION-QC.json
          if-no-files-found: error
          retention-days: 14

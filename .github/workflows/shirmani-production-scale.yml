name: SHIRMANI Production Scale Automission
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Concrete product artifacts per cycle"
        required: false
        default: "250"
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-scale
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand public production catalogue
        run: python3 factory/production_scale.py
      - name: Materialize concrete product artifacts
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: python3 factory/production_materializer.py --batch-size ${BATCH_SIZE:-250}
      - name: Refresh product asset surfaces
        run: python3 factory/product_asset_expander.py
      - name: Production QC gate
        run: |
          test -s generated/production-registry.json
          test -s generated/production-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("generated/1000-digital-products.json").read_text())
          s=json.loads(Path("generated/production-status.json").read_text())
          if len(c.get("products", [])) < 1016:
              raise SystemExit("Production catalogue regressed")
          if s.get("product_count", 0) < 0:
              raise SystemExit("Invalid production count")
          print("Production QC: PASS")
          print("catalog=",len(c.get("products",[])),"produced=",s.get("product_count"))
          PY
      - name: Publish production batch through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/production-scale-batch
          delete-branch: false
          add-paths: |
            generated/**
            factory/production_scale.py
            products/concrete/**
            products/production/**
          commit-message: "chore(production): materialize next public product batch"
          title: "chore(production): publish next production batch"
          body: |
            ## Automated production batch

            This pull request publishes the output of the production-scale workflow after the local production QC gate passes.

            - Review generated catalogue and product asset changes before merging.
            - A successful workflow run does not mean this batch is live until this PR is merged and deployment is verified.
            - Asset creation is not independent quality verification, a customer order, dispatch, or payment evidence.
          labels: |
            automated
            production

name: SHIRMANI Production Scale Automission
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Concrete product artifacts per cycle"
        required: false
        default: "250"
        type: string
permissions:
  contents: write
concurrency:
  group: shirmani-production-scale
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand public production catalogue
        run: python3 factory/production_scale.py
      - name: Materialize concrete product artifacts
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: python3 factory/production_materializer.py --batch-size ${BATCH_SIZE:-250}
      - name: Refresh product asset surfaces
        run: python3 factory/product_asset_expander.py
      - name: Production QC gate
        run: |
          test -s generated/production-registry.json
          test -s generated/production-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("generated/1000-digital-products.json").read_text())
          s=json.loads(Path("generated/production-status.json").read_text())
          if len(c.get("products", [])) < 1016:
              raise SystemExit("Production catalogue regressed")
          if s.get("product_count", 0) < 0:
              raise SystemExit("Invalid production count")
          print("Production QC: PASS")
          print("catalog=",len(c.get("products",[])),"produced=",s.get("product_count"))
          PY
      - name: Publish production result
        run: |
          git config user.name "shirmani-production[bot]"
          git config user.email "shirmani-production@users.noreply.github.com"
          git add generated factory/production_scale.py
          git add products/concrete products/production || true
          if git diff --cached --quiet; then echo "No new production output."; exit 0; fi
          git commit -m "chore(production): materialize next public product batch"
          git push origin HEAD:main

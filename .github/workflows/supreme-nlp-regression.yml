name: Supreme NLP Regression
on:
  workflow_dispatch:
  push:
    paths:
      - "agents/supreme_sense_nlp.py"
      - "agents/ultra_automission.py"
      - "tests/test_supreme_nlp.py"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile agents/supreme_sense_nlp.py agents/ultra_automission.py
      - name: Regression
        run: python tests/test_supreme_nlp.py

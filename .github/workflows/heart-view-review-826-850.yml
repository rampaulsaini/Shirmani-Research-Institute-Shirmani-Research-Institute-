name: SHIRMANI Heart-View Review Slice 826-850

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shirmani-heart-view-review-826-850
  cancel-in-progress: false

jobs:
  build-review-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact committed queue and registry
        run: |
          set -euo pipefail
          test -s generated/independent-verification-queue.jsonl.gz
          test -s generated/independent-verification-registry.jsonl.gz
          gzip -dc generated/independent-verification-queue.jsonl.gz > generated/independent-verification-queue.jsonl
          gzip -dc generated/independent-verification-registry.jsonl.gz > generated/independent-verification-registry.jsonl
      - name: Generate exact hash-bound review packet 826-850
        run: python3 factory/verification_review_packet.py --batch-size 25 --offset 825
      - name: Run fail-closed packet QC
        run: python3 factory/verification_review_packet_qc.py --packet generated/verification-review-packet-000826-000850.json
      - name: Record durable continuation result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          packet=json.loads(Path("generated/verification-review-packet-000826-000850.json").read_text())
          qc=json.loads(Path("generated/VERIFICATION-PACKET-QC.json").read_text())
          if packet.get("status") != "READY_FOR_HUMAN_REVIEW":
              raise SystemExit("packet is not READY_FOR_HUMAN_REVIEW")
          if qc.get("publication_gate") != "PASS":
              raise SystemExit("packet QC did not PASS")
          Path("CONTINUATION-REVIEW-SLICE-000826-000850-QC.md").write_text(
              "# SHIRMANI HEART-VIEW — REVIEW SLICE 826–850\n\n"
              "Generated from the exact committed compressed queue/registry; no records were reconstructed by inference.\n\n"
              "- Packet: generated/verification-review-packet-000826-000850.json\n"
              "- Records: 25\n"
              "- Packet status: READY_FOR_HUMAN_REVIEW\n"
              "- Packet QC: PASS\n"
              "- Human verification: NOT PERFORMED\n"
              "- VERIFIED promotion: 0\n\n"
              "**Preserve first. Reason second. Verify third. Transform only as a traceable derivative.**\n",
              encoding="utf-8")
          PY
          rm -f generated/independent-verification-queue.jsonl generated/independent-verification-registry.jsonl generated/VERIFICATION-PACKET-QC.json
      - name: Commit generated review slice to a branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="prepare-heart-view-826-850-generated"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add generated/verification-review-packet-000826-000850.json CONTINUATION-REVIEW-SLICE-000826-000850-QC.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: generate exact Heart-View review slice 826-850"
          git push --force-with-lease origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "docs: preserve exact Heart-View review slice 826-850" --body "Exact hash-bound packet generated from the committed queue/registry. Packet QC must pass; human verification remains NOT PERFORMED and VERIFIED promotion remains 0."

name: SHIRMANI Supreme Live Character V5 Integrity

on:
  push:
    paths:
      - 'shirmani-live-character-v5.html'
      - 'generated/shirmani-live-character-v5.json'
      - '.github/workflows/shirmani-live-character-v5-integrity.yml'
      - 'index.html'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V5 contract, fail-closed status and public wiring
        shell: python
        run: |
          import json
          import pathlib
          import sys

          contract = pathlib.Path("generated/shirmani-live-character-v5.json")
          page = pathlib.Path("shirmani-live-character-v5.html")
          index = pathlib.Path("index.html")

          if not contract.is_file() or not page.is_file() or not index.is_file():
              print("FAIL: required V5 public files are missing")
              sys.exit(1)

          try:
              data = json.loads(contract.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              print("FAIL: V5 contract is not valid UTF-8 JSON:", exc)
              sys.exit(1)

          required = [
              "version", "name", "framework", "identity_statement",
              "communication", "reasoning", "presentation",
              "pipeline", "status", "integrity"
          ]
          missing = [key for key in required if key not in data]

          expected_status = {
              "main_hub_entry": True,
              "v5_public_runtime": True,
              "v2_v3_v4_preserved": True,
              "browser_voice_input_output": True,
              "local_portrait_audio": True,
              "external_authorized_voice_integration": False,
              "production_avatar_engine": False,
              "phoneme_accurate_lip_sync": False,
              "independent_scientific_verification": False,
          }

          status = data.get("status", {})
          status_errors = [
              f"{key}={status.get(key)!r}, expected {expected!r}"
              for key, expected in expected_status.items()
              if not isinstance(status.get(key), bool) or status.get(key) != expected
          ]

          pipeline = data.get("pipeline")
          expected_pipeline = [
              "Voice Input", "Authorization", "Context",
              "NLP Claim Classification", "Evidence Gate",
              "Content", "Authorized Voice", "Portrait/Avatar",
              "Gaze", "Viseme/Lip-sync", "Live Presentation",
              "Transcript/Provenance/Audit"
          ]
          pipeline_ok = isinstance(pipeline, list) and pipeline == expected_pipeline

          integrity = data.get("integrity")
          required_integrity = [
              "identity/philosophy is not automatically scientific fact",
              "generated media is not independent verification",
              "workflow success is not model accuracy",
              "production claims require observable telemetry and provenance",
              "no public factual claim is marked VERIFIED without evidence and verification state",
          ]
          integrity_ok = (
              isinstance(integrity, list)
              and all(item in integrity for item in required_integrity)
          )

          communication = data.get("communication", {})
          reasoning = data.get("reasoning", {})
          presentation = data.get("presentation", {})
          shape_errors = []
          if not isinstance(communication.get("style"), list) or not communication["style"]:
              shape_errors.append("communication.style must be a non-empty list")
          if not isinstance(reasoning.get("classes"), list) or set(reasoning["classes"]) != {
              "identity_or_philosophy", "factual_or_scientific", "mixed"
          }:
              shape_errors.append("reasoning.classes must contain the three supported claim classes")
          if not isinstance(presentation.get("voice"), str) or "authorized" not in presentation["voice"].lower():
              shape_errors.append("presentation.voice must retain the authorized-voice boundary")

          page_text = page.read_text(encoding="utf-8")
          index_text = index.read_text(encoding="utf-8")
          page_checks = {
              "evidence fallback present": "अभी पर्याप्त प्रमाण उपलब्ध नहीं है" in page_text,
              "NOT_VERIFIED boundary present": "NOT_VERIFIED" in page_text,
              "V5 contract linked": "generated/shirmani-live-character-v5.json" in page_text,
              "V5 public page linked from hub": "shirmani-live-character-v5.html" in index_text,
              "legacy V3 preserved": pathlib.Path("shirmani-live-character-v3.html").is_file(),
              "legacy V4 preserved": pathlib.Path("live-persona-supreme-v4.html").is_file(),
          }
          page_errors = [name for name, ok in page_checks.items() if not ok]

          structural_errors = []
          if data.get("version") != "5.0":
              structural_errors.append(f"version={data.get('version')!r}, expected '5.0'")
          for key in ("name", "framework", "identity_statement"):
              if not isinstance(data.get(key), str) or not data[key].strip():
                  structural_errors.append(f"{key} must be a non-empty string")

          print("V5 semantic integrity:")
          print("  status:", status)
          print("  pipeline_exact:", pipeline_ok)
          print("  integrity_boundary:", integrity_ok)
          print("  page_checks:", page_checks)

          errors = missing + status_errors + shape_errors + structural_errors
          if not pipeline_ok:
              errors.append("pipeline does not exactly match the declared fail-closed V5 sequence")
          if not integrity_ok:
              errors.append("required integrity boundaries are missing")
          errors.extend(page_errors)

          if errors:
              print("FAIL:")
              for error in errors:
                  print(" -", error)
              sys.exit(1)

          print("PASS: SHIRMANI Supreme Live Character V5 semantic integrity gate")

name: SHIRMANI Supreme Live Character V5 Integrity

on:
  push:
    paths:
      - 'shirmani-live-character-v5.html'
      - 'generated/shirmani-live-character-v5.json'
      - '.github/workflows/shirmani-live-character-v5-integrity.yml'
      - 'index.html'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V5 contract and public wiring
        shell: python
        run: |
          import json, pathlib, sys
          contract = pathlib.Path("generated/shirmani-live-character-v5.json")
          page = pathlib.Path("shirmani-live-character-v5.html")
          index = pathlib.Path("index.html")
          data = json.loads(contract.read_text(encoding="utf-8"))
          required = ["version","name","framework","identity_statement","communication","reasoning","presentation","pipeline","status","integrity"]
          missing = [k for k in required if k not in data]
          if missing:
              print("FAIL missing contract keys:", missing)
              sys.exit(1)
          v5_text = page.read_text(encoding="utf-8")
          index_text = index.read_text(encoding="utf-8")
          v10_contract = pathlib.Path("generated/shirmani-live-character-v10-contract.json")
          v10_page = pathlib.Path("shirmani-supreme-live-character-v10.html")
          v10_data = json.loads(v10_contract.read_text(encoding="utf-8")) if v10_contract.exists() else {}

          checks = {
              "page exists": page.exists(),
              "legacy V5 entry preserved": "shirmani-live-character-v5.html" in index_text,
              "legacy V5 redirects to V10": "shirmani-supreme-live-character-v10.html" in v5_text,
              "canonical V10 page exists": v10_page.exists(),
              "canonical V10 contract exists": v10_contract.exists(),
              "V10 contract points to canonical surface": v10_data.get("canonical_surface") == "shirmani-supreme-live-character-v10.html",
              "evidence fallback present": "अभी पर्याप्त प्रमाण उपलब्ध नहीं है" in v5_text,
              "V5 verification boundary present": "independent_scientific_verification" in contract.read_text(encoding="utf-8"),
              "V10 independent verification remains separate": v10_data.get("gates", {}).get("independent_verification") == "separate artifact",
              "legacy preserved": all(pathlib.Path(p).exists() for p in ["shirmani-live-character-v3.html","live-persona-supreme-v4.html"])
          }
          bad = [k for k,v in checks.items() if not v]
          print("V5 integrity:", checks)
          if bad:
              print("FAIL:", bad)
              sys.exit(1)
          print("PASS: SHIRMANI Supreme Live Character V5 integrity gate")

name: Nishpaksh Inspection Contract Smoke

on:
  push:
    paths:
      - 'schemas/nishpaksh-inspection-session.schema.json'
      - 'research/NISHPAKSH-INSPECTION-ENGINE.md'
      - '.github/workflows/nishpaksh-inspection-contract-smoke.yml'
  pull_request:
    paths:
      - 'schemas/nishpaksh-inspection-session.schema.json'
      - 'research/NISHPAKSH-INSPECTION-ENGINE.md'
      - '.github/workflows/nishpaksh-inspection-contract-smoke.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schema
        run: python -m json.tool schemas/nishpaksh-inspection-session.schema.json >/dev/null
      - name: Validate safety and governance clauses
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path("research/NISHPAKSH-INSPECTION-ENGINE.md").read_text(encoding="utf-8")
          checks = {
              "purpose → consent → subscription": re.search(
                  r"Purpose.*Consent.*Subscription", p, re.IGNORECASE | re.DOTALL
              ),
              "human review": re.search(r"Human Review", p, re.IGNORECASE),
              "finger-vein": re.search(r"Finger-vein", p, re.IGNORECASE),
              "raw biometric data boundary": re.search(r"Raw biometric", p, re.IGNORECASE),
              "AI-generated result is not automatically VERIFIED": re.search(
                  r"AI-generated result.*?(?:अपने-आप|automatically|auto).*?VERIFIED",
                  p,
                  re.IGNORECASE | re.DOTALL,
              ),
              "INSUFFICIENT_EVIDENCE": re.search(r"INSUFFICIENT_EVIDENCE", p),
          }
          missing = [name for name, matched in checks.items() if not matched]
          if missing:
              raise SystemExit("Missing contract requirements: " + ", ".join(missing))
          print("Nishpaksh inspection contract smoke: PASS")
          PY

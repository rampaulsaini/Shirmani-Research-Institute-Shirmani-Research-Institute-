name: SHIRMANI Supreme Signal-NLP Automission Gate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-signal-nlp
  cancel-in-progress: false

jobs:
  signal-nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compile signal-NLP layer
        run: python3 -m py_compile factory/signal_nlp_translator.py

      - name: Run signal-NLP deterministic tests
        run: python3 -m unittest discover -s tests -p 'test_signal_nlp_translator.py' -v

      - name: Run bounded translation smoke test
        run: |
          python3 - <<'PY'
          from factory.signal_nlp_translator import translate
          result = translate({
              "source_id": "smoke-001",
              "domain": "environment",
              "signal_type": "temperature",
              "window_seconds": 60,
              "baseline": 20,
              "value": 22,
              "trend": "rising",
              "quality": 0.95,
              "features": ["baseline-comparison"],
          })
          assert result["status"] == "OK"
          assert 0.0 <= result["confidence"] <= 1.0
          assert "observable signal pattern" in result["evidence_boundary"]
          print("SUPREME SIGNAL-NLP GATE: PASS")
          print(result)
          PY

name: SHIRMANI Supreme Senses NLP Contract

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    paths:
      - "docs/supreme-senses-nlp-contract-2026-10-02.md"
      - "schemas/supreme-senses-signal.schema.json"
      - "factory/supreme_senses_signal_qc.py"
      - "tests/test_supreme_senses_signal_qc.py"
      - ".github/workflows/supreme-senses-contract.yml"
  push:
    branches: [main]
    paths:
      - "docs/supreme-senses-nlp-contract-2026-10-02.md"
      - "schemas/supreme-senses-signal.schema.json"
      - "factory/supreme_senses_signal_qc.py"
      - "tests/test_supreme_senses_signal_qc.py"
      - ".github/workflows/supreme-senses-contract.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-senses-contract
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schema
        run: python3 -m json.tool schemas/supreme-senses-signal.schema.json >/dev/null
      - name: Compile QC gate and regression tests
        run: |
          python3 -m py_compile factory/supreme_senses_signal_qc.py tests/test_supreme_senses_signal_qc.py
          python3 -m unittest tests/test_supreme_senses_signal_qc.py -v
      - name: Contract smoke test
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("schemas/supreme-senses-signal.schema.json").read_text())
          required=set(s["required"])
          expected={"measurement","model_inference","plain_language","confidence","uncertainty","evidence","alternative_interpretations"}
          assert expected <= required
          print("Supreme-Senses contract smoke test: PASS")
          PY
      - name: Emit fail-closed summary
        run: |
          {
            echo "## Supreme-Senses NLP Contract"
            echo "- Multimodal measurement → pattern → inference → plain-language pipeline: PASS"
            echo "- Evidence and uncertainty fields: REQUIRED"
            echo "- Unsupported subjective-state claims: BLOCKED"
            echo "- Verification state: explicit"
            echo "- Perfect-accuracy claims: not permitted; performance must be measured"
          } >> "$GITHUB_STEP_SUMMARY"

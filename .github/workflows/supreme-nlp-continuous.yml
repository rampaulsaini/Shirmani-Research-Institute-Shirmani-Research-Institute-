name: SHIRMANI Supreme NLP Continuous

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/supreme_nlp_agent.py"
      - "factory/supreme_nlp_qc.py"
      - "factory/supreme-nlp-policy.json"
      - ".github/workflows/supreme-nlp-continuous.yml"

permissions:
  contents: write

concurrency:
  group: shirmani-supreme-nlp
  cancel-in-progress: false

jobs:
  nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate policy
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("factory/supreme-nlp-policy.json",encoding="utf-8"))
          assert p["fail_closed"] is True
          assert p["default_status"] == "UNVERIFIED"
          assert p["confidence_requires_evaluated_validation"] is True
          assert p["subjective_state_claims_require_independent_verification"] is True
          print("SUPREME_NLP_POLICY_V2=PASS")
          PY

      - name: Compile and run deterministic QC
        run: |
          python3 -m py_compile agents/supreme_nlp_agent.py factory/supreme_nlp_qc.py
          python3 factory/supreme_nlp_qc.py

      - name: Produce deterministic status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp_agent import interpret
          result=interpret({
              "context":"continuous baseline",
              "signals":[]
          })
          Path("generated/supreme-nlp").mkdir(parents=True, exist_ok=True)
          Path("generated/supreme-nlp/status.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          PY

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-status
          path: generated/supreme-nlp/status.json
          if-no-files-found: error

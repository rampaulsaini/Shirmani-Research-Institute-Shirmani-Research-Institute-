name: SHIRMANI Supreme NLP Continuous
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "agents/supreme_nlp.py"
      - "agents/supreme_nlp_agent.py"
      - "agents/language_agents.py"
      - "tests/**"
      - "factory/supreme_nlp_qc.py"
      - "factory/supreme-nlp-policy.json"
      - ".github/workflows/supreme-nlp-continuous.yml"
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/supreme_nlp.py"
      - "agents/supreme_nlp_agent.py"
      - "agents/language_agents.py"
      - "tests/test_supreme_nlp.py"
      - "tests/test_language_agents.py"
      - "factory/supreme_nlp_qc.py"
      - "factory/supreme-nlp-policy.json"
      - ".github/workflows/supreme-nlp-continuous.yml"

permissions:
  contents: write

concurrency:
  group: shirmani-supreme-nlp
  cancel-in-progress: false

jobs:
  nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate policy and compile contracts
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("factory/supreme-nlp-policy.json",encoding="utf-8"))
          assert p["fail_closed"] is True
          assert p["default_status"]=="UNVERIFIED"
          assert p["subjective_state_claims_require_independent_verification"] is True
          print("SUPREME_NLP_POLICY=PASS")
          PY
          python3 -m py_compile agents/supreme_nlp.py agents/supreme_nlp_agent.py agents/language_agents.py factory/supreme_nlp_qc.py

      - name: Run deterministic NLP tests
        run: |
          python3 factory/supreme_nlp_qc.py
          python3 -m unittest discover -s tests -p 'test_supreme_nlp.py' -v
          python3 -m unittest discover -s tests -p 'test_language_agents.py' -v

      - name: Produce deterministic status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp_agent import interpret
          result=interpret({"context":"continuous baseline","signals":[]})
          Path("generated").mkdir(exist_ok=True)
          Path("generated/supreme-nlp-status.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          assert result["status"]=="UNVERIFIED"
          assert result["verification"]["required"] is True
          PY

      - name: Commit status
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "omniverse-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/supreme-nlp-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nlp): refresh supreme NLP status"
          git push

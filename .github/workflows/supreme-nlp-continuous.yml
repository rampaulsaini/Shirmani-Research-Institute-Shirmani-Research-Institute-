name: SHIRMANI Supreme NLP Continuous
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/supreme_nlp_agent.py"
      - "factory/supreme_nlp_qc.py"
      - "factory/supreme-nlp-policy.json"
      - "factory/supreme-nlp-impartiality-policy.json"
      - ".github/workflows/supreme-nlp-continuous.yml"
permissions:
  contents: read
concurrency:
  group: shirmani-supreme-nlp
  cancel-in-progress: false
jobs:
  nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate policy and QC
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("factory/supreme-nlp-policy.json",encoding="utf-8"))
          assert p["fail_closed"] is True
          assert p["default_status"]=="UNVERIFIED"
          assert p["subjective_state_claims_require_independent_verification"] is True
          q=json.load(open("factory/supreme-nlp-impartiality-policy.json",encoding="utf-8"))
          assert q["fail_closed"] is True
          assert q["preferred_conclusion"] is None
          assert q["claim_levels"]["observation"]=="OBSERVED"
          print("SUPREME_NLP_POLICY=PASS")
          print("IMPARTIALITY_POLICY=PASS")
          PY
          python3 -m py_compile agents/supreme_nlp_agent.py factory/supreme_nlp_qc.py factory/supreme_nlp_impartiality_audit.py
          python3 factory/supreme_nlp_qc.py
          python3 factory/supreme_nlp_impartiality_audit.py
      - name: Produce deterministic status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp_agent import interpret
          result=interpret({"context":"continuous baseline","signals":[]})
          Path("generated").mkdir(exist_ok=True)
          Path("generated/supreme-nlp-status.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-continuous-status
          path: generated/supreme-nlp-status.json
          if-no-files-found: error
          retention-days: 14

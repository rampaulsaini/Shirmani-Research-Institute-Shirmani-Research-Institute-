name: SHIRMANI Supreme Signal-to-Language Practitioner
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "supreme-nlp/signal_to_language.py"
      - "schemas/supreme-signal-language.schema.json"
      - "tests/supreme_signal_language_test.py"
      - ".github/workflows/supreme-signal-language.yml"
permissions:
  contents: write
concurrency:
  group: shirmani-supreme-signal-language
  cancel-in-progress: true
jobs:
  signal-language:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Compile practitioner
        run: python -m py_compile supreme-nlp/signal_to_language.py
      - name: Run regression
        run: python3 tests/supreme_signal_language_test.py
      - name: Run practitioner
        run: python3 supreme-nlp/signal_to_language.py
      - name: Validate fail-closed contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-nlp/signal-language.json").read_text())
          assert d["governance"]["fail_closed"] is True
          assert d["governance"]["subjective_experience_claim_allowed"] is False
          assert d["governance"]["independent_verification_required"] is True
          assert d["verification_state"] in {"UNVERIFIED","REVIEW","BLOCKED"}
          assert 0 <= d["inference"]["confidence"] <= 1
          print("Signal-to-language fail-closed contract: PASS")
          PY
      - name: Commit telemetry
        run: |
          git config user.name "shirmani-signal-language[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/supreme-nlp/signal-language.json generated/supreme-nlp/signal-input.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "chore(supreme-nlp): refresh signal-to-language telemetry"
          git push

name: SHIRMANI Independent Verification Conveyor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main, supreme-verification-v2]
    paths:
      - "generated/independent-verification-status-2026-09-29.json"
      - "generated/independent-verification-queue.jsonl"
      - "generated/independent-verification-registry.jsonl"
      - "generated/independent-verification-records.json"
      - "factory/independent_verification_pipeline.py"
      - "factory/bootstrap_independent_verification_queue.py"
      - "factory/bootstrap_verification_review_registry.py"
      - ".github/workflows/independent-verification-conveyor.yml"
      - "research/independent-verification-protocol-2026-09-29.md"

permissions:
  contents: read

concurrency:
  group: shirmani-independent-verification-conveyor
  cancel-in-progress: true

jobs:
  conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap deterministic review queue
        run: python3 factory/bootstrap_independent_verification_queue.py

      - name: Bootstrap pending review slots
        run: python3 factory/bootstrap_verification_review_registry.py

      - name: Run fail-closed verification conveyor
        run: python3 factory/independent_verification_pipeline.py

      - name: Run queue QC when a queue exists
        run: |
          set -euo pipefail
          if [ -s generated/independent-verification-queue.jsonl ] && [ -s generated/claim-evidence.jsonl ]; then
            python3 factory/verification_queue_qc.py
          else
            echo "Queue QC: NOT_READY; fail-closed."
          fi

      - name: Run promotion QC when a review registry exists
        run: |
          set -euo pipefail
          if [ -s generated/independent-verification-registry.jsonl ] && [ -s generated/independent-verification-queue.jsonl ]; then
            python3 factory/verification_promotion_gate.py
          else
            echo "Promotion QC: NOT_READY; VERIFIED remains blocked."
          fi

      - name: Generate measurable progress map
        run: python3 scripts/generate_independent_verification_progress_map.py

      - name: Run independent verification scope-integrity audit
        run: python3 scripts/audit_independent_verification_scope.py

      - name: Publish conveyor report
        uses: actions/upload-artifact@v4
        with:
          name: independent-verification-conveyor-${{ github.run_id }}
          path: |
            generated/independent-verification-conveyor-report.json
            generated/independent-verification-progress.json
            generated/independent-verification-progress-map.md
            generated/VERIFICATION-QUEUE-QC.json
            generated/VERIFICATION-PROMOTION-QC.json
            generated/INDEPENDENT-VERIFICATION-SCOPE-INTEGRITY.json
            generated/independent-verification-queue.jsonl
            generated/independent-verification-registry.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Emit summary
        run: |
          {
            echo "## Independent Verification Conveyor"
            echo "- Pipeline: evidence -> independent test -> reproducible result -> audit -> VERIFIED"
            echo "- Review slots are generated automatically; VERIFIED is never auto-declared"
            echo "- Current independent verification baseline remains fail-closed at 0%"
            echo "- Continuous cycle: every 5 minutes"
          } >> "$GITHUB_STEP_SUMMARY"

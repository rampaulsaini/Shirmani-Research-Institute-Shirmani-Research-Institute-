name: SHIRMANI Supreme NLP Benchmark Integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "schemas/supreme-nlp-benchmark-record.schema.json"
      - "factory/supreme_nlp_benchmark_integrity.py"
      - "tests/supreme_nlp_benchmark_integrity.py"
      - "generated/supreme-nlp-benchmark-records/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-benchmark-integrity
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run fail-closed benchmark integrity gate
        run: python3 factory/supreme_nlp_benchmark_integrity.py
      - name: Run hardening test
        run: python3 tests/supreme_nlp_benchmark_integrity.py

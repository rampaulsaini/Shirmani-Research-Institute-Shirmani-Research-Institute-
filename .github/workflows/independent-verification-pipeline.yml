name: SHIRMANI Evidence-to-VERIFIED Control Plane
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "schemas/independent-verification-record.schema.json"
      - "factory/independent_verification_engine.py"
      - "generated/independent-verification-records.json"
      - ".github/workflows/independent-verification-pipeline.yml"
permissions:
  contents: read
concurrency:
  group: shirmani-independent-verification-control-plane
  cancel-in-progress: true
jobs:
  verification-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build current fail-closed verification status
        run: python3 factory/build_independent_verification_status.py

      - name: Validate schema and registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.load(open("schemas/independent-verification-record.schema.json",encoding="utf-8"))
          d=json.load(open("generated/independent-verification-records.json",encoding="utf-8"))
          assert isinstance(d.get("records"),list)
          print("SCHEMA_AND_REGISTRY: PASS")
          PY
      - name: Run Supreme NLP contract tests
        run: python tests/test_supreme_nlp_evidence_engine.py
      - name: Evaluate promotion gates
        run: python factory/independent_verification_engine.py
      - name: Run independent verification integrity gate
        run: python scripts/independent_verification_gate.py --registry generated/independent-verification-records.json
      - name: Enforce fail-closed VERIFIED rule
        run: |
          python - <<'PY'
          import json
          d=json.load(open("generated/independent-verification-promotion-report.json",encoding="utf-8"))
          for r in d["records"]:
              if r["eligible_for_verified"]:
                  assert r["requested_decision"]=="VERIFIED"
              else:
                  assert r["requested_decision"]!="VERIFIED" or r["errors"]
          print("VERIFIED_PROMOTION_GATE: PASS")
          print("VERIFIED eligible:",d["verified_records"])
          PY
      - name: Audit summary
        run: |
          {
            echo "## Evidence → VERIFIED Control Plane"
            echo "- Evidence collection → independent test → reproducibility → counter-evidence → audit → explicit reviewer decision"
            echo "- VERIFIED remains fail-closed"
            echo "- Automation cannot manufacture an independent review decision"
            echo "- Supreme NLP contract: provenance + uncertainty + abstention + multimodal disagreement preservation"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: independent-verification-promotion-${{ github.run_id }}
          path: generated/independent-verification-promotion-report.json
          if-no-files-found: error
          retention-days: 14

name: SHIRMANI Four-Stage Production — Institute Factory QC Showroom
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Run a deliberate production refresh even when the current scale target and QC gate are complete"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-four-stage-production
  cancel-in-progress: false
jobs:
  production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check production target and QC before generating another batch
        id: target_gate
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          live_path = Path("generated/live-production-state.json")
          qc_path = Path("generated/product-qc-gate.json")
          live = json.loads(live_path.read_text(encoding="utf-8")) if live_path.is_file() else {}
          qc = json.loads(qc_path.read_text(encoding="utf-8")) if qc_path.is_file() else {}

          def nonnegative_int(mapping, key):
              value = mapping.get(key)
              # Missing, null, booleans, strings, and negative values must never
              # satisfy the completed-target gate.
              if type(value) is not int or value < 0:
                  return None
              return value

          target = nonnegative_int(live, "five_thousand_scale_target")
          produced = nonnegative_int(live, "concrete_repository_assets")
          remaining = nonnegative_int(live, "remaining_to_scale_target")
          passed = nonnegative_int(qc, "qc_passed")
          failed = nonnegative_int(qc, "qc_failed")
          qc_state = live.get("qc_state")
          force = os.environ.get("FORCE_REFRESH", "false").strip().lower() == "true"

          complete = (
              target is not None
              and target > 0
              and produced is not None
              and produced >= target
              and remaining == 0
              and qc_state == "QC_PASSED"
              and passed is not None
              and passed >= target
              and failed == 0
          )
          skip = complete and not force
          reason = (
              f"Target reached ({produced}/{target}); QC passed={passed}, failed={failed}. "
              "Skip duplicate production and prioritize downstream customer, dispatch, payment and verification work."
              if skip else
              "Manual force refresh requested; run the normal production/QC flow."
              if force else
              f"Production/QC target is not complete (produced={produced}/{target}, qc_state={qc_state!r}, passed={passed}, failed={failed}); run the normal flow."
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"skip={'true' if skip else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Production target gate\n\n" + reason + "\n")
          print(reason)
          PY
      - name: Institute → Factory → QC → Showroom
        if: steps.target_gate.outputs.skip != 'true'
        run: python3 factory/four_stage_production_orchestrator.py
      - name: Publish production state through PR
        if: steps.target_gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/production-cycle-${GITHUB_RUN_ID}"
          git config user.name "shirmani-production[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          for path in generated/1000-digital-products.json generated/PRODUCT-PASSPORTS.jsonl generated/real-product-factory-status.json generated/concrete-product-asset-status.json generated/product-qc-gate.json generated/live-production-state.json generated/four-stage-production-status.json generated/production-release-map.json generated/public-showroom-status.json generated/showroom-entry-fees.json generated/production-throughput.json products/production supreme-showroom.html docs/four-stage-production-contract.md; do
            if [[ -e "$path" ]]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No production delta."
            exit 0
          fi
          git commit -m "chore(production): advance four-stage showroom production"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "chore(production): advance four-stage showroom production" --body "Automated production cycle: Institute discovery → concrete factory production → deterministic QC gate → public showroom state. Verification remains downstream.")
          echo "$PR_URL"
          gh pr merge "$BRANCH" --auto --squash --delete-branch || echo "Auto-merge unavailable; PR remains open for the repository gate."

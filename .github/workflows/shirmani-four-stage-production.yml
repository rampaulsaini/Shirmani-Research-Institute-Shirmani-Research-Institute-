name: SHIRMANI Four-Stage Production — Institute Factory QC Showroom
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-four-stage-production
  cancel-in-progress: false
jobs:
  production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Institute → Factory → QC → Showroom
        run: python3 factory/four_stage_production_orchestrator.py
      - name: Publish production state
        run: |
          git config user.name "shirmani-production[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/1000-digital-products.json generated/PRODUCT-PASSPORTS.jsonl generated/real-product-factory-status.json generated/concrete-product-asset-status.json generated/product-qc-gate.json generated/four-stage-production-status.json generated/production-release-map.json generated/public-showroom-status.json generated/showroom-entry-fees.json products/production supreme-showroom.html docs/four-stage-production-contract.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(production): advance four-stage showroom production"
          git push

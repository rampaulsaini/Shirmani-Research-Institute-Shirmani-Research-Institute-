name: SHIRMANI Supreme NLP Conveyor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "supreme-nlp/**"
      - "schemas/supreme-nlp-result.schema.json"
      - ".github/workflows/supreme-nlp-conveyor.yml"

permissions:
  contents: write

concurrency:
  group: shirmani-supreme-nlp
  cancel-in-progress: true

jobs:
  supreme-nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile supreme-nlp/engine.py
      - name: Run evidence-first NLP
        run: python supreme-nlp/engine.py
      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open("generated/supreme-nlp/status.json",encoding="utf-8"))
          assert d["governance"]["fail_closed"] is True
          assert d["governance"]["independent_verification_required"] is True
          assert d["governance"]["subjective_experience_claim_allowed"] is False
          assert 0 <= d["interpretation"]["confidence"] <= 1
          assert d["features"]["evidence_grade"] in {"A","B","C","D"}
          print("Supreme NLP contract: PASS")
          PY
      - name: Run Automission supervisor
        run: python agents/automission_supervisor.py
      - name: Publish generated status through pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "shirmani-supreme-nlp[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/supreme-nlp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(supreme-nlp): refresh evidence-first interpretation"
          branch="automation/supreme-nlp-status"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force origin "HEAD:$branch"
          if gh pr list --repo "${{ github.repository }}" --base main --head "$branch" --state open --json number --jq "length" | grep -q "^0$"; then
            gh pr create --repo "${{ github.repository }}" --base main --head "$branch" --title "chore(supreme-nlp): refresh evidence-first interpretation" --body "Automated generated status publication. Protected main branch is updated only through pull requests."
          fi

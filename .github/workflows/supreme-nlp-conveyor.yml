name: SHIRMANI Supreme NLP Conveyor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "supreme-nlp/**"
      - "schemas/supreme-nlp-result.schema.json"
      - ".github/workflows/supreme-nlp-conveyor.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp
  cancel-in-progress: true

jobs:
  supreme-nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile supreme-nlp/engine.py
      - name: Run evidence-first NLP
        run: python supreme-nlp/engine.py
      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open("generated/supreme-nlp/status.json",encoding="utf-8"))
          assert d["governance"]["fail_closed"] is True
          assert d["governance"]["independent_verification_required"] is True
          assert d["governance"]["subjective_experience_claim_allowed"] is False
          assert 0 <= d["interpretation"]["confidence"] <= 1
          assert d["features"]["evidence_grade"] in {"A","B","C","D"}
          print("Supreme NLP contract: PASS")
          PY
      - name: Run Automission supervisor
        run: python agents/automission_supervisor.py
      - name: Upload generated NLP status
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-status-${{ github.run_id }}
          path: |
            generated/supreme-nlp/status.json
            generated/supreme-nlp/automission-plan.json
          if-no-files-found: error
          retention-days: 14

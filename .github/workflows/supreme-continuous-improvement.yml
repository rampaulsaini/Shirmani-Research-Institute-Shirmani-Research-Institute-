name: SHIRMANI Supreme Continuous Improvement

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "agents/supreme_nlp_engine.py"
      - "agents/automission_supervisor.py"
      - "factory/supreme_quality_gate.py"
      - ".github/workflows/supreme-continuous-improvement.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-continuous-improvement
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile core Python
        run: |
          python -m py_compile agents/supreme_nlp_engine.py
          python -m py_compile agents/automission_supervisor.py
          python -m py_compile factory/supreme_quality_gate.py

      - name: Run NLP engine smoke test
        run: |
          mkdir -p generated/supreme-nlp
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp_engine import Signal, interpret
          signals=[
            Signal("demo-a",1.0,"unit","source-a","2026-10-01T00:00:00Z"),
            Signal("demo-b",0.5,"unit","source-b","2026-10-01T00:00:01Z"),
          ]
          out=interpret(signals, {"mode":"smoke_test"})
          Path("generated/supreme-nlp/status.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Run deterministic quality gate
        run: python factory/supreme_quality_gate.py

      - name: Run existing Automission supervisor
        run: python agents/automission_supervisor.py

      - name: Validate verification boundary
        run: |
          test -f .github/workflows/shirmani-independent-verification-gate.yml
          test -f research/independent-verification-protocol-2026-09-29.md
          grep -q "workflow succeeding is not independent verification" research/independent-verification-protocol-2026-09-29.md
          grep -q "counter-evidence" research/independent-verification-protocol-2026-09-29.md
          echo "FAIL-CLOSED VERIFICATION BOUNDARY: PASS"

      - name: Validate repository configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in ("factory","schemas","automation"):
              p=Path(root)
              for f in p.rglob("*.json"):
                  json.loads(f.read_text(encoding="utf-8"))
          print("JSON CONFIGURATION: PASS")
          PY

      - name: Security and mutation boundary
        run: |
          grep -q "scheduled_code_mutation_allowed.*False" agents/automission_supervisor.py
          echo "SCHEDULED CODE MUTATION: BLOCKED"

      - name: Quality summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          out={
            "status":"audit_passed",
            "pipeline":"Observe -> Collect -> Clean -> Analyze -> Reason -> Translate -> Verify -> Audit -> Improve",
            "cycle":"5-minute scheduled audit",
            "independent_verification_required":True,
            "scheduled_code_mutation_allowed":False,
            "generated_at":datetime.now(timezone.utc).isoformat()
          }
          Path("generated/supreme-nlp/continuous-improvement-status.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY

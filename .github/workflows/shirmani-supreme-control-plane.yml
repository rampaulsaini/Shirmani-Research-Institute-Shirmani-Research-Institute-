name: SHIRMANI Supreme Control Plane

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "agents/supreme_nlp.py"
      - "agents/supreme_nlp_practitioner.py"
      - "agents/automission_supervisor.py"
      - "factory/supreme_quality_controller.py"
      - "schemas/supreme-nlp-*.json"
      - "scripts/validate_supreme_nlp*.py"
      - ".github/workflows/shirmani-supreme-control-plane.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: shirmani-supreme-control-plane
  cancel-in-progress: false

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile canonical intelligence modules
        run: |
          python -m py_compile agents/supreme_nlp.py agents/supreme_nlp_practitioner.py agents/automission_supervisor.py factory/supreme_quality_controller.py factory/supreme_ai_ml_nlp_engine.py

      - name: Validate Supreme NLP contracts
        run: |
          python scripts/validate_supreme_nlp.py
          python scripts/validate_supreme_nlp_practitioner.py

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path("schemas/supreme-nlp-record.schema.json"), Path("schemas/supreme-nlp-practitioner.schema.json")]:
              json.loads(p.read_text(encoding="utf-8"))
              print("SCHEMA_OK", p)
          PY

      - name: Run deterministic AI-ML-NLP regression suite
        run: python -m unittest discover -s tests -p 'test_supreme_ai_ml_nlp.py' -v

      - name: Run fail-closed quality controller
        run: python factory/supreme_quality_controller.py

      - name: Generate deterministic NLP status and improvement plan
        run: |
          mkdir -p generated/supreme-nlp
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp import build_record
          from agents.automission_supervisor import inspect
          rows = [
              {"modality":"synthetic","feature":"baseline_a","value":1.0,"quality":1.0,"source":"control-plane"},
              {"modality":"synthetic","feature":"baseline_b","value":1.0,"quality":1.0,"source":"control-plane"},
          ]
          Path("generated/supreme-nlp/status.json").write_text(
              json.dumps(build_record(rows, "control-plane"), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8")
          Path("generated/supreme-nlp/automission-plan.json").write_text(
              json.dumps(inspect(), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8")
          PY

      - name: Enforce fail-closed governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("generated/supreme-nlp/status.json").read_text())
          p=json.loads(Path("generated/supreme-nlp/automission-plan.json").read_text())
          assert s["result"]["status"] == "interpreted"
          assert 0 <= s["result"]["interpretation"]["confidence"] <= 1
          assert p["governance"]["scheduled_code_mutation_allowed"] is False
          assert p["governance"]["independent_verification_required"] is True
          print("SUPREME_CONTROL_PLANE_GOVERNANCE_OK")
          PY

      - name: Publish unified telemetry
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-supreme-control-plane-${{ github.run_id }}
          path: |
            generated/supreme-quality-report.json
            generated/supreme-nlp/status.json
            generated/supreme-nlp/automission-plan.json
          if-no-files-found: warn
          retention-days: 14

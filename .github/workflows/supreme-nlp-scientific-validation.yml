name: SHIRMANI Supreme NLP Scientific Validation v3

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-scientific-validation
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile factory/supreme_nlp_scientific_validation.py
      - name: Unit tests
        run: python -m unittest tests/test_supreme_nlp_scientific_validation.py -v
      - name: Schema validation
        run: python -m json.tool schemas/supreme-nlp-scientific-validation-record.schema.json >/dev/null
      - name: Deterministic scientific-validation self-test
        run: python factory/supreme_nlp_scientific_validation.py
      - name: Verify fail-closed boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-nlp/scientific-validation-self-test.json").read_text())
          assert d["status"] == "PASS"
          assert d["gates"]["verification_not_inferred"] is True
          print("SCIENTIFIC_VALIDATION_FAIL_CLOSED: PASS")
          PY
      - name: Summary
        run: |
          {
            echo "## Supreme NLP Scientific Validation v3"
            echo "- TEVV-oriented validation"
            echo "- adversarial and negative-control hooks"
            echo "- provenance and reproducibility requirements"
            echo "- uncertainty and bounded metrics"
            echo "- independent-review boundary remains fail-closed"
            echo "- Automission cannot manufacture VERIFIED status"
          } >> "$GITHUB_STEP_SUMMARY"

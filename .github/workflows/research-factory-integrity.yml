name: Research Factory Integrity

on:
  push:
    paths:
      - "generated/**/*.json"
      - "schemas/**/*.json"
      - "scripts/**/*.py"
      - "PROJECT-CONTINUITY.md"\n      - "agents/**/*.py"\n      - "factory/**/*.py"
      - "FACTORY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax
        run: |
          python3 scripts/validate_json.py generated/*.json schemas/*.json
      - name: Factory contract smoke test\n        run: |\n          python3 factory/validate_factory.py\n      - name: Deterministic normalization smoke test
        run: |
          python3 -m py_compile scripts/normalize_records.py scripts/validate_json.py

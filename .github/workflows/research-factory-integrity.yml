name: Research Factory Integrity

on:
  push:
    paths:
      - "generated/**/*.json"
      - "schemas/**/*.json"
      - "scripts/**/*.py"
      - "PROJECT-CONTINUITY.md"
      - "agents/**/*.py"
      - "factory/**/*.py"
      - "FACTORY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax
        run: |
          python3 scripts/validate_json.py generated/*.json schemas/*.json
      - name: No committed Python cache files
        run: |
          if git ls-files '*.pyc' | grep -q .; then
            echo 'Committed Python bytecode artifacts detected'; exit 1;
          fi
          if git ls-files | grep -E '(^|/)__pycache__/' | grep -q .; then
            echo 'Committed Python cache directories detected'; exit 1;
          fi
      - name: Factory contract smoke test
        run: |
          python3 factory/validate_factory.py
      - name: Deterministic normalization smoke test
        run: |
          python3 -m py_compile scripts/normalize_records.py scripts/validate_json.py factory/heart_view_label.py
      - name: Heart-view NEXT_LABEL gate
        run: |
          python3 factory/heart_view_label.py
          python3 - <<'PY'
          import json
          p=json.load(open("generated/heart-view-label.json",encoding="utf-8"))
          assert p["label"]=="NEXT_LABEL"
          assert p["state"]=="HEART_VIEW_FRAMEWORK"
          assert p["integrity"]["physiological_inactivity_claimed"] is False
          assert p["integrity"]["empirical_certainty_invented"] is False
          print("HEART VIEW NEXT_LABEL: PASS")
          PY

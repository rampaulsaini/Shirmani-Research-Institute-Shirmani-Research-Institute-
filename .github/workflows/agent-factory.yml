name: Multi-Agent Research Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 1'
  push:
    paths:
      - 'agents/**'
      - 'factory/agent_config.json'
      - 'schemas/**'
      - '.github/workflows/agent-factory.yml'
permissions:
  contents: write
concurrency:
  group: omniverse-research-factory
  cancel-in-progress: false
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Python agents and factory
        run: python -m compileall agents factory
      - name: Validate JSON configuration
        run: python3 -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('factory').glob('*.json')]; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('schemas').glob('*.json')]; print('JSON configuration OK')"
      - name: Run factory smoke test
        run: python3 factory/validate_factory.py
      - name: Build source corpus and products
        run: python3 factory/build_factory.py
      - name: Run multi-agent orchestration
        run: python3 -c "from agents.orchestrator import run; print(run('generated/verse-corpus.jsonl','generated/agent-run'))"
      - name: Commit factory state
        run: |
          git config user.name 'omniverse-factory[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents factory/agent_config.json schemas docs generated
          git diff --cached --quiet && exit 0
          git commit -m 'chore(factory): run multi-agent pipeline'
          git push

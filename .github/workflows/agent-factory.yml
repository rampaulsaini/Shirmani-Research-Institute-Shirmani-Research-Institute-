name: Multi-Agent Research Factory
on:
  workflow_dispatch:
  push:
    paths:
      - 'agents/**'
      - 'factory/**'
      - 'schemas/**'
      - 'docs/**'
      - '.github/workflows/agent-factory.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Python
        run: python -m compileall agents factory

      - name: Validate configuration
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('factory').glob('*.json')]; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('schemas').glob('*.json')]; print('configuration OK')"

      - name: Validate router
        run: python -c "from factory.job_router import route; r=route('research.deep', nvidia_enabled=False); assert r['agent']=='research'; assert r['verification_required'] is True; print(r)"

      - name: Smoke test
        run: python factory/validate_factory.py

      - name: Build source corpus
        run: python factory/build_factory.py --bootstrap-only

      - name: Assert corpus populated
        run: python -c "import json; m=json.load(open('generated/manifest.json', encoding='utf-8')); assert m['units'] > 0, 'SOURCE_INGESTION_EMPTY'; print('source units:', m['units'])"

      - name: Run product batch
        run: python factory/batch_worker.py --batch-size 5000

      - name: Run multi-agent verification
        run: python -c "from agents.orchestrator import run; print(run('generated/verse-corpus.jsonl','generated/agent-run',batch_size=1000))"

      - name: Commit factory state
        run: |
          git config user.name 'omniverse-factory[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents factory schemas docs generated
          git diff --cached --quiet && exit 0
          git commit -m 'chore(factory): run resumable multi-agent batch'
          git push

name: SHIRMANI Public Module Production Map

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shirmani-public-module-production
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build public module production map
        run: python3 factory/public_module_inventory.py
      - name: Publish module map as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-public-module-production-map
          path: |
            generated/public-module-inventory.json
            generated/public-module-production-map.html
          retention-days: 30

name: SHIRMANI Public Module Production Map

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: shirmani-public-module-production
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build public module production map
        run: python3 factory/public_module_inventory.py
      - name: Publish module map as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-public-module-production-map
          path: |
            generated/public-module-inventory.json
            generated/public-module-production-map.html
          retention-days: 30
      - name: Publish module map through PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "SHIRMANI Public Module Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/public-module-inventory.json generated/public-module-production-map.html
          if git diff --cached --quiet; then
            echo "No module-map changes to publish."
            exit 0
          fi
          BRANCH="automation/public-module-map-publish"
          git checkout -B "$BRANCH"
          git commit -m "chore(automission): publish public module production map"
          git push --force-with-lease origin "HEAD:$BRANCH"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "chore(automission): publish public module production map" --body "Automated repository module inventory and production map. Publication is performed through the repository PR gate.")"
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh workflow run github-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

name: SHIRMANI Public Module Production Map

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shirmani-public-module-production
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build public module production map
        run: python3 factory/public_module_inventory.py
      - name: Publish changed production map
        run: |
          git config user.name "shirmani-production-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/public-module-inventory.json generated/public-module-production-map.html
          if git diff --cached --quiet; then
            echo "No production-map changes."
            exit 0
          fi
          git commit -m "chore(production): refresh public module production map"
          git push

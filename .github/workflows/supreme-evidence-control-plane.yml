name: Supreme Evidence Control Plane

on:
  workflow_dispatch:
  push:
    paths:
      - "agents/supreme_control_plane.py"
      - "agents/supreme_nlp_practitioner.py"
      - "agents/supreme_nlp_quality.py"
      - "tests/test_supreme_control_plane.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: supreme-evidence-control-plane
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile control-plane modules
        run: python -m py_compile agents/supreme_control_plane.py agents/supreme_nlp_practitioner.py agents/supreme_nlp_quality.py

      - name: Run deterministic self-test
        working-directory: agents
        run: python supreme_control_plane.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_supreme_control_plane.py" -v

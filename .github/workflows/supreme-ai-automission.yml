name: ULTRA-MEGA-INFINITY-QUANTUM AI ML NLP Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/supreme_nlp.py"
      - "agents/ultra_automission.py"
      - "factory/supreme_ai_qc.py"
      - "tests/test_supreme_ai.py"
      - "schemas/supreme-ai-config.json"
      - ".github/workflows/supreme-ai-automission.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-ai-automission
  cancel-in-progress: true

jobs:
  supreme-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p "test_supreme_ai.py" -v
      - name: Generate canonical NLP status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp import build_record
          rows = []
          p = Path("generated/source-units.jsonl")
          if p.exists():
              for line in p.read_text(encoding="utf-8").splitlines()[:1000]:
                  if line.strip():
                      rows.append({"modality":"text","feature":"repository_text_length","value":len(line),"quality":0.5,"source":"repository-text"})
          record = build_record(rows, "supreme-ai-${{ github.run_id }}")
          out = Path("generated/supreme-nlp")
          out.mkdir(parents=True, exist_ok=True)
          (out/"status.json").write_text(json.dumps(record, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          (out/"simple-language.txt").write_text(record["simple_language"]+"\n", encoding="utf-8")
          PY
      - name: Build fail-closed Automission plan
        run: python3 agents/ultra_automission.py
      - name: Run Supreme AI QC
        run: python3 factory/supreme_ai_qc.py
      - name: Validate verification boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("generated/supreme-nlp/automission-plan.json").read_text(encoding="utf-8"))
          assert d["governance"]["verification_promotion"]=="independent_verification_required"
          assert d["governance"]["scheduled_source_mutation"] is False
          print("Supreme AI governance boundary: PASS")
          PY
      - name: Upload Supreme AI status
        uses: actions/upload-artifact@v4
        with:
          name: supreme-ai-automission-${{ github.run_id }}
          path: generated/supreme-nlp/
          if-no-files-found: error
          retention-days: 14
      - name: Emit run summary
        run: |
          {
            echo "## ULTRA-MEGA-INFINITY-QUANTUM AI/ML/NLP Automission"
            echo "- Continuous cadence: every 5 minutes"
            echo "- Observable-signal NLP translation: enabled"
            echo "- Multimodal-ready architecture: enabled"
            echo "- Fail-closed verification boundary: enabled"
            echo "- Scheduled production-source mutation: disabled"
            echo "- Independent verification remains required for VERIFIED status"
          } >> "$GITHUB_STEP_SUMMARY"

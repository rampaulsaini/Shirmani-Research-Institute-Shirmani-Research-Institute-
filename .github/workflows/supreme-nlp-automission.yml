name: Supreme NLP Automission Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: supreme-nlp-automission
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Run non-destructive audit
        run: python3 automation/supreme_nlp_automission.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-audit
          path: artifacts/supreme-nlp-audit.json
          if-no-files-found: error
          retention-days: 14

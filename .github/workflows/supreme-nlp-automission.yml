name: Supreme NLP Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "agents/supreme_nlp.py"
      - "agents/supreme_nlp_practitioner.py"
      - "agents/automission_supervisor.py"
      - "agents/neutrality_gate.py"
      - "scripts/validate_supreme_nlp.py"
      - "scripts/validate_supreme_nlp_practitioner.py"
      - "scripts/validate_neutrality_gate.py"
      - "scripts/validate_automission_supervisor.py"
      - "schemas/supreme-nlp-record.schema.json"
      - "docs/SUPREME-NLP-ARCHITECTURE.md"
      - "docs/supreme-nlp-neutral-automission.md"
      - "factory/supreme_nlp_qc.py"
      - ".github/workflows/supreme-nlp-automission.yml"

permissions:
  contents: read

concurrency:
  group: supreme-nlp-automission
  cancel-in-progress: false

jobs:
  audit-and-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile and contract-test
        run: |
          python -m py_compile agents/supreme_nlp.py agents/supreme_nlp_practitioner.py agents/automission_supervisor.py agents/neutrality_gate.py factory/supreme_nlp_qc.py
          python scripts/validate_supreme_nlp.py
          python scripts/validate_supreme_nlp_practitioner.py
          python scripts/validate_neutrality_gate.py
          python factory/supreme_nlp_qc.py

      - name: Validate Automission supervisor contract
        run: python scripts/validate_automission_supervisor.py

      - name: Validate schema syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("schemas/supreme-nlp-record.schema.json").read_text(encoding="utf-8"))
          print("SCHEMA_JSON_OK")
          PY

      - name: Generate deterministic status
        run: |
          mkdir -p generated/supreme-nlp
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp import build_record

          p = Path("generated/signal-input.jsonl")
          rows = (
              [json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
              if p.exists() else []
          )
          if not rows:
              rows = [
                  {"modality":"synthetic","feature":"baseline_a","value":1.0,"quality":1.0,"source":"automission-smoke"},
                  {"modality":"synthetic","feature":"baseline_b","value":1.0,"quality":1.0,"source":"automission-smoke"},
              ]

          rec = build_record(rows, "automission-cycle")
          Path("generated/supreme-nlp/status.json").write_text(
              json.dumps(rec, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(rec["simple_language"])
          print("FINGERPRINT:", rec["fingerprint"])
          PY

      - name: Run neutrality and evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.neutrality_gate import audit

          out = audit([{
              "claim_type": "SOURCE_WORLDVIEW",
              "verification_status": "UNVERIFIED",
              "provenance": "user-source-2026-09-20",
              "evidence": [],
          }])

          p = Path("generated/supreme-nlp/neutrality-status.json")
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          assert out["status"] == "HOLD"
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Run Automission improvement audit
        run: python agents/automission_supervisor.py

      - name: Validate generated record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("generated/supreme-nlp/status.json").read_text(encoding="utf-8"))
          plan = json.loads(Path("generated/supreme-nlp/automission-plan.json").read_text(encoding="utf-8"))
          neutral = json.loads(Path("generated/supreme-nlp/neutrality-status.json").read_text(encoding="utf-8"))

          assert status["fingerprint"]
          assert status["result"]["status"] in {"no_data", "insufficient_quality", "interpreted"}
          assert plan["state"] in {"MONITOR", "IMPROVEMENT_REQUIRED"}
          assert isinstance(plan["actions"], list) and plan["actions"]
          assert neutral["status"] == "HOLD"
          assert neutral["governance"]["fail_closed"] is True
          print("GENERATED_RECORD_CONTRACT_OK")
          PY

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-automission-${{ github.run_id }}
          path: |
            generated/supreme-nlp/status.json
            generated/supreme-nlp/automission-plan.json
            generated/supreme-nlp/neutrality-status.json
          if-no-files-found: error
          retention-days: 14

      - name: Emit machine-readable summary
        run: |
          {
            echo "## Supreme NLP Automission"
            echo ""
            echo "- Cycle: every 5 minutes"
            echo "- Evidence: deterministic multimodal status"
            echo "- Neutrality: source/model/evidence separation enforced"
            echo "- Verification: independent verification remains required"
            echo "- Code mutation: disabled in scheduled audit"
            echo "- Artifacts: uploaded for traceability"
          } >> "$GITHUB_STEP_SUMMARY"

name: Supreme NLP Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "agents/supreme_nlp.py"
      - "agents/automission_supervisor.py"
      - "scripts/validate_supreme_nlp.py"
      - "schemas/supreme-nlp-record.schema.json"
      - ".github/workflows/supreme-nlp-automission.yml"

permissions:
  contents: write

concurrency:
  group: supreme-nlp-automission
  cancel-in-progress: true

jobs:
  audit-and-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile and contract-test
        run: |
          python -m py_compile agents/supreme_nlp.py agents/automission_supervisor.py
          python scripts/validate_supreme_nlp.py

      - name: Validate schema syntax
        run: python -c "import json; json.load(open('schemas/supreme-nlp-record.schema.json',encoding='utf-8'))"

      - name: Generate deterministic status
        run: |
          mkdir -p generated/supreme-nlp
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.supreme_nlp import build_record
          p=Path("generated/signal-input.jsonl")
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()] if p.exists() else []
          if not rows:
              rows=[
                {"modality":"synthetic","feature":"baseline_a","value":1.0,"quality":1.0,"source":"automission-smoke"},
                {"modality":"synthetic","feature":"baseline_b","value":1.0,"quality":1.0,"source":"automission-smoke"}
              ]
          rec=build_record(rows,"automission-cycle")
          Path("generated/supreme-nlp/status.json").write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding="utf-8")
          print(rec["simple_language"])
          PY

      - name: Run Automission improvement audit
        run: python agents/automission_supervisor.py

      - name: Persist deterministic outputs
        run: |
          git config user.name "omniverse-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/supreme-nlp/status.json generated/supreme-nlp/automission-plan.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(automission): update supreme NLP audit"
          git push

name: Supreme Multimodal NLP Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "agents/supreme_nlp.py"
      - "agents/automission_engine.py"
      - "tests/test_supreme_nlp.py"
      - "schemas/*nlp*.json"
      - "schemas/automission-result.schema.json"
      - "docs/SUPREME-MULTIMODAL-NLP-AUTOMISSION.md"
      - ".github/workflows/supreme-nlp-automission.yml"

permissions:
  contents: read

concurrency:
  group: supreme-nlp-automission
  cancel-in-progress: false

jobs:
  architecture-integrity:
    name: Architecture Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate architecture files
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/SUPREME-MULTIMODAL-NLP-AUTOMISSION.md
          test -s agents/supreme_nlp.py
          test -s agents/automission_engine.py
          test -s tests/test_supreme_nlp.py
          python -m json.tool schemas/supreme-nlp-record.schema.json >/dev/null
          python -m json.tool schemas/automission-result.schema.json >/dev/null

      - name: Compile agents
        run: python -m compileall -q agents

      - name: Run deterministic verification tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check evidence-first safety language
        shell: bash
        run: |
          set -euo pipefail
          grep -q "observed signal" docs/SUPREME-MULTIMODAL-NLP-AUTOMISSION.md
          grep -q "independent verification" docs/SUPREME-MULTIMODAL-NLP-AUTOMISSION.md
          grep -q "Production changes require" docs/SUPREME-MULTIMODAL-NLP-AUTOMISSION.md

      - name: Emit machine-readable audit status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automission/status
          cat > automission/status/supreme-nlp-status.json <<'JSON'
          {
            "system": "supreme-multimodal-nlp-automission",
            "cycle": "architecture-integrity",
            "result": "PASS",
            "verification": "schema-tests-and-document-integrity",
            "production_model_training": false
          }
          JSON

      - name: Upload audit record
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-automission-status
          path: automission/status/supreme-nlp-status.json

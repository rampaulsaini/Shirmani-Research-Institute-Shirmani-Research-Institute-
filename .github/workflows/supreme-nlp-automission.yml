name: SHIRMANI Supreme NLP Automission

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main, supreme-nlp-automission-v3]
    paths:
      - "agents/supreme_nlp.py"
      - "agents/automission_supervisor.py"
      - "schemas/supreme-nlp-observation.schema.json"
      - "tests/test_supreme_nlp_contract.py"
      - "docs/SUPREME-NLP-AUTOMISSION.md"
      - ".github/workflows/supreme-nlp-automission.yml"

permissions:
  contents: read

concurrency:
  group: shirmani-supreme-nlp-automission
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile agents/supreme_nlp.py agents/automission_supervisor.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_supreme_nlp_contract.py" -v
      - name: Schema syntax
        run: python -m json.tool schemas/supreme-nlp-observation.schema.json >/dev/null
      - name: Synthetic multimodal benchmark
        run: |
          mkdir -p generated/supreme-nlp
          cat > generated/supreme-nlp/observations.jsonl <<'EOF'
          {"modality":"bioelectric","feature":"signal","value":0.42,"unit":"mV","quality":0.95,"source":"synthetic-a","timestamp":"2026-10-02T00:00:00Z"}
          {"modality":"vibration","feature":"frequency","value":12.4,"unit":"Hz","quality":0.90,"source":"synthetic-b","timestamp":"2026-10-02T00:00:01Z"}
          EOF
          python - <<'PY'
          from agents.supreme_nlp import process_jsonl, validate_record_contract
          record = process_jsonl("generated/supreme-nlp/observations.jsonl", "generated/supreme-nlp/status.json")
          errors = validate_record_contract(record)
          assert not errors, errors
          assert record["result"]["status"] == "interpreted"
          assert record["provenance"]["verification_status"] == "UNVERIFIED"
          assert record["result"]["features"]["modalities"] >= 2
          print("Supreme NLP Automission gate: PASS")
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: supreme-nlp-automission-${{ github.run_id }}
          path: generated/supreme-nlp/status.json
          retention-days: 14

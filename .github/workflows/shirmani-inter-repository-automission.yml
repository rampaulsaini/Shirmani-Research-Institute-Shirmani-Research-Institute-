name: SHIRMANI Inter-Repository Automission Orchestrator

on:
  # Cross-repository dispatch is production-scoped: feature-branch pushes must not fan out downstream.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      brief:
        description: "Research/creative brief to federate"
        required: false
        default: "Automission continuity brief: continue verified research-to-creative production work."
        type: string
      format:
        description: "Target production format"
        required: false
        default: "animated-film"
        type: string
  repository_dispatch:
    types:
      - shirmani_automission_request
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-inter-repository-automission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow syntax
        run: echo "Inter-repository automation workflow loaded successfully for ${{ github.event_name }}."

      - name: Check federation credential
        id: federation
        env:
          FEDERATION_TOKEN: ${{ secrets.SHIRMANI_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(python3 - <<'PY'
          import os
          token = os.environ.get("FEDERATION_TOKEN", "")
          print("true" if token and token.isascii() and not any(ch.isspace() for ch in token) else "false")
          PY
          )
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Dispatch approved repository matrix
        if: steps.federation.outputs.enabled == 'true'
        env:
          REPOSITORY_MATRIX: ${{ vars.SHIRMANI_REPOSITORIES }}
          MANUAL_BRIEF: ${{ inputs.brief }}
          MANUAL_FORMAT: ${{ inputs.format }}
          EVENT_BRIEF: ${{ github.event.client_payload.brief }}
          EVENT_FORMAT: ${{ github.event.client_payload.format }}
          AUTOMATION_MODE: ${{ vars.SHIRMANI_AUTOMATION_MODE || 'CONTINUOUS' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SHIRMANI_GITHUB_TOKEN }}
          script: |
            const raw = process.env.REPOSITORY_MATRIX || '';
            let targets = [];
            if (raw.trim()) {
              try {
                const parsed = JSON.parse(raw);
                targets = Array.isArray(parsed) ? parsed : (parsed.repositories || []);
              } catch (error) {
                core.setFailed('SHIRMANI_REPOSITORIES must be valid JSON.');
                return;
              }
            }

            if (!targets.length) {
              targets = [{
                repository: 'rampaulsaini/yatharth-music-ai',
                event_type: 'yatharth_studio_request',
                enabled: true
              }];
            }

            const brief =
              process.env.MANUAL_BRIEF ||
              process.env.EVENT_BRIEF ||
              'Automission continuity brief: continue verified research-to-creative production work.';
            const format =
              process.env.MANUAL_FORMAT ||
              process.env.EVENT_FORMAT ||
              'animated-film';

            const allowedFormats = new Set([
              'animated-film',
              'animated-short',
              'music-video',
              'story-film'
            ]);
            if (!allowedFormats.has(format)) {
              core.setFailed(`Unsupported production format: ${format}`);
              return;
            }

            const mode = process.env.AUTOMATION_MODE || 'CONTINUOUS';

            for (const target of targets) {
              if (target.enabled === false) continue;
              if (!target.repository || !target.event_type) {
                core.warning(`Skipping invalid target: ${JSON.stringify(target)}`);
                continue;
              }

              const parts = target.repository.split('/');
              if (parts.length !== 2 || !parts[0] || !parts[1]) {
                core.warning(`Skipping invalid repository: ${target.repository}`);
                continue;
              }

              const receiptPath = target.receipt_path || `automation/inbox/yatharth-studio-request-${context.runId}.json`;
              if (!receiptPath.startsWith("automation/inbox/") ||
                  receiptPath.includes("..") ||
                  receiptPath.startsWith("/")) {
                core.setFailed(`Invalid receipt_path for ${target.repository}: ${receiptPath}`);
                return;
              }

              await github.rest.repos.createDispatchEvent({
                owner: parts[0],
                repo: parts[1],
                event_type: target.event_type,
                client_payload: {
                  source_repository: context.repo.owner + '/' + context.repo.repo,
                  source_workflow: context.workflow,
                  source_run_id: String(context.runId),
                  automation_mode: mode,
                  brief,
                  format,
                  receipt_path: receiptPath
                }
              });

              core.info(`Dispatched ${target.event_type} → ${target.repository}`);

              // End-to-end handshake: the receiver must persist a receipt keyed to this run.
              // Dispatch success alone is not treated as downstream completion.
              let receipt = null;
              for (let attempt = 1; attempt <= 36; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                try {
                  const response = await github.rest.repos.getContent({
                    owner: parts[0],
                    repo: parts[1],
                    path: receiptPath,
                    ref: 'main'
                  });
                  const item = Array.isArray(response.data) ? response.data[0] : response.data;
                  if (item && item.content) {
                    receipt = JSON.parse(Buffer.from(item.content, 'base64').toString('utf8'));
                    break;
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                core.info(`Waiting for receiver receipt (${attempt}/36): ${target.repository}`);
              }

              if (!receipt) {
                core.setFailed(`Downstream receiver did not publish a receipt within 180 seconds: ${target.repository}`);
                return;
              }
              if (receipt.status !== 'RECEIVED' ||
                  receipt.source_run_id !== String(context.runId) ||
                  receipt.independent_verification_claim !== false) {
                core.setFailed(`Downstream receipt failed integrity checks: ${target.repository}`);
                return;
              }

              core.info(`Verified downstream receipt: ${target.repository} / ${receiptPath}`);
            }

            await core.summary
              .addHeading('Inter-Repository Automission')
              .addTable([
                [{data:'Field',header:true},{data:'Value',header:true}],
                ['Mode', mode],
                ['Targets', String(targets.filter(t => t.enabled !== false).length)],
                ['Format', format]
              ])
              .write();

      - name: Report federation dispatch skipped
        if: steps.federation.outputs.enabled != 'true'
        run: echo "Federation dispatch skipped safely because SHIRMANI_GITHUB_TOKEN is missing or malformed; no cross-repository dispatch performed."

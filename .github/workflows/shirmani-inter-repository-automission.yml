name: SHIRMANI Inter-Repository Automission Orchestrator

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      brief:
        description: "Research/creative brief to federate"
        required: true
        type: string
      format:
        description: "Target production format"
        required: false
        default: "animated-film"
        type: string
  repository_dispatch:
    types: [shirmani_automission_request]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: shirmani-inter-repository-automission
  cancel-in-progress: false

jobs:
  push_guard:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm push-only guard
        run: echo "Push received; inter-repository federation dispatch is intentionally skipped."

  dispatch:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEDERATION_TOKEN: ${{ secrets.SHIRMANI_GITHUB_TOKEN }}
    steps:
      - name: Report missing federation credential
        if: ${{ env.FEDERATION_TOKEN == '' }}
        run: echo "Inter-repository dispatch skipped: SHIRMANI_GITHUB_TOKEN is not configured."

      - name: Dispatch approved repository matrix
        if: ${{ env.FEDERATION_TOKEN != '' }}
        uses: actions/github-script@v7
        env:
          AUTOMATION_MODE: ${{ vars.SHIRMANI_AUTOMATION_MODE || 'CONTINUOUS' }}
          REPOSITORY_MATRIX: ${{ vars.SHIRMANI_REPOSITORIES }}
          MANUAL_BRIEF: ${{ inputs.brief }}
          MANUAL_FORMAT: ${{ inputs.format }}
          EVENT_BRIEF: ${{ github.event.client_payload.brief }}
          EVENT_FORMAT: ${{ github.event.client_payload.format }}
        with:
          github-token: ${{ env.FEDERATION_TOKEN }}
          script: |
            const raw = process.env.REPOSITORY_MATRIX || '';
            let targets = [];
            if (raw.trim()) {
              try {
                const parsed = JSON.parse(raw);
                targets = Array.isArray(parsed) ? parsed : (parsed.repositories || []);
              } catch (error) {
                core.setFailed('SHIRMANI_REPOSITORIES must be valid JSON.');
                return;
              }
            }

            // Safe default keeps the existing Shirmani → Yatharth bridge operational
            // even before the optional 25-repository matrix is configured.
            if (!targets.length) {
              targets = [{
                repository: 'rampaulsaini/yatharth-music-ai',
                event_type: 'yatharth_studio_request',
                enabled: true
              }];
            }

            const brief =
              process.env.MANUAL_BRIEF ||
              process.env.EVENT_BRIEF ||
              'Automission continuity brief: continue verified research-to-creative production work.';
            const format = process.env.MANUAL_FORMAT || process.env.EVENT_FORMAT || 'animated-film';
            const mode = process.env.AUTOMATION_MODE || 'CONTINUOUS';

            for (const target of targets) {
              if (target.enabled === false) continue;
              if (!target.repository || !target.event_type) {
                core.warning(`Skipping invalid target: ${JSON.stringify(target)}`);
                continue;
              }

              await github.rest.repos.createDispatchEvent({
                owner: target.repository.split('/')[0],
                repo: target.repository.split('/')[1],
                event_type: target.event_type,
                client_payload: {
                  source_repository: context.repo.owner + '/' + context.repo.repo,
                  source_workflow: context.workflow,
                  source_run_id: String(context.runId),
                  automation_mode: mode,
                  brief,
                  format
                }
              });

              core.info(`Dispatched ${target.event_type} → ${target.repository}`);
            }

            core.summary
              .addHeading('Inter-Repository Automission')
              .addTable([
                [{data:'Field',header:true},{data:'Value',header:true}],
                ['Mode', mode],
                ['Targets', String(targets.filter(t => t.enabled !== false).length)],
                ['Brief', brief],
                ['Format', format]
              ])
              .write();

name: SHIRMANI Public Surface Security Smoke Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-surface-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  html-security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed HTML files
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF"
            git diff --name-only "origin/$BASE_REF...HEAD" | grep -E "\.(html?|HTML?)$" | sed -n '1,250p' > /tmp/changed-files.txt || true
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA" HEAD | grep -E "\.(html?|HTML?)$" | sed -n '1,250p' > /tmp/changed-files.txt || true
          else
            git ls-files '*.html' '*.htm' | sed -n '1,250p' > /tmp/changed-files.txt
          fi
          {
            echo 'paths<<EOF'
            cat /tmp/changed-files.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run dependency-free HTML security smoke checks
        shell: bash
        env:
          CHANGED_PATHS: ${{ steps.changed.outputs.paths }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_PATHS"
          if ((${#files[@]} == 0)) || [[ -z "${files[0]}" ]]; then
            echo "No changed HTML files to scan; skipping file-level HTML smoke."
            exit 0
          fi
          python3 scripts/security/public_html_smoke_check.py "${files[@]}"

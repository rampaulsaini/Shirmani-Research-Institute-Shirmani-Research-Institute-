name: Yatharth Public Status Contract

on:
  push:
    paths:
      - "docs/yatharth-system/feature-status-registry.json"
      - "scripts/validate_yatharth_status.py"
      - ".github/workflows/yatharth-status-contract.yml"
  pull_request:
    paths:
      - "docs/yatharth-system/feature-status-registry.json"
      - "scripts/validate_yatharth_status.py"
      - ".github/workflows/yatharth-status-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public status contract
        run: python3 scripts/validate_yatharth_status.py

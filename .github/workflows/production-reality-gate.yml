name: SHIRMANI Production Reality Gate
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/product-catalog.json"
      - "factory/production_reality_gate.py"
      - "research-paper.pdf"
permissions:
  contents: read
jobs:
  reality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate real delivery evidence
        run: python3 factory/production_reality_gate.py
      - name: Publish reality gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-production-reality-gate
          path: generated/production-reality-gate.json

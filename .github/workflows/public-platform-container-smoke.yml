name: Public Platform Container Smoke

on:
  pull_request:
    paths:
      - "server/**"
      - "docs/public-platform/deployment-runbook.md"
      - ".github/workflows/public-platform-container-smoke.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/public-platform/deployment-runbook.md"
      - ".github/workflows/public-platform-container-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t shirmani-social-api:ci ./server
      - name: Inspect image
        run: docker image inspect shirmani-social-api:ci
      - name: Confirm deployment boundary
        run: |
          grep -q "does not declare the service LIVE" docs/public-platform/deployment-runbook.md
          grep -q "independent verification" docs/public-platform/deployment-runbook.md

name: SHIRMANI Read-Only Security Baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/security/**"
      - "scripts/security_baseline_audit.py"
      - "factory/public_production_materializer.py"
      - "tests/public_production_status_test.py"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/security/**"
      - "scripts/security_baseline_audit.py"
      - "factory/public_production_materializer.py"
      - "tests/public_production_status_test.py"
      - "SECURITY.md"
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
concurrency:
  group: read-only-security-baseline-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  static-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test concrete production status contract
        run: python3 -m unittest discover -s tests -p 'public_production_status_test.py' -v
      - name: Run read-only credential and workflow-hardening scan
        run: python3 scripts/security_baseline_audit.py
      - name: Run focused workflow static baseline
        if: always()
        run: python3 scripts/security/workflow_static_baseline.py
      - name: Upload machine-readable workflow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-static-security-baseline
          path: security/reports/workflow-static-baseline.json
          if-no-files-found: warn
          retention-days: 30

name: SHIRMANI Showroom Product Visual Production
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  visuals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Build product visuals
        run: python factory/build_product_visuals.py
      - name: Commit generated visuals
        run: |
          git config user.name "SHIRMANI Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/visuals
          git diff --cached --quiet || git commit -m "automission: refresh showroom product visual identities"
          git push

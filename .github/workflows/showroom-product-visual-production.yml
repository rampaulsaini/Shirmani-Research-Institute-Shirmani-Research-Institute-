name: SHIRMANI Showroom Product Visual Production
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  visuals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Install visual build dependency\n        run: python -m pip install "qrcode[pil]"\n      - name: Build product visuals
        run: python factory/build_product_visuals.py
      - name: Create reviewable production PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "automission: refresh showroom product visual identities"
          title: "Automission: refresh showroom product visual identities"
          body: "Generated product identity visuals from the current showroom product registry. Review before production publication."
          branch: "automission/generated-product-visuals"
          delete-branch: true

name: SHIRMANI Supreme Public Production — Continuous
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-main-writer
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Institute → Factory — materialize catalog products
        env:
          PRODUCT_TARGET: "5000"
        run: |
          python3 factory/real_product_factory.py
          python3 factory/incremental_public_production.py
      - name: Public production synchronization
        run: python3 factory/supreme_public_production_sync.py
      - name: Product QC gate
        run: python3 factory/product_qc_gate.py
      - name: Publish showroom production telemetry
        run: python3 factory/production_dashboard.py
      - name: Normalize generated outputs to prevent timestamp-only churn
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          files = (
              "generated/production-status.json",
              "generated/production-registry.json",
              "generated/concrete-production-overlay.json",
              "generated/product-qc-gate.json",
              "generated/concrete-product-asset-status.json",
          )
          for name in files:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing required production output: {name}")
              data = json.loads(path.read_text(encoding="utf-8"))
              data.pop("generated_at", None)
              data.pop("qc_generated_at", None)
              for product in data.get("products", []):
                  product.pop("produced_at", None)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          dashboard = Path("production-dashboard.html")
          if not dashboard.is_file():
              raise SystemExit("Missing production-dashboard.html")
          html = dashboard.read_text(encoding="utf-8")
          html = re.sub(
              r'<p class="muted">Updated .*?</p>',
              '<p class="muted">Generated from the current repository catalogue; run history is available in GitHub Actions.</p>',
              html,
          )
          dashboard.write_text(html, encoding="utf-8")
          print("Normalized generated timestamps; real product counts and QC results are preserved.")
          PY
      - name: Validate generated telemetry and public QC truth
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from factory.qc_state_contract import qc_passed, sync_public_qc_state

          for name in (
              "generated/production-status.json",
              "generated/production-registry.json",
              "generated/concrete-production-overlay.json",
              "generated/product-qc-gate.json",
              "generated/concrete-product-asset-status.json",
              "generated/live-production-state.json",
          ):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing required production output: {name}")
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"{name}: valid JSON; keys={len(data)}")

          catalog = json.loads(Path("generated/1000-digital-products.json").read_text(encoding="utf-8"))
          count = len(catalog.get("products", []))
          # Publish the authoritative QC result before validating public counters.
          sync_public_qc_state(Path.cwd(), count)
          qc = json.loads(Path("generated/product-qc-gate.json").read_text(encoding="utf-8"))
          live = json.loads(Path("generated/live-production-state.json").read_text(encoding="utf-8"))
          expected = "QC_PASSED" if qc_passed(qc, count) else (
              "QC_REVIEW_REQUIRED" if qc.get("release_state") == "QC_REVIEW_REQUIRED" else "READY_FOR_QC"
          )
          if live.get("qc_state") != expected:
              raise SystemExit("Public live-production-state QC status is stale")
          expected_passed = qc.get("qc_passed")
          if type(expected_passed) is not int or expected_passed < 0:
              expected_passed = None
          expected_failed = qc.get("qc_failed")
          if type(expected_failed) is not int or expected_failed < 0:
              expected_failed = None
          if live.get("qc_passed") != expected_passed:
              raise SystemExit("Public live-production-state qc_passed counter is stale")
          if live.get("qc_failed") != expected_failed:
              raise SystemExit("Public live-production-state qc_failed counter is stale")
          if live.get("dispatch_released", 0) != 0 or live.get("sales_claimed", 0) != 0 or live.get("payment_claimed", 0) != 0:
              raise SystemExit("Production telemetry must not invent dispatch, sales, or payment")
          print("Public QC state and commercial truth boundaries validated.")
          PY
      - name: Propose production update through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/supreme-public-production
          delete-branch: false
          commit-message: "automission: publish validated production telemetry"
          title: "chore(production): publish validated production telemetry"
          body: |
            Automated production telemetry proposal.

            This change is proposed for review; it is not a claim of independent verification or completed sales.
            Timestamp-only changes are normalized to avoid noisy PR churn.
            Merge only after reviewing product artifacts, QC evidence, and the generated counters.
          add-paths: |
            production-dashboard.html
            generated/production-status.json
            generated/production-registry.json
            generated/concrete-production-overlay.json
            generated/product-qc-gate.json
            generated/concrete-product-asset-status.json
            generated/live-production-state.json

name: SHIRMANI Supreme Public Production — Continuous
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shirmani-production-main-writer
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Institute → Factory — materialize all catalog products
        env:
          PRODUCT_TARGET: "5000"
        run: |
          python3 factory/real_product_factory.py
          python3 factory/incremental_public_production.py
      - name: Public production synchronization
        run: python3 factory/supreme_public_production_sync.py
      - name: Product QC gate
        run: python3 factory/product_qc_gate.py
      - name: Publish showroom production telemetry
        run: |
          python3 factory/production_dashboard.py
          git config user.name "SHIRMANI Supreme Production"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/1000-digital-products.json generated/PRODUCT-PASSPORTS.jsonl generated/real-product-factory-status.json generated/concrete-production-overlay.json generated/production-registry.json generated/production-status.json generated/product-qc-gate.json generated/product-production-assets.json products/production products/modules production-dashboard.html supreme-showroom.html supreme-production-showroom.html
          if git diff --cached --quiet; then echo "No production delta."; else git commit -m "automission: publish concrete public product production"; COMMIT_SHA="$(git rev-parse HEAD)"; for attempt in 1 2 3; do git fetch origin main; git reset --hard origin/main; git cherry-pick "$COMMIT_SHA" || { git cherry-pick --abort || true; }; if git push origin HEAD:main; then exit 0; fi; echo "main moved; retrying push ($attempt/3)"; done; echo "Unable to publish production commit after 3 attempts"; exit 1; fi

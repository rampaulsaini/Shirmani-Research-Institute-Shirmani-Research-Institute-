name: SHIRMANI Supreme Public Production — Continuous
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-main-writer
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Institute → Factory — materialize all catalog products
        env:
          PRODUCT_TARGET: "5000"
        run: |
          python3 factory/real_product_factory.py
          python3 factory/incremental_public_production.py
      - name: Public production synchronization
        run: python3 factory/supreme_public_production_sync.py
      - name: Product QC gate
        run: python3 factory/product_qc_gate.py
      - name: Publish showroom production telemetry through a pull request
        run: python3 factory/production_dashboard.py
      - name: Publish generated production artifacts through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automission/supreme-public-production
          delete-branch: false
          commit-message: "automission: publish concrete public product production"
          title: "Automission: publish concrete public product production"
          body: |
            Continuous production artifacts generated by SHIRMANI Supreme Public Production.
            Produced assets remain distinct from QC, dispatch, payment and independent verification.
          add-paths: |
            generated
            products/production
            products/concrete
            products/visuals
            production-dashboard.html

name: SHIRMANI Supreme Public Production — Continuous
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: shirmani-public-production-pages
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Institute → Factory — materialize all catalog products
        run: |
          python3 factory/real_product_factory.py
          python3 factory/incremental_public_production.py
      - name: Public production synchronization
        run: python3 factory/supreme_public_production_sync.py
      - name: Product QC gate
        run: python3 factory/product_qc_gate.py
      - name: Publish showroom production telemetry
        run: python3 factory/production_dashboard.py
      - name: Upload showroom telemetry
        uses: actions/upload-artifact@v4
        with:
          name: shirmani-supreme-public-production
          path: |
            generated/1000-digital-products.json
            generated/PRODUCT-PASSPORTS.jsonl
            generated/real-product-factory-status.json
            generated/concrete-production-overlay.json
            generated/production-registry.json
            generated/production-status.json
            generated/product-qc-gate.json
            generated/product-production-assets.json
            products/production
            products/modules
            production-dashboard.html
            supreme-showroom.html
            supreme-production-showroom.html
          retention-days: 14

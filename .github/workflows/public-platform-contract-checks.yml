name: Public Platform Contract Checks

on:
  pull_request:
    paths:
      - "public-platform-*.html"
      - "docs/public-platform/**"
      - "schemas/public-platform-record.schema.json"
      - "schemas/social-platform-api.openapi.json"
      - "server/**"
  push:
    branches: [main]
    paths:
      - "public-platform-*.html"
      - "docs/public-platform/**"
      - "schemas/public-platform-record.schema.json"
      - "schemas/social-platform-api.openapi.json"
      - "server/**"

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs/public-platform/public-capability-registry.json','utf8')); JSON.parse(require('fs').readFileSync('docs/public-platform/platform-schema.json','utf8')); JSON.parse(require('fs').readFileSync('schemas/public-platform-record.schema.json','utf8')); JSON.parse(require('fs').readFileSync('schemas/social-platform-api.openapi.json','utf8')); console.log('JSON contracts valid')"
      - name: Validate required public surfaces
        run: |
          test -f public-platform-hub.html
          test -f public-platform-mvp.html
          test -f public-platform-console.html
          test -f docs/public-platform/integration-runbook.md
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Syntax check API
        working-directory: server
        run: node --check src/index.js
      - name: API contract endpoint presence
        working-directory: server
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const s = fs.readFileSync("src/index.js", "utf8");
          const routes = ["/health","/v1/auth/register","/v1/auth/login","/v1/profile/:id","/v1/feed","/v1/posts","/v1/self-interviews","/v1/marketplace/listings","/v1/ai-tasks/:id","/v1/marketplace/transactions","/v1/marketplace/orders","/v1/marketplace/orders/:id/cancel","/v1/dashboard","/v1/capabilities/status","/v1/platform/readiness","/v1/ai-agents","/v1/ai-tasks/:id/events","/v1/ai-tasks/:id/dispatch","/v1/ai-tasks/:id/retry","/v1/ai-tasks/:id/cancel","/v1/privacy-requests","/v1/privacy-requests/:id","/v1/media-assets","/v1/payments/webhook","/v1/governance/policy"];
          for (const route of routes) if (!s.includes(route)) throw new Error("Missing implemented route: " + route);
          console.log("Implemented route coverage OK");
          NODE
      - name: Run server tests
        working-directory: server
        run: node --test test/*.test.js

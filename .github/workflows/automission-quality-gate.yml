name: AI ML NLP Automission Quality Gate

on:
  push:
    paths:
      - "docs/yatharth-governance/automission-quality-gate.json"
      - "docs/yatharth-governance/ai-control-contract.md"
      - "docs/yatharth-system/feature-status-registry.json"
      - "docs/yatharth-system/continuity-integrity-schema.json"
      - "scripts/validate_automission_quality_gate.py"
      - ".github/workflows/automission-quality-gate.yml"
  pull_request:
    paths:
      - "docs/yatharth-governance/automission-quality-gate.json"
      - "docs/yatharth-governance/ai-control-contract.md"
      - "docs/yatharth-system/feature-status-registry.json"
      - "docs/yatharth-system/continuity-integrity-schema.json"
      - "scripts/validate_automission_quality_gate.py"
      - ".github/workflows/automission-quality-gate.yml"

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate AI ML NLP Automission contract
        run: python3 scripts/validate_automission_quality_gate.py

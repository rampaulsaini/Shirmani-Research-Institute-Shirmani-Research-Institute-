name: SHIRMANI Production Surface + 150K Catalogue Factory
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-surface-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build 150K-scale catalogue shards
        run: python3 factory/catalog_sharder.py
      - name: Materialize public product surfaces
        env:
          PRODUCT_SURFACE_BATCH: "25"
        run: python3 factory/product_surface_factory.py
      - name: Publish production result through pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            catalog/**
            generated/product-surface-manifest.json
            products/live/**
          branch: automation/production-surface-factory
          delete-branch: true
          base: main
          title: "chore(factory): publish production surfaces and catalogue shards"
          commit-message: "feat(production): materialize public product surfaces and catalog shards"
          body: |
            ## Automated production batch

            - Refreshes catalogue shards and a bounded batch of product surfaces.
            - Keeps publication behind the repository's required pull-request review path.
            - Generated public surfaces are not evidence of sale, delivery, payment, scientific verification, or independent human review.

            Please review generated changes and the product manifest before merging.

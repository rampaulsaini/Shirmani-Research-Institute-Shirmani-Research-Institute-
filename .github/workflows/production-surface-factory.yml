name: SHIRMANI Production Surface + 150K Catalogue Factory
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-surface-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build 150K-scale catalogue shards
        run: python3 factory/catalog_sharder.py
      - name: Materialize public product surfaces
        env:
          PRODUCT_SURFACE_BATCH: "25"
        run: python3 factory/product_surface_factory.py
      - name: Publish production result through pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/production-surface-factory
          delete-branch: false
          commit-message: "feat(production): materialize public product surfaces and catalog shards"
          title: "feat(production): publish public product surfaces and catalog shards"
          body: |
            Automated production output from the catalogue factory.
            Generated assets are proposed through a pull request because repository rules prohibit direct pushes to main.
            Output generation is not independent verification or QC approval.
          add-paths: |
            catalog
            generated/product-surface-manifest.json
            products/live

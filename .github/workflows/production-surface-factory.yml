name: SHIRMANI Production Surface + 150K Catalogue Factory
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: shirmani-production-surface-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build 150K-scale catalogue shards
        run: python3 factory/catalog_sharder.py
      - name: Materialize public product surfaces
        env:
          PRODUCT_SURFACE_BATCH: "25"
        run: python3 factory/product_surface_factory.py
      - name: Publish production result
        run: |
          git config user.name "SHIRMANI Production Surface Factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog generated/product-surface-manifest.json products/live
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(production): materialize public product surfaces and catalog shards"
          git push origin HEAD:main

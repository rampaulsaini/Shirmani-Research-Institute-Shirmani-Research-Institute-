name: SHIRMANI Production Surface + 150K Catalogue Factory
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shirmani-production-surface-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test product surface links and demo truth
        run: python3 -m unittest factory/test_product_surface_factory.py
      - name: Build 150K-scale catalogue shards
        run: python3 factory/catalog_sharder.py
      - name: Materialize and refresh public product surfaces
        env:
          PRODUCT_SURFACE_BATCH: "25"
        run: python3 factory/product_surface_factory.py
      - name: Create or update reviewed production PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automission/production-surface-refresh
          delete-branch: false
          commit-message: "fix(production): repair product links and enquiry paths"
          title: "Automission: refresh public product surfaces and catalogue"
          body: |
            ## Automated production refresh

            This PR refreshes existing public product pages as well as adding the next batch.

            - Product passport and showroom links are resolved from nested public URLs.
            - Product enquiry CTAs open a customer-controlled WhatsApp or email draft.
            - Screenshot/video links are shown only when the corresponding media file exists.
            - Missing demo media is labelled honestly; catalogue presence is not a working-demo or sales claim.
            - Generated output remains reviewed through a pull request.
          add-paths: |
            catalog/**
            generated/product-surface-manifest.json
            products/live/**

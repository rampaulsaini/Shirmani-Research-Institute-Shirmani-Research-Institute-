name: Supreme AI-ML-NLP-Automission Hardening QC

on:
  push:
    branches: [main]
    paths:
      - "docs/supreme-ai-ml-nlp-automission-total-graph-2026-10-01.md"
      - "docs/yatharth-governance/ai-control-contract.md"
      - "PROJECT-CONTINUITY.md"
      - "factory/supreme_architecture_qc.py"
      - ".github/workflows/supreme-ai-ml-nlp-automission-qc.yml"
      - ".github/workflows/omniverse-factory.yml"
      - "generated/factory-status.json"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: supreme-ai-ml-nlp-automission-qc
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical state
        uses: actions/checkout@v4

      - name: Run deterministic supreme architecture gate
        run: |
          set -euo pipefail
          python3 factory/supreme_architecture_qc.py | tee supreme-architecture-qc.json

      - name: Publish machine-readable QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: supreme-ai-ml-nlp-automission-qc
          path: supreme-architecture-qc.json
          if-no-files-found: error
          retention-days: 14

name: Supreme Platform Integrity Gate

on:
  push:
    branches: [main]
    paths:
      - "factory/**"
      - "agents/**"
      - "schemas/**"
      - "scripts/**"
      - "generated/*.json"
      - "PROJECT-CONTINUITY.md"
      - "FACTORY.md"
      - ".github/workflows/supreme-platform-integrity.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-platform-integrity
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate core governance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("schemas/agent-governance.json").read_text())
          assert policy.get("fail_closed") is True
          assert policy.get("fabrication_prohibited") is True
          assert policy.get("provenance_required_for_claims") is True
          assert policy.get("authorization", {}).get("irreversible_actions") == "owner_authorization_required"
          assert policy.get("authorization", {}).get("verification_promotion") == "independent_verification_required"
          print("governance: PASS")
          PY
      - name: Validate critical JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = [
              Path("generated/current-status.json"),
              Path("generated/agent-status.json"),
              Path("generated/federation-status.json"),
              Path("factory/agent_config.json"),
              Path("factory/shirmani-framework.json"),
          ]
          for p in files:
              json.loads(p.read_text(encoding="utf-8"))
              print("JSON PASS:", p)
          PY
      - name: Validate factory contract
        run: python3 factory/validate_factory.py
      - name: Validate deterministic normalization
        run: python3 -m py_compile scripts/normalize_records.py scripts/validate_json.py
      - name: Verify public navigation targets
        shell: bash
        run: |
          set -euo pipefail
          for p in index.html factory-dashboard.html federation-dashboard.html repositories.html PROJECT-CONTINUITY.md; do
            test -s "$p"
          done
          grep -qE "Employment|Livelihood|आजीविका|रोजगार" index.html
          grep -q "generated/factory-status.json" factory-dashboard.html
          grep -q "generated/federation-status.json" federation-dashboard.html
          echo "navigation: PASS"
      - name: Check for accidental credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(^|[^A-Za-z0-9_])(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})([^A-Za-z0-9_]|$)' -- ':!*.lock'; then
            echo "Potential credential pattern detected"
            exit 1
          fi
          echo "credential-pattern scan: PASS"

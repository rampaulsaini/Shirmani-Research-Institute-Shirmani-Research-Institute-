name: "Public Product Review"
description: "Product quality, usability, value and improvement feedback"
title: "[Review] "
labels: ["customer-review"]
body:
  - type: markdown
    attributes:
      value: |
        सार्वजनिक product review दें। यह feedback production quality improvement signal बनेगा।
  - type: input
    id: product
    attributes:
      label: Product ID
      description: "उदाहरण: SP-0001"
      placeholder: "SP-0001"
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Rating
      options:
        - "5"
        - "4"
        - "3"
        - "2"
        - "1"
    validations:
      required: true
  - type: textarea
    id: quality
    attributes:
      label: Product quality review
      description: "क्या अच्छा है और कहाँ सुधार चाहिए?"
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Improvement request
      description: "अगले version में क्या बेहतर होना चाहिए?"
  - type: textarea
    id: usage
    attributes:
      label: Usage result
      description: "आपने product को किस काम में इस्तेमाल किया?"

services:
  automission:
    build:
      context: ..
      dockerfile: automission-runtime/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      AUTOMISSION_HEARTBEAT_SECONDS: "300"
      AUTOMISSION_HEARTBEAT_MAX_AGE_SECONDS: "900"
      AUTOMISSION_STALE_PROCESSING_SECONDS: "1800"
      AUTOMISSION_MAX_CONSECUTIVE_FAILURES: "3"
      AUTOMISSION_ADAPTER_ALLOWLIST: ""
      AUTOMISSION_STATE_DIR: /app/automission-runtime/state
    volumes:
      - automission_state:/app/automission-runtime/state
    healthcheck:
      test: ["CMD", "python", "/app/automission-runtime/healthcheck.py"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 10m

volumes:
  automission_state:

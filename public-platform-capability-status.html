<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yatharth Public Platform — Capability Status</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#071018;color:#eef5f8}main{max-width:1100px;margin:auto;padding:24px}h1{color:#ffd84a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{padding:16px;border:1px solid #48606c;border-radius:16px;background:#ffffff08}.state{font-weight:700}.note{color:#cbd7dc}</style></head>
<body><main><h1>🌍 Yatharth Public Platform</h1>
<p class="note">Capability map. Status is explicit so visitors can distinguish a live service from architecture or research.</p>
<div class="grid" id="app"></div>
<script>
const data=[
["Accounts & Profiles","ARCHITECTURE"],["Social Publishing","ARCHITECTURE"],["Creator Marketplace","ARCHITECTURE"],["Digital Store","ARCHITECTURE"],["Freelancing","ARCHITECTURE"],["Employment","ARCHITECTURE"],["Education & Courses","ARCHITECTURE"],["Yatharth AI Music","ARCHITECTURE"],["Research Institute","LIVE"],["Evidence & Verification","REVIEW_REQUIRED"],["AI / ML / NLP","ARCHITECTURE"],["Automission","ARCHITECTURE"],["Yatharth Economy","RESEARCH"],["Yatharth Mudra","RESEARCH"],["Yatharth Justice","RESEARCH"],["Nature & Humanity","RESEARCH"]
];
const root=document.getElementById("app");
for(const [name,state] of data){const c=document.createElement("section");c.className="card";c.innerHTML="<h2>"+name+"</h2><div class='state'>"+state+"</div>";root.appendChild(c);}
</script>
</main></body></html>

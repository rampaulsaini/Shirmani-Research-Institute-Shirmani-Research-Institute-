<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꙰ SHIRMANI 1000+ Digital Products</title><style>body{margin:0;background:#07101c;color:#f4f7fb;font:15px system-ui}.wrap{max-width:1200px;margin:auto;padding:20px}h1{color:#ffd84d;font-size:clamp(2rem,6vw,4rem)}input,select{padding:10px;margin:4px;border-radius:8px;background:#0e1a2b;color:#fff;border:1px solid #28415f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{padding:15px;border:1px solid #28415f;border-radius:14px;background:#0e1a2b}.tag{color:#4de7ff}.price{color:#ffd84d;font-weight:800}a{color:#ffd84d}</style></head><body><main class="wrap"><h1>1000+ Digital Products</h1><p>1200 catalogue-ready product records generated from distinct product families. First live micro-tools are linked to Product Studio. Catalogue status is not a claim of payment/marketplace fulfilment.</p><input id="q" placeholder="Search" oninput="render()"><select id="cat" onchange="render()"><option>All</option></select><p id="count"></p><div id="grid" class="grid"></div><p><a href="product-studio.html">Product Studio</a> · <a href="education-hub.html">Education</a> · <a href="index.html">Main</a></p></main><script>const F=["AI & NLP","SEO & Writing","Software","Counting & Calculators","Sketching & Drawing","Painting","Micro Digital","Games","Cartoons","Education","University","Skills","Research","Productivity","Business","Accessibility","Data","Creator","Audio & Music","Video","Quantum-Inspired Computing","Simulation","Languages","Knowledge","Web Tools","Security","Study"];const V=["Starter","Pro","Mini","Studio","Lab","Creator","Scholar","Master","Pocket","Ultra"];const P=Array.from({length:1200},(_,i)=>({name:'Shirmani '+F[i%F.length]+' '+V[i%V.length]+' '+String(i+1).padStart(4,'0'),cat:F[i%F.length],price:Math.round((19+i%97)*.8),status:i<16?'LIVE MICRO-TOOL':'CATALOGUE READY'}));F.forEach(x=>cat.add(new Option(x,x)));function render(){let q=document.getElementById('q').value.toLowerCase(),c=cat.value,a=P.filter(x=>(c==='All'||x.cat===c)&&x.name.toLowerCase().includes(q));count.textContent=a.length+' matching / '+P.length+' total';grid.innerHTML=a.slice(0,120).map(x=>'<article class="card"><div class="tag">'+x.cat+'</div><h3>'+x.name+'</h3><p>Unique digital product concept with simple user experience, traceability and production metadata.</p><div class="price">₹'+x.price+' target · '+x.status+'</div></article>').join('')}render();</script></body></html>
